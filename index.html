                            <div className="p-3 bg-zinc-900/50 rounded-lg border border-zinc-700/50 flex flex-col gap-3">
                                <span className="text-zinc-300 font-medium text-sm flex items-center gap-1.5">
                                    변환 중심점 설정
                                    <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.origin); }} className="text-zinc-500 hover:text-white transition ml-auto"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                </span>
                                <div className="flex gap-2">
                                    <div className="flex-1 flex flex-col gap-1 min-w-0">
                                        <span className="text-[10px] text-zinc-500 text-center">X 좌표</span>
                                        <CustomNumberInput value={transformOriginX} onChange={v => { setManualMat3D(null); setTransformOriginX(v); }} className="w-full bg-zinc-950 border border-zinc-700 text-sky-400 font-bold px-2 py-1.5 rounded outline-none text-center focus:border-sky-500" />
                                    </div>
                                    <div className="flex-1 flex flex-col gap-1 min-w-0">
                                        <span className="text-[10px] text-zinc-500 text-center">Y 좌표</span>
                                        <CustomNumberInput value={transformOriginY} onChange={v => { setManualMat3D(null); setTransformOriginY(v); }} className="w-full bg-zinc-950 border border-zinc-700 text-sky-400 font-bold px-2 py-1.5 rounded outline-none text-center focus:border-sky-500" />
                                    </div>
                                </div>
                                <button onClick={() => { setManualMat3D(null); setTransformOriginX(0); setTransformOriginY(0); }} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 text-xs py-1.5 rounded transition border border-zinc-700">원점으로 초기화</button>
                            </div>
                        )}
                        <div className="p-3 bg-zinc-900/50 rounded-lg border border-zinc-700/50 flex flex-col gap-3">
                            <span className="text-zinc-300 font-medium text-sm flex items-center gap-1.5">
                                <svg className="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                화면 캡처
                            </span>
                            <div className="grid grid-cols-3 gap-2">
                                <button onClick={() => handleSaveImage('png')} className="bg-zinc-800 hover:bg-sky-600 hover:text-white text-zinc-400 font-bold text-xs py-2 rounded transition border border-zinc-700 hover:border-sky-500 shadow-sm">PNG</button>
                                <button onClick={() => handleSaveImage('jpeg')} className="bg-zinc-800 hover:bg-sky-600 hover:text-white text-zinc-400 font-bold text-xs py-2 rounded transition border border-zinc-700 hover:border-sky-500 shadow-sm">JPG</button>
                                <button onClick={() => handleSaveImage('webp')} className="bg-zinc-800 hover:bg-sky-600 hover:text-white text-zinc-400 font-bold text-xs py-2 rounded transition border border-zinc-700 hover:border-sky-500 shadow-sm">WEBP</button>
                            </div>
                        </div>
                    </div>

                  </div>
                )}
                {settingsTab === 'inputs' && (
                  <div className="flex flex-col gap-4 max-h-[50vh] overflow-y-auto pr-2">
                    <div className="flex flex-col gap-2">
                        <span className="text-[11px] font-bold text-sky-400 uppercase tracking-wider pl-1">기하학 변환</span>
                        <div className="flex flex-col gap-4">
                            <ConfigRow title="X축 확대 변환" prefix="scaleX" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="Y축 확대 변환" prefix="scaleY" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="Z축 확대 변환" prefix="scaleZ" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="X축 이동 변환" prefix="transX" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="Y축 이동 변환" prefix="transY" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="Z축 이동 변환" prefix="transZ" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="회전 변환" prefix="rot" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="X축 회전 변환" prefix="rotX" config={config} setConfig={setConfig} colorClass="rose" />
                            <ConfigRow title="Y축 회전 변환" prefix="rotY" config={config} setConfig={setConfig} colorClass="emerald" />
                            <ConfigRow title="Z축 회전 변환" prefix="rotZ" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="X축 전단 변환" prefix="shearX" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="Y축 전단 변환" prefix="shearY" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="XY 3차원 전단 변환" prefix="shearXY" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="XZ 3차원 전단 변환" prefix="shearXZ" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="YZ 3차원 전단 변환" prefix="shearYZ" config={config} setConfig={setConfig} colorClass="sky" />
                            <ConfigRow title="스퀴즈 변환" prefix="squeeze" config={config} setConfig={setConfig} colorClass="purple" />
                            <ConfigRow title="수평 투시 변환" prefix="perspX" config={config} setConfig={setConfig} colorClass="indigo" />
                            <ConfigRow title="수직 투시 변환" prefix="perspY" config={config} setConfig={setConfig} colorClass="indigo" />
                        </div>
                    </div>
                    <hr className="border-zinc-700/50" />
                    <div className="flex flex-col gap-2">
                        <span className="text-[11px] font-bold text-sky-400 uppercase tracking-wider pl-1">색상 변환</span>
                        <div className="flex flex-col gap-4">
                            <ConfigRow title="전체 명암비" prefix="cont" config={config} setConfig={setConfig} colorClass="zinc" restrictMin={0} />
                        </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          <div style={isMobile ? { 
                position: 'fixed', bottom: 0, left: 0, width: '100%', 
                height: `calc(${mobilePanelHeight}vh + var(--safe-bottom, env(safe-area-inset-bottom, 0px)))`, 
                paddingBottom: 'var(--safe-bottom, env(safe-area-inset-bottom, 0px))', zIndex: 45, 
                transition: isDraggingHandle.current ? 'none' : 'height 0.3s cubic-bezier(0.4, 0, 0.2, 1)' 
               } : { width: `${panelWidth}px`, height: '100%', position: 'relative', zIndex: 40 }} 
               className={`bg-zinc-900 flex flex-col shadow-2xl shrink-0 border-zinc-800 ${isMobile ? 'border-t rounded-t-2xl' : 'border-r'}`}>
            
            {isMobile && (
              <div 
                onTouchStart={startDraggingHandle}
                onMouseDown={startDraggingHandle}
                onClick={() => {
                    const h = mobilePanelHeightRef.current;
                    if (h > 5) setMobilePanelHeight(0);
                    else setMobilePanelHeight(50);
                }}
                className="absolute left-1/2 -top-8 w-40 h-8 flex justify-center items-end cursor-pointer z-50 drop-shadow-[0_-3px_5px_rgba(0,0,0,0.4)]" 
                style={{ transform: 'translateX(-50%)' }}
              >
                <div className="w-full h-full bg-zinc-900 flex justify-center items-start pt-2" style={{ clipPath: 'polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%)' }}>
                    <div className="w-12 h-1.5 rounded-full bg-zinc-500/80 pointer-events-none"></div>
                </div>
              </div>
            )}

            <div className="hidden md:block p-5 border-b border-zinc-800 shrink-0">
              <h1 className="text-xl font-black text-white flex items-baseline gap-2 truncate">Vision Matrix</h1>
              <div className="flex gap-2 mt-4">
                <label className="flex-1 flex justify-center items-center gap-2 bg-zinc-100 hover:bg-white text-black py-2.5 rounded-lg text-base font-bold transition cursor-pointer shadow truncate">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                  사진 불러오기
                  <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                </label>
                <button onClick={() => resetAll(imageObj)} className="px-5 flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-base font-bold transition shadow shrink-0">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                  전체 초기화
                </button>
              </div>
            </div>

            <div className="hidden md:flex bg-black justify-center items-center border-b border-zinc-800 shrink-0 relative px-4 py-6 min-h-[220px]">
                {/* 🚀 PC용 현재 상태 저장 버튼 (아이콘 변경) */}
              {!showMatrixChain && (
                  <button onClick={handleSaveState} className="absolute bottom-4 right-4 w-9 h-9 flex items-center justify-center rounded-lg bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 hover:text-white transition shadow z-10" title="애니매이션">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                  </button>
              )}
              
              <button onClick={() => setShowMatrixChain(!showMatrixChain)} className={`absolute top-4 left-4 w-9 h-9 flex items-center justify-center rounded-lg transition shadow z-10 ${showMatrixChain ? 'bg-indigo-600 text-white' : 'bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 hover:text-white'}`} title="행렬 곱셈 순서 변경">
                  {showMatrixChain ? (
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                  ) : (
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                  )}
              </button>

              {/* 🚀 PC용 좌하단: 3차원(3D) 모드 전환 버튼 (입체다각형 문양) */}
              {!showMatrixChain && (
                  <button
                      onClick={() => {
                          const next = !is3DMode;
                          setIs3DMode(next);
                          setManualMat3D(null);
                      }}
                      className={`absolute bottom-4 left-4 w-9 h-9 flex items-center justify-center rounded-lg transition shadow z-10 ${is3DMode ? 'bg-sky-500 text-white border border-zinc-700 shadow-[0_0_15px_rgba(14,165,233,0.5)]' : 'bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 hover:text-white'}`}
                      title={is3DMode ? "2차원 평면 모드로 전환" : "3차원 공간 모드로 전환"}
                  >
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" />
                          <path strokeLinecap="round" strokeLinejoin="round" d="M3.27 6.96L12 12.01l8.73-5.05" />
                          <path strokeLinecap="round" strokeLinejoin="round" d="M12 22.08V12" />
                      </svg>
                  </button>
              )}

              {showMatrixChain && (
                  <>
                      <button onClick={() => setLogicInfoData(INFO_DATA.matrixChain)} className="absolute top-4 left-[60px] w-9 h-9 flex items-center justify-center rounded-lg bg-zinc-800 text-indigo-400 border border-indigo-500/50 hover:bg-zinc-700 hover:text-white transition shadow z-10" title="행렬 곱셈 순서 변경 설명">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg>
                      </button>
                      <button onClick={() => setChainOrder(['translate', 'origin', 'perspective', 'rotate', 'scale', 'shear', 'origin_back'])} className="absolute top-4 left-[104px] w-9 h-9 flex items-center justify-center rounded-lg bg-zinc-800 text-rose-400 border border-rose-500/50 hover:bg-zinc-700 hover:text-white transition shadow z-10" title="곱셈 순서 초기화">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                      </button>
                  </>
              )}

              {!showMatrixChain && (
                  <button onClick={() => setIsCalcMode(!isCalcMode)} className={`absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-lg transition shadow-lg z-10 ${isCalcMode ? 'bg-amber-500 text-white animate-pulse shadow-[0_0_15px_rgba(245,158,11,0.6)]' : 'bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 hover:text-white'}`} title="행렬 연산 과정 보기">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                  </button>
              )}
              
              <div className="flex items-center justify-center relative w-full h-[180px]">
                  {showMatrixChain ? (
                      <div className="flex items-center w-full overflow-x-auto space-x-2 px-14 scrollbar-hide py-2"
                           style={{ touchAction: ghostDragInfo ? 'none' : 'auto' }}
                           onTouchMove={ghostDragInfo ? handleChainTouchMove : undefined}
                           onTouchEnd={handleChainTouchEnd}
                           onTouchCancel={handleChainTouchEnd}
                           onDragOver={(e) => {
                               e.preventDefault();
                               // 🚀 컴퓨터(마우스) 환경에서 블록을 화면 끝으로 가져가면 컨테이너가 자동으로 스크롤 됨
                               const rect = e.currentTarget.getBoundingClientRect();
                               const edge = 100; // 가장자리 인식 범위 (100px)
                               if (e.clientX > rect.right - edge) e.currentTarget.scrollLeft += 15;
                               else if (e.clientX < rect.left + edge) e.currentTarget.scrollLeft -= 15;
                           }}
                      >
                          {chainOrder.map((id, idx) => {
                              const chainItem = getChainMatrix(id);
                              const isDragging = ghostDragInfo && ghostDragInfo.id === id;
                              return (
                                  <React.Fragment key={id}>
                                      <div 
                                          data-chain-idx={idx}
                                          draggable 
                                          onDragStart={(e) => handleDragStart(e, idx)}
                                          onDragOver={handleDragOver}
                                          onDrop={(e) => handleDrop(e, idx)}
                                          onTouchStart={(e) => handleChainTouchStart(e, idx, id)}
                                          onContextMenu={(e) => e.preventDefault()}
                                          className={`cursor-grab active:cursor-grabbing transition-transform touch-none select-none ${isDragging ? 'opacity-0' : 'opacity-100 hover:scale-105 drop-shadow-lg'}`}
                                      >
                                          <MiniMatrix m={chainItem.m} m3={chainItem.m3} label={chainItem.label} type={id} />
                                      </div>
                                      {idx < chainOrder.length - 1 && <span className="text-zinc-500 font-bold text-sm shrink-0">×</span>}
                                  </React.Fragment>
                              );
                          })}
                      </div>
                  ) : (
                      <div className="flex items-center justify-center w-full max-w-[380px]">
                          <div className="flex items-center justify-center w-8">
                            <span className="text-zinc-400 font-serif text-[80px] leading-[0]" style={{ transform: 'scale(0.6, 2.5)' }}>(</span>
                          </div>
                          <div className="grid grid-cols-3 gap-x-4 gap-y-5 text-center font-mono text-2xl md:text-3xl font-bold tracking-tighter w-full mx-2 py-1">
                            <MatrixInput value={m00Str} onChange={v => handleMatrixUpdate('a', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m00Str, "1.00", "1")}`} />
                            <MatrixInput value={m01Str} onChange={v => handleMatrixUpdate('c', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m01Str, "0.00", "0")}`} />
                            <MatrixInput value={m02Str} onChange={v => handleMatrixUpdate('e', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m02Str, "0.00", "0")}`} />
                            
                            <MatrixInput value={m10Str} onChange={v => handleMatrixUpdate('b', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m10Str, "0.00", "0")}`} />
                            <MatrixInput value={m11Str} onChange={v => handleMatrixUpdate('d', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m11Str, "1.00", "1")}`} />
                            <MatrixInput value={m12Str} onChange={v => handleMatrixUpdate('f', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m12Str, "0.00", "0")}`} />
                            
                            {/* 🚀 3행의 원소들을 <div> 고정 태그에서 <MatrixInput> 컴포넌트로 개방. 크기와 UI 100% 통일 */}
                            <MatrixInput value={m20Str} onChange={v => { if (is3DMode) handleMatrixUpdate('p0', v); else { setUsePerspective(true); setUseRefl(false); setPerspX(v); } }} matrixFormatExact={matrixFormatExact} isTranslate={false} isPerspective={!is3DMode || is3DPerspDisplay} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m20Str, "0.00", "0")}`} />
                            <MatrixInput value={m21Str} onChange={v => { if (is3DMode) handleMatrixUpdate('p1', v); else { setUsePerspective(true); setUseRefl(false); setPerspY(v); } }} matrixFormatExact={matrixFormatExact} isTranslate={false} isPerspective={!is3DMode || is3DPerspDisplay} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m21Str, "0.00", "0")}`} />
                            {is3DMode ? (
                                <MatrixInput value={m22Str} onChange={v => handleMatrixUpdate('p2', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m22Str, "1.00", "1")}`} />
                            ) : (
                                <div className={`pointer-events-none w-full text-center flex items-center justify-center py-1 ${getMatrixColor(m22Str, "1.00", "1")}`}>{m22Str}</div>
                            )}
                          </div>
                          <div className="flex items-center justify-center w-8">
                            <span className="text-zinc-400 font-serif text-[80px] leading-[0]" style={{ transform: 'scale(0.6, 2.5)' }}>)</span>
                          </div>
                      </div>
                  )}
              </div>
            </div>

            {/* 🚀 왼쪽 사이드바(PC) / 하단 네비게이션(모바일) + 우측 컨텐츠 분할 레이아웃 */}
            <div className="flex flex-1 overflow-hidden border-t border-zinc-800 bg-zinc-900 flex-col-reverse md:flex-row">
              
              {/* 1. 사이드바 (표 형태의 단일 선 구분 레이아웃 - 칸 크기 대폭 축소) */}

                      <ControlRow label="Y축 확대 변환" min={config.scaleYMin} max={config.scaleYMax} step={config.scaleYStep} value={scaleY} onChange={v => handleSyncChange('scaleY', v)} onReset={() => handleSyncChange('scaleY', 1.0)} syncKey="scaleY" isSynced={syncKeys.has('scaleY')} onToggleSync={() => toggleSync('scaleY')} onOpenInfo={() => setLogicInfoData(INFO_DATA.scaleY)} />

                          <ControlRow label="Y축 회전 변환" min={config.rotYMin} max={config.rotYMax} step={config.rotYStep} value={rotY} onChange={v => handleSyncChange('rotY', v)} onReset={() => handleSyncChange('rotY', 0)} syncKey="rotY" isSynced={syncKeys.has('rotY')} onToggleSync={() => toggleSync('rotY')} onOpenInfo={() => setLogicInfoData(INFO_DATA.rotY)} colorClass="emerald" />
                          <ControlRow label="Z축 회전 변환" min={config.rotZMin} max={config.rotZMax} step={config.rotZStep} value={rotZ} onChange={v => handleSyncChange('rotZ', v)} onReset={() => handleSyncChange('rotZ', 0)} syncKey="rotZ" isSynced={syncKeys.has('rotZ')} onToggleSync={() => toggleSync('rotZ')} onOpenInfo={() => setLogicInfoData(INFO_DATA.rotZ)} colorClass="sky" />

                                    {reflMode === 'angle' ? '함수' : '각도'}
                                </button>
                                <label className="flex items-center cursor-pointer group">
                                    <div className="relative">

                                    </span>
                                    <button onClick={() => { setManualMat3D(null); setReflLineA(1); setReflLineB(-1); setReflLineC(0); setUseRefl(true); }} className="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-400 hover:text-white rounded border border-zinc-700 transition">초기화</button>

                                <div className="flex items-center gap-2 bg-black/40 p-2 rounded-lg border border-rose-500/20">

                                    <CustomNumberInput value={reflLineB} onChange={v => { setManualMat3D(null); if(v===0 && reflLineA===0) setReflLineB(-1); else setReflLineB(v); setUseRefl(true); }} className="w-12 bg-zinc-900 text-rose-400 font-bold px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-rose-500 text-center" />

                            <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">

                                    { id: 'zx', label: 'ZX 평면' },

                                ))}

                                              <span className="text-rose-400 font-bold text-sm flex items-center gap-1.5">

                                                  <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.symmetry3D); }} className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                              </span>
                                              <button onClick={() => { setScaleX(1); setScaleY(1); setScaleZ(1); setManualMat3D(null); setUseSymmetryGhost(false); }} className="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-400 hover:text-white rounded border border-zinc-700 transition">초기화</button>
                                          </div>
                                          <div className="grid grid-cols-2 gap-2">
                                              <button onClick={() => { applySymmetry3D('XY'); if(!useMathLab) handleMathLabToggle(true); }} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">XY평면 대칭 (z=-z)</button>
                                              <button onClick={() => { applySymmetry3D('YZ'); if(!useMathLab) handleMathLabToggle(true); }} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">YZ평면 대칭 (x=-x)</button>
                                              <button onClick={() => { applySymmetry3D('ZX'); if(!useMathLab) handleMathLabToggle(true); }} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">ZX평면 대칭 (y=-y)</button>
                                              <button onClick={() => { applySymmetry3D('ORIGIN3D'); if(!useMathLab) handleMathLabToggle(true); }} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">3차원 원점 대칭</button>
                                          </div>
                                      </div>
                                  )}
                              </div>

                              <div className="flex flex-col gap-3">
                                  <div className="flex items-center justify-between">
                                      <label className="flex items-center gap-2 text-amber-400 font-bold text-sm w-max cursor-pointer">
                                        <input type="checkbox" checked={useUnitSquare} onChange={(e) => { setUseUnitSquare(e.target.checked); if(!useMathLab) handleMathLabToggle(true); }} className="w-4 h-4 accent-amber-500 cursor-pointer" /> 
                                        {is3DMode ? "단위 정육면체 시각화" : "단위 정사각형 시각화"}
                                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(is3DMode ? INFO_DATA.unitCube : INFO_DATA.unitSquare); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                      </label>
                                      {useUnitSquare && (
                                          <button onClick={() => setShowUnitSquareModal(true)} className="text-[11px] px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg font-bold transition">
                                              {is3DMode ? "부피 연산 과정" : "넓이 연산 과정"}
                                          </button>
                                      )}
                                  </div>
                              </div>

                              {/* 🚀 4번 요구사항: 3차원 다면체 시각화 (3D 모드 전용 표시) */}
                              {is3DMode && (
                                  <div className="flex flex-col gap-3">
                                      <label className="flex items-center gap-2 text-sky-400 font-bold text-sm w-max cursor-pointer">
                                        <input type="checkbox" checked={usePolyhedron} onChange={(e) => { setUsePolyhedron(e.target.checked); if (e.target.checked) setIs3DMode(true); if (!useMathLab) handleMathLabToggle(true); }} className="w-4 h-4 accent-sky-500 cursor-pointer" /> 
                                        3차원 다면체 시각화
                                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.polyhedron3D); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                      </label>
                                      {usePolyhedron && (
                                          <div className="grid grid-cols-2 gap-2 bg-sky-900/10 p-3 rounded-lg border border-sky-500/20">
                                              {[
                                                  { id: 'cube', label: '정육면체' },
                                                  { id: 'tetra', label: '정사면체' },
                                                  { id: 'octa', label: '정팔면체' },
                                                  { id: 'pyramid', label: '사각뿔' }
                                              ].map(item => (
                                                  <button
                                                      key={item.id}
                                                      onClick={() => setPolyhedronType(item.id)}
                                                      className={`py-2 rounded text-xs font-bold transition border ${polyhedronType === item.id ? 'bg-sky-500 text-white border-sky-400 shadow' : 'bg-zinc-900 text-zinc-300 border-zinc-700 hover:bg-zinc-800'}`}
                                                  >
                                                      {item.label}
                                                  </button>
                                              ))}
                                          </div>
                                      )}
                                  </div>
                              )}

                              {is3DMode && (
                                  <div className="flex flex-col gap-2 bg-indigo-950/30 p-3 rounded-lg border border-indigo-500/30">
                                      <span className="text-indigo-300 font-bold text-xs flex items-center gap-1.5">
                                          3차원 곡면 빠른 예시
                                          <button onClick={() => setLogicInfoData(INFO_DATA.surface3D)} className="text-zinc-500 hover:text-white transition ml-auto"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                      </span>
                                      <div className="grid grid-cols-1 gap-1.5">
                                          <button onClick={() => { setUseGraph(true); if(!useMathLab) handleMathLabToggle(true); setGraphs([{ id: Date.now(), eq: 'z=\\sin{x}+\\cos{y}', matrixMode: 'global', customMatrix: {a:1,b:0,c:0,d:1,e:0,f:0} }]); }} className="bg-zinc-900 hover:bg-zinc-800 text-sky-300 border border-zinc-700 rounded py-1.5 px-2 text-xs font-mono text-left transition">물결 곡면 : z = sin(x) + cos(y)</button>
                                          <button onClick={() => { setUseGraph(true); if(!useMathLab) handleMathLabToggle(true); setGraphs([{ id: Date.now(), eq: 'z=\\frac{x^{2}-y^{2}}{4}', matrixMode: 'global', customMatrix: {a:1,b:0,c:0,d:1,e:0,f:0} }]); }} className="bg-zinc-900 hover:bg-zinc-800 text-purple-300 border border-zinc-700 rounded py-1.5 px-2 text-xs font-mono text-left transition">쌍곡포물면 안장 : z = (x² - y²) / 4</button>
                                          <button onClick={() => { setUseGraph(true); if(!useMathLab) handleMathLabToggle(true); setGraphs([{ id: Date.now(), eq: 'z=\\frac{x^{2}+y^{2}}{5}', matrixMode: 'global', customMatrix: {a:1,b:0,c:0,d:1,e:0,f:0} }]); }} className="bg-zinc-900 hover:bg-zinc-800 text-emerald-300 border border-zinc-700 rounded py-1.5 px-2 text-xs font-mono text-left transition">포물면 그릇 : z = (x² + y²) / 5</button>
                                      </div>
                                  </div>
                              )}

                          </div>
                    </div>
                  </div>
                )}

              {/* 3. 색상 변환 탭 */}
              {activeTab === 'color' && (
                <div className="flex flex-col gap-5 md:gap-6 pb-20">
                  {/* 흑백화 & 반전 & 듀오톤 */}
                  <div className="space-y-4">
                      <div className="flex items-center justify-between">
                          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
                              흑백화
                              <button onClick={() => setLogicInfoData(INFO_DATA.chkGray)} className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                          </span>
                          <label className="flex items-center cursor-pointer group">
                              <div className="relative">
                                  <input type="checkbox" checked={chkGray} onChange={(e) => setChkGray(e.target.checked)} className="peer sr-only" />
                                  <div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-amber-500 transition"></div>
                                  <div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div>
                              </div>
                          </label>
                      </div>
                      <div className="flex items-center justify-between">
                          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
                              색상 반전
                              <button onClick={() => setLogicInfoData(INFO_DATA.chkInv)} className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                          </span>
                          <label className="flex items-center cursor-pointer group">
                              <div className="relative">
                                  <input type="checkbox" checked={chkInvert} onChange={(e) => setChkInvert(e.target.checked)} className="peer sr-only" />
                                  <div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-amber-500 transition"></div>
                                  <div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div>
                              </div>
                          </label>
                      </div>
                      <div className="flex items-center justify-between">
                          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
                              이중 색상 변환
                              <button onClick={() => setLogicInfoData(INFO_DATA.duo)} className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                          </span>
                          <label className="flex items-center cursor-pointer group">
                              <div className="relative">
                                  <input type="checkbox" checked={useDuotone} onChange={(e) => setUseDuotone(e.target.checked)} className="peer sr-only" />
                                  <div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-purple-500 transition"></div>
                                  <div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div>
                              </div>
                          </label>
                      </div>
                      {useDuotone && (
                          <div className="flex gap-2 mt-2">
                              <label className="flex-1 flex flex-col gap-1 text-zinc-400 text-xs">어두운 영역<input type="color" value={colorDarkUI} onChange={(e) => setColorDarkUI(e.target.value)} className="w-full h-8 cursor-pointer bg-zinc-900 border-none rounded"/></label>
                              <label className="flex-1 flex flex-col gap-1 text-zinc-400 text-xs">밝은 영역<input type="color" value={colorLightUI} onChange={(e) => setColorLightUI(e.target.value)} className="w-full h-8 cursor-pointer bg-zinc-900 border-none rounded"/></label>
                          </div>
                      )}
                  </div>
                  <hr className="border-zinc-800" />
                  <div className="space-y-4">
                    <ControlRow label="전체 밝기" min="-255" max="255" step="1" value={globalAdd} onChange={v=>handleSyncChange('globalAdd', v)} onReset={() => handleSyncChange('globalAdd', 0)} syncKey="globalAdd" isSynced={syncKeys.has('globalAdd')} onToggleSync={()=>toggleSync('globalAdd')} colorClass="zinc" onOpenInfo={() => setLogicInfoData(INFO_DATA.gAdd)} />
                    <ControlRow label="전체 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={globalMul} onChange={v=>handleSyncChange('globalMul', v)} onReset={() => handleSyncChange('globalMul', 1.0)} syncKey="globalMul" isSynced={syncKeys.has('globalMul')} onToggleSync={()=>toggleSync('globalMul')} colorClass="zinc" onOpenInfo={() => setLogicInfoData(INFO_DATA.gMul)} />
                    <ControlRow label="이진화 (-1 끄기)" min="-1" max="255" step="1" value={binThresh} onChange={setBinThresh} onReset={() => setBinThresh(-1)} colorClass="zinc" onOpenInfo={() => setLogicInfoData(INFO_DATA.binThresh)} />
                  </div>

                  <hr className="border-zinc-800" />
                  <div className="space-y-4 p-3 border-l-2 border-red-500">
                    <ControlRow label="빨간색 밝기" min="-255" max="255" step="1" value={rAdd} onChange={v=>handleSyncChange('rAdd', v)} onReset={() => handleSyncChange('rAdd', 0)} syncKey="rAdd" isSynced={syncKeys.has('rAdd')} onToggleSync={()=>toggleSync('rAdd')} colorClass="red" onOpenInfo={() => setLogicInfoData(INFO_DATA.cAdd)} />
                    <ControlRow label="빨간색 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={rMul} onChange={v=>handleSyncChange('rMul', v)} onReset={() => handleSyncChange('rMul', 1.0)} syncKey="rMul" isSynced={syncKeys.has('rMul')} onToggleSync={()=>toggleSync('rMul')} colorClass="red" onOpenInfo={() => setLogicInfoData(INFO_DATA.cMul)} />
                  </div>
                  <div className="space-y-4 p-3 border-l-2 border-green-500">
                    <ControlRow label="초록색 밝기" min="-255" max="255" step="1" value={gAdd} onChange={v=>handleSyncChange('gAdd', v)} onReset={() => handleSyncChange('gAdd', 0)} syncKey="gAdd" isSynced={syncKeys.has('gAdd')} onToggleSync={()=>toggleSync('gAdd')} colorClass="green" onOpenInfo={() => setLogicInfoData(INFO_DATA.cAdd)} />
                    <ControlRow label="초록색 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={gMul} onChange={v=>handleSyncChange('gMul', v)} onReset={() => handleSyncChange('gMul', 1.0)} syncKey="gMul" isSynced={syncKeys.has('gMul')} onToggleSync={()=>toggleSync('gMul')} colorClass="green" onOpenInfo={() => setLogicInfoData(INFO_DATA.cMul)} />
                  </div>
                  <div className="space-y-4 p-3 border-l-2 border-blue-500 mb-8">
                    <ControlRow label="파란색 밝기" min="-255" max="255" step="1" value={bAdd} onChange={v=>handleSyncChange('bAdd', v)} onReset={() => handleSyncChange('bAdd', 0)} syncKey="bAdd" isSynced={syncKeys.has('bAdd')} onToggleSync={()=>toggleSync('bAdd')} colorClass="blue" onOpenInfo={() => setLogicInfoData(INFO_DATA.cAdd)} />
                    <ControlRow label="파란색 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={bMul} onChange={v=>handleSyncChange('bMul', v)} onReset={() => handleSyncChange('bMul', 1.0)} syncKey="bMul" isSynced={syncKeys.has('bMul')} onToggleSync={()=>toggleSync('bMul')} colorClass="blue" onOpenInfo={() => setLogicInfoData(INFO_DATA.cMul)} />
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

          {!isMobile && (
            <div className="w-1.5 bg-zinc-800 hover:bg-sky-500 cursor-col-resize flex-shrink-0 z-20 flex items-center justify-center transition-colors group relative" 
                 onMouseDown={startResizingPanel} 
                 onTouchStart={startResizingPanel} 
                 title="패널 크기 조절">
              <div className="h-10 w-0.5 bg-zinc-600 group-hover:bg-white rounded"></div>
            </div>
          )}

          <div className={`flex items-center justify-center relative overflow-hidden bg-zinc-950 h-full ${isMobile ? 'w-full absolute inset-0 z-10' : 'flex-1 z-10'}`}>
            
            <div 
              className="absolute inset-0 z-[55] touch-none cursor-default"
              onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUpOrLeave} onMouseLeave={handleMouseUpOrLeave}
              onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchEnd}
            />

            {/* 🚀 개별 그림자 전용 팝업 메뉴 (행렬 조정창 연동 및 45% 상한선 적용) */}
            {showShadowMenu && selectedShadowId && (
                <div className={`absolute z-[80] bg-zinc-900/95 backdrop-blur-md px-3 md:px-4 py-2 md:py-2.5 rounded-full border border-zinc-600 shadow-2xl flex items-center justify-center gap-2 md:gap-3 animate-fade-in pointer-events-auto w-max max-w-[95vw] md:w-auto ${shadowMenuPos ? '' : 'left-1/2 -translate-x-1/2'}`}
                     style={shadowMenuPos ? { left: `${shadowMenuPos.left}px`, top: `${shadowMenuPos.top}px`, bottom: 'auto', right: 'auto', transform: 'none' } : (isMobile ? { bottom: `calc(${Math.min(mobilePanelHeight, 45)}vh + var(--safe-bottom, env(safe-area-inset-bottom, 0px)) + 20px)` } : { bottom: '8rem' })}>
                    
                    {/* 🚀 왼쪽 X 버튼 추가 (팝업창 닫기 전용) */}
                    <button onClick={() => { setShowShadowMenu(false); setSelectedShadowId(null); }} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white w-8 h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center shadow transition shrink-0" title="닫기">
                        <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>

                    <div className="w-px h-6 bg-zinc-700 shrink-0"></div>

                    {/* 🚀 딜레이 없는 즉각적인 드래그 핸들 (네이티브 드래그 꼬임 버그 차단) */}
                    <div 
                        onMouseDown={(e) => {
                            e.stopPropagation();
                            e.preventDefault(); // 🚀 텍스트 선택 및 브라우저 네이티브 드래그(커서에 달라붙는 버그) 완벽 차단
                            const clientX = e.clientX; const clientY = e.clientY;
                            const el = e.currentTarget.parentElement;
                            const parentRect = el.parentElement.getBoundingClientRect();
                            const rect = el.getBoundingClientRect();
                            
                            const initLeft = rect.left - parentRect.left;
                            const initTop = rect.top - parentRect.top;
                            
                            dragMenuRef.current = { isDragging: true, startX: clientX, startY: clientY, initLeft, initTop };
                        }}
                        onTouchStart={(e) => {
                            e.stopPropagation();
                            if (e.cancelable) e.preventDefault(); // 🚀 모바일 스크롤 충돌 방지 및 즉각 반응
                            const clientX = e.touches[0].clientX; const clientY = e.touches[0].clientY;
                            const el = e.currentTarget.parentElement;
                            const parentRect = el.parentElement.getBoundingClientRect();
                            const rect = el.getBoundingClientRect();
                            
                            const initLeft = rect.left - parentRect.left;
                            const initTop = rect.top - parentRect.top;
                            
                            dragMenuRef.current = { isDragging: true, startX: clientX, startY: clientY, initLeft, initTop };
                        }}
                        className="flex items-center cursor-pointer shrink-0 pr-1 md:pr-2 py-1"
                        title="드래그하여 팝업창 이동"
                    >
                        <span className="text-zinc-300 font-bold mr-1 text-xs md:text-sm whitespace-nowrap select-none">
                            애니메이션 {shadowStates.findIndex(s => s.id === selectedShadowId) + 1}
                        </span>
                    </div>

                    <button onClick={() => playAnimation(selectedShadowId)} className="bg-sky-600 hover:bg-sky-500 text-white w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow transition shrink-0" title="재생">
                        <svg className="w-4 h-4 md:w-5 md:h-5 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg>
                    </button>
                    <div className="w-px h-6 bg-zinc-700 shrink-0"></div>
                    <button onClick={() => handleLoadState(selectedShadowId)} className="bg-amber-600 hover:bg-amber-500 text-white w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow transition shrink-0" title="불러오기">
                        <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    </button>
                    <div className="w-px h-6 bg-zinc-700 shrink-0"></div>
                    <button onClick={() => { setShadowStates(prev => prev.filter(s => s.id !== selectedShadowId)); setShowShadowMenu(false); }} className="bg-rose-600 hover:bg-rose-500 text-white w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow transition shrink-0" title="삭제">
                        <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            )}
            
            <canvas ref={canvasRef} width={2000} height={1200} className="w-full h-full object-cover z-20 pointer-events-none absolute inset-0" />
            {/* 🚀 2층: 오직 수학 그래프만 그리는 초고속 GPU WebGL 캔버스 (2D 모드에서만 사진 아래로 내리기 옵션 연동) */}
            <canvas ref={canvasGLRef} width={2000} height={1200} className={`w-full h-full object-cover pointer-events-none absolute inset-0 ${(!is3DMode && mathUnderImage) ? 'z-10' : 'z-30'}`} />

            {isCalcMode && (
                <div 
                    style={{ top: 'calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 48px)' }}
                    className="absolute left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 z-[70] pointer-events-none w-[92vw] md:w-auto"
                >
                    <div className="bg-amber-500/95 text-white px-4 py-3 md:px-5 md:py-2.5 rounded-2xl md:rounded-full font-bold text-xs md:text-base shadow-[0_0_15px_rgba(245,158,11,0.5)] flex flex-col md:flex-row items-center gap-2 md:gap-3 pointer-events-auto text-center break-keep w-full md:w-auto">
                        <span>{is3DMode ? '3차원 좌표를 직접 입력하여 연산 과정을 확인하세요' : '화면을 눌러 연산 과정을 볼 점을 찍어주세요'}</span>
                        <div className="flex gap-2 w-full justify-center md:w-auto mt-1 md:mt-0">
                            {!is3DMode && (
                                <button onClick={() => setShowManualCalcPointUI(!showManualCalcPointUI)} className="bg-white text-amber-600 px-3 py-1.5 md:py-1 rounded-full text-xs hover:bg-amber-100 transition whitespace-nowrap shadow-sm">
                                    직접 입력
                                </button>
                            )}
                            <button onClick={() => { setCalcPoints([]); setIsCalcMode(false); }} className="bg-rose-600 text-white px-3 py-1.5 md:py-1 rounded-full text-xs hover:bg-rose-500 transition whitespace-nowrap shadow-sm">
                                전체 삭제 및 종료
                            </button>
                        </div>
                    </div>
                    {(is3DMode || showManualCalcPointUI) && (
                        <div className="flex flex-wrap justify-center gap-2 items-center bg-black/85 p-2.5 rounded-lg border border-amber-500/50 shadow-xl pointer-events-auto">
                            <span className="text-zinc-400 font-mono text-xs">X:</span>
                            <CustomNumberInput value={calcManualX} onChange={setCalcManualX} className="w-14 md:w-16 bg-zinc-900 text-amber-300 font-mono px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-amber-500" />
                            <span className="text-zinc-400 font-mono text-xs">Y:</span>
                            <CustomNumberInput value={calcManualY} onChange={setCalcManualY} className="w-14 md:w-16 bg-zinc-900 text-amber-300 font-mono px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-amber-500" />
                            {is3DMode && (
                                <>
                                    <span className="text-zinc-400 font-mono text-xs">Z:</span>
                                    <CustomNumberInput value={calcManualZ} onChange={setCalcManualZ} className="w-14 md:w-16 bg-zinc-900 text-amber-300 font-mono px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-amber-500" />
                                </>
                            )}
                            <button onClick={handleAddManualCalcPoint} className="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold transition">입력</button>
                        </div>
                    )}
                </div>
            )}

            <div className={`absolute flex flex-col bg-zinc-800/90 backdrop-blur rounded-xl border border-zinc-700 shadow-2xl overflow-hidden text-lg font-bold z-[100] pointer-events-auto ${!isDraggingHandle.current ? 'transition-all duration-300' : ''}`}
                 style={isMobile ? { bottom: `calc(${mobilePanelHeight}vh + var(--safe-bottom, env(safe-area-inset-bottom, 16px)) + 48px)`, right: '16px' } : { bottom: '32px', right: '32px' }}>
              {isMobile && (
                  <button onClick={() => resetAll(imageObj)} className="px-3 py-3 md:px-4 md:py-4 hover:bg-rose-600 hover:text-white text-rose-400 transition-colors" title="전체 초기화">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                  </button>
              )}
              <button onClick={goHome} className={`px-3 py-3 md:px-4 md:py-4 hover:bg-sky-600 bg-sky-500 text-white transition-colors ${isMobile ? 'border-t' : ''} border-zinc-700`} title="화면 복귀">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              </button>
              <button onClick={zoomIn} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition-colors" title="확대">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
              </button>
              <button onClick={zoomOut} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition-colors" title="축소">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM7 10h6"/></svg>
              </button>
            </div>

            {isMobile && (
              <div 
                style={{ top: 'calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 16px)' }}
                className="absolute left-4 z-[60] flex items-center drop-shadow-2xl pointer-events-auto"
              >
                {/* 🚀 UI 크기 축소 (200x140 -> 180x130) 및 내부 여백 조절 */}
                <div className="bg-black/90 backdrop-blur border border-zinc-700 rounded-lg p-2.5 relative w-[180px] h-[130px] flex justify-center items-center shrink-0">
                  
                  {/* 좌상단: 연산 순서 보기 (PC와 아이콘 100% 동일하게 동기화) */}
                  <button onClick={() => setShowMatrixChain(!showMatrixChain)} className={`absolute -top-3 -left-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border ${showMatrixChain ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-zinc-800 border-zinc-600 text-zinc-400 hover:bg-zinc-700 hover:text-white'}`} title="행렬 곱셈 분해">
                      {showMatrixChain ? (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                      ) : (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                      )}
                  </button>
                  
                  {/* 우상단: 연산 과정 보기 */}
                  <button onClick={() => setIsCalcMode(!isCalcMode)} className={`absolute -top-3 -right-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border ${isCalcMode ? 'bg-amber-500 border-amber-400 text-white animate-pulse' : 'bg-zinc-800 border-zinc-600 text-amber-400 hover:bg-zinc-700 hover:text-white'}`} title="행렬 연산 과정 보기">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                  </button>

                  {/* 우하단: 그림자 저장 (중복 코드 완벽 삭제됨) */}
                  {!showMatrixChain && (
                      <button onClick={handleSaveState} className="absolute -bottom-3 -right-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border bg-zinc-800 border-zinc-600 text-indigo-400 hover:bg-zinc-700 hover:text-white" title="현재 상태 저장">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                      </button>
                  )}

                  <div className="flex items-center justify-center w-3 h-full">
                    <span className="text-zinc-400 font-serif text-[50px] leading-[0]" style={{ transform: 'scale(0.7, 2.0)' }}>(</span>
                  </div>

                  {/* 🚀 모바일 좌하단: 3차원(3D) 모드 전환 버튼 (입체다각형 문양) */}
                  {!showMatrixChain && (
                      <button
                          onClick={() => {
                              const next = !is3DMode;
                              setIs3DMode(next);
                              setManualMat3D(null);
                          }}
                          className={`absolute -bottom-3 -left-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border ${is3DMode ? 'bg-sky-500 border-sky-400 text-white shadow-[0_0_12px_rgba(14,165,233,0.6)]' : 'bg-zinc-800 border-zinc-600 text-sky-400 hover:bg-zinc-700 hover:text-white'}`}
                          title={is3DMode ? "2차원 평면 모드로 전환" : "3차원 공간 모드로 전환"}
                      >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" />
                              <path strokeLinecap="round" strokeLinejoin="round" d="M3.27 6.96L12 12.01l8.73-5.05" />
                              <path strokeLinecap="round" strokeLinejoin="round" d="M12 22.08V12" />
                          </svg>
                      </button>
                  )}
                  
                  {showMatrixChain ? (
                      <div className="flex items-center justify-center w-[110px] self-center">
                          <span className="text-indigo-400 font-bold text-[10px] text-center border border-indigo-500/30 bg-indigo-900/20 px-2 py-1.5 rounded-lg shadow-inner">
                              조립기<br/>실행 중
                          </span>
                      </div>
                  ) : (
                      <div className="grid grid-cols-3 gap-x-1.5 gap-y-2 text-center font-mono text-[11px] font-bold tracking-tighter w-full self-center max-w-[120px] mx-0.5">
                        <MatrixInput value={m00Str} onChange={v => handleMatrixUpdate('a', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m00Str, "1.00", "1")}`} />
                        <MatrixInput value={m01Str} onChange={v => handleMatrixUpdate('c', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m01Str, "0.00", "0")}`} />
                        <MatrixInput value={m02Str} onChange={v => handleMatrixUpdate('e', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m02Str, "0.00", "0")}`} />
                        
                        <MatrixInput value={m10Str} onChange={v => handleMatrixUpdate('b', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m10Str, "0.00", "0")}`} />
                        <MatrixInput value={m11Str} onChange={v => handleMatrixUpdate('d', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m11Str, "1.00", "1")}`} />
                        <MatrixInput value={m12Str} onChange={v => handleMatrixUpdate('f', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 md:py-1 transition-colors ${getMatrixColor(m12Str, "0.00", "0")}`} />
                        
                        {/* 🚀 모바일 환경에서도 3행의 원소들을 <MatrixInput> 컴포넌트로 개방. 크기와 UI 완벽 통일 */}
                        <MatrixInput value={m20Str} onChange={v => { if (is3DMode) handleMatrixUpdate('p0', v); else { setUsePerspective(true); setUseRefl(false); setPerspX(v); } }} matrixFormatExact={matrixFormatExact} isTranslate={false} isPerspective={!is3DMode || is3DPerspDisplay} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 md:py-1 transition-colors text-[10px] md:text-base ${getMatrixColor(m20Str, "0.00", "0")}`} />
                        <MatrixInput value={m21Str} onChange={v => { if (is3DMode) handleMatrixUpdate('p1', v); else { setUsePerspective(true); setUseRefl(false); setPerspY(v); } }} matrixFormatExact={matrixFormatExact} isTranslate={false} isPerspective={!is3DMode || is3DPerspDisplay} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 md:py-1 transition-colors text-[10px] md:text-base ${getMatrixColor(m21Str, "0.00", "0")}`} />
                        {is3DMode ? (
                            <MatrixInput value={m22Str} onChange={v => handleMatrixUpdate('p2', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 md:py-1 transition-colors text-[10px] md:text-base ${getMatrixColor(m22Str, "1.00", "1")}`} />
                        ) : (
                            <div className={`pointer-events-none w-full text-center text-[10px] md:text-base flex items-center justify-center py-0.5 md:py-1 ${getMatrixColor(m22Str, "1.00", "1")}`}>{m22Str}</div>
                        )}
                      </div>
                  )}

                  <div className="flex items-center justify-center w-3 h-full">
                    <span className="text-zinc-400 font-serif text-[50px] leading-[0]" style={{ transform: 'scale(0.7, 2.0)' }}>)</span>
                  </div>
                </div>

                {/* 🚀 사진 열기 버튼 크기 축소 및 배치 최적화 */}
                <label className="ml-2.5 w-12 h-[130px] flex flex-col gap-1.5 items-center justify-center bg-zinc-800/90 hover:bg-zinc-700 backdrop-blur border border-zinc-700 text-zinc-300 rounded-lg font-bold transition cursor-pointer shadow-xl pointer-events-auto shrink-0">
                    <svg className="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span className="text-[9px] text-zinc-400 leading-tight text-center">사진<br/>열기</span>
                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                </label>
              </div>
            )}

          </div>
        </div>
      );
    }

    function App() {
      const [isStarted, setIsStarted] = useState(window.location.hash === '#simulator');
      useEffect(() => {
        const handlePopState = () => setIsStarted(window.location.hash === '#simulator');
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);
      const handleStart = () => { window.history.pushState(null, '', '#simulator'); setIsStarted(true); };
      return !isStarted ? <StartScreen onStart={handleStart} /> : <SimulatorScreen />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
