<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 🚀 안드로이드 기기 자체의 강제 화면 확대/축소(Pinch Zoom) 기능을 원천 차단합니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vision Matrix Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-40px) rotate(180deg); } }
    @keyframes float-med { 0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); } 50% { transform: translateY(30px) rotate(-120deg) scale(1.1); } }
    @keyframes float-fast { 0%, 100% { transform: translateX(0px) rotate(0deg); } 50% { transform: translateX(-30px) rotate(90deg); } }
    .geom-shape { position: absolute; opacity: 0.15; border: 3px solid white; }
    .shape-1 { animation: float-slow 12s infinite ease-in-out; }
    .shape-2 { animation: float-med 15s infinite ease-in-out; }
    .shape-3 { animation: float-fast 10s infinite ease-in-out; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type="number"], input[type="text"] { -moz-appearance: textfield; appearance: textfield; }
    /* 🚀 모바일 환경(화면 너비 768px 이하)에서만 막대 터치 무시 & 손잡이 터치만 허용 */
    @media (max-width: 768px) {
      .strict-slider {
        /* Tailwind를 뚫고 강제로 적용하기 위해 !important 추가 */
        pointer-events: none !important;
      }
      .strict-slider::-webkit-slider-thumb {
        pointer-events: auto !important;
        /* 모바일에서 동그란 손잡이를 콕 집기 편하도록 터치 영역(크기)을 살짝 키워줍니다 */
        width: 22px !important;
        height: 22px !important;
      }
      .strict-slider::-moz-range-thumb {
        pointer-events: auto !important;
        width: 22px !important;
        height: 22px !important;
      }
    }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const DEFAULT_CONFIG = {
        scaleXMin: -5.0, scaleXMax: 5.0, scaleXStep: 0.1, scaleYMin: -5.0, scaleYMax: 5.0, scaleYStep: 0.1,
        squeezeMin: 0.1, squeezeMax: 3.0, squeezeStep: 0.1, transXMin: -500, transXMax: 500, transXStep: 1, transYMin: -500, transYMax: 500, transYStep: 1,
        rotMin: -180, rotMax: 180, rotStep: 1, shearXMin: -3.0, shearXMax: 3.0, shearXStep: 0.1, shearYMin: -3.0, shearYMax: 3.0, shearYStep: 0.1, contMin: 0, contMax: 5.0, contStep: 0.1
    };

    const GRAPH_COLORS = ['#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4'];

    const INFO_DATA = {
        scaleX: { title: "X축 확대 (Scale X)", desc: "X좌표에만 지정한 배율(sx)을 곱하여 가로로 늘리거나 줄입니다.", matrix: [['sx', '0', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        scaleY: { title: "Y축 확대 (Scale Y)", desc: "Y좌표에만 지정한 배율(sy)을 곱하여 세로로 늘리거나 줄입니다.", matrix: [['1', '0', '0'], ['0', 'sy', '0'], ['0', '0', '1']] },
        squeeze: { title: "스퀴즈 (Squeeze)", desc: "전체 면적은 그대로 1로 유지하면서, 한쪽 축은 늘리고 반대 축은 압축하는 특수 변환입니다.", matrix: [['k', '0', '0'], ['0', '1/k', '0'], ['0', '0', '1']] },
        transX: { title: "X축 이동 (Translate X)", desc: "모든 픽셀의 X좌표에 일정 값(dx)을 더하여 좌우로 평행 이동시킵니다.", matrix: [['1', '0', 'dx'], ['0', '1', '0'], ['0', '0', '1']] },
        transY: { title: "Y축 이동 (Translate Y)", desc: "모든 픽셀의 Y좌표에 일정 값(dy)을 더하여 상하로 평행 이동시킵니다.", matrix: [['1', '0', '0'], ['0', '1', 'dy'], ['0', '0', '1']] },
        rot: { title: "평면 회전 (Rotation)", desc: "원점을 기준으로 이미지를 지정된 각도(θ)만큼 평면 회전시키는 변환입니다.", matrix: [['cosθ', '-sinθ', '0'], ['sinθ', 'cosθ', '0'], ['0', '0', '1']] },
        shearX: { title: "X축 전단 (Shear X)", desc: "Y값이 커질수록 X축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 눕힙니다.", matrix: [['1', 'shx', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        shearY: { title: "Y축 전단 (Shear Y)", desc: "X값이 커질수록 Y축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 세웁니다.", matrix: [['1', '0', '0'], ['shy', '1', '0'], ['0', '0', '1']] },
        refl: { title: "반사 변환 (Reflection)", desc: "변환 중심점을 지나는 직선을 거울 삼아 이미지를 대칭시킵니다. (각도는 X축 기준)", matrix: [['cos(2θ)', 'sin(2θ)', '0'], ['sin(2θ)', '-cos(2θ)', '0'], ['0', '0', '1']] },
        mathLab: { title: "수학 실험실 (Math Lab)", desc: "이미지 렌더링을 끄고 순수한 2D 좌표평면을 띄워 실험하는 전문가용 모드입니다." },
        graph: { title: "함수 맵핑 (Function Map)", desc: "입력된 수학 함수 f(x)의 각 점에 3x3 변환 행렬을 곱하여 곡선을 구부립니다.", formulas: ["y = f(x)", "Point = Matrix * [x, y, 1]"] },
        point: { title: "좌표 점 맵핑 (Point Map)", desc: "화면을 클릭하여 생성된 수학적 원본 좌표(x,y)에 실시간으로 행렬을 곱합니다.", formulas: ["Point = Matrix * [x, y, 1]"] },
        polygon: { title: "다각형 그리기 맵핑", desc: "화면을 터치해 꼭짓점을 찍고, 처음 찍은 점을 다시 클릭하면 다각형 도형이 생성됩니다. 행렬 변환 시 뼈대 점들이 어떻게 움직여 도형이 찌그러지는지 확인해보세요." },
        symmetry: { title: "도형의 대칭이동", desc: "고등학교 1학년 수학 과정의 핵심인 x축, y축, 원점, y=x 직선에 대한 대칭이동을 원클릭으로 수행합니다. 각 버튼을 누르면 그에 맞는 변환 행렬로 자동 셋팅됩니다." },
        unitSquare: { title: "단위 정사각형 (행렬식/넓이)", desc: "한 변의 길이가 1인 기준 정사각형을 띄웁니다. 행렬 변환 후 이 정사각형의 넓이가 바로 행렬식(Determinant, |ad-bc|)의 값을 의미합니다. 넓이가 어떻게 뻥튀기되는지 관찰하세요.", formulas: ["넓이 변화율 = |ad - bc|"] },
        origin: { title: "변환 중심점 (Origin)", desc: "기본적으로 모든 도형과 사진의 회전 및 확대는 원점(0,0)을 기준으로 일어납니다. 이 좌표를 조절하면 행렬 변환의 '축'이 바뀌어 전혀 다른 궤적의 이동이 발생합니다." },
        chkGray: { title: "흑백화 (Grayscale)", desc: "빛의 3원색(RGB)에 눈의 민감도를 곱해 무채색으로 변환합니다.", formulas: ["Gray = R*0.299 + G*0.587 + B*0.114", "R = Gray, G = Gray, B = Gray"] },
        chkInv: { title: "색상 반전 (Invert)", desc: "빛의 삼원색 한계치(255)에서 현재 색상을 빼 보색을 만듭니다.", formulas: ["R = 255 - R", "G = 255 - G", "B = 255 - B"] },
        gAdd: { title: "전체 밝기 (Global Add)", desc: "모든 픽셀에 동일한 상수를 더해 화면 전체를 밝게 하거나 어둡게 합니다.", formulas: ["R' = R + Add"] },
        gMul: { title: "전체 명암비 (Global Contrast)", desc: "밝은 곳은 더 밝게, 어두운 곳은 더 어둡게 배율을 곱해 색상의 대비를 키웁니다.", formulas: ["R' = R * Contrast"] },
        binThresh: { title: "이진화 (Binary Threshold)", desc: "특정 임계값을 기준으로 픽셀을 오직 흰색(255)과 검은색(0)으로만 나눕니다.", formulas: ["if (Gray > Threshold) 255", "else 0"] },
        duo: { title: "듀오톤 (Duotone)", desc: "이미지를 흑백으로 바꾼 뒤, 어두운 부분과 밝은 부분에 두 가지 색상만 매핑합니다.", formulas: ["Color = Dark + (Light - Dark) * Ratio"] },
        cAdd: { title: "채널별 밝기 (Channel Add)", desc: "특정 색상(R/G/B) 채널의 값만 더하거나 뺍니다.", formulas: ["Channel = Channel + Add"] },
        cMul: { title: "채널별 명암비 (Channel Contrast)", desc: "특정 색상 채널의 값에만 배율을 곱합니다.", formulas: ["Channel = Channel * Contrast"] },
        matrixChain: { title: "행렬 분해 조립기 (연산 순서)", desc: "컴퓨터가 도형을 찌그러뜨릴 때 곱해지는 행렬들의 순서를 보여줍니다. 행렬 곱셈은 교환법칙이 성립하지 않기 때문에(AB ≠ BA), 블록을 위아래로 끌어다 순서를 바꾸면 화면의 도형이 전혀 다르게 움직이는 것을 확인할 수 있습니다." }
    };

    function getOptimalGridStep(z) {
        const targetStep = 100 / z;
        const exponent = Math.floor(Math.log10(targetStep));
        const fraction = targetStep / Math.pow(10, exponent);
        let niceFraction;
        if (fraction < 1.5) niceFraction = 1;
        else if (fraction < 3.5) niceFraction = 2;
        else if (fraction < 7.5) niceFraction = 5;
        else niceFraction = 10;
        return parseFloat((niceFraction * Math.pow(10, exponent)).toPrecision(14));
    }

    function formatNumber(num) {
        if (num === 0) return "0";
        const abs = Math.abs(num);
        if (abs >= 1e7 || abs <= 1e-7) return num.toExponential(2).replace('+', '');
        return parseFloat(num.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 7 });
    }

    const fmt = (v) => parseFloat(v.toFixed(4)).toString();

    const hexToRgb = (hex) => {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    };

    function compileMath(expr, constNames = []) {
        try {
            let s = expr.toLowerCase();
            
            // 🚀 새 UI(y= 직접 입력)에 맞춰, '=' 기호가 있으면 우변만 잘라서 사용하도록 호환성 추가
            if (s.includes('=')) {
                s = s.split('=')[1];
            }
            
            s = s.replace(/log_([0-9a-z.]+)\(([^)]+)\)/g, '(log($2)/log($1))');
            const keywords = ['sin', 'cos', 'tan', 'log', 'ln', 'abs', 'sqrt', 'exp', 'pi'];
            const map = {};
            keywords.forEach((kw, i) => {
                const char = String.fromCharCode(0xE000 + i);
                s = s.split(kw).join(char);
                map[char] = kw;
            });
            s = s.replace(/([a-z])(?=[a-z])/g, '$1*'); 
            s = s.replace(/([a-z])(?=[\uE000-\uE009])/g, '$1*'); 
            s = s.replace(/([\uE000-\uE009])(?=[a-z])/g, '$1*'); 
            s = s.replace(/([0-9.]+)(?=[a-z\uE000-\uE009])/g, '$1*'); 
            s = s.replace(/([a-z\uE000-\uE009])(?=[0-9.])/g, '$1*'); 
            s = s.replace(/([0-9a-z])\(/g, '$1*('); 
            s = s.replace(/\)(?=[0-9a-z\uE000-\uE009])/g, ')*'); 
            s = s.replace(/\)\(/g, ')*('); 
            for (const char in map) { s = s.split(char).join(map[char]); }
            s = s.replace(/sin/g, 'Math.sin')
                 .replace(/cos/g, 'Math.cos')
                 .replace(/tan/g, 'Math.tan')
                 .replace(/log/g, 'Math.log10')
                 .replace(/ln/g, 'Math.log')
                 .replace(/abs/g, 'Math.abs')
                 .replace(/sqrt/g, 'Math.sqrt')
                 .replace(/exp/g, 'Math.exp')
                 .replace(/pi/g, 'Math.PI')
                 .replace(/\be\b/g, 'Math.E')
                 .replace(/\^/g, '**')
                 .replace(/\bx\b/g, 'v'); 
            return new Function('v', ...constNames, `return ${s};`);
        } catch(e) { return () => NaN; }
    }

    const executeMath = (func, v, constValues = []) => {
        try { 
            const res = func(v, ...constValues); 
            if (typeof res === 'boolean') return res ? 1 : 0;
            return isNaN(res) ? NaN : res; 
        } 
        catch { return NaN; }
    }

    function CustomNumberInput({ value, onChange, validate, className }) {
        const [localVal, setLocalVal] = useState(String(value));
        useEffect(() => { setLocalVal(String(value)); }, [value]);

        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            if (validate && !validate(parsed)) {
                setLocalVal(String(value)); 
                return;
            }
            setLocalVal(String(parsed));
            if (parsed !== parseFloat(value)) onChange(parsed);
        };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                let parsed = parseFloat(localVal);
                if (isNaN(parsed)) parsed = 0;
                if (validate && !validate(parsed)) return; 
                e.target.blur(); 
            }
        };

        return <input type="text" value={localVal} onChange={(e) => setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} />;
    }

    function MatrixInput({ value, onChange, isTranslate, matrixFormatExact, className }) {
        const [localVal, setLocalVal] = useState("");
        useEffect(() => { 
            let parsed = parseFloat(value);
            if (isNaN(parsed)) parsed = 0;
            let finalStr = matrixFormatExact ? parseFloat(parsed.toFixed(4)).toString() : (isTranslate ? parsed.toFixed(0) : parsed.toFixed(2));
            setLocalVal(finalStr); 
        }, [value, isTranslate, matrixFormatExact]);
        
        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            let finalStr = matrixFormatExact ? parseFloat(parsed.toFixed(4)).toString() : (isTranslate ? parsed.toFixed(0) : parsed.toFixed(2));
            setLocalVal(finalStr);
            if (Math.abs(parsed - parseFloat(value)) > 0.0001) onChange(parsed);
        };
        const handleKeyDown = (e) => { 
            if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
        };

        const getFontSize = () => {
            const len = localVal.length;
            if (len > 8) return '0.55em';
            if (len > 6) return '0.7em';
            if (len > 4) return '0.85em';
            return '1em';
        };

        return <input type="text" value={localVal} onChange={e=>setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} style={{ fontSize: getFontSize(), transition: 'font-size 0.2s ease' }} />;
    }

    const ControlRow = ({ label, min, max, step, value, onChange, onReset = null, colorClass = "sky", syncKey = null, isSynced = false, onToggleSync = null, onOpenLogic = null, onOpenInfo = null }) => (
      <div className="flex flex-col gap-1">
        <div className="flex justify-between items-center">
          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
            {label}
            {onOpenInfo && ( <button onClick={onOpenInfo} title="설명 보기" className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button> )}
            {syncKey && ( <button onClick={onToggleSync} title="동기화 링크" className={`p-1 rounded transition-colors ${isSynced ? 'bg-sky-500 text-white' : 'text-zinc-500 hover:text-white'}`}><svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg></button> )}
            {onOpenLogic && ( 
              <button onClick={onOpenLogic} title="설정 변경" className="text-zinc-500 hover:text-white transition">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
              </button> 
            )}
            {onReset && ( 
              <button onClick={onReset} title="초기화" className="text-zinc-500 hover:text-white transition">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
              </button> 
            )}
          </span>
          <CustomNumberInput value={value} validate={(v) => v >= min && v <= max} onChange={onChange} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1 rounded w-16 text-right outline-none focus:border-${colorClass}-500 transition-colors`} />
        </div>
        
        {/* 🚀 strict-slider 클래스 추가됨 */}
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} style={{ touchAction: 'pan-y' }} className={`strict-slider accent-${colorClass}-400 cursor-pointer h-1.5 bg-zinc-700 rounded-lg appearance-none`} />
      </div>
    );

    const ConfigRow = ({ title, prefix, config, setConfig, colorClass, restrictMin = -Infinity }) => {
        const handleConfigChange = (type, val) => { 
            if (type === 'Min' && val < restrictMin) val = restrictMin;
            setConfig(prev => ({ ...prev, [`${prefix}${type}`]: val })); 
        };
        const resetToDefault = () => { setConfig(prev => ({ ...prev, [`${prefix}Min`]: Math.max(restrictMin, DEFAULT_CONFIG[`${prefix}Min`]), [`${prefix}Max`]: DEFAULT_CONFIG[`${prefix}Max`], [`${prefix}Step`]: DEFAULT_CONFIG[`${prefix}Step`] })); };

          if(navigator.vibrate) navigator.vibrate(20);
      };

      const handleMobileChainTouchMove = (e) => {
          if (!mobileDragRef.current) return;
          if (!e.touches || e.touches.length === 0) return; // 🚀 화면 밖 튀어나감(Touch End/Cancel) 시 e.touches[0] 증발 에러 완벽 방어
          const touch = e.touches[0];
          
          if (!mobileDragRef.current.isDragging) return;

          if (e.cancelable) e.preventDefault(); 

          let targetIdx = -1;
          const container = mobileChainContainerRef.current;
          
          if (container) {
              const crect = container.getBoundingClientRect();

              if (touch.clientY > crect.bottom - edge) container.scrollTop += 15;

              // 🚀 1. 유저 요청: 블록이 화면 밖(조립기 칸 밖)으로 나가지 못하게 Y좌표를 칸 내부에 가둠!
              let newY = touch.clientY - mobileDragRef.current.offsetY;
              const ghostHeight = mobileDragRef.current.height || 60; 
              newY = Math.max(crect.top, Math.min(crect.bottom - ghostHeight, newY));
              
              setMobileGhost(prev => prev ? { ...prev, y: newY } : null);

              // 🚀 2. 과격한 터치로 손가락이 좌우(X축)로 흔들려도 위치 교환이 안 끊기도록 Y축으로만 강력하게 판단!
              const children = Array.from(container.children);
              for (let i = 0; i < children.length; i++) {
                  const child = children[i];
                  const attr = child.getAttribute('data-mobile-idx');
                  if (attr !== null) {
                      const rect = child.getBoundingClientRect();
                      
                      // 손가락이 삐뚤어져도 Y좌표만 안에 있으면 무조건 통과!
                      if (touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                          const tIdx = parseInt(attr, 10);
                          const cIdx = mobileDragRef.current.index;
                          
                          if (tIdx !== cIdx && !isNaN(tIdx) && !isNaN(cIdx)) {
                              const midY = rect.top + rect.height / 2;
                              if ((cIdx < tIdx && touch.clientY > midY) || (cIdx > tIdx && touch.clientY < midY)) {
                                  targetIdx = tIdx;
                              }
                          }
                          break;
                      }
                  }
              }
          }

          // 🚀 3. 안전한 배열 인덱스 검사 (상태 꼬임 블랙스크린 렌더링 에러 영구 차단)
          if (targetIdx !== -1) {
              const currentIndex = mobileDragRef.current.index;
              if (!isNaN(targetIdx) && targetIdx !== currentIndex && targetIdx >= 0 && targetIdx < chainOrder.length && currentIndex >= 0 && currentIndex < chainOrder.length) {
                  setChainOrder(prev => {
                      const newOrder = [...prev];
                      const temp = newOrder[currentIndex];
                      if (!temp) return prev; 
                      newOrder.splice(currentIndex, 1);
                      newOrder.splice(targetIdx, 0, temp);
                      return newOrder;
                  });
                  mobileDragRef.current.index = targetIdx;
                  if (navigator.vibrate) navigator.vibrate(10);
              }
          }
      };

      const handleMobileChainTouchEnd = () => {
          mobileDragRef.current = null;
          setMobileGhost(null);
      }; 

      const handleChainTouchStart = (e, index, id) => {
          const touch = e.touches[0];
          const target = e.currentTarget;
          const rect = target.getBoundingClientRect();
          
          dragChainRef.current = {
              index, id,
              startX: touch.clientX, startY: touch.clientY,
              offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top,
              width: rect.width,
              timeout: setTimeout(() => {
                  if(dragChainRef.current) {
                      dragChainRef.current.isDragging = true;
                      setGhostDragInfo({ 
                          id, 
                          x: touch.clientX - dragChainRef.current.offsetX, 
                          y: touch.clientY - dragChainRef.current.offsetY,
                          width: dragChainRef.current.width 
                      });
                      if(navigator.vibrate) navigator.vibrate(50);
                  }
              }, 200) // 0.2초간 꾹 누르면 드래그 시작
          };
      };

      const handleChainTouchMove = (e) => {
          if (!dragChainRef.current) return;
          if (!e.touches || e.touches.length === 0) return; // 🚀 터치 아웃 에러 방어
          const touch = e.touches[0];

          if (!dragChainRef.current.isDragging) {
              if (Math.abs(touch.clientX - dragChainRef.current.startX) > 10 || Math.abs(touch.clientY - dragChainRef.current.startY) > 10) {
                  clearTimeout(dragChainRef.current.timeout);
                  dragChainRef.current = null;
              }
              return;
          }

          if (e.cancelable) e.preventDefault();
          
          let targetIdx = -1;
          const container = e.currentTarget;
          if (container) {
              const crect = container.getBoundingClientRect();
              const edgeThreshold = 80;
              // 🚀 가로 모드 모서리에 닿으면 손가락을 멈추고 있어도 부드럽게 화면 자동 스크롤
              if (touch.clientX > crect.right - edgeThreshold) {
                  if (!autoScrollTimerRef.current) autoScrollTimerRef.current = setInterval(() => { container.scrollLeft += 20; }, 30);
              } else if (touch.clientX < crect.left + edgeThreshold) {
                  if (!autoScrollTimerRef.current) autoScrollTimerRef.current = setInterval(() => { container.scrollLeft -= 20; }, 30);
              } else {
                  if (autoScrollTimerRef.current) { clearInterval(autoScrollTimerRef.current); autoScrollTimerRef.current = null; }
              }
              
              // 🚀 1. 조립기 칸 바깥으로 나가지 못하게 X좌표 고정, Y좌표는 흔들리지 않게 중앙 고정!
              let newX = touch.clientX - dragChainRef.current.offsetX;
              const ghostWidth = dragChainRef.current.width || 80;
              newX = Math.max(crect.left, Math.min(crect.right - ghostWidth, newX));
              let newY = crect.top + (crect.height / 2) - 30; // 가로 모드에서는 Y축이 위아래로 흔들리지 않고 레일처럼 고정됨
              
              setGhostDragInfo(prev => prev ? { ...prev, x: newX, y: newY } : null);
              
              // 🚀 2. 손가락이 위아래(Y축)로 삐뚤어져도 무시하고 X축으로만 강력하게 위치 교환 판단!
              const children = Array.from(container.children);
              for (let i = 0; i < children.length; i++) {
                  const child = children[i];
                  const attr = child.getAttribute('data-chain-idx');
                  if (attr !== null) {
                      const rect = child.getBoundingClientRect();
                      
                      if (touch.clientX >= rect.left && touch.clientX <= rect.right) {
                          const tIdx = parseInt(attr, 10);
                          const cIdx = dragChainRef.current.index;
                          
                          if (tIdx !== cIdx && !isNaN(tIdx) && !isNaN(cIdx)) {
                              const midX = rect.left + rect.width / 2;
                              if ((cIdx < tIdx && touch.clientX > midX) || (cIdx > tIdx && touch.clientX < midX)) {
                                  targetIdx = tIdx;
                              }
                          }
                          break;
                      }
                  }
              }
          }

          if (targetIdx !== -1) {
              const currentIndex = dragChainRef.current.index;
              if (!isNaN(targetIdx) && targetIdx !== currentIndex && targetIdx >= 0 && targetIdx < chainOrder.length && currentIndex >= 0 && currentIndex < chainOrder.length) {
                  setChainOrder(prev => {
                      const newOrder = [...prev];
                      const temp = newOrder[currentIndex];
                      if (!temp) return prev; // 🚀 안전망
                      newOrder.splice(currentIndex, 1);
                      newOrder.splice(targetIdx, 0, temp);

                  dragChainRef.current.index = targetIdx;
                  if (navigator.vibrate) navigator.vibrate(10);

      const handleChainTouchEnd = () => {

      const [useUnitSquare, setUseUnitSquare] = useState(false);
      const [transformOriginX, setTransformOriginX] = useState(0);
      const [transformOriginY, setTransformOriginY] = useState(0);
      
      const [usePolygonMode, setUsePolygonMode] = useState(false);
      const [polygons, setPolygons] = useState([]);
      const [polygonPoints, setPolygonPoints] = useState([]);
      
      // 🚀 도형 좌표 목록을 열고 닫는 토글 상태 관리

      const togglePoly = (idx) => {
          setExpandedPolys(prev => {

      const [showManualPolyUI, setShowManualPolyUI] = useState(false);
      const [polyManualX, setPolyManualX] = useState("0");
      const [polyManualY, setPolyManualY] = useState("0");

      const [isCalcMode, setIsCalcMode] = useState(false);
      const [calcPoints, setCalcPoints] = useState([]);
      const [selectedCalcPoint, setSelectedCalcPoint] = useState(null);
      const [showManualCalcPointUI, setShowManualCalcPointUI] = useState(false);
      const [calcManualX, setCalcManualX] = useState("0");
      const [calcManualY, setCalcManualY] = useState("0");

      useEffect(() => {
          const neededConsts = new Set();
          graphs.forEach(g => {
              if(!g.eq) return;
              let s = g.eq.toLowerCase();
              s = s.replace(/log_([0-9a-z.]+)\(([^)]+)\)/g, '(log($2)/log($1))');
              // 🚀 'y'를 동적 상수로 취급하지 않도록 예외 목록에 추가
              const keywords = ['sin', 'cos', 'tan', 'log', 'ln', 'abs', 'sqrt', 'exp', 'pi', 'e', 'x', 'y'];
              keywords.forEach(kw => { s = s.split(kw).join(''); });
              const matches = s.match(/[a-z]/g);
              if(matches) matches.forEach(m => neededConsts.add(m));
          });
          
          setConstants(prev => {
              let updated = false;
              let newConstants = prev.filter(c => {
                  if (neededConsts.has(c.name)) return true;

              neededConsts.forEach(letter => {
                  if (!newConstants.some(c => c.name === letter)) {
                      newConstants.push({ name: letter, value: 1.0, min: -10, max: 10, step: 0.1 });

              return updated ? newConstants : prev;
          });
      }, [graphs]);

      const openMathPad = (id, currentEq) => {

      const handleMathPadDelete = () => {

              } else if (start > 0) {

                  setTempGraphEq(newEq);

              }
          } else {
              setTempGraphEq(tempGraphEq.slice(0, -1));
          }
      };

      const handleMathPadClear = () => { 
          setTempGraphEq(""); 
          setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 0);
      };
      
      const MathParserGLSL = {
          parse: function(expr) {
              let s = expr.toLowerCase().replace(/\s+/g, '');
              if (s.includes('=')) { let p = s.split('='); s = `(${p[0]})-(${p[1]})`; } 
              else { s = `y-(${s})`; }
              s = s.replace(/log_([0-9a-z.]+)\(([^)]+)\)/g, '(LOGE($2)/LOGE($1))');
              s = s.replace(/ln\(/g, 'LOGE('); s = s.replace(/log\(/g, 'LOG10(');
              s = s.replace(/sin\(/g, 'SIN('); s = s.replace(/cos\(/g, 'COS(');
              s = s.replace(/tan\(/g, 'TAN('); s = s.replace(/abs\(/g, 'ABS(');
              s = s.replace(/sqrt\(/g, 'SQRT('); s = s.replace(/exp\(/g, 'EXP(');
              s = s.replace(/\bpi\b/g, 'PI_CONST'); s = s.replace(/\be\b/g, 'E_CONST');

      const handleDragOver = (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
      };

      const [syncKeys, setSyncKeys] = useState(new Set());
      const toggleSync = (key) => { setSyncKeys(prev => { const next = new Set(prev); if (next.has(key)) next.delete(key); else next.add(key); return next; }); };

      const prevVals = useRef({});
      useEffect(() => { prevVals.current = { scaleX, scaleY, translateX, translateY, rotation, shearX, shearY, squeeze, globalAdd, globalMul, rAdd, rMul, gAdd, gMul, bAdd, bMul }; });

      const stateSetters = { scaleX: setScaleX, scaleY: setScaleY, translateX: setTranslateX, translateY: setTranslateY, rotation: setRotation, shearX: setShearX, shearY: setShearY, squeeze: setSqueeze, globalAdd: setGlobalAdd, globalMul: setGlobalMul, rAdd: setRAdd, rMul: setRMul, gAdd: setGAdd, gMul: setGMul, bAdd: setBAdd, bMul: setBMul };
      
      const handleSyncChange = (key, newVal) => {
          const oldVal = prevVals.current[key];
          const delta = newVal - oldVal;
          stateSetters[key](newVal);
          if (syncKeys.has(key)) {
              syncKeys.forEach(k => {
                  if (k === key) return;
                  let targetNewVal = prevVals.current[k] + delta;
                  const bounds = {
                      scaleX: {min: config.scaleXMin, max: config.scaleXMax}, scaleY: {min: config.scaleYMin, max: config.scaleYMax},
                      translateX: {min: config.transXMin, max: config.transXMax}, translateY: {min: config.transYMin, max: config.transYMax},
                      rotation: {min: config.rotMin, max: config.rotMax},
                      shearX: {min: config.shearXMin, max: config.shearXMax}, shearY: {min: config.shearYMin, max: config.shearYMax},
                      squeeze: {min: config.squeezeMin, max: config.squeezeMax}, globalAdd: {min: -255, max: 255}, globalMul: {min: config.contMin, max: config.contMax},
                      rAdd: {min: -255, max: 255}, rMul: {min: config.contMin, max: config.contMax}, gAdd: {min: -255, max: 255}, gMul: {min: config.contMin, max: config.contMax}, bAdd: {min: -255, max: 255}, bMul: {min: config.contMin, max: config.contMax}
                  }[k];
                  if (targetNewVal < bounds.min) targetNewVal = bounds.min;
                  if (targetNewVal > bounds.max) targetNewVal = bounds.max;
                  stateSetters[k](targetNewVal);
              });
          }
      };

      const resetAll = (img = imageObj) => {
        if (useMathLab && !keepViewOnMathLab) {
            if (showImageInMathLab && img) setCamera(getOptimalCamera(img));
            else setCamera({ x: 0, y: 0, z: 100.0 });
        } else if (!useMathLab) {
            setCamera(getOptimalCamera(img));
        }
        
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

        setScaleX(clamp(1.0, config.scaleXMin, config.scaleXMax));
        setScaleY(clamp(1.0, config.scaleYMin, config.scaleYMax));
        setTranslateX(clamp(0, config.transXMin, config.transXMax));
        setTranslateY(clamp(0, config.transYMin, config.transYMax));
        setTransformOriginX(0); setTransformOriginY(0);
        setRotation(clamp(0, config.rotMin, config.rotMax));
        setShearX(clamp(0, config.shearXMin, config.shearXMax));
        setShearY(clamp(0, config.shearYMin, config.shearYMax));
        setSqueeze(clamp(1.0, config.squeezeMin, config.squeezeMax));
        
        setUseRefl(false); setReflAngle(90);
        setChkGray(false); setChkInvert(false); 
        setGlobalAdd(0); setGlobalMul(clamp(1.0, config.contMin, config.contMax)); 
        setBinThresh(-1);
        
        setRAdd(0); setRMul(clamp(1.0, config.contMin, config.contMax)); 
        setGAdd(0); setGMul(clamp(1.0, config.contMin, config.contMax)); 
        setBAdd(0); setBMul(clamp(1.0, config.contMin, config.contMax));
        
        setUseDuotone(false); 
        setChainOrder(['translate', 'origin', 'rotate', 'scale', 'shear', 'origin_back']);
      };

      // 🚀 현재 화면 이미지 병합 및 다운로드 함수
      const handleSaveImage = (format) => {
          const c2d = canvasRef.current;
          const cgl = canvasGLRef.current;
          if (!c2d) return;

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = c2d.width;
          tempCanvas.height = c2d.height;
          const tCtx = tempCanvas.getContext('2d');

          // 현재 테마에 맞춰 배경색 칠하기
          tCtx.fillStyle = isLightMode ? '#f0f2f5' : '#09090b';
          tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

          // 2D 캔버스와 WebGL 캔버스를 옵션(mathUnderImage) 순서에 맞게 병합
          if (mathUnderImage && cgl) {
              tCtx.drawImage(cgl, 0, 0);
              tCtx.drawImage(c2d, 0, 0);
          } else {
              tCtx.drawImage(c2d, 0, 0);
              if (cgl) tCtx.drawImage(cgl, 0, 0);
          }

          // 다운로드 트리거
          const link = document.createElement('a');
          link.download = `vision_matrix_export.${format === 'jpeg' ? 'jpg' : format}`;
          link.href = tempCanvas.toDataURL(`image/${format}`, 1.0);
          link.click();
      };

      const handleImageUpload = (e) => { // <-- (기존 코드 위치)
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          setImageObj(img);
          setUseMathLab(false); setUseGraph(false); setUsePointMode(false); 
          if (autoResetOnLoad) resetAll(img); else setCamera(getOptimalCamera(img));
        };
        img.src = url;
      };

      const handleAddManualPoint = () => {
          let x = parseFloat(manualX); let y = parseFloat(manualY);
          if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
          x = Math.max(-1e7, Math.min(1e7, x)); y = Math.max(-1e7, Math.min(1e7, y));
          setPoints(prev => {
              const newLabel = String.fromCharCode(65 + prev.length % 26);
              return [...prev, { id: Date.now(), label: newLabel, x, y }];
          });
          setShowManualPointUI(false);
      };

      const handleAddManualCalcPoint = () => {
          let x = parseFloat(calcManualX); let y = parseFloat(calcManualY);
          if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
          x = Math.max(-1e7, Math.min(1e7, x)); y = Math.max(-1e7, Math.min(1e7, y));
          setCalcPoints(prev => [...prev, { id: Date.now(), x, y }]);
          setShowManualCalcPointUI(false);
          setIsCalcMode(false);
      };

      const handleAddManualPolyPoint = () => {
          let x = parseFloat(polyManualX); let y = parseFloat(polyManualY);
          if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
          x = Math.max(-1e7, Math.min(1e7, x)); y = Math.max(-1e7, Math.min(1e7, y));

          // 🚀 1. 점 입력 후 텍스트 칸을 '0'으로 완벽히 초기화
          setPolyManualX("0");
          setPolyManualY("0");

          // 🚀 2. 입력한 좌표가 맨 처음 찍은 점의 좌표와 동일한지 검사
          if (polygonPoints.length >= 2) {
              let firstP = polygonPoints[0];
              // 부동소수점 오차를 고려해 1e-5 이내로 같으면 동일한 점으로 판정
              if (Math.abs(firstP.x - x) < 1e-5 && Math.abs(firstP.y - y) < 1e-5) {
                  setPolygons(prev => [...prev, polygonPoints]); // 완성된 다각형 목록에 추가
                  setPolygonPoints([]); // 현재 그리고 있는 점 목록 비우기 (마지막 중복 점 표시 X)
                  setShowManualPolyUI(false);
                  return;
              }
          }

          setPolygonPoints(prev => [...prev, { x, y }]);
          setShowManualPolyUI(false);
      };

      const applySymmetry = (type) => {
          handleSyncChange('translateX', 0); handleSyncChange('translateY', 0);
          handleSyncChange('shearX', 0); handleSyncChange('shearY', 0); handleSyncChange('squeeze', 1.0);
          if (type === 'X') {
              setUseRefl(false); setRotation(0); handleSyncChange('scaleX', 1); handleSyncChange('scaleY', -1); 
          } else if (type === 'Y') {
              setUseRefl(false); setRotation(0); handleSyncChange('scaleX', -1); handleSyncChange('scaleY', 1); 
          } else if (type === 'ORIGIN') {
              setUseRefl(false); setRotation(180); handleSyncChange('scaleX', 1); handleSyncChange('scaleY', 1);
          } else if (type === 'YX') {
              setUseRefl(true); setReflAngle(45); handleSyncChange('scaleX', 1); handleSyncChange('scaleY', 1); setRotation(0);
          }
      };

      const constValues = constants.map(c => c.value);

      // 🚀 드래그 가능한 행렬 블록 맵핑
      const getChainMatrix = (id) => {
          switch(id) {
              case 'translate': return { m: new DOMMatrix().translate(translateX, translateY), label: '이동' };
              case 'origin': return { m: new DOMMatrix().translate(transformOriginX, -transformOriginY), label: '+중심점' };
              case 'origin_back': return { m: new DOMMatrix().translate(-transformOriginX, transformOriginY), label: '-중심점' };
              case 'rotate': 
                  if (useRefl) {
                      // 🚀 브라우저 캔버스의 Y축 역전으로 인한 부호 오류를 막기 위해 DOMMatrix 내장함수 체이닝 사용
                      const rMat = new DOMMatrix().rotate(-reflAngle).scale(1, -1).rotate(reflAngle);
                      return { m: rMat, label: '반사' };
                  } else {
                      const v = rotation * Math.PI / 180;
                      let rM = new DOMMatrix([
                          executeMath(compiledLogic.m00, v, constValues), executeMath(compiledLogic.m10, v, constValues),
                          executeMath(compiledLogic.m01, v, constValues), executeMath(compiledLogic.m11, v, constValues),
                          0, 0
                      ]);
                      return { m: rM, label: '회전' };
                  }
              case 'scale': return { m: new DOMMatrix().scale(scaleX * squeeze, scaleY * (1 / squeeze)), label: '크기' };
              case 'shear': return { m: new DOMMatrix([1, shearY, shearX, 1, 0, 0]), label: '전단(Shear)' };
              default: return { m: new DOMMatrix(), label: '알수없음' };
          }
      };

      // 🚀 1. 행렬 연산 엔진 (드래그 앤 드롭 순서 적용)
      let matrix = new DOMMatrix();
      
      if (showMatrixChain) {
          chainOrder.forEach(id => {
              matrix = matrix.multiply(getChainMatrix(id).m);
          });
      } else {
          matrix = matrix.translate(translateX, translateY); 
          matrix = matrix.translate(transformOriginX, -transformOriginY); 
          if (useRefl) {
              // 🚀 메인 행렬에도 DOMMatrix 내장함수 체이닝 사용
              matrix = matrix.multiply(new DOMMatrix().rotate(-reflAngle).scale(1, -1).rotate(reflAngle));
          } else { 
              let v = rotation * Math.PI / 180;
              let rM = new DOMMatrix([
                  executeMath(compiledLogic.m00, v, constValues), executeMath(compiledLogic.m10, v, constValues),
                  executeMath(compiledLogic.m01, v, constValues), executeMath(compiledLogic.m11, v, constValues),
                  0, 0
              ]);
              matrix = matrix.multiply(rM);
          }
          matrix = matrix.scale(scaleX * squeeze, scaleY * (1 / squeeze));
          matrix = matrix.multiply(new DOMMatrix([1, shearY, shearX, 1, 0, 0]));
          matrix = matrix.translate(-transformOriginX, transformOriginY); 
      }

      const getMatrixColor = (currentStr, defaultFixed, defaultExact) => {
          const target = matrixFormatExact ? defaultExact : defaultFixed;
          return currentStr === target ? "text-zinc-600" : "text-sky-400 text-shadow-glow";
      };

      const formatMatrixVal = (val, isTranslate) => {
          if (matrixFormatExact) return parseFloat(val.toFixed(4)).toString();
          return isTranslate ? val.toFixed(0) : val.toFixed(2);
      };

      let m00Str = formatMatrixVal(matrix.a, false); let m10Str = formatMatrixVal(matrix.b, false);
      let m01Str = formatMatrixVal(matrix.c, false); let m11Str = formatMatrixVal(matrix.d, false);
      let m02Str = formatMatrixVal(matrix.e, true); let m12Str = formatMatrixVal(matrix.f, true);

      const handleMatrixUpdate = (key, v) => {
          setConfig(prev => {
              let next = { ...prev };
              const expand = (prefix, val) => {
                  if (val > next[`${prefix}Max`]) next[`${prefix}Max`] = Math.ceil(val + Math.abs(val)*0.2 + 1);
                  if (val < next[`${prefix}Min`]) next[`${prefix}Min`] = Math.floor(val - Math.abs(val)*0.2 - 1);
              };
              if (key === 'a' || key === 'd') { expand('scaleX', v); expand('scaleY', v); }
              if (key === 'e') expand('transX', v);
              if (key === 'f') expand('transY', v);
              if (key === 'b' || key === 'c') { expand('shearX', v); expand('shearY', v); }
              return next;
          });

          if (key === 'e') setTranslateX(v);
          if (key === 'f') setTranslateY(v);
          if (key === 'a') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setScaleX(v); }
          if (key === 'd') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setScaleY(v); }
          if (key === 'c') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setShearX(scaleY !== 0 ? v / scaleY : 0); }
          if (key === 'b') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setShearY(scaleX !== 0 ? v / scaleX : 0); }
      };

      // 🚀 통합 정밀 타격 엔진: "모니터 화면 픽셀(Screen Pixel)" 기준으로 거리를 재고, 빈 공간(투명 픽셀)을 무시합니다.
      // 🚀 통합 정밀 타격 엔진: "모니터 화면 픽셀(Screen Pixel)" 기준으로 거리를 재고, 빈 공간(투명 픽셀)을 무시합니다.
      const getHitShadowId = (screenX, screenY) => {
          let canvasPt = new DOMPoint(screenX / camera.z, screenY / camera.z);
          let mathPt = new DOMPoint(screenX / camera.z, -screenY / camera.z);

          for (let i = shadowStates.length - 1; i >= 0; i--) {
              let shadow = shadowStates[i];
              let invMat = shadow.matrix.inverse();
              let baseCanvasPt = canvasPt.matrixTransform(invMat);
              let baseMathPt = mathPt.matrixTransform(invMat);
              let hit = false;
              
              // 1. 사진 정밀 타격 (투명한 허공 무시 + 억지로 넓히던 인식 범위 완전 제거)
              if (shadow.isImageActive && imageObj && colorCacheRef.current) {
                  let imgScale = (shadow.isMathActive && shadow.isImageActive) ? (1.0 / pixelsPerUnit) : 1.0;
                  let scaledX = baseCanvasPt.x / imgScale;
                  let scaledY = baseCanvasPt.y / imgScale;
                  if (scaledX >= -imageObj.width/2 && scaledX <= imageObj.width/2 && scaledY >= -imageObj.height/2 && scaledY <= imageObj.height/2) {
                      let ctxCache = colorCacheRef.current.getContext('2d', { willReadFrequently: true });
                      let ratioX = colorCacheRef.current.width / imageObj.width; 
                      let ratioY = colorCacheRef.current.height / imageObj.height;
                      let px = Math.floor((scaledX + imageObj.width/2) * ratioX); 
                      let py = Math.floor((scaledY + imageObj.height/2) * ratioY);
                      if (px >= 0 && px < colorCacheRef.current.width && py >= 0 && py < colorCacheRef.current.height) {
                          if (ctxCache.getImageData(px, py, 1, 1).data[3] > 20) hit = true; // 투명도 검사로 빈 허공 클릭 무시
                      }
                  }
              }
              
              // 2. 단위 정사각형 타격
              if (!hit && shadow.isMathActive && useUnitSquare) {
                  if (baseMathPt.x >= 0 && baseMathPt.x <= 1 && baseMathPt.y >= 0 && baseMathPt.y <= 1) hit = true; 
              }
              
              // 3. 수학 함수 선(Line) 타격 (화면상 15픽셀 이내인지 직접 계산)
              if (!hit && shadow.isMathActive && shadow.graphs) {
                  for (let g of shadow.graphs) {
                      if (!g.eq) continue;
                      let s = g.eq.toLowerCase().replace(/\s+/g, '');
                      if (s.includes('=') && !s.startsWith('y=')) {
                          if (baseMathPt.x >= -15 && baseMathPt.x <= 15 && baseMathPt.y >= -15 && baseMathPt.y <= 15) { hit = true; break; }
                      } else {
                          try {
                              let jsEq = MathParserJS.parse(s);
                              let func = new Function('x', ...constants.map(c=>c.name), `return ${jsEq};`);
                              let y = func(baseMathPt.x, ...constants.map(c=>c.value));
                              if (isFinite(y)) {
                                  let curvePt = new DOMPoint(baseMathPt.x, y).matrixTransform(shadow.matrix);
                                  let drawX = curvePt.x * camera.z; let drawY = -curvePt.y * camera.z;
                                  if (Math.hypot(screenX - drawX, screenY - drawY) < 15) { hit = true; break; } // 🚀 함수 선 15px 반경 지정
                              }
                          } catch(e) {}
                      }
                  }
              }
              
              // 4. 다각형 및 점 타격 (화면상 15픽셀 이내)
              if (!hit && shadow.isMathActive && shadow.polygons) {
                  for (let poly of shadow.polygons) {
                      for (let p of poly) {
                          let pt = new DOMPoint(p.x, p.y).matrixTransform(shadow.matrix);
                          if (Math.hypot(screenX - pt.x * camera.z, screenY + pt.y * camera.z) < 15) { hit = true; break; }
                      }
                  }
              }
              if (!hit && shadow.isMathActive && shadow.points) {
                  for (let p of shadow.points) {
                      let pt = new DOMPoint(p.x, p.y).matrixTransform(shadow.matrix);
                      if (Math.hypot(screenX - pt.x * camera.z, screenY + pt.y * camera.z) < 15) { hit = true; break; }
                  }
              }
              
              if (hit) return shadow.id;
          }
          return null;
      };

      const processCanvasClick = (clientX, clientY) => {
          const canvas = canvasRef.current;
          if (!canvas) return false;

          const rect = canvas.getBoundingClientRect();
          const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
          const offsetX = (rect.width - canvas.width * scale) / 2;
          const offsetY = (rect.height - canvas.height * scale) / 2;
          const canvasX = (clientX - rect.left - offsetX) / scale;
          const canvasY = (clientY - rect.top - offsetY) / scale;
          const cx = canvas.width / 2; const cy = canvas.height / 2;

          let screenX = canvasX - cx - camera.x;
          let screenY = canvasY - cy - camera.y;
          
          let hitShadowId = getHitShadowId(screenX, screenY);

          if (hitShadowId !== null) {
              setSelectedShadowId(hitShadowId);
              setShowShadowMenu(true);
              return true; 
          }

          // 🚀 다른 곳을 누르면 삭제되는 기능 완전히 삭제 완료 (요청 1번 반영)

          let hitPoint = null;
          for (let p of calcPoints) {
              let pt = new DOMPoint(p.x, p.y);
              let tPt = pt.matrixTransform(matrix);
              let drawX = tPt.x * camera.z; let drawY = -tPt.y * camera.z; 
              if (Math.hypot(screenX - drawX, screenY - drawY) < 30) { hitPoint = p; break; }
          }
          if (hitPoint) { setSelectedCalcPoint(hitPoint); return true; }

          let mathX = screenX / camera.z; let mathY = -screenY / camera.z; 
          let mathPt = new DOMPoint(mathX, mathY);

          if (isCalcMode) {
              let invMat = matrix.inverse(); let basePt = mathPt.matrixTransform(invMat);
              let logicX = Math.round((basePt.x) * 100) / 100; let logicY = Math.round((basePt.y) * 100) / 100;
              setCalcPoints(prev => [...prev, { id: Date.now(), x: logicX, y: logicY }]);
              setIsCalcMode(false); return true;
          }

          if (usePolygonMode) {
              let invMat = matrix.inverse(); let basePt = mathPt.matrixTransform(invMat);
              let logicX = Math.round((basePt.x) * 10) / 10; let logicY = Math.round((basePt.y) * 10) / 10;
              if (polygonPoints.length >= 3) {
                  let firstP = polygonPoints[0];
                  let fMath = new DOMPoint(firstP.x, firstP.y).matrixTransform(matrix);
                  let fDrawX = fMath.x * camera.z; let fDrawY = -fMath.y * camera.z;
                  if (Math.hypot(screenX - fDrawX, screenY - fDrawY) < 20) {
                      setPolygons(prev => [...prev, polygonPoints]); setPolygonPoints([]); return true;
                  }
              }
              setPolygonPoints(prev => [...prev, { x: logicX, y: logicY }]); return true;
          }
          return false;
      };

      const addMathPoint = (clientX, clientY) => {
          const canvas = canvasRef.current; if (!canvas) return;
          const rect = canvas.getBoundingClientRect(); const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
          const offsetX = (rect.width - canvas.width * scale) / 2; const offsetY = (rect.height - canvas.height * scale) / 2;
          const canvasX = (clientX - rect.left - offsetX) / scale; const canvasY = (clientY - rect.top - offsetY) / scale;
          const cx = canvas.width / 2; const cy = canvas.height / 2;
          let screenX = canvasX - cx - camera.x; let screenY = canvasY - cy - camera.y;

          let mathX = screenX / camera.z; let mathY = -screenY / camera.z;
          let mathPt = new DOMPoint(mathX, mathY);
          let invMat = matrix.inverse(); let basePt = mathPt.matrixTransform(invMat);
          
          let logicX = Math.round((basePt.x) * 10) / 10; let logicY = Math.round((basePt.y) * 10) / 10;
          setPoints(prev => {
              const newLabel = String.fromCharCode(65 + prev.length % 26);
              return [...prev, { id: Date.now(), label: newLabel, x: logicX, y: logicY }];
          });
      };

      // 🚀 1. 0으로 나누기(Infinity, NaN) 원천 차단형 이동 계산기
      const calculateDelta = (clientX, clientY) => {
          const canvas = canvasRef.current; if (!canvas) return { dx: 0, dy: 0 };
          const rect = canvas.getBoundingClientRect(); 
          
          let scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
          if (!isFinite(scale) || scale <= 0) scale = 1; // 안드로이드 크기 0 버그 방어막!
          
          let dx = (clientX - lastMouseRef.current.x) / scale; 
          let dy = (clientY - lastMouseRef.current.y) / scale;
          
          if (!isFinite(dx) || isNaN(dx)) dx = 0; // NaN 감염 차단
          if (!isFinite(dy) || isNaN(dy)) dy = 0;
          return { dx, dy };
      };

                    // ❌ 원본 코드에 있던 gl.deleteProgram(program) 완벽히 삭제 (이게 엔진을 뻗게 한 주범)
                }
            }
        };

        const drawMathPoints = (renderMatrix = matrix, alpha = 1.0) => {
            if (!useMathLab || !usePointMode || points.length === 0) return;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(cx + camera.x, cy + camera.y);
            points.forEach(p => {
                let pt = new DOMPoint(p.x, p.y); // 🚀 부호 버그 수정
                let tPt = pt.matrixTransform(renderMatrix);
                let drawX = tPt.x * z;
                let drawY = -tPt.y * z;
                if (!isFinite(drawX) || !isFinite(drawY)) return;
                
                ctx.beginPath(); ctx.arc(drawX, drawY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#10b981'; ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = 'white'; ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
                ctx.fillText(`${p.label}(${p.x}, ${p.y})`, drawX + 12, drawY - 12);
                ctx.shadowBlur = 0;
            });
            ctx.restore();
        };

        const drawCalcPoints = () => {
            if (calcPoints.length === 0) return;
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            calcPoints.forEach(p => {
                let pt = new DOMPoint(p.x, p.y); // 🚀 부호 버그 수정
                let tPt = pt.matrixTransform(matrix);
                let drawX = tPt.x * z;
                let drawY = -tPt.y * z;
                if (!isFinite(drawX) || !isFinite(drawY)) return;
                
                ctx.beginPath();
                ctx.arc(drawX, drawY, 12, 0, 2 * Math.PI);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', drawX, drawY);
                
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'left';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(`(${p.x}, ${p.y})`, drawX + 18, drawY - 18);
                ctx.shadowBlur = 0;
            });
            ctx.restore();
        };

        if (!imageUnderGrid) {
            drawGridLines();
            drawNumbers();
        }

        // 🚀 그림자를 메인 도형들보다 '먼저(바닥에)' 그려서 원본 이미지가 탁해지는 현상 완벽 방어!
        if (shadowStates.length > 0) {
            shadowStates.forEach(shadow => {
                if (shadow.glImage) {
                    ctx.save();
                    ctx.globalAlpha = 0.35; 
                    const sScale = z / shadow.camOrigin.z;
                    ctx.translate(cx + camera.x, cy + camera.y);
                    ctx.scale(sScale, sScale);
                    ctx.translate(-(cx + shadow.camOrigin.x), -(cy + shadow.camOrigin.y));
                    ctx.drawImage(shadow.glImage, 0, 0);
                    ctx.restore();
                }

                // 🚀 그림자 렌더링 시 현재 모드가 아니라 "저장 시점의 모드"를 그대로 적용
                if (shadow.isImageActive) drawImageLayer(shadow.matrix, 0.35, shadow.isMathActive, true);
                if (shadow.isMathActive) { 
                    drawUnitSquare(shadow.matrix, 0.35); 
                    drawPolygon(shadow.matrix, 0.35, shadow.polygons); 
                    // 🚀 렌더링 중 수식 파서 뻗음(블랙스크린) 방지 안전망 추가
                    try { drawMathFunctions(shadow.matrix, 0.35, shadow.graphs); } catch(e) {}
                    drawMathPoints(shadow.matrix, 0.35, shadow.points); 
                }
            });
        }
        
        // 🚀 원본(현재 상태) 메인 객체 렌더링 (불투명도 100%)
        ctx.globalAlpha = 1.0;
        
        if (useMathLab && mathUnderImage) { drawUnitSquare(); drawPolygon(); drawMathFunctions(); drawMathPoints(); }

        if (isImageActive) drawImageLayer();

        if (useMathLab && !mathUnderImage) { drawUnitSquare(); drawPolygon(); drawMathFunctions(); drawMathPoints(); }

        if (imageUnderGrid) {
            drawGridLines();
            drawNumbers();
        }

        drawCalcPoints();

        if (useRefl) {
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y); 
            ctx.translate((translateX + transformOriginX) * z, (translateY - transformOriginY) * z); 
            ctx.rotate(-(reflAngle * Math.PI) / 180); 
            ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 3; ctx.beginPath(); 
            if (isFinite(-w*5)) ctx.moveTo(-w * 5, 0); 
            if (isFinite(w*5)) ctx.lineTo(w * 5, 0); 
            ctx.stroke(); ctx.restore();
        }

      // 🚀 다중 그림자 배열(shadowStates) 감지 추가
      }, [camera, matrix, imageObj, imageUnderGrid, hideGrid, useRefl, reflAngle, translateX, translateY, useMathLab, useGraph, usePointMode, points, graphs, imageSmoothing, constants, mathUnderImage, showImageInMathLab, calcPoints, useUnitSquare, usePolygonMode, polygonPoints, polygons, shadowStates]);

                  .text-white, .text-zinc-100, .text-zinc-200, .text-zinc-300 { color: #212529 !important; }
                  .text-zinc-400, .text-zinc-500, .text-zinc-600 { color: #495057 !important; }
                  .border-zinc-700, .border-zinc-800, .border-zinc-600 { border-color: #dee2e6 !important; }

          {/* 🚀 모바일용 세로 드래그앤드롭 고스트(Ghost) UI */}

                      <div className="flex justify-between items-center border-b border-zinc-700 pb-3">

                                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg>
                              </button>

                                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>

                          <button onClick={() => setShowMatrixChain(false)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                      </div>
                      
                      <p className="text-[11px] text-zinc-400 leading-relaxed -mt-2">

                      <div className="flex flex-col gap-2.5 overflow-y-auto max-h-[50vh] p-1 pb-4 scrollbar-hide relative"

                                <button onClick={()=>handleMathPadKey('3')} className="bg-zinc-800 text-white py-2 rounded-lg font-bold text-lg hover:bg-zinc-700">3</button>
                                <button onClick={()=>handleMathPadKey('-')} className="bg-sky-600/20 text-sky-400 border border-sky-500/30 py-2 rounded-lg font-bold text-xl hover:bg-sky-600/40">-</button>

                                <button onClick={()=>handleMathPadKey('0')} className="bg-zinc-800 text-white py-2 rounded-lg font-bold text-lg hover:bg-zinc-700">0</button>

                                <button onClick={()=>handleMathPadKey('+')} className="bg-sky-600/20 text-sky-400 border border-sky-500/30 py-2 rounded-lg font-bold text-lg hover:bg-sky-600/40">+</button>
                            </div>

                        <button onClick={applyMathPad} className="mt-1 w-full bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-sm py-3 transition shadow-[0_0_15px_rgba(168,85,247,0.3)]">

                        </button>
                    </div>
                )}

                    <div className="grid grid-cols-5 gap-3">

                            <button key={letter} onClick={() => handleConstClick(letter)} className="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 py-4 rounded-lg font-bold text-xl hover:bg-indigo-600/40 transition">
                                {letter}
                            </button>
                        ))}
                    </div>
                )}
              </div>
            </div>
          )}

          {logicInfoData && (
            <div className="fixed inset-0 z-[400] flex items-start md:items-center justify-center pt-24 md:pt-0 bg-black/70 backdrop-blur-sm px-4" onClick={() => setLogicInfoData(null)}>

                              <span className="text-slate-400 font-sans font-bold px-1">=</span>
                              <div className="flex items-center">

                              <div className="flex items-center gap-1 md:gap-2 pl-4 md:pl-9 font-sans flex-wrap">

                              <div className="flex items-center gap-1 md:gap-2 pl-4 md:pl-9 font-sans">

                              <div className="flex items-center gap-1 md:gap-2 pl-4 md:pl-9 font-sans flex-wrap">

                              </div>
                              <div className="flex items-center gap-1 md:gap-2 pl-4 md:pl-9 font-sans">

                              const b = fmt(matrix.b), d = fmt(matrix.d), f = fmt(matrix.f);
                              const x = selectedCalcPoint.x, y = selectedCalcPoint.y;
                              const resX = fmt(matrix.a * x + matrix.c * y + matrix.e);
                              const resY = fmt(matrix.b * x + matrix.d * y + matrix.f);
                              const text = `[행렬 연산 과정]\n행렬:\n[ ${a}  ${c}  ${e} ]\n[ ${b}  ${d}  ${f} ]\n[ 0  0  1 ]\n\n원본 좌표: (${x}, ${y})\n\nX' = (${a} * ${x}) + (${c} * ${y}) + ${e} = ${resX}\nY' = (${b} * ${x}) + (${d} * ${y}) + ${f} = ${resY}\n\n결과 좌표: (${resX}, ${resY})`;
                              navigator.clipboard.writeText(text).then(() => alert("연산 과정이 텍스트로 복사되었습니다."));

                               <svg className="w-3.5 h-3.5 md:w-4 md:h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                               지우기
                           </button>
                           <button onClick={() => setSelectedCalcPoint(null)} className="px-5 md:px-6 py-1.5 md:py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition shadow-lg font-bold text-xs md:text-sm">
                               확인
                           </button>
                      </div>
                  </div>
              </div>
          )}

          {graphSettingsId !== null && (
            <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
              <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-5 md:p-6 w-full max-w-[22rem] shadow-2xl animate-fade-in flex flex-col gap-4">

                {graphs.find(g => g.id === graphSettingsId) && (() => {

                                        setGraphs(prev => prev.map(item => item.id === g.id ? { ...item, matrixMode: 'global' } : item));
                                    }} className="accent-purple-500" />
                                    <span className="text-zinc-300 font-bold text-sm">기본 (글로벌 행렬 따르기)</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-zinc-800 transition">
                                    <input type="radio" name="matrixMode" checked={g.matrixMode === 'none'} onChange={() => {

                                <label className="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-zinc-800 transition">

                                    }} className="accent-purple-500" />
                                    <span className="text-zinc-300 font-bold text-sm text-purple-400">개별 행렬 직접 입력</span>
                                </label>
                            </div>

                            {g.matrixMode === 'custom' && (
                                <div className="bg-black border border-zinc-800 rounded-lg p-4 flex justify-center items-center relative shadow-inner h-[140px]">
                                    <div className="flex items-center justify-center w-3 h-full">
                                        <span className="text-zinc-500 font-serif text-[60px] leading-[0]" style={{ transform: 'scale(0.6, 2.0)' }}>(</span>
                                    </div>

                                        <CustomNumberInput value={g.customMatrix.a} onChange={v => updateGraphCustomMatrix(g.id, 'a', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />
                                        <CustomNumberInput value={g.customMatrix.c} onChange={v => updateGraphCustomMatrix(g.id, 'c', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />
