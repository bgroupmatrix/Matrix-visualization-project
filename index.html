                <button onClick={() => resetAll(imageObj)} className="px-5 flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-base font-bold transition shadow shrink-0">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                  전체 리셋
                </button>
              </div>
            </div>

            <div className="hidden md:flex bg-black justify-center items-center border-b border-zinc-800 shrink-0 relative px-4 py-6 min-h-[220px]">
                {/* 🚀 PC용 현재 상태 저장 버튼 (아이콘 변경) */}
              {!showMatrixChain && (
                  <button onClick={handleSaveState} className="absolute bottom-4 right-4 w-9 h-9 flex items-center justify-center rounded-lg bg-zinc-800 text-indigo-400 border border-indigo-500/50 hover:bg-zinc-700 hover:text-white transition shadow z-10" title="현재 상태 그림자로 저장">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                  </button>
              )}
              
              <button onClick={() => setShowMatrixChain(!showMatrixChain)} className={`absolute top-4 left-4 w-9 h-9 flex items-center justify-center rounded-lg transition shadow z-10 ${showMatrixChain ? 'bg-indigo-600 text-white' : 'bg-zinc-800 text-zinc-400 border border-zinc-700 hover:bg-zinc-700 hover:text-white'}`} title="행렬 곱셈 분해하여 보기">
                  {showMatrixChain ? (
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                  ) : (
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                  )}
              </button>

              {/* 🚀 PC: 행렬 분해 보기 i 아이콘 및 리셋 아이콘 추가 */}
              {showMatrixChain && (
                  <>
                      <button onClick={() => setLogicInfoData(INFO_DATA.matrixChain)} className="absolute top-4 left-16 w-9 h-9 flex items-center justify-center rounded-lg bg-zinc-800 text-indigo-400 border border-indigo-500/50 hover:bg-zinc-700 hover:text-white transition shadow z-10" title="행렬 분해 조립기 설명">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg>
                      </button>
                      <button onClick={() => setChainOrder(['translate', 'origin', 'rotate', 'scale', 'shear', 'origin_back'])} className="absolute top-4 left-[104px] w-9 h-9 flex items-center justify-center rounded-lg bg-zinc-800 text-rose-400 border border-rose-500/50 hover:bg-zinc-700 hover:text-white transition shadow z-10" title="행렬 순서 초기화">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                      </button>
                  </>
              )}

              <button onClick={() => setIsCalcMode(!isCalcMode)} className={`absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-lg transition shadow z-10 ${isCalcMode ? 'bg-amber-500 text-white animate-pulse' : 'bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 hover:text-white'}`} title="연산 과정 보기">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
              </button>
              
              <div className="flex items-center justify-center relative w-full h-[180px]">
                  {showMatrixChain ? (
                      <div className="flex items-center w-full overflow-x-auto space-x-2 px-14 scrollbar-hide py-2"
                           style={{ touchAction: ghostDragInfo ? 'none' : 'auto' }}
                           onTouchMove={ghostDragInfo ? handleChainTouchMove : undefined}
                           onTouchEnd={handleChainTouchEnd}
                           onTouchCancel={handleChainTouchEnd}
                           onDragOver={(e) => {
                               e.preventDefault();
                               // 🚀 컴퓨터(마우스) 환경에서 블록을 화면 끝으로 가져가면 컨테이너가 자동으로 스크롤 됨
                               const rect = e.currentTarget.getBoundingClientRect();
                               const edge = 100; // 가장자리 인식 범위 (100px)
                               if (e.clientX > rect.right - edge) e.currentTarget.scrollLeft += 15;
                               else if (e.clientX < rect.left + edge) e.currentTarget.scrollLeft -= 15;
                           }}
                      >
                          {chainOrder.map((id, idx) => {
                              const chainItem = getChainMatrix(id);
                              const isDragging = ghostDragInfo && ghostDragInfo.id === id;
                              return (
                                  <React.Fragment key={id}>
                                      <div 
                                          data-chain-idx={idx}
                                          draggable 
                                          onDragStart={(e) => handleDragStart(e, idx)}
                                          onDragOver={handleDragOver}
                                          onDrop={(e) => handleDrop(e, idx)}
                                          onTouchStart={(e) => handleChainTouchStart(e, idx, id)}
                                          onContextMenu={(e) => e.preventDefault()}
                                          className={`cursor-grab active:cursor-grabbing transition-transform touch-none select-none ${isDragging ? 'opacity-0' : 'opacity-100 hover:scale-105 drop-shadow-lg'}`}
                                      >
                                          <MiniMatrix m={chainItem.m} label={chainItem.label} />
                                      </div>
                                      {idx < chainOrder.length - 1 && <span className="text-zinc-500 font-bold text-sm shrink-0">×</span>}
                                  </React.Fragment>
                              );
                          })}
                      </div>
                  ) : (
                      <div className="flex items-center justify-center w-full max-w-[380px]">
                          <div className="flex items-center justify-center w-8">
                            <span className="text-zinc-400 font-serif text-[80px] leading-[0]" style={{ transform: 'scale(0.6, 2.5)' }}>(</span>
                          </div>
                          <div className="grid grid-cols-3 gap-x-4 gap-y-5 text-center font-mono text-2xl md:text-3xl font-bold tracking-tighter w-full mx-2 py-1">
                            <MatrixInput value={m00Str} onChange={v => handleMatrixUpdate('a', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m00Str, "1.00", "1")}`} />
                            <MatrixInput value={m01Str} onChange={v => handleMatrixUpdate('c', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m01Str, "0.00", "0")}`} />
                            <MatrixInput value={m02Str} onChange={v => handleMatrixUpdate('e', v)} matrixFormatExact={matrixFormatExact} isTranslate={true} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m02Str, "0", "0")}`} />
                            <MatrixInput value={m10Str} onChange={v => handleMatrixUpdate('b', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m10Str, "0.00", "0")}`} />
                            <MatrixInput value={m11Str} onChange={v => handleMatrixUpdate('d', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m11Str, "1.00", "1")}`} />
                            <MatrixInput value={m12Str} onChange={v => handleMatrixUpdate('f', v)} matrixFormatExact={matrixFormatExact} isTranslate={true} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m12Str, "0", "0")}`} />
                            <div className="text-zinc-600 pointer-events-none w-full text-center">0</div>
                            <div className="text-zinc-600 pointer-events-none w-full text-center">0</div>
                            <div className="text-zinc-600 pointer-events-none w-full text-center">1</div>
                          </div>
                          <div className="flex items-center justify-center w-8">
                            <span className="text-zinc-400 font-serif text-[80px] leading-[0]" style={{ transform: 'scale(0.6, 2.5)' }}>)</span>
                          </div>
                      </div>
                  )}
              </div>
            </div>

            {/* 🚀 왼쪽 사이드바(PC) / 하단 네비게이션(모바일) + 우측 컨텐츠 분할 레이아웃 */}
            <div className="flex flex-1 overflow-hidden border-t border-zinc-800 bg-zinc-900 flex-col-reverse md:flex-row">
              
              {/* 1. 사이드바 (표 형태의 단일 선 구분 레이아웃 - 칸 크기 대폭 축소) */}
              <div className="w-full md:w-[60px] h-[46px] md:h-full bg-zinc-950 border-t md:border-t-0 md:border-r border-zinc-800 flex flex-row md:flex-col shrink-0 z-10 shadow-[0_-5px_15px_rgba(0,0,0,0.3)] md:shadow-none">
                
                <button 
                  onClick={() => setActiveTab('geo')} 
                  title="기하학 변환" 
                  className={`flex-1 md:flex-none md:h-[50px] flex items-center justify-center transition-colors border-r md:border-r-0 md:border-b border-zinc-800 last:border-r-0 md:last:border-b-0 ${activeTab === 'geo' ? 'bg-zinc-900 text-sky-400 shadow-[inset_0_-3px_0_currentColor] md:shadow-[inset_3px_0_0_currentColor]' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900/50'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 20h16L4 4v16z"/>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M8 16h5l-5-5v5z"/>
                  </svg>
                </button>
                
                <button 
                  onClick={() => setActiveTab('math')} 
                  title="수학 실험실" 
                  className={`flex-1 md:flex-none md:h-[50px] flex items-center justify-center transition-colors border-r md:border-r-0 md:border-b border-zinc-800 last:border-r-0 md:last:border-b-0 ${activeTab === 'math' ? 'bg-zinc-900 text-indigo-400 shadow-[inset_0_-3px_0_currentColor] md:shadow-[inset_3px_0_0_currentColor]' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900/50'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                  </svg>
                </button>
                
                <button 
                  onClick={() => setActiveTab('color')} 
                  title="색상 변환" 
                  className={`flex-1 md:flex-none md:h-[50px] flex items-center justify-center transition-colors border-r md:border-r-0 md:border-b border-zinc-800 last:border-r-0 md:last:border-b-0 ${activeTab === 'color' ? 'bg-zinc-900 text-amber-400 shadow-[inset_0_-3px_0_currentColor] md:shadow-[inset_3px_0_0_currentColor]' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900/50'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.836-.437-1.124L12 18.312C11.512 17.77 11.25 17.125 11.25 16.5c0-1.385 1.115-2.5 2.5-2.5h7.168C21.874 14 22 13.062 22 12c0-5.5-4.5-10-10-10z"/>
                    <circle cx="13.5" cy="6.5" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="17.5" cy="10.5" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="8.5" cy="7.5" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="6.5" cy="12.5" r="1.5" fill="currentColor" stroke="none" />
                  </svg>
                </button>

              </div>

              {/* 2. 우측 세부 컨텐츠 영역 (기존 코드 100% 동일하게 유지) */}
              <div className="flex-1 overflow-y-auto p-4 md:p-5 relative bg-zinc-900">
                {activeTab === 'geo' && (
                  <div className="flex flex-col gap-5 md:gap-6 pb-20">
                    <div className="space-y-4">
                      <ControlRow label="X축 확대 (Scale X)" min={config.scaleXMin} max={config.scaleXMax} step={config.scaleXStep} value={scaleX} onChange={v => handleSyncChange('scaleX', v)} onReset={() => handleSyncChange('scaleX', 1.0)} syncKey="scaleX" isSynced={syncKeys.has('scaleX')} onToggleSync={() => toggleSync('scaleX')} onOpenInfo={() => setLogicInfoData(INFO_DATA.scaleX)} />
                      <ControlRow label="Y축 확대 (Scale Y)" min={config.scaleYMin} max={config.scaleYMax} step={config.scaleYStep} value={scaleY} onChange={v => handleSyncChange('scaleY', v)} onReset={() => handleSyncChange('scaleY', 1.0)} syncKey="scaleY" isSynced={syncKeys.has('scaleY')} onToggleSync={() => toggleSync('scaleY')} onOpenInfo={() => setLogicInfoData(INFO_DATA.scaleY)} />
                      <ControlRow label="스퀴즈 (Squeeze)" min={config.squeezeMin} max={config.squeezeMax} step={config.squeezeStep} value={squeeze} onChange={v => handleSyncChange('squeeze', v)} onReset={() => handleSyncChange('squeeze', 1.0)} colorClass="purple" syncKey="squeeze" isSynced={syncKeys.has('squeeze')} onToggleSync={() => toggleSync('squeeze')} onOpenInfo={() => setLogicInfoData(INFO_DATA.squeeze)} />
                    </div>
                    <hr className="border-zinc-800" />
                    <div className="space-y-4">
                      <ControlRow label="X축 이동 (Translate X)" min={config.transXMin} max={config.transXMax} step={config.transXStep} value={translateX} onChange={v => handleSyncChange('translateX', v)} onReset={() => handleSyncChange('translateX', 0)} syncKey="translateX" isSynced={syncKeys.has('translateX')} onToggleSync={() => toggleSync('translateX')} onOpenInfo={() => setLogicInfoData(INFO_DATA.transX)} />
                      <ControlRow label="Y축 이동 (Translate Y)" min={config.transYMin} max={config.transYMax} step={config.transYStep} value={translateY} onChange={v => handleSyncChange('translateY', v)} onReset={() => handleSyncChange('translateY', 0)} syncKey="translateY" isSynced={syncKeys.has('translateY')} onToggleSync={() => toggleSync('translateY')} onOpenInfo={() => setLogicInfoData(INFO_DATA.transY)} />
                    </div>
                    <hr className="border-zinc-800" />
                    <div className="space-y-4">
                      <ControlRow label="평면 회전 (Rotation °)" min={config.rotMin} max={config.rotMax} step={config.rotStep} value={rotation} onChange={v => handleSyncChange('rotation', v)} onReset={() => handleSyncChange('rotation', 0)} syncKey="rotation" isSynced={syncKeys.has('rotation')} onToggleSync={() => toggleSync('rotation')} onOpenLogic={openLogicModal} onOpenInfo={() => setLogicInfoData(INFO_DATA.rot)} />
                    </div>
                    <hr className="border-zinc-800" />
                    <div className="space-y-4">
                      <ControlRow label="X축 전단 (Shear X)" min={config.shearXMin} max={config.shearXMax} step={config.shearXStep} value={shearX} onChange={v => handleSyncChange('shearX', v)} onReset={() => handleSyncChange('shearX', 0)} syncKey="shearX" isSynced={syncKeys.has('shearX')} onToggleSync={() => toggleSync('shearX')} onOpenInfo={() => setLogicInfoData(INFO_DATA.shearX)} />
                      <ControlRow label="Y축 전단 (Shear Y)" min={config.shearYMin} max={config.shearYMax} step={config.shearYStep} value={shearY} onChange={v => handleSyncChange('shearY', v)} onReset={() => handleSyncChange('shearY', 0)} syncKey="shearY" isSynced={syncKeys.has('shearY')} onToggleSync={() => toggleSync('shearY')} onOpenInfo={() => setLogicInfoData(INFO_DATA.shearY)} />
                    </div>
                    <hr className="border-zinc-800" />
                    
                    <div className="p-4 bg-rose-900/10 rounded-xl border border-rose-500/20 flex flex-col gap-3">
                      <label className="flex items-center gap-2 text-rose-400 font-bold text-sm md:text-base w-max cursor-pointer">
                        <input type="checkbox" checked={useRefl} onChange={(e) => setUseRefl(e.target.checked)} className="w-4 h-4 accent-rose-500 cursor-pointer" /> 
                        반사 변환 직선 (y = ax) 켜기
                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.refl); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                      </label>
                      <ControlRow label="반사축 각도" min="0" max="180" step="1" value={reflAngle} onChange={setReflAngle} onReset={() => setReflAngle(90)} colorClass="rose" />
                    </div>
                    <hr className="border-zinc-800" />
                  </div>
                )}

                {/* 2. 수학 실험실 탭 */}
                {activeTab === 'math' && (
                  <div className="flex flex-col gap-5 md:gap-6 pb-20">
                    <div className="p-4 bg-indigo-900/10 rounded-xl border border-indigo-500/30 flex flex-col gap-4">
                      <label className="flex items-center gap-2 text-indigo-400 font-black text-lg w-max cursor-pointer">
                        <input type="checkbox" checked={useMathLab} onChange={(e) => handleMathLabToggle(e.target.checked)} className="w-5 h-5 accent-indigo-500 cursor-pointer" /> 
                        수학 실험실 전원 켜기
                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.mathLab); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                      </label>

                      {useMathLab && (
                          <div className="flex flex-col gap-6 mt-1 pl-2 md:pl-4 border-l-2 border-indigo-500/30">
                              
                              <div className="flex flex-col gap-3">
                                  <label className="flex items-center gap-2 text-emerald-400 font-bold text-sm w-max cursor-pointer">
                                    <input type="checkbox" checked={usePointMode} onChange={(e) => setUsePointMode(e.target.checked)} className="w-4 h-4 accent-emerald-500 cursor-pointer" /> 
                                    좌표 점 맵핑
                                    <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.point); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                  </label>
                                  {usePointMode && (
                                      <div className="flex flex-col gap-2 bg-emerald-900/10 p-3 rounded-lg border border-emerald-500/20">
                                          <div className="flex justify-between items-center mb-1">
                                              <div className="flex items-center gap-2">
                                                  <span className="text-zinc-400 text-xs font-bold">찍힌 점 목록 ({points.length})</span>
                                                  <button onClick={() => setShowManualPointUI(!showManualPointUI)} className="bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-400 border border-emerald-500/30 w-5 h-5 flex items-center justify-center rounded transition text-xs font-black" title="점 직접 입력">
                                                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
                                                  </button>
                                              </div>
                                              <div className="flex gap-1">
                                                  {points.length > 0 && (
                                                      <button onClick={() => setPoints([])} className="text-zinc-400 hover:text-rose-400 w-6 h-6 flex items-center justify-center bg-zinc-800 rounded font-bold transition shadow-sm border border-zinc-700" title="전체 지우기">
                                                          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                      </button>
                                                  )}
                                                  <button onClick={() => setIsPointListExpanded(!isPointListExpanded)} className="text-zinc-400 hover:text-white w-6 h-6 flex items-center justify-center bg-zinc-800 rounded font-bold transition shadow-sm border border-zinc-700">
                                                      {isPointListExpanded ? <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7"/></svg> : <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>}
                                                  </button>
                                              </div>
                                          </div>

                                                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

                                                  <span className="text-zinc-500 font-mono text-[10px]">Y:</span>

                                                              <div onClick={() => openMathPad(g.id, g.eq)} className="flex-1 bg-zinc-950 border border-zinc-700 px-3 py-2 rounded-lg cursor-pointer hover:border-zinc-500 font-mono text-base overflow-x-auto whitespace-nowrap shadow-inner font-bold" style={{color: GRAPH_COLORS[idx % GRAPH_COLORS.length]}} title="수식 편집 (여기를 클릭하세요)">

                                                              </div>
                                                              <div className="flex gap-1 shrink-0">
                                                                  <button onClick={() => setGraphSettingsId(g.id)} className={`w-8 h-8 flex items-center justify-center rounded font-bold shadow transition ${g.matrixMode !== 'global' ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-zinc-700 hover:bg-zinc-600 text-zinc-300'}`} title="행렬 설정">
                                                                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
                                                                  </button>
                                                                  <button onClick={() => removeGraph(g.id)} className="text-rose-400 hover:text-rose-300 font-bold px-2 py-1.5 bg-zinc-700/50 rounded transition">✕</button>
                                                              </div>
                                                          </div>
                                                          {g.matrixMode !== 'global' && (
                                                              <div className="text-[10px] text-amber-500/80 font-bold text-right px-1">

                                                              </div>
                                                          )}
                                                      </div>
                                                  ))}
                                              </div>
                                          )}
                                          {isGraphListExpanded && (
                                              <button onClick={addGraph} className="mt-1 w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded font-bold text-xs transition border border-zinc-700 shadow-sm flex items-center justify-center gap-1">
                                                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
                                                  함수 추가하기
                                              </button>
                                          )}
                                          
                                          {isGraphListExpanded && constants.length > 0 && (
                                              <div className="mt-4 pt-4 border-t border-sky-500/30 flex flex-col gap-3">
                                                  <span className="text-zinc-400 text-xs font-bold">동적 상수(Constant) 연동</span>
                                                  {constants.map(c => (
                                                      <div key={c.name} className="flex flex-col gap-1">
                                                          <ControlRow 
                                                              label={`상수 ${c.name}`} 
                                                              min={c.min} max={c.max} step={c.step} 
                                                              value={c.value} 
                                                              onChange={v => updateConstant(c.name, 'value', v)} 
                                                              onReset={() => updateConstant(c.name, 'value', 1.0)}
                                                              colorClass="indigo" 
                                                          />
                                                      </div>
                                                  ))}
                                              </div>
                                          )}
                                      </div>
                                  )}
                              </div>

                              <div className="flex flex-col gap-2">
                                  <div className="flex justify-between items-center w-full">
                                      <span className="text-rose-400 font-bold text-sm flex items-center gap-1">
                                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>

                                          <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.symmetry); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                      </span>
                                      <button onClick={() => { handleSyncChange('scaleX', 1.0); handleSyncChange('scaleY', 1.0); setRotation(0); setUseRefl(false); setReflAngle(90); }} className="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-400 hover:text-white rounded border border-zinc-700 transition shadow-sm">초기화</button>
                                  </div>
                                  <div className="grid grid-cols-2 gap-2 mt-1">
                                      <button onClick={() => applySymmetry('X')} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">X축 대칭</button>
                                      <button onClick={() => applySymmetry('Y')} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">Y축 대칭</button>
                                      <button onClick={() => applySymmetry('ORIGIN')} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">원점 대칭</button>
                                      <button onClick={() => applySymmetry('YX')} className="bg-rose-900/20 hover:bg-rose-900/40 text-rose-300 border border-rose-500/30 rounded py-2 text-xs font-bold transition">y=x 직선 대칭</button>

                              </div>

                              <div className="flex flex-col gap-3">
                                  <label className="flex items-center gap-2 text-amber-400 font-bold text-sm w-max cursor-pointer">
                                    <input type="checkbox" checked={useUnitSquare} onChange={(e) => setUseUnitSquare(e.target.checked)} className="w-4 h-4 accent-amber-500 cursor-pointer" />

                                    <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.unitSquare); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                                  </label>
                              </div>

                          </div>
                      )}
                    </div>
                  </div>
                )}

              {activeTab === 'color' && (
                <div className="flex flex-col gap-5 md:gap-6 pb-20">

                        <input type="checkbox" checked={chkGray} onChange={(e) => setChkGray(e.target.checked)} className="w-4 h-4 accent-amber-500 cursor-pointer" /> 흑백화
                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.chkGray); }} className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                    </label>
                    <label className="flex items-center gap-2 text-amber-400 font-bold whitespace-nowrap text-sm md:text-base w-max cursor-pointer">
                        <input type="checkbox" checked={chkInvert} onChange={(e) => setChkInvert(e.target.checked)} className="w-4 h-4 accent-amber-500 cursor-pointer" /> 반전
                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.chkInv); }} className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                    </label>
                  </div>
                  <div className="space-y-4">
                    <ControlRow label="전체 밝기 (+)" min="-255" max="255" step="1" value={globalAdd} onChange={v=>handleSyncChange('globalAdd', v)} onReset={() => handleSyncChange('globalAdd', 0)} syncKey="globalAdd" isSynced={syncKeys.has('globalAdd')} onToggleSync={()=>toggleSync('globalAdd')} colorClass="zinc" onOpenInfo={() => setLogicInfoData(INFO_DATA.gAdd)} />
                    <ControlRow label="전체 명암비 (x)" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={globalMul} onChange={v=>handleSyncChange('globalMul', v)} onReset={() => handleSyncChange('globalMul', 1.0)} syncKey="globalMul" isSynced={syncKeys.has('globalMul')} onToggleSync={()=>toggleSync('globalMul')} colorClass="zinc" onOpenInfo={() => setLogicInfoData(INFO_DATA.gMul)} />
                    <ControlRow label="이진화 (Threshold, -1 끄기)" min="-1" max="255" step="1" value={binThresh} onChange={setBinThresh} onReset={() => setBinThresh(-1)} colorClass="zinc" onOpenInfo={() => setLogicInfoData(INFO_DATA.binThresh)} />
                  </div>

                  <div className="p-3 bg-purple-900/20 rounded-xl border border-purple-500/30 flex flex-col gap-3">
                    <label className="flex items-center gap-2 text-purple-400 font-bold text-sm md:text-base w-max cursor-pointer">
                        <input type="checkbox" checked={useDuotone} onChange={(e) => setUseDuotone(e.target.checked)} className="w-4 h-4 accent-purple-500 cursor-pointer" /> 가짜 컬러 복원 (듀오톤)
                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setLogicInfoData(INFO_DATA.duo); }} className="text-zinc-500 hover:text-white transition ml-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button>
                    </label>
                    <div className="flex gap-2">

                      <label className="flex-1 flex flex-col gap-1 text-zinc-400 text-xs">밝은 영역<input type="color" value={colorLightUI} onChange={(e) => setColorLightUI(e.target.value)} className="w-full h-8 cursor-pointer bg-zinc-900 border-none rounded"/></label>

                  <div className="space-y-4 p-3 border-l-2 border-red-500">

                    <ControlRow label="Red 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={rMul} onChange={v=>handleSyncChange('rMul', v)} onReset={() => handleSyncChange('rMul', 1.0)} syncKey="rMul" isSynced={syncKeys.has('rMul')} onToggleSync={()=>toggleSync('rMul')} colorClass="red" onOpenInfo={() => setLogicInfoData(INFO_DATA.cMul)} />
                  </div>
                  <div className="space-y-4 p-3 border-l-2 border-green-500">
                    <ControlRow label="Green 밝기" min="-255" max="255" step="1" value={gAdd} onChange={v=>handleSyncChange('gAdd', v)} onReset={() => handleSyncChange('gAdd', 0)} syncKey="gAdd" isSynced={syncKeys.has('gAdd')} onToggleSync={()=>toggleSync('gAdd')} colorClass="green" onOpenInfo={() => setLogicInfoData(INFO_DATA.cAdd)} />
                    <ControlRow label="Green 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={gMul} onChange={v=>handleSyncChange('gMul', v)} onReset={() => handleSyncChange('gMul', 1.0)} syncKey="gMul" isSynced={syncKeys.has('gMul')} onToggleSync={()=>toggleSync('gMul')} colorClass="green" onOpenInfo={() => setLogicInfoData(INFO_DATA.cMul)} />
                  </div>
                  <div className="space-y-4 p-3 border-l-2 border-blue-500 mb-8">
                    <ControlRow label="Blue 밝기" min="-255" max="255" step="1" value={bAdd} onChange={v=>handleSyncChange('bAdd', v)} onReset={() => handleSyncChange('bAdd', 0)} syncKey="bAdd" isSynced={syncKeys.has('bAdd')} onToggleSync={()=>toggleSync('bAdd')} colorClass="blue" onOpenInfo={() => setLogicInfoData(INFO_DATA.cAdd)} />
                    <ControlRow label="Blue 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={bMul} onChange={v=>handleSyncChange('bMul', v)} onReset={() => handleSyncChange('bMul', 1.0)} syncKey="bMul" isSynced={syncKeys.has('bMul')} onToggleSync={()=>toggleSync('bMul')} colorClass="blue" onOpenInfo={() => setLogicInfoData(INFO_DATA.cMul)} />
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

          {!isMobile && (
            <div className="w-1.5 bg-zinc-800 hover:bg-sky-500 cursor-col-resize flex-shrink-0 z-20 flex items-center justify-center transition-colors group relative" 
                 onMouseDown={startResizingPanel} 
                 onTouchStart={startResizingPanel} 
                 title="패널 크기 조절">
              <div className="h-10 w-0.5 bg-zinc-600 group-hover:bg-white rounded"></div>
            </div>
          )}

          <div className={`flex items-center justify-center relative overflow-hidden bg-zinc-950 h-full ${isMobile ? 'w-full absolute inset-0 z-10' : 'flex-1 z-10'}`}>
            
            <div 
              className="absolute inset-0 z-[55] touch-none cursor-default"
              onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUpOrLeave} onMouseLeave={handleMouseUpOrLeave}
              onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchEnd}
            />

            {/* 🚀 개별 그림자 전용 팝업 메뉴 (행렬 조정창 연동 및 45% 상한선 적용) */}
            {showShadowMenu && selectedShadowId && (
                <div className={`absolute z-[80] bg-zinc-900/95 backdrop-blur-md px-3 md:px-4 py-2 md:py-2.5 rounded-full border border-zinc-600 shadow-2xl flex items-center justify-center gap-2 md:gap-3 animate-fade-in pointer-events-auto w-max max-w-[95vw] md:w-auto ${shadowMenuPos ? '' : 'left-1/2 -translate-x-1/2'}`}
                     style={shadowMenuPos ? { left: `${shadowMenuPos.left}px`, top: `${shadowMenuPos.top}px`, bottom: 'auto', right: 'auto', transform: 'none' } : (isMobile ? { bottom: `calc(${Math.min(mobilePanelHeight, 45)}vh + env(safe-area-inset-bottom, 0px) + 20px)` } : { bottom: '8rem' })}>
                    
                    {/* 🚀 왼쪽 X 버튼 추가 (팝업창 닫기 전용) */}
                    <button onClick={() => { setShowShadowMenu(false); setSelectedShadowId(null); }} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white w-8 h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center shadow transition shrink-0" title="창 닫기">
                        <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>

                    <div className="w-px h-6 bg-zinc-700 shrink-0"></div>

                    {/* 🚀 딜레이 없는 즉각적인 드래그 핸들 (네이티브 드래그 꼬임 버그 차단) */}
                    <div 
                        onMouseDown={(e) => {
                            e.stopPropagation();
                            e.preventDefault(); // 🚀 텍스트 선택 및 브라우저 네이티브 드래그(커서에 달라붙는 버그) 완벽 차단
                            const clientX = e.clientX; const clientY = e.clientY;
                            const el = e.currentTarget.parentElement;
                            const parentRect = el.parentElement.getBoundingClientRect();
                            const rect = el.getBoundingClientRect();
                            
                            const initLeft = rect.left - parentRect.left;
                            const initTop = rect.top - parentRect.top;
                            
                            dragMenuRef.current = { isDragging: true, startX: clientX, startY: clientY, initLeft, initTop };
                        }}
                        onTouchStart={(e) => {
                            e.stopPropagation();
                            if (e.cancelable) e.preventDefault(); // 🚀 모바일 스크롤 충돌 방지 및 즉각 반응
                            const clientX = e.touches[0].clientX; const clientY = e.touches[0].clientY;
                            const el = e.currentTarget.parentElement;
                            const parentRect = el.parentElement.getBoundingClientRect();
                            const rect = el.getBoundingClientRect();
                            
                            const initLeft = rect.left - parentRect.left;
                            const initTop = rect.top - parentRect.top;
                            
                            dragMenuRef.current = { isDragging: true, startX: clientX, startY: clientY, initLeft, initTop };
                        }}
                        className="flex items-center cursor-pointer shrink-0 pr-1 md:pr-2 py-1"
                        title="드래그하여 팝업창 이동"
                    >
                        <span className="text-zinc-300 font-bold mr-1 text-xs md:text-sm whitespace-nowrap select-none">
                            그림자 {shadowStates.findIndex(s => s.id === selectedShadowId) + 1}
                        </span>
                    </div>

                    <button onClick={() => playAnimation(selectedShadowId)} className="bg-sky-600 hover:bg-sky-500 text-white w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow transition shrink-0" title="개별 재생">
                        <svg className="w-4 h-4 md:w-5 md:h-5 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg>
                    </button>
                    <div className="w-px h-6 bg-zinc-700 shrink-0"></div>
                    <button onClick={() => handleLoadState(selectedShadowId)} className="bg-amber-600 hover:bg-amber-500 text-white w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow transition shrink-0" title="상태 불러오기">
                        <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    </button>
                    <div className="w-px h-6 bg-zinc-700 shrink-0"></div>
                    <button onClick={() => { setShadowStates(prev => prev.filter(s => s.id !== selectedShadowId)); setShowShadowMenu(false); }} className="bg-rose-600 hover:bg-rose-500 text-white w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow transition shrink-0" title="개별 삭제">
                        <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            )}
            
            <canvas ref={canvasRef} width={2000} height={1200} className="w-full h-full object-cover z-20 pointer-events-none absolute inset-0" />
            {/* 🚀 2층: 오직 수학 그래프만 그리는 초고속 GPU WebGL 캔버스 (사진 아래로 내리기 옵션 연동) */}
            <canvas ref={canvasGLRef} width={2000} height={1200} className={`w-full h-full object-cover pointer-events-none absolute inset-0 ${mathUnderImage ? 'z-10' : 'z-30'}`} />

            {isCalcMode && (
                <div className="absolute top-16 md:top-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 z-[70] pointer-events-none w-[92vw] md:w-auto">
                    <div className="bg-amber-500/95 text-white px-4 py-3 md:px-5 md:py-2.5 rounded-2xl md:rounded-full font-bold text-xs md:text-base shadow-[0_0_15px_rgba(245,158,11,0.5)] flex flex-col md:flex-row items-center gap-2 md:gap-3 pointer-events-auto text-center break-keep w-full md:w-auto">
                        <span>화면을 터치하여 계산 과정을 볼 점을 찍어주세요</span>
                        <div className="flex gap-2 w-full justify-center md:w-auto mt-1 md:mt-0">
                            <button onClick={() => setShowManualCalcPointUI(!showManualCalcPointUI)} className="bg-white text-amber-600 px-3 py-1.5 md:py-1 rounded-full text-xs hover:bg-amber-100 transition whitespace-nowrap shadow-sm">
                                직접 입력
                            </button>
                            <button onClick={() => { setCalcPoints([]); setIsCalcMode(false); }} className="bg-rose-600 text-white px-3 py-1.5 md:py-1 rounded-full text-xs hover:bg-rose-500 transition whitespace-nowrap shadow-sm">
                                전체 삭제 및 종료
                            </button>
                        </div>
                    </div>
                    {showManualCalcPointUI && (
                        <div className="flex gap-2 items-center bg-black/80 p-2.5 rounded-lg border border-amber-500/50 shadow-xl pointer-events-auto">
                            <span className="text-zinc-400 font-mono text-xs">X:</span>
                            <CustomNumberInput value={calcManualX} onChange={setCalcManualX} className="w-16 bg-zinc-900 text-amber-300 font-mono px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-amber-500" />
                            <span className="text-zinc-400 font-mono text-xs">Y:</span>
                            <CustomNumberInput value={calcManualY} onChange={setCalcManualY} className="w-16 bg-zinc-900 text-amber-300 font-mono px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-amber-500" />
                            <button onClick={handleAddManualCalcPoint} className="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold transition">입력</button>
                        </div>
                    )}
                </div>
            )}

            <div className={`absolute flex flex-col bg-zinc-800/90 backdrop-blur rounded-xl border border-zinc-700 shadow-2xl overflow-hidden text-lg font-bold z-[100] pointer-events-auto ${!isDraggingHandle.current ? 'transition-all duration-300' : ''}`}
                 style={isMobile ? { bottom: `calc(${mobilePanelHeight}vh + env(safe-area-inset-bottom, 16px) + 48px)`, right: '16px' } : { bottom: '32px', right: '32px' }}>
              {isMobile && (
                  <button onClick={() => resetAll(imageObj)} className="px-3 py-3 md:px-4 md:py-4 hover:bg-rose-600 hover:text-white text-rose-400 transition-colors" title="리셋">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                  </button>
              )}
              <button onClick={goHome} className={`px-3 py-3 md:px-4 md:py-4 hover:bg-sky-600 bg-sky-500 text-white transition-colors ${isMobile ? 'border-t' : ''} border-zinc-700`} title="화면 맞춤">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              </button>
              <button onClick={zoomIn} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition-colors" title="확대">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
              </button>
              <button onClick={zoomOut} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition-colors" title="축소">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM7 10h6"/></svg>
              </button>
            </div>

            {isMobile && (
              <div className="absolute top-4 left-4 z-[60] flex items-center drop-shadow-2xl pointer-events-auto">
                {/* 🚀 UI 크기 축소 (200x140 -> 180x130) 및 내부 여백 조절 */}
                <div className="bg-black/90 backdrop-blur border border-zinc-700 rounded-lg p-2.5 relative w-[180px] h-[130px] flex justify-center items-center shrink-0">
                  
                  {/* 좌상단: 연산 순서 보기 (PC와 아이콘 100% 동일하게 동기화) */}
                  <button onClick={() => setShowMatrixChain(!showMatrixChain)} className={`absolute -top-3 -left-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border ${showMatrixChain ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-zinc-800 border-zinc-600 text-zinc-400 hover:bg-zinc-700 hover:text-white'}`} title="행렬 곱셈 분해">
                      {showMatrixChain ? (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                      ) : (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                      )}
                  </button>
                  
                  {/* 우상단: 연산 과정 보기 */}
                  <button onClick={() => setIsCalcMode(!isCalcMode)} className={`absolute -top-3 -right-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border ${isCalcMode ? 'bg-amber-500 border-amber-400 text-white animate-pulse' : 'bg-zinc-800 border-zinc-600 text-amber-400 hover:bg-zinc-700 hover:text-white'}`} title="연산 과정 보기">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                  </button>

                  {/* 우하단: 그림자 저장 (중복 코드 완벽 삭제됨) */}
                  {!showMatrixChain && (
                      <button onClick={handleSaveState} className="absolute -bottom-3 -right-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border bg-zinc-800 border-zinc-600 text-indigo-400 hover:bg-zinc-700 hover:text-white" title="현재 상태 그림자로 저장">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                      </button>
                  )}

                  <div className="flex items-center justify-center w-3 h-full">
                    <span className="text-zinc-400 font-serif text-[50px] leading-[0]" style={{ transform: 'scale(0.7, 2.0)' }}>(</span>
                  </div>
                  
                  {showMatrixChain ? (
                      <div className="flex items-center justify-center w-[110px] self-center">
                          <span className="text-indigo-400 font-bold text-[10px] text-center border border-indigo-500/30 bg-indigo-900/20 px-2 py-1.5 rounded-lg shadow-inner">
                              조립기<br/>실행 중
                          </span>
                      </div>
                  ) : (
                      <div className="grid grid-cols-3 gap-x-1.5 gap-y-2 text-center font-mono text-[11px] font-bold tracking-tighter w-full self-center max-w-[120px] mx-0.5">
                        <MatrixInput value={m00Str} onChange={v => handleMatrixUpdate('a', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m00Str, "1.00", "1")}`} />
                        <MatrixInput value={m01Str} onChange={v => handleMatrixUpdate('c', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m01Str, "0.00", "0")}`} />
                        <MatrixInput value={m02Str} onChange={v => handleMatrixUpdate('e', v)} matrixFormatExact={matrixFormatExact} isTranslate={true} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m02Str, "0", "0")}`} />
                        <MatrixInput value={m10Str} onChange={v => handleMatrixUpdate('b', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m10Str, "0.00", "0")}`} />
                        <MatrixInput value={m11Str} onChange={v => handleMatrixUpdate('d', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m11Str, "1.00", "1")}`} />
                        <MatrixInput value={m12Str} onChange={v => handleMatrixUpdate('f', v)} matrixFormatExact={matrixFormatExact} isTranslate={true} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m12Str, "0", "0")}`} />
                        <div className="text-zinc-600 pointer-events-none w-full text-center text-[10px]">0</div>
                        <div className="text-zinc-600 pointer-events-none w-full text-center text-[10px]">0</div>
                        <div className="text-zinc-600 pointer-events-none w-full text-center text-[10px]">1</div>
                      </div>
                  )}

                  <div className="flex items-center justify-center w-3 h-full">
                    <span className="text-zinc-400 font-serif text-[50px] leading-[0]" style={{ transform: 'scale(0.7, 2.0)' }}>)</span>
                  </div>
                </div>

                {/* 🚀 사진 열기 버튼 크기 축소 및 배치 최적화 */}
                <label className="ml-2.5 w-12 h-[130px] flex flex-col gap-1.5 items-center justify-center bg-zinc-800/90 hover:bg-zinc-700 backdrop-blur border border-zinc-700 text-zinc-300 rounded-lg font-bold transition cursor-pointer shadow-xl pointer-events-auto shrink-0">
                    <svg className="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span className="text-[9px] text-zinc-400 leading-tight text-center">사진<br/>열기</span>
                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                </label>
              </div>
            )}

          </div>
        </div>
      );
    }

    function App() {
      const [isStarted, setIsStarted] = useState(window.location.hash === '#simulator');
      useEffect(() => {
        const handlePopState = () => setIsStarted(window.location.hash === '#simulator');
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);
      const handleStart = () => { window.history.pushState(null, '', '#simulator'); setIsStarted(true); };
      return !isStarted ? <StartScreen onStart={handleStart} /> : <SimulatorScreen />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
