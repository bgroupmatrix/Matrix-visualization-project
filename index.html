<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vision Matrix Pro - Web Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-40px) rotate(180deg); } }
    @keyframes float-med { 0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); } 50% { transform: translateY(30px) rotate(-120deg) scale(1.1); } }
    @keyframes float-fast { 0%, 100% { transform: translateX(0px) rotate(0deg); } 50% { transform: translateX(-30px) rotate(90deg); } }
    .geom-shape { position: absolute; opacity: 0.15; border: 3px solid white; }
    .shape-1 { animation: float-slow 12s infinite ease-in-out; }
    .shape-2 { animation: float-med 15s infinite ease-in-out; }
    .shape-3 { animation: float-fast 10s infinite ease-in-out; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type="number"], input[type="text"] { -moz-appearance: textfield; appearance: textfield; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useLayoutEffect } = React;

    const DEFAULT_CONFIG = {
        scaleXMin: 0.1, scaleXMax: 5.0, scaleXStep: 0.1, scaleYMin: 0.1, scaleYMax: 5.0, scaleYStep: 0.1,
        squeezeMin: 0.1, squeezeMax: 3.0, squeezeStep: 0.1, transXMin: -500, transXMax: 500, transXStep: 1, transYMin: -500, transYMax: 500, transYStep: 1,
        rotMin: -180, rotMax: 180, rotStep: 1, shearXMin: -3.0, shearXMax: 3.0, shearXStep: 0.1, shearYMin: -3.0, shearYMax: 3.0, shearYStep: 0.1, contMin: 0, contMax: 5.0, contStep: 0.1
    };

    const GRAPH_COLORS = ['#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4'];

    const INFO_DATA = {
        scaleX: { title: "X축 확대 (Scale X)", desc: "X좌표에만 지정한 배율(sx)을 곱하여 가로로 늘리거나 줄입니다.", matrix: [['sx', '0', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        scaleY: { title: "Y축 확대 (Scale Y)", desc: "Y좌표에만 지정한 배율(sy)을 곱하여 세로로 늘리거나 줄입니다.", matrix: [['1', '0', '0'], ['0', 'sy', '0'], ['0', '0', '1']] },
        squeeze: { title: "스퀴즈 (Squeeze)", desc: "전체 면적은 그대로 1로 유지하면서, 한쪽 축은 늘리고 반대 축은 압축하는 특수 변환입니다.", matrix: [['k', '0', '0'], ['0', '1/k', '0'], ['0', '0', '1']] },
        transX: { title: "X축 이동 (Translate X)", desc: "모든 픽셀의 X좌표에 일정 값(dx)을 더하여 좌우로 평행 이동시킵니다.", matrix: [['1', '0', 'dx'], ['0', '1', '0'], ['0', '0', '1']] },
        transY: { title: "Y축 이동 (Translate Y)", desc: "모든 픽셀의 Y좌표에 일정 값(dy)을 더하여 상하로 평행 이동시킵니다.", matrix: [['1', '0', '0'], ['0', '1', 'dy'], ['0', '0', '1']] },
        rot: { title: "평면 회전 (Rotation)", desc: "원점을 기준으로 이미지를 지정된 각도(θ)만큼 평면 회전시키는 변환입니다.", matrix: [['cos(θ)', '-sin(θ)', '0'], ['sin(θ)', 'cos(θ)', '0'], ['0', '0', '1']] },
        shearX: { title: "X축 전단 (Shear X)", desc: "Y값이 커질수록 X축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 눕힙니다.", matrix: [['1', 'shx', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        shearY: { title: "Y축 전단 (Shear Y)", desc: "X값이 커질수록 Y축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 세웁니다.", matrix: [['1', '0', '0'], ['shy', '1', '0'], ['0', '0', '1']] },
        refl: { title: "반사 변환 (Reflection)", desc: "원점을 지나는 특정 직선(y = ax)을 거울 삼아 이미지를 반대편으로 대칭 이동시킵니다.", matrix: [['cos(2θ)', 'sin(2θ)', '0'], ['sin(2θ)', '-cos(2θ)', '0'], ['0', '0', '1']] },
        mathLab: { title: "수학 실험실 (Math Lab)", desc: "이미지 렌더링을 끄고 순수한 2D 좌표평면을 띄워 실험하는 전문가용 모드입니다." },
        graph: { title: "함수 맵핑 (Function Map)", desc: "입력된 수학 함수 f(x)의 각 점에 3x3 변환 행렬을 곱하여 곡선을 구부립니다.", formulas: ["y = f(x)", "Point = Matrix * [x, y, 1]"] },
        point: { title: "좌표 점 맵핑 (Point Map)", desc: "화면을 클릭하여 생성된 수학적 원본 좌표(x,y)에 실시간으로 행렬을 곱합니다.", formulas: ["Point = Matrix * [x, y, 1]"] },
        chkGray: { title: "흑백화 (Grayscale)", desc: "빛의 3원색(RGB)에 눈의 민감도를 곱해 무채색으로 변환합니다.", formulas: ["Gray = R*0.299 + G*0.587 + B*0.114", "R = Gray, G = Gray, B = Gray"] },
        chkInv: { title: "색상 반전 (Invert)", desc: "빛의 삼원색 한계치(255)에서 현재 색상을 빼 보색을 만듭니다.", formulas: ["R = 255 - R", "G = 255 - G", "B = 255 - B"] },
        gAdd: { title: "전체 밝기 (Global Add)", desc: "모든 픽셀에 동일한 상수를 더해 화면 전체를 밝게 하거나 어둡게 합니다.", formulas: ["R' = R + Add"] },
        gMul: { title: "전체 명암비 (Global Contrast)", desc: "밝은 곳은 더 밝게, 어두운 곳은 더 어둡게 배율을 곱해 색상의 대비를 키웁니다.", formulas: ["R' = R * Contrast"] },
        binThresh: { title: "이진화 (Binary Threshold)", desc: "특정 임계값을 기준으로 픽셀을 오직 흰색(255)과 검은색(0)으로만 나눕니다.", formulas: ["if (Gray > Threshold) 255", "else 0"] },
        duo: { title: "듀오톤 (Duotone)", desc: "이미지를 흑백으로 바꾼 뒤, 어두운 부분과 밝은 부분에 두 가지 색상만 매핑합니다.", formulas: ["Color = Dark + (Light - Dark) * Ratio"] },
        cAdd: { title: "채널별 밝기 (Channel Add)", desc: "특정 색상(R/G/B) 채널의 값만 더하거나 뺍니다.", formulas: ["Channel = Channel + Add"] },
        cMul: { title: "채널별 명암비 (Channel Contrast)", desc: "특정 색상 채널의 값에만 배율을 곱합니다.", formulas: ["Channel = Channel * Contrast"] }
    };

    function getOptimalGridStep(z) {
        const targetStep = 100 / z;
        const exponent = Math.floor(Math.log10(targetStep));
        const fraction = targetStep / Math.pow(10, exponent);
        let niceFraction;
        if (fraction < 1.5) niceFraction = 1;
        else if (fraction < 3.5) niceFraction = 2;
        else if (fraction < 7.5) niceFraction = 5;
        else niceFraction = 10;
        return parseFloat((niceFraction * Math.pow(10, exponent)).toPrecision(14));
    }

    function formatNumber(num) {
        if (num === 0) return "0";
        const abs = Math.abs(num);
        if (abs >= 1e7 || abs <= 1e-7) return num.toExponential(2).replace('+', '');
        return parseFloat(num.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 7 });
    }

    const fmt = (v) => parseFloat(v.toFixed(4)).toString();

    function compileMath(expr, constNames = []) {
        try {
            let safeExpr = expr
                .replace(/log_([0-9a-zA-Z.]+)\(([^)]+)\)/g, '(Math.log($2)/Math.log($1))')
                .replace(/sin/g, 'Math.sin')
                .replace(/cos/g, 'Math.cos')
                .replace(/tan/g, 'Math.tan')
                .replace(/abs/g, 'Math.abs')
                .replace(/sqrt/g, 'Math.sqrt')
                .replace(/log\(/g, 'Math.log10(') 
                .replace(/ln\(/g, 'Math.log(')    
                .replace(/pi/gi, 'Math.PI')
                .replace(/\be\b/g, 'Math.E')
                .replace(/\^/g, '**'); 
            return new Function('v', ...constNames, `return ${safeExpr};`);
        } catch(e) { return () => NaN; }
    }

    const executeMath = (func, v, constValues = []) => {
        try { 
            const res = func(v, ...constValues); 
            if (typeof res === 'boolean') return res ? 1 : 0;
            return isNaN(res) ? NaN : res; 
        } 
        catch { return NaN; }
    }

    function CustomNumberInput({ value, onChange, validate, className }) {
        const [localVal, setLocalVal] = useState(String(value));
        useEffect(() => { setLocalVal(String(value)); }, [value]);

        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            if (validate && !validate(parsed)) {
                setLocalVal(String(value)); 
                return;
            }
            setLocalVal(String(parsed));
            if (parsed !== parseFloat(value)) onChange(parsed);
        };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                let parsed = parseFloat(localVal);
                if (isNaN(parsed)) parsed = 0;
                if (validate && !validate(parsed)) return; 
                e.target.blur(); 
            }
        };

        const handleChange = (e) => { setLocalVal(e.target.value); };
        return <input type="text" value={localVal} onChange={handleChange} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} />;
    }

    function MatrixInput({ value, onChange, isTranslate, matrixFormatExact, className }) {
        const [localVal, setLocalVal] = useState("");
        useEffect(() => { 
            let parsed = parseFloat(value);
            if (isNaN(parsed)) parsed = 0;
            let finalStr = matrixFormatExact ? parseFloat(parsed.toFixed(4)).toString() : (isTranslate ? parsed.toFixed(0) : parsed.toFixed(2));
            setLocalVal(finalStr); 
        }, [value, isTranslate, matrixFormatExact]);
        
        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            let finalStr = matrixFormatExact ? parseFloat(parsed.toFixed(4)).toString() : (isTranslate ? parsed.toFixed(0) : parsed.toFixed(2));
            setLocalVal(finalStr);
            if (Math.abs(parsed - parseFloat(value)) > 0.0001) onChange(parsed);
        };
        const handleKeyDown = (e) => { 
            if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
        };

        const getFontSize = () => {
            const len = localVal.length;
            if (len > 8) return '0.55em';
            if (len > 6) return '0.7em';
            if (len > 4) return '0.85em';
            return '1em';
        };

        return <input type="text" value={localVal} onChange={e=>setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} style={{ fontSize: getFontSize(), transition: 'font-size 0.2s ease' }} />;
    }

    const ControlRow = ({ label, min, max, step, value, onChange, colorClass = "sky", syncKey = null, isSynced = false, onToggleSync = null, onOpenLogic = null, onOpenInfo = null }) => (
      <div className="flex flex-col gap-1">
        <div className="flex justify-between items-center">
          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
            {label}
            {onOpenInfo && ( <button onClick={onOpenInfo} title="설명 보기" className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button> )}
            {syncKey && ( <button onClick={onToggleSync} title="동기화 링크" className={`p-1 rounded transition-colors ${isSynced ? 'bg-sky-500 text-white' : 'text-zinc-500 hover:text-white'}`}><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg></button> )}
            {onOpenLogic && ( 
              <button onClick={onOpenLogic} title="설정 변경" className="text-zinc-500 hover:text-white transition">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
              </button> 
            )}
          </span>
          <CustomNumberInput value={value} validate={(v) => v >= min && v <= max} onChange={onChange} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1 rounded w-20 text-right outline-none focus:border-${colorClass}-500 transition-colors`} />
        </div>
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} style={{ touchAction: 'pan-y' }} className={`accent-${colorClass}-400 cursor-pointer h-1.5 bg-zinc-700 rounded-lg appearance-none`} />
      </div>
    );

    const ConfigRow = ({ title, prefix, config, setConfig, colorClass }) => {
        const handleConfigChange = (type, val) => { setConfig(prev => ({ ...prev, [`${prefix}${type}`]: val })); };
        const resetToDefault = () => { setConfig(prev => ({ ...prev, [`${prefix}Min`]: DEFAULT_CONFIG[`${prefix}Min`], [`${prefix}Max`]: DEFAULT_CONFIG[`${prefix}Max`], [`${prefix}Step`]: DEFAULT_CONFIG[`${prefix}Step`] })); };

        return (
            <div className="flex flex-col gap-2 border-b border-zinc-700 pb-3">
                <div className="flex justify-between items-center">
                    <span className="text-zinc-300 text-xs font-bold">{title}</span>
                    <button onClick={resetToDefault} className="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-400 hover:text-white rounded border border-zinc-700 transition">초기화</button>
                </div>
                <div className="flex gap-2">
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최소<CustomNumberInput value={config[`${prefix}Min`]} validate={(v) => v <= config[`${prefix}Max`]} onChange={v => handleConfigChange('Min', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최대<CustomNumberInput value={config[`${prefix}Max`]} validate={(v) => v >= config[`${prefix}Min`]} onChange={v => handleConfigChange('Max', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">간격<CustomNumberInput value={config[`${prefix}Step`]} validate={(v) => Math.abs(v) > 0} onChange={v => handleConfigChange('Step', Math.abs(v))} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                </div>
            </div>
        );
    };

    function StartScreen({ onStart }) {
      return (
        <div className="relative w-full h-screen bg-gradient-to-br from-zinc-800 via-zinc-900 to-black overflow-hidden flex flex-col items-center justify-center">
          <div className="geom-shape shape-1 rounded-full w-48 h-48 -top-10 left-10"></div><div className="geom-shape shape-2 w-32 h-32 top-1/4 right-20"></div>
          <div className="geom-shape shape-3 rounded-full w-24 h-24 bottom-20 left-1/4"></div><div className="geom-shape shape-1 w-64 h-64 border-t-0 border-r-0 rounded-bl-full -bottom-10 -right-10"></div>
          
          <div className="relative z-10 flex flex-col items-center justify-center transform transition-all duration-700 hover:scale-105">
            <div className="flex items-center text-white">
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">(</span>
              <div className="grid grid-cols-3 gap-x-6 md:gap-x-12 gap-y-2 text-5xl md:text-8xl font-black mx-2 md:mx-4 text-center bg-clip-text text-transparent bg-gradient-to-b from-white via-zinc-300 to-zinc-600">
                <span>m</span><span>a</span><span>t</span>
                <span>r</span><span>i</span><span>x</span>
              </div>
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">)</span>
            </div>
          </div>
          
          <p className="relative z-10 mt-6 text-zinc-400 font-medium tracking-widest text-sm md:text-lg text-center px-4">Interactive Vision Transformation Engine</p>
          <button onClick={onStart} className="relative z-10 mt-12 md:mt-16 px-10 py-3 md:px-14 md:py-4 bg-gradient-to-r from-white to-zinc-300 text-black text-xl md:text-2xl font-black rounded-full hover:from-zinc-300 hover:to-zinc-500 shadow-lg transition-all duration-300 transform hover:-translate-y-1">시작하기</button>
        </div>
      );
    }

    function SimulatorScreen() {
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      const [panelWidth, setPanelWidth] = useState(450);
      const isResizingPanel = useRef(false);

      const [mobilePanelHeight, setMobilePanelHeightState] = useState(55); 
      const mobilePanelHeightRef = useRef(55);
      const setMobilePanelHeight = (h) => {
          setMobilePanelHeightState(h);
          mobilePanelHeightRef.current = h;
      };
      
      const prevPanelHeight = useRef(55);
      const isDraggingHandle = useRef(false);
      const handleStartY = useRef(0);
      const handleStartHeight = useRef(0);

      const [logicInfoData, setLogicInfoData] = useState(null); 
      const [useMathLab, setUseMathLab] = useState(false);
      
      const [constants, setConstants] = useState([]);
      const [activeConstConfig, setActiveConstConfig] = useState(null);

      const toggleConstConfig = (name) => { setActiveConstConfig(prev => prev === name ? null : name); };
      const updateConstant = (name, key, val) => { setConstants(prev => prev.map(c => c.name === name ? { ...c, [key]: val } : c)); };
      const deleteConstant = (name) => { setConstants(prev => prev.filter(c => c.name !== name)); };
      
      const [useGraph, setUseGraph] = useState(false);
      const [graphs, setGraphs] = useState([{ id: Date.now(), eq: 'x' }]);
      const [isGraphListExpanded, setIsGraphListExpanded] = useState(true);

      const [usePointMode, setUsePointMode] = useState(false);
      const [points, setPoints] = useState([]); 
      const [isPointListExpanded, setIsPointListExpanded] = useState(true);

      const [mathPadOpen, setMathPadOpen] = useState(false);
      const [padTab, setPadTab] = useState('math'); 
      const [tempGraphEq, setTempGraphEq] = useState("");
      const [editingGraphId, setEditingGraphId] = useState(null);
      const inputRef = useRef(null);

      const openMathPad = (id, currentEq) => { 
          setEditingGraphId(id); 
          setTempGraphEq(currentEq); 
          setMathPadOpen(true); 
          setPadTab('math');
      };
      
      const handleMathPadKey = (char) => {
          const el = inputRef.current;
          if (el) {
              const pos = el.selectionStart;
              const newEq = tempGraphEq.slice(0, pos) + char + tempGraphEq.slice(pos);
              setTempGraphEq(newEq);
              setTimeout(() => {
                  el.setSelectionRange(pos + char.length, pos + char.length);
                  el.focus();
              }, 0);
          } else {
              setTempGraphEq(tempGraphEq + char);
          }
      };

      const handleMathPadDelete = () => {
          const el = inputRef.current;
          if (el) {
              const start = el.selectionStart;
              const end = el.selectionEnd;
              if (start !== end) {
                  const newEq = tempGraphEq.slice(0, start) + tempGraphEq.slice(end);
                  setTempGraphEq(newEq);
                  setTimeout(() => { el.setSelectionRange(start, start); el.focus(); }, 0);
              } else if (start > 0) {
                  const newEq = tempGraphEq.slice(0, start - 1) + tempGraphEq.slice(start);
                  setTempGraphEq(newEq);

              };
              const nextStep = getNextStep(currentStep, direction);
              let newZ = 100 / nextStep;
              
              if (newZ > 1e7) newZ = 1e7;
              if (newZ < 1e-7) newZ = 1e-7;
              const actualRatio = newZ / prev.z;
              return { x: prev.x * actualRatio, y: prev.y * actualRatio, z: newZ }; 
          });
      };
      
      const goHome = () => {
          if (useMathLab) {
              const offsetScreenPixels = isMobile ? (window.innerHeight * (mobilePanelHeight / 100)) / 2 : 0;
              setCamera({ x: 0, y: -(offsetScreenPixels / 100.0), z: 100.0 });
          } else {
              setCamera(getOptimalCamera(imageObj));
          }
      };

      const zoomIn = () => handleZoom('in'); const zoomOut = () => handleZoom('out');

      useLayoutEffect(() => {
        if (!imageObj || useMathLab) return;
        const cCanvas = colorCacheRef.current;
        cCanvas.width = imageObj.width; cCanvas.height = imageObj.height;
        const cCtx = cCanvas.getContext('2d', { willReadFrequently: true });
        cCtx.drawImage(imageObj, 0, 0);

        const doColorMath = rAdd !== 0 || rMul !== 1 || gAdd !== 0 || gMul !== 1 || bAdd !== 0 || bMul !== 1 || chkGray || binThresh >= 0 || chkInvert || globalAdd !== 0 || globalMul !== 1.0 || useDuotone;

        if (doColorMath) {
          const imgData = cCtx.getImageData(0, 0, cCanvas.width, cCanvas.height);
          const data = imgData.data;
          const cDark = hexToRgb(colorDark); const cLight = hexToRgb(colorLight);
          for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] === 0) continue; 
            let r = data[i] * rMul + rAdd, g = data[i+1] * gMul + gAdd, b = data[i+2] * bMul + bAdd;
            r = r * globalMul + globalAdd; g = g * globalMul + globalAdd; b = b * globalMul + globalAdd;
            r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));

            if (chkGray || binThresh >= 0 || useDuotone) {
              let gray = r * 0.299 + g * 0.587 + b * 0.114;
              if (useDuotone) {
                const ratio = gray / 255.0;
                r = cDark.r + (cLight.r - cDark.r) * ratio; g = cDark.g + (cLight.g - cDark.g) * ratio; b = cDark.b + (cLight.b - cDark.b) * ratio;
              } else { if (binThresh >= 0) gray = gray > binThresh ? 255 : 0; r = g = b = gray; }
            }
            if (chkInvert) { r = 255 - r; g = 255 - g; b = 255 - b; }
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          cCtx.putImageData(imgData, 0, 0);
        }
      }, [imageObj, chkGray, chkInvert, globalAdd, globalMul, binThresh, rAdd, rMul, gAdd, gMul, bAdd, bMul, useDuotone, colorDark, colorLight, useMathLab]);

      useLayoutEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        ctx.imageSmoothingEnabled = imageSmoothing;

        const w = canvas.width, h = canvas.height;
        const cx = w / 2, cy = h / 2;
        
        const gridStep = getOptimalGridStep(camera.z);
        const z = camera.z;

        ctx.clearRect(0, 0, w, h);

        let customMarksX = [];
        let customMarksY = [];
        let hw = 0; let hh = 0;
        
        if (!useMathLab) {
            if (imageObj) {
                hw = imageObj.width / 2;
                hh = imageObj.height / 2;
                customMarksX.push(hw, -hw);
                customMarksY.push(hh, -hh);
            } else {
                hw = 100;
                hh = 100;
                customMarksX.push(hw, -hw);
                customMarksY.push(hh, -hh);
            }
        }

        // 🚀 축과 그리드가 화면 밖으로 이동해도 선이 끊기지 않도록 여유 스캔 범위 추가
        let minXIter = Math.floor(((-cx - camera.x) / z) / gridStep) - 2;
        let maxXIter = Math.ceil(((w - cx - camera.x) / z) / gridStep) + 2;
        if (maxXIter - minXIter > 200) { minXIter = -100; maxXIter = 100; }
        
        let minYIter = Math.floor(((-cy - camera.y) / z) / gridStep) - 2;
        let maxYIter = Math.ceil(((h - cy - camera.y) / z) / gridStep) + 2;
        if (maxYIter - minYIter > 200) { minYIter = -100; maxYIter = 100; }

        let regularMarksX = [];
        for (let i = minXIter; i <= maxXIter; i++) { if (i !== 0) regularMarksX.push(i * gridStep); }
        let regularMarksY = [];
        for (let i = minYIter; i <= maxYIter; i++) { if (i !== 0) regularMarksY.push(-i * gridStep); }

        const drawGridLines = () => {
          if (hideGrid) return;
          
          ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.beginPath();
          // 🚀 그리드 선 끊김 완벽 방지 (-100000 ~ 100000 무한대 길이로 그림)
          regularMarksX.forEach(valX => { let screenX = cx + camera.x + valX * z; ctx.moveTo(screenX, -100000); ctx.lineTo(screenX, 100000); });
          regularMarksY.forEach(valY => { let screenY = cy + camera.y - valY * z; ctx.moveTo(-100000, screenY); ctx.lineTo(100000, screenY); });
          ctx.stroke();

          ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath();
          let sOriginX = cx + camera.x, sOriginY = cy + camera.y;
          // 🚀 X, Y축 끊김 완벽 방지
          ctx.moveTo(sOriginX, -100000); ctx.lineTo(sOriginX, 100000);
          ctx.moveTo(-100000, sOriginY); ctx.lineTo(100000, sOriginY);
          ctx.stroke();
        };

        // 1. 그리드 선을 먼저 그립니다.
        if (!imageUnderGrid) drawGridLines();

        // 2. 그 다음 사진을 그립니다. (숫자보다 아래에 깔리게 순서 변경)
        ctx.save();
        ctx.translate(cx + camera.x, cy + camera.y); 
        ctx.scale(z, z); 
        ctx.transform(matrix.a, matrix.b, matrix.c, matrix.d, matrix.e, matrix.f);
        if (!useMathLab) {
            if (imageObj && colorCacheRef.current) {
              ctx.drawImage(colorCacheRef.current, -imageObj.width / 2, -imageObj.height / 2, imageObj.width, imageObj.height);
            } else if (!imageObj) {
              ctx.fillStyle = 'rgb(59, 130, 246)'; ctx.fillRect(-100, -100, 200, 200);
              ctx.fillStyle = 'rgb(239, 68, 68)'; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill();
            }
        }
        ctx.restore();

        if (imageUnderGrid) drawGridLines();

        // 🚀 3. 숫자를 맨 마지막에 덮어 그려서 사진 밑으로 절대 가려지지 않게 함!
        if (!hideGrid) {
            let sOriginX = cx + camera.x, sOriginY = cy + camera.y;
            ctx.font = `bold 14px monospace`;
            
            // 🎯 일반 눈금 
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            regularMarksX.forEach(valX => {
                // 🚀 사진이나 도형 '내부'에 있는 숫자는 아예 그리지 않음! (사진 위에 숫자 방지)
                if (!useMathLab && valX > -hw + 1e-5 && valX < hw - 1e-5) return; 
                
                let screenX = cx + camera.x + valX * z;
                let str = formatNumber(valX);
                
                let textY = Math.max(15, Math.min(h - 25, sOriginY + 15));
                ctx.lineWidth = 6; ctx.strokeStyle = '#09090b'; ctx.strokeText(str, screenX, textY);
                ctx.fillStyle = 'white'; ctx.fillText(str, screenX, textY);
            });

            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            regularMarksY.forEach(valY => {
                // 🚀 사진이나 도형 '내부'에 있는 숫자는 아예 그리지 않음! (사진 위에 숫자 방지)
                if (!useMathLab && valY > -hh + 1e-5 && valY < hh - 1e-5) return;

                let screenY = cy + camera.y - valY * z;
                let str = formatNumber(valY);
                
                let textX = Math.max(15, Math.min(w - 70, sOriginX - 10));
                ctx.lineWidth = 6; ctx.strokeStyle = '#09090b'; ctx.strokeText(str, textX, screenY);
                ctx.fillStyle = 'white'; ctx.fillText(str, textX, screenY);
            });

            // 🎯 사진/도형 끝단 숫자 (사진 영역 밖으로 띄워서 표시 & 완벽히 겹치면 원래 자리로 융합)
            if (!useMathLab) {
                // X축 끝단
                customMarksX.forEach(mark => {
                    let isExactGrid = regularMarksX.some(rx => Math.abs(rx - mark) < 1e-5);
                    if (isExactGrid) return; // 🌟 단위가 딱 맞으면 스킵 (일반 눈금 자리에 그려짐)
                    
                    let screenX = cx + camera.x + mark * z;
                    let textY = Math.max(15, Math.min(h - 25, sOriginY - 8)); // 🌟 X축 선 위로 띄움
                    let str = formatNumber(mark);
                    
                    ctx.textAlign = mark > 0 ? 'left' : 'right'; 
                    ctx.textBaseline = 'bottom';
                    let drawX = mark > 0 ? screenX + 14 : screenX - 14; // 🌟 좌우로 확실히 밀어서 겹침 방지

                    ctx.lineWidth = 6; ctx.strokeStyle = '#09090b'; ctx.strokeText(str, drawX, textY);
                    ctx.fillStyle = 'white'; ctx.fillText(str, drawX, textY);
                    
                    ctx.beginPath(); ctx.moveTo(screenX, sOriginY - 6); ctx.lineTo(screenX, sOriginY + 6); ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke();
                });

                // Y축 끝단
                customMarksY.forEach(mark => {
                    let isExactGrid = regularMarksY.some(ry => Math.abs(ry - mark) < 1e-5);
                    if (isExactGrid) return; // 🌟 단위가 딱 맞으면 스킵
                    
                    let screenY = cy + camera.y - mark * z;
                    let textX = Math.max(15, Math.min(w - 70, sOriginX + 10)); // 🌟 Y축 선 오른쪽으로 띄움
                    let str = formatNumber(mark);
                    
                    ctx.textAlign = 'left'; 
                    ctx.textBaseline = mark > 0 ? 'bottom' : 'top'; 
                    let drawY = mark > 0 ? screenY - 18 : screenY + 18; // 🌟 상하로 확실히 밀어서 겹침 방지

                    ctx.lineWidth = 6; ctx.strokeStyle = '#09090b'; ctx.strokeText(str, textX, drawY);
                    ctx.fillStyle = 'white'; ctx.fillText(str, textX, drawY);
                    
                    ctx.beginPath(); ctx.moveTo(sOriginX - 6, screenY); ctx.lineTo(sOriginX + 6, screenY); ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke();
                });
            }
        }

        const constNames = constants.map(c => c.name);
        const currentConstValues = constants.map(c => c.value);

        // 🚀 딥줌(Deep Zoom)시 함수 꺾임 및 과부하를 막는 경량화 렌더 엔진
        if (useMathLab && useGraph && graphs.length > 0) {
            graphs.forEach((g, idx) => {
                if (!g) return;
                const func = compileMath(g.eq.replace(/x/g, 'v'), constNames);
                ctx.save();
                ctx.translate(cx + camera.x, cy + camera.y);
                ctx.beginPath();
                ctx.strokeStyle = GRAPH_COLORS[idx % GRAPH_COLORS.length]; 
                ctx.lineWidth = 4; 
                
                let invMat;
                try { invMat = matrix.inverse(); } catch(e) { invMat = new DOMMatrix(); }
                
                let corners = [
                    new DOMPoint(-w, -h), new DOMPoint(w*2, -h),
                    new DOMPoint(-w, h*2), new DOMPoint(w*2, h*2)
                ];
                let minMathX = Infinity, maxMathX = -Infinity;
                corners.forEach(c => {
                    let canvasX = (c.x - cx - camera.x) / z;
                    let canvasY = (c.y - cy - camera.y) / z;
                    let mathPt = new DOMPoint(canvasX, canvasY).matrixTransform(invMat);
                    minMathX = Math.min(minMathX, mathPt.x);
                    maxMathX = Math.max(maxMathX, mathPt.x);
                });

                // 🚀 화면 픽셀 해상도 기준으로 항상 최적의 점(최대 3000개)만 가볍게 샘플링
                let steps = Math.min(3000, w * 1.5);
                let mathStep = (maxMathX - minMathX) / steps;
                if (mathStep <= 0 || !isFinite(mathStep)) mathStep = 0.01;

                let startMathX = minMathX;
                let first = true;
                let prevMathY = null;
                
                const LIMIT = 1000000; // 충분히 넓은 렌더링 한계 (선 안 꺾임)

                for (let mathX = startMathX; mathX <= maxMathX; mathX += mathStep) {
                    let mathY = executeMath(func, mathX, currentConstValues); 
                    
                    if (isNaN(mathY) || !isFinite(mathY)) {
                        first = true; prevMathY = null; continue;
                    }

                    if (prevMathY !== null) {
                        let dyScreen = Math.abs(mathY - prevMathY) * z;
                        if (dyScreen > h && mathY * prevMathY < 0) {
                            first = true; // 점근선 끊기
                        }
                    }
                    
                    let pt = new DOMPoint(mathX, -mathY);
                    let transformedPt = pt.matrixTransform(matrix);
                    
                    let drawX = transformedPt.x * z;
                    let drawY = transformedPt.y * z;
                    
                    if (drawX > LIMIT) drawX = LIMIT;
                    if (drawX < -LIMIT) drawX = -LIMIT;
                    if (drawY > LIMIT) drawY = LIMIT;
                    if (drawY < -LIMIT) drawY = -LIMIT;

                    if (first) {
                        ctx.moveTo(drawX, drawY);
                        first = false;
                    } else {
                        ctx.lineTo(drawX, drawY);
                    }
                    prevMathY = mathY;
                }
                ctx.stroke();
                ctx.restore();
            });
        }

        if (useMathLab && usePointMode && points.length > 0) {
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            points.forEach(p => {
                let pt = new DOMPoint(p.x, -p.y);
                let tPt = pt.matrixTransform(matrix);
                
                let drawX = tPt.x * z;
                let drawY = tPt.y * z;
                
                ctx.beginPath();
                ctx.arc(drawX, drawY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#10b981'; 
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(`${p.label}(${p.x}, ${p.y})`, drawX + 12, drawY - 12);
                ctx.shadowBlur = 0;
            });
            ctx.restore();
        }

        if (useRefl) {
          ctx.save();
          ctx.translate(cx + camera.x, cy + camera.y); ctx.translate(translateX * z, translateY * z); ctx.rotate(-(reflAngle * Math.PI) / 180); 
          ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-30000, 0); ctx.lineTo(30000, 0); ctx.stroke(); ctx.restore();
        }
      }, [camera, matrix, imageObj, imageUnderGrid, hideGrid, useRefl, reflAngle, translateX, translateY, useMathLab, useGraph, usePointMode, points, graphs, imageSmoothing, constants]); 

      return (
        <div className="flex w-full h-screen overflow-hidden animate-fade-in bg-zinc-950 relative">
          
          {mathPadOpen && (
            <div className="fixed inset-0 z-[110] flex items-end md:items-center justify-center bg-black/70 backdrop-blur-sm p-4 pb-10">
              <div className="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 w-full max-w-[28rem] shadow-2xl animate-fade-in flex flex-col">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4">
                  <h3 className="text-white font-bold text-lg">수식 입력 (y = f(x))</h3>
                  <button onClick={() => setMathPadOpen(false)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                
                <div className="bg-zinc-950 border border-zinc-700 rounded-xl p-3 flex flex-col mb-4 shadow-inner">
                    <div className="flex items-center text-purple-400 font-mono text-xl w-full border-b border-zinc-800 pb-2 mb-2 relative">
                        <span className="mr-2">y =</span>
                        <input 
                            ref={inputRef} type="text" value={tempGraphEq} 
                            onChange={(e) => setTempGraphEq(e.target.value)} 
                            className="flex-1 bg-transparent outline-none text-white tracking-wider font-mono min-w-0"
                            autoFocus autoComplete="off" spellCheck="false"
                        />
                    </div>
                    <div className="flex justify-start text-purple-300 font-serif text-2xl tracking-wide min-h-[36px] items-center pl-8 opacity-80"
                         dangerouslySetInnerHTML={{ __html: tempGraphEq ? tempGraphEq.replace(/log_([0-9a-zA-Z]+)/g, 'log<sub>$1</sub>').replace(/\^([0-9a-zA-Z]+|\([^)]+\))/g, '<sup>$1</sup>').replace(/\(([^)]+)\)\/\(([^)]+)\)/g, '<span class="inline-flex flex-col items-center align-middle mx-1 text-[0.65em]"><span class="border-b border-purple-400/50 px-1 pb-0.5">$1</span><span class="pt-0.5">$2</span></span>').replace(/\*/g, '·') : "<span class='text-zinc-600 text-sm'>수식 미리보기</span>" }}>
                    </div>
                </div>
                
                <div className="flex gap-2 mb-4 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
                    <button onClick={() => setPadTab('math')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${padTab === 'math' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}>기본 수식</button>
                    <button onClick={() => setPadTab('const')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${padTab === 'const' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}>상수 추가 (a~z)</button>
                </div>

                {padTab === 'math' && (
                    <div className="flex gap-4">
                        <div className="grid grid-cols-3 gap-2 flex-1">
                            <button onClick={()=>handleMathPadKey('sin(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-xs">sin</button>
                            <button onClick={()=>handleMathPadKey('cos(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-xs">cos</button>
                            <button onClick={()=>handleMathPadKey('tan(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-xs">tan</button>
                            <button onClick={()=>handleMathPadKey('log_')} className="bg-zinc-800 text-amber-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-[11px]">log_n</button>
                            <button onClick={()=>handleMathPadKey('log(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-[11px]">log₁₀</button>
                            <button onClick={()=>handleMathPadKey('ln(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-[11px]">ln</button>
                            
                            <button onClick={()=>handleMathPadKey('sqrt(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-base">√</button>
                            <button onClick={()=>handleMathPadKey('^2')} className="bg-zinc-800 text-sky-300 py-3 rounded-lg font-black hover:bg-zinc-700 text-sm">x²</button>
                            <button onClick={()=>handleMathPadKey('^')} className="bg-zinc-800 text-sky-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-sm">xⁿ</button>
                            
                            <button onClick={()=>handleMathPadKey('abs(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-base">|x|</button>
                            <button onClick={()=>handleMathPadKey('(')} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-base">(</button>
                            <button onClick={()=>handleMathPadKey(')')} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-base">)</button>
                            
                            <button onClick={()=>handleMathPadKey('x')} className="col-span-2 bg-purple-600/30 text-purple-400 border border-purple-500/30 py-3 rounded-lg font-bold text-xl hover:bg-purple-600/50">x</button>
                            <button onClick={()=>handleMathPadKey(')/(')} className="bg-zinc-700 text-emerald-400 py-3 rounded-lg font-bold hover:bg-zinc-600 text-[10px]">a/b</button>
                        </div>
                        <div className="grid grid-cols-4 gap-2 flex-[1.3]">
                            <button onClick={()=>handleMathPadKey('7')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">7</button>
                            <button onClick={()=>handleMathPadKey('8')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">8</button>
                            <button onClick={()=>handleMathPadKey('9')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">9</button>
                            <button onClick={handleMathPadDelete} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-sm">⌫</button>
                            <button onClick={()=>handleMathPadKey('4')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">4</button>
                            <button onClick={()=>handleMathPadKey('5')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">5</button>
                            <button onClick={()=>handleMathPadKey('6')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">6</button>
                            <button onClick={()=>handleMathPadKey('/')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">÷</button>
                            <button onClick={()=>handleMathPadKey('1')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">1</button>
                            <button onClick={()=>handleMathPadKey('2')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">2</button>
                            <button onClick={()=>handleMathPadKey('3')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">3</button>
                            <button onClick={()=>handleMathPadKey('*')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">×</button>
                            <button onClick={handleMathPadClear} className="bg-rose-600/30 text-rose-400 border border-rose-500/30 py-3 rounded-lg font-bold hover:bg-rose-600/50 text-xs">AC</button>
                            <button onClick={()=>handleMathPadKey('0')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">0</button>
                            <button onClick={()=>handleMathPadKey('.')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">.</button>

                <label className="ml-3 w-14 h-[110px] flex flex-col gap-1.5 items-center justify-center bg-zinc-800/90 hover:bg-zinc-700 backdrop-blur border border-zinc-700 text-zinc-300 rounded-lg font-bold transition cursor-pointer shadow-xl pointer-events-auto">
                    <svg className="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span className="text-[10px] text-zinc-400">사진 열기</span>
                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                </label>
              </div>
            )}

            {useRefl && (
              <div className={`absolute ${isMobile ? 'top-[135px] left-4' : 'top-8 left-8'} z-[60] text-rose-500 font-bold text-sm md:text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,1)] bg-zinc-900/60 px-3 py-2 md:px-5 md:py-3 rounded-lg border border-rose-500/30 shadow-2xl backdrop-blur-sm pointer-events-none`}>
                Reflection Axis: {Math.abs(reflAngle - 90) < 0.01 ? "x = 0" : `y = ${Math.tan(reflAngle * Math.PI / 180).toFixed(2)}x`}
              </div>
            )}

            <canvas ref={canvasRef} width={2000} height={1200} className="w-full h-full object-cover z-20 pointer-events-none absolute inset-0" />
            
            <div className="absolute flex flex-col bg-zinc-800/90 backdrop-blur rounded-xl border border-zinc-700 shadow-2xl overflow-hidden text-lg font-bold z-[60] transition-all duration-300 pointer-events-auto"
                 style={isMobile ? { bottom: `calc(${mobilePanelHeight}vh + env(safe-area-inset-bottom, 0px) + 16px)`, right: '16px' } : { bottom: '32px', right: '32px' }}>
              {isMobile && (
                  <button onClick={() => resetAll(imageObj)} className="px-3 py-3 md:px-4 md:py-4 hover:bg-rose-600 hover:text-white text-rose-400 transition" title="리셋">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                  </button>
              )}
              <button onClick={goHome} className={`px-3 py-3 md:px-4 md:py-4 hover:bg-sky-600 bg-sky-500 text-white transition ${isMobile ? 'border-t' : ''} border-zinc-700`} title="화면 맞춤">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              </button>
              <button onClick={zoomIn} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition" title="확대">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
              </button>
              <button onClick={zoomOut} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition" title="축소">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM7 10h6"/></svg>
              </button>
            </div>
          </div>

        </div>
      );
    }

    function App() {
      const [isStarted, setIsStarted] = useState(window.location.hash === '#simulator');
      useEffect(() => {
        const handlePopState = () => setIsStarted(window.location.hash === '#simulator');
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);
      const handleStart = () => { window.history.pushState(null, '', '#simulator'); setIsStarted(true); };
      return !isStarted ? <StartScreen onStart={handleStart} /> : <SimulatorScreen />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
