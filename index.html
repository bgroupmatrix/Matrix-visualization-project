          } else {
              setTempGraphEq(tempGraphEq + char);
          }
      };

      const handleMathPadDelete = () => {
          const el = inputRef.current;
          if (el) {
              const start = el.selectionStart;
              const end = el.selectionEnd;
              if (start !== end) {
                  const newEq = tempGraphEq.slice(0, start) + tempGraphEq.slice(end);
                  setTempGraphEq(newEq);
                  setTimeout(() => { el.setSelectionRange(start, start); el.focus(); }, 0);
              } else if (start > 0) {
                  const newEq = tempGraphEq.slice(0, start - 1) + tempGraphEq.slice(start);
                  setTempGraphEq(newEq);
                  setTimeout(() => { el.setSelectionRange(start - 1, start - 1); el.focus(); }, 0);
              }
          } else {
              setTempGraphEq(tempGraphEq.slice(0, -1));
          }
      };

      const handleMathPadClear = () => { 
          setTempGraphEq(""); 
          setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 0);
      };
      
      const applyMathPad = () => { 
          setGraphs(prev => prev.map(g => g.id === editingGraphId ? { ...g, eq: tempGraphEq || 'x' } : g));
          setMathPadOpen(false); 
      };

      const handleConstClick = (letter) => { handleMathPadKey(letter); };
      
      const addGraph = () => { setGraphs(prev => [...prev, { id: Date.now(), eq: 'x', matrixMode: 'global', customMatrix: {a:1, b:0, c:0, d:1, e:0, f:0} }]); setIsGraphListExpanded(true); };
      const removeGraph = (id) => { 
          setGraphs(prev => {
              const next = prev.filter(g => g.id !== id);
              return next.length > 0 ? next : [{ id: Date.now(), eq: 'x', matrixMode: 'global', customMatrix: {a:1, b:0, c:0, d:1, e:0, f:0} }];
          });
      };

      const updateGraphCustomMatrix = (id, key, val) => {
          setGraphs(prev => prev.map(g => g.id === id ? { ...g, customMatrix: { ...g.customMatrix, [key]: val } } : g));
      };

      const [logicModalOpen, setLogicModalOpen] = useState(false);
      const [customLogic, setCustomLogic] = useState({ m00: 'cos(v)', m01: '-sin(v)', m10: 'sin(v)', m11: 'cos(v)' });
      const [tempLogic, setTempLogic] = useState(customLogic);
      
      const [compiledLogic, setCompiledLogic] = useState({
          m00: compileMath('cos(v)'), m01: compileMath('-sin(v)'),
          m10: compileMath('sin(v)'), m11: compileMath('cos(v)')
      });

      useEffect(() => {
          const names = constants.map(c => c.name);
          setCompiledLogic({
              m00: compileMath(customLogic.m00, names), m01: compileMath(customLogic.m01, names),
              m10: compileMath(customLogic.m10, names), m11: compileMath(customLogic.m11, names)
          });
      }, [customLogic, constants.length]);

      const openLogicModal = () => { setTempLogic(customLogic); setLogicModalOpen(true); };
      const saveLogicModal = () => { setCustomLogic(tempLogic); setLogicModalOpen(false); };

      const [camera, setCamera] = useState({ x: 0, y: 0, z: 1.0 });
      const isDraggingRef = useRef(false);
      const lastMouseRef = useRef({ x: 0, y: 0 });
      const initialPinchDist = useRef(null);
      const dragDistRef = useRef(0);
      
      const [isDragUI, setIsDragUI] = useState(false);

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [settingsTab, setSettingsTab] = useState('display'); 
      const [imageSmoothing, setImageSmoothing] = useState(true); 
      const [imageUnderGrid, setImageUnderGrid] = useState(false);
      const [hideGrid, setHideGrid] = useState(false);
      const [autoResetOnLoad, setAutoResetOnLoad] = useState(false);
      const [matrixFormatExact, setMatrixFormatExact] = useState(false); 
      
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [activeTab, setActiveTab] = useState('geo');

      const [scaleX, setScaleX] = useState(1.0); const [scaleY, setScaleY] = useState(1.0);
      const [translateX, setTranslateX] = useState(0); const [translateY, setTranslateY] = useState(0);
      const [rotation, setRotation] = useState(0); const [shearX, setShearX] = useState(0); const [shearY, setShearY] = useState(0);
      const [squeeze, setSqueeze] = useState(1.0); const [useRefl, setUseRefl] = useState(false); const [reflAngle, setReflAngle] = useState(90);

      const [chkGray, setChkGray] = useState(false); const [chkInvert, setChkInvert] = useState(false);
      const [globalAdd, setGlobalAdd] = useState(0); const [globalMul, setGlobalMul] = useState(1.0); const [binThresh, setBinThresh] = useState(-1);
      
      const [rAdd, setRAdd] = useState(0); const [rMul, setRMul] = useState(1.0);
      const [gAdd, setGAdd] = useState(0); const [gMul, setGMul] = useState(1.0);
      const [bAdd, setBAdd] = useState(0); const [bMul, setBMul] = useState(1.0);

      const [useDuotone, setUseDuotone] = useState(false);
      const [colorDarkUI, setColorDarkUI] = useState('#0a0a2a'); const [colorDark, setColorDark] = useState('#0a0a2a');
      const [colorLightUI, setColorLightUI] = useState('#ffea00'); const [colorLight, setColorLight] = useState('#ffea00');

      useEffect(() => { const t = setTimeout(() => setColorDark(colorDarkUI), 150); return () => clearTimeout(t); }, [colorDarkUI]);
      useEffect(() => { const t = setTimeout(() => setColorLight(colorLightUI), 150); return () => clearTimeout(t); }, [colorLightUI]);

      const [imageObj, setImageObj] = useState(null);
      const canvasRef = useRef(null);
      const colorCacheRef = useRef(null);
      if (!colorCacheRef.current && typeof document !== 'undefined') { colorCacheRef.current = document.createElement('canvas'); }

      useEffect(() => {
          const canvas = document.createElement('canvas');
          canvas.width = 400; canvas.height = 400;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = 'rgb(59, 130, 246)'; ctx.fillRect(100, 100, 200, 200);
          ctx.fillStyle = 'rgb(239, 68, 68)'; ctx.beginPath(); ctx.arc(200, 200, 50, 0, Math.PI * 2); ctx.fill();
          const img = new Image();
          img.onload = () => setImageObj(img);
          img.src = canvas.toDataURL();
      }, []);

      useEffect(() => {
          setConfig(prev => {
              let next = { ...prev };
              if (useMathLab && !showImageInMathLab) {
                  next.transXMin = -10; next.transXMax = 10; next.transXStep = 0.1;
                  next.transYMin = -10; next.transYMax = 10; next.transYStep = 0.1;
              } else if (imageObj) {
                  let mx = Math.ceil(imageObj.width / 10) * 10;
                  let my = Math.ceil(imageObj.height / 10) * 10;
                  next.transXMin = -mx; next.transXMax = mx; next.transXStep = 1;
                  next.transYMin = -my; next.transYMax = my; next.transYStep = 1;
              } else {
                  next.transXMin = -500; next.transXMax = 500; next.transXStep = 1;
                  next.transYMin = -500; next.transYMax = 500; next.transYStep = 1;
              }
              return next;
          });
      }, [imageObj, useMathLab, showImageInMathLab]);

      const getOptimalCamera = (img) => {
        let targetZ = 1.0;
        if (img) {
            targetZ = Math.min((2000 * 0.8) / img.width, (1200 * 0.8) / img.height);
            if (targetZ > 1.0) targetZ = 1.0; 
        }
        return { x: 0, y: 0, z: targetZ };
      };

      const handleMathLabToggle = (checked) => {
          setUseMathLab(checked);
          if (!keepViewOnMathLab) {
              if (checked) {
                  if (showImageInMathLab && imageObj) setCamera(getOptimalCamera(imageObj));
                  else setCamera({ x: 0, y: 0, z: 100.0 });
              } else {
                  setCamera(getOptimalCamera(imageObj));
              }
          }
      };

      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      useEffect(() => {
        const handleMouseMoveGlobal = (e) => {
          if (isResizingPanel.current) {
            let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            let newWidth = clientX;
            if (newWidth < 300) newWidth = 300;
            if (newWidth > window.innerWidth * 0.7) newWidth = Math.floor(window.innerWidth * 0.7);
            setPanelWidth(newWidth);
          }
          if (isDraggingHandle.current) {
            let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const deltaY = handleStartY.current - clientY;
            const deltaVh = (deltaY / window.innerHeight) * 100;
            let newHeight = handleStartHeight.current + deltaVh;
            if (newHeight < 0) newHeight = 0;
            if (newHeight > 85) newHeight = 85; 
            setMobilePanelHeight(newHeight);
          }
        };

        const handleMouseUpGlobal = (e) => {
          if (isResizingPanel.current) {
             isResizingPanel.current = false; 
             document.body.style.cursor = 'default'; 
          }
          if (isDraggingHandle.current) {
             isDraggingHandle.current = false;
             let clientY = e.type.includes('touch') ? e.changedTouches[0].clientY : e.clientY;
             const deltaY = Math.abs(handleStartY.current - clientY);
             if (deltaY < 10) {
                 const h = mobilePanelHeightRef.current;
                 if (h > 50) setMobilePanelHeight(15);
                 else setMobilePanelHeight(85);
             }
          }
        };

        window.addEventListener('mousemove', handleMouseMoveGlobal); 
        window.addEventListener('mouseup', handleMouseUpGlobal);
        window.addEventListener('touchmove', handleMouseMoveGlobal, { passive: false });
        window.addEventListener('touchend', handleMouseUpGlobal);
        
        return () => { 
            window.removeEventListener('mousemove', handleMouseMoveGlobal); 
            window.removeEventListener('mouseup', handleMouseUpGlobal); 
            window.removeEventListener('touchmove', handleMouseMoveGlobal);
            window.removeEventListener('touchend', handleMouseUpGlobal);
        };
      }, []);

      const startResizingPanel = (e) => { 
          isResizingPanel.current = true; 
          document.body.style.cursor = 'col-resize'; 
          if(e.type !== 'touchstart') e.preventDefault(); 
      };

      const startDraggingHandle = (e) => {
          isDraggingHandle.current = true;
          handleStartY.current = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
          handleStartHeight.current = mobilePanelHeightRef.current;
          e.stopPropagation();
      };

      // 🚀 드래그 앤 드롭 핸들러 로직
      const handleDragStart = (e, index) => {
          e.dataTransfer.setData('dragIndex', index);
          e.dataTransfer.effectAllowed = "move";
      };
      
      const handleDrop = (e, targetIndex) => {
          e.preventDefault();
          const dragIndexStr = e.dataTransfer.getData('dragIndex');
          if (!dragIndexStr) return;
          const dragIndex = parseInt(dragIndexStr);
          if (dragIndex === targetIndex) return;
          
          const newOrder = [...chainOrder];
          const [draggedItem] = newOrder.splice(dragIndex, 1);
          newOrder.splice(targetIndex, 0, draggedItem);
          setChainOrder(newOrder);
      };
      
      const handleDragOver = (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
      };

      const [syncKeys, setSyncKeys] = useState(new Set());
      const toggleSync = (key) => { setSyncKeys(prev => { const next = new Set(prev); if (next.has(key)) next.delete(key); else next.add(key); return next; }); };

      const prevVals = useRef({});
      useEffect(() => { prevVals.current = { scaleX, scaleY, translateX, translateY, rotation, shearX, shearY, squeeze, globalAdd, globalMul, rAdd, rMul, gAdd, gMul, bAdd, bMul }; });

      const stateSetters = { scaleX: setScaleX, scaleY: setScaleY, translateX: setTranslateX, translateY: setTranslateY, rotation: setRotation, shearX: setShearX, shearY: setShearY, squeeze: setSqueeze, globalAdd: setGlobalAdd, globalMul: setGlobalMul, rAdd: setRAdd, rMul: setRMul, gAdd: setGAdd, gMul: setGMul, bAdd: setBAdd, bMul: setBMul };
      
      const handleSyncChange = (key, newVal) => {
          const oldVal = prevVals.current[key];
          const delta = newVal - oldVal;
          stateSetters[key](newVal);
          if (syncKeys.has(key)) {
              syncKeys.forEach(k => {
                  if (k === key) return;
                  let targetNewVal = prevVals.current[k] + delta;
                  const bounds = {
                      scaleX: {min: config.scaleXMin, max: config.scaleXMax}, scaleY: {min: config.scaleYMin, max: config.scaleYMax},
                      translateX: {min: config.transXMin, max: config.transXMax}, translateY: {min: config.transYMin, max: config.transYMax},
                      rotation: {min: config.rotMin, max: config.rotMax},
                      shearX: {min: config.shearXMin, max: config.shearXMax}, shearY: {min: config.shearYMin, max: config.shearYMax},
                      squeeze: {min: config.squeezeMin, max: config.squeezeMax}, globalAdd: {min: -255, max: 255}, globalMul: {min: config.contMin, max: config.contMax},
                      rAdd: {min: -255, max: 255}, rMul: {min: config.contMin, max: config.contMax}, gAdd: {min: -255, max: 255}, gMul: {min: config.contMin, max: config.contMax}, bAdd: {min: -255, max: 255}, bMul: {min: config.contMin, max: config.contMax}
                  }[k];
                  if (targetNewVal < bounds.min) targetNewVal = bounds.min;
                  if (targetNewVal > bounds.max) targetNewVal = bounds.max;
                  stateSetters[k](targetNewVal);
              });
          }
      };

      const resetAll = (img = imageObj) => {
        if (useMathLab && !keepViewOnMathLab) {
            if (showImageInMathLab && img) setCamera(getOptimalCamera(img));
            else setCamera({ x: 0, y: 0, z: 100.0 });
        } else if (!useMathLab) {
            setCamera(getOptimalCamera(img));
        }
        
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

        setScaleX(clamp(1.0, config.scaleXMin, config.scaleXMax));
        setScaleY(clamp(1.0, config.scaleYMin, config.scaleYMax));
        setTranslateX(clamp(0, config.transXMin, config.transXMax));
        setTranslateY(clamp(0, config.transYMin, config.transYMax));
        setTransformOriginX(0); setTransformOriginY(0);
        setRotation(clamp(0, config.rotMin, config.rotMax));
        setShearX(clamp(0, config.shearXMin, config.shearXMax));
        setShearY(clamp(0, config.shearYMin, config.shearYMax));
        setSqueeze(clamp(1.0, config.squeezeMin, config.squeezeMax));
        
        setUseRefl(false); setReflAngle(90);
        setChkGray(false); setChkInvert(false); 
        setGlobalAdd(0); setGlobalMul(clamp(1.0, config.contMin, config.contMax)); 
        setBinThresh(-1);
        
        setRAdd(0); setRMul(clamp(1.0, config.contMin, config.contMax)); 
        setGAdd(0); setGMul(clamp(1.0, config.contMin, config.contMax)); 
        setBAdd(0); setBMul(clamp(1.0, config.contMin, config.contMax));
        
        setUseDuotone(false); 
        setChainOrder(['translate', 'origin', 'rotate', 'scale', 'shear', 'origin_back']);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          setImageObj(img);
          setUseMathLab(false); setUseGraph(false); setUsePointMode(false); 
          if (autoResetOnLoad) resetAll(img); else setCamera(getOptimalCamera(img));
        };
        img.src = url;
      };

      const handleAddManualPoint = () => {
          let x = parseFloat(manualX); let y = parseFloat(manualY);
          if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
          x = Math.max(-1e7, Math.min(1e7, x)); y = Math.max(-1e7, Math.min(1e7, y));
          setPoints(prev => {
              const newLabel = String.fromCharCode(65 + prev.length % 26);
              return [...prev, { id: Date.now(), label: newLabel, x, y }];
          });
          setShowManualPointUI(false);
      };

      const handleAddManualCalcPoint = () => {
          let x = parseFloat(calcManualX); let y = parseFloat(calcManualY);
          if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
          x = Math.max(-1e7, Math.min(1e7, x)); y = Math.max(-1e7, Math.min(1e7, y));
          setCalcPoints(prev => [...prev, { id: Date.now(), x, y }]);
          setShowManualCalcPointUI(false);
          setIsCalcMode(false);
      };

      const handleAddManualPolyPoint = () => {
          let x = parseFloat(polyManualX); let y = parseFloat(polyManualY);
          if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
          x = Math.max(-1e7, Math.min(1e7, x)); y = Math.max(-1e7, Math.min(1e7, y));
          setPolygonPoints(prev => [...prev, { x, y }]);
          setShowManualPolyUI(false);
      };

      const applySymmetry = (type) => {
          handleSyncChange('translateX', 0); handleSyncChange('translateY', 0);
          handleSyncChange('shearX', 0); handleSyncChange('shearY', 0); handleSyncChange('squeeze', 1.0);
          if (type === 'X') {
              setUseRefl(false); setRotation(0); handleSyncChange('scaleX', 1); handleSyncChange('scaleY', -1); 
          } else if (type === 'Y') {
              setUseRefl(false); setRotation(0); handleSyncChange('scaleX', -1); handleSyncChange('scaleY', 1); 
          } else if (type === 'ORIGIN') {
              setUseRefl(false); setRotation(180); handleSyncChange('scaleX', 1); handleSyncChange('scaleY', 1);
          } else if (type === 'YX') {
              setUseRefl(true); setReflAngle(45); handleSyncChange('scaleX', 1); handleSyncChange('scaleY', 1); setRotation(0);
          }
      };

      const constValues = constants.map(c => c.value);

      // 🚀 드래그 가능한 행렬 블록 맵핑
      const getChainMatrix = (id) => {
          switch(id) {
              case 'translate': return { m: new DOMMatrix().translate(translateX, translateY), label: '이동' };
              case 'origin': return { m: new DOMMatrix().translate(transformOriginX, -transformOriginY), label: '+중심점' };
              case 'origin_back': return { m: new DOMMatrix().translate(-transformOriginX, transformOriginY), label: '-중심점' };
              case 'rotate': 
                  if (useRefl) {
                      const theta = (reflAngle * Math.PI) / 180;
                      return { m: new DOMMatrix([Math.cos(2*theta), Math.sin(2*theta), Math.sin(2*theta), -Math.cos(2*theta), 0, 0]), label: '반사' };
                  } else {
                      const v = rotation * Math.PI / 180;
                      let rM = new DOMMatrix([
                          executeMath(compiledLogic.m00, v, constValues), executeMath(compiledLogic.m10, v, constValues),
                          executeMath(compiledLogic.m01, v, constValues), executeMath(compiledLogic.m11, v, constValues),
                          0, 0
                      ]);
                      return { m: rM, label: '회전' };
                  }
              case 'scale': return { m: new DOMMatrix().scale(scaleX * squeeze, scaleY * (1 / squeeze)), label: '크기' };
              case 'shear': return { m: new DOMMatrix([1, shearY, shearX, 1, 0, 0]), label: '전단(Shear)' };
              default: return { m: new DOMMatrix(), label: '알수없음' };
          }
      };

      // 🚀 1. 행렬 연산 엔진 (드래그 앤 드롭 순서 적용)
      let matrix = new DOMMatrix();
      
      if (showMatrixChain) {
          chainOrder.forEach(id => {
              matrix = matrix.multiply(getChainMatrix(id).m);
          });
      } else {
          matrix = matrix.translate(translateX, translateY); 
          matrix = matrix.translate(transformOriginX, -transformOriginY); 
          if (useRefl) {
              const theta = (reflAngle * Math.PI) / 180;
              matrix = matrix.multiply(new DOMMatrix([Math.cos(2*theta), Math.sin(2*theta), Math.sin(2*theta), -Math.cos(2*theta), 0, 0]));
          } else { 
              let v = rotation * Math.PI / 180;
              let rM = new DOMMatrix([
                  executeMath(compiledLogic.m00, v, constValues), executeMath(compiledLogic.m10, v, constValues),
                  executeMath(compiledLogic.m01, v, constValues), executeMath(compiledLogic.m11, v, constValues),
                  0, 0
              ]);
              matrix = matrix.multiply(rM);
          }
          matrix = matrix.scale(scaleX * squeeze, scaleY * (1 / squeeze));
          matrix = matrix.multiply(new DOMMatrix([1, shearY, shearX, 1, 0, 0]));
          matrix = matrix.translate(-transformOriginX, transformOriginY); 
      }

      const getMatrixColor = (currentStr, defaultFixed, defaultExact) => {
          const target = matrixFormatExact ? defaultExact : defaultFixed;
          return currentStr === target ? "text-zinc-600" : "text-sky-400 text-shadow-glow";
      };

      const formatMatrixVal = (val, isTranslate) => {
          if (matrixFormatExact) return parseFloat(val.toFixed(4)).toString();
          return isTranslate ? val.toFixed(0) : val.toFixed(2);
      };

      let m00Str = formatMatrixVal(matrix.a, false); let m10Str = formatMatrixVal(matrix.b, false);
      let m01Str = formatMatrixVal(matrix.c, false); let m11Str = formatMatrixVal(matrix.d, false);
      let m02Str = formatMatrixVal(matrix.e, true); let m12Str = formatMatrixVal(matrix.f, true);

      const handleMatrixUpdate = (key, v) => {
          setConfig(prev => {
              let next = { ...prev };
              const expand = (prefix, val) => {
                  if (val > next[`${prefix}Max`]) next[`${prefix}Max`] = Math.ceil(val + Math.abs(val)*0.2 + 1);
                  if (val < next[`${prefix}Min`]) next[`${prefix}Min`] = Math.floor(val - Math.abs(val)*0.2 - 1);
              };
              if (key === 'a' || key === 'd') { expand('scaleX', v); expand('scaleY', v); }
              if (key === 'e') expand('transX', v);
              if (key === 'f') expand('transY', v);
              if (key === 'b' || key === 'c') { expand('shearX', v); expand('shearY', v); }
              return next;
          });

          if (key === 'e') setTranslateX(v);
          if (key === 'f') setTranslateY(v);
          if (key === 'a') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setScaleX(v); }
          if (key === 'd') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setScaleY(v); }
          if (key === 'c') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setShearX(scaleY !== 0 ? v / scaleY : 0); }
          if (key === 'b') { setRotation(0); setSqueeze(1.0); setUseRefl(false); setShearY(scaleX !== 0 ? v / scaleX : 0); }
      };

      const processCanvasClick = (clientX, clientY) => {
          const canvas = canvasRef.current;
          if (!canvas) return false;
          const rect = canvas.getBoundingClientRect();
          const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
          
          const offsetX = (rect.width - canvas.width * scale) / 2;
          const offsetY = (rect.height - canvas.height * scale) / 2;
          
          const canvasX = (clientX - rect.left - offsetX) / scale;
          const canvasY = (clientY - rect.top - offsetY) / scale;
          
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          
          let screenX = canvasX - cx - camera.x;
          let screenY = canvasY - cy - camera.y;

          let hitPoint = null;
          for (let p of calcPoints) {
              let mathPt = new DOMPoint(p.x, -p.y);
              let tPt = mathPt.matrixTransform(matrix);
              let drawX = tPt.x * camera.z;
              let drawY = tPt.y * camera.z;
              let distSq = (screenX - drawX) ** 2 + (screenY - drawY) ** 2;
              if (distSq < (25 / camera.z) ** 2 || distSq < 400) { 
                  hitPoint = p; break; 
              }
          }

          if (hitPoint) {
              setSelectedCalcPoint(hitPoint);
              return true;
          }

          if (isCalcMode) {
              let mathX = screenX / camera.z;
              let mathY = screenY / camera.z;
              let mathPt = new DOMPoint(mathX, mathY);
              let invMat = matrix.inverse();
              let basePt = mathPt.matrixTransform(invMat);
              
              let logicX = Math.round((basePt.x) * 100) / 100; 
              let logicY = Math.round((-basePt.y) * 100) / 100;
              
              setCalcPoints(prev => [...prev, { id: Date.now(), x: logicX, y: logicY }]);
              setIsCalcMode(false);
              return true;
          }

          if (usePolygonMode && !isPolygonClosed) {
              let mathX = screenX / camera.z;
              let mathY = screenY / camera.z;
              let mathPt = new DOMPoint(mathX, mathY);
              let invMat = matrix.inverse();
              let basePt = mathPt.matrixTransform(invMat);
              let logicX = Math.round((basePt.x) * 10) / 10;
              let logicY = Math.round((-basePt.y) * 10) / 10;

              if (polygonPoints.length >= 3) {
                  let firstP = polygonPoints[0];
                  let fMath = new DOMPoint(firstP.x, -firstP.y).matrixTransform(matrix);
                  let fDrawX = fMath.x * camera.z;
                  let fDrawY = fMath.y * camera.z;
                  let dist = Math.hypot(screenX - fDrawX, screenY - fDrawY);
                  if (dist < 20) {
                      setIsPolygonClosed(true);
                      return true;
                  }
              }
              setPolygonPoints(prev => [...prev, { x: logicX, y: logicY }]);
              return true;
          }

          return false;
      };

      const addMathPoint = (clientX, clientY) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
          const offsetX = (rect.width - canvas.width * scale) / 2;
          const offsetY = (rect.height - canvas.height * scale) / 2;
          const canvasX = (clientX - rect.left - offsetX) / scale;
          const canvasY = (clientY - rect.top - offsetY) / scale;
          const cx = canvas.width / 2; const cy = canvas.height / 2;
          let screenX = canvasX - cx - camera.x;
          let screenY = canvasY - cy - camera.y;

          let mathX = screenX / camera.z;
          let mathY = screenY / camera.z;
          let mathPt = new DOMPoint(mathX, mathY);
          let invMat = matrix.inverse();
          let basePt = mathPt.matrixTransform(invMat);
          
          let logicX = Math.round((basePt.x) * 10) / 10;
          let logicY = Math.round((-basePt.y) * 10) / 10;
          
          setPoints(prev => {
              const newLabel = String.fromCharCode(65 + prev.length % 26);
              return [...prev, { id: Date.now(), label: newLabel, x: logicX, y: logicY }];
          });
      };

      const calculateDelta = (clientX, clientY) => {
          const canvas = canvasRef.current;
          if (!canvas) return { dx: 0, dy: 0 };
          const rect = canvas.getBoundingClientRect();
          const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
          const dx = (clientX - lastMouseRef.current.x) / scale;
          const dy = (clientY - lastMouseRef.current.y) / scale;
          return { dx, dy };
      };

      const handleMouseDown = (e) => { 
          isDraggingRef.current = true; setIsDragUI(true); dragDistRef.current = 0; 
          lastMouseRef.current = { x: e.clientX, y: e.clientY }; 
      };
      const handleMouseMove = (e) => {
        if (!isDraggingRef.current) return;
        const { dx, dy } = calculateDelta(e.clientX, e.clientY);
        dragDistRef.current += Math.abs(dx) + Math.abs(dy); 
        setCamera(prev => ({ ...prev, x: prev.x + dx, y: prev.y + dy }));
        lastMouseRef.current = { x: e.clientX, y: e.clientY };
      };
      const handleMouseUpOrLeave = (e) => { 
        isDraggingRef.current = false; setIsDragUI(false); 
        if (e.type === 'mouseup' && dragDistRef.current < 5) {
            const handled = processCanvasClick(e.clientX, e.clientY);
            if (!handled && useMathLab && usePointMode) {
                addMathPoint(e.clientX, e.clientY);
            }
        }
      };

      const handleTouchStart = (e) => {
        dragDistRef.current = 0;
        if (e.touches.length === 1) {
            isDraggingRef.current = true; setIsDragUI(true); 
            lastMouseRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; 
        } else if (e.touches.length === 2) {
            isDraggingRef.current = false;
            dragDistRef.current += 100; 
            const t1 = e.touches[0]; const t2 = e.touches[1];
            const dx = t1.clientX - t2.clientX; const dy = t1.clientY - t2.clientY;
            const dist = Math.max(1, Math.sqrt(dx*dx + dy*dy)); 
            const midX = (t1.clientX + t2.clientX) / 2; const midY = (t1.clientY + t2.clientY) / 2;
            initialPinchDist.current = { lastDist: dist, lastMidX: midX, lastMidY: midY };
        }
      };

      const handleTouchMove = (e) => {
        if (e.touches.length === 1 && isDraggingRef.current) {
            const touch = e.touches[0];
            const { dx, dy } = calculateDelta(touch.clientX, touch.clientY);
            dragDistRef.current += Math.abs(dx) + Math.abs(dy);
            setCamera(prev => ({ ...prev, x: prev.x + dx, y: prev.y + dy }));
            lastMouseRef.current = { x: touch.clientX, y: touch.clientY };
        } else if (e.touches.length === 2 && initialPinchDist.current) {
            dragDistRef.current += 100; 
            const t1 = e.touches[0]; const t2 = e.touches[1];
            const dx = t1.clientX - t2.clientX; const dy = t1.clientY - t2.clientY;
            const dist = Math.max(1, Math.sqrt(dx*dx + dy*dy));
            if (initialPinchDist.current.lastDist < 1) initialPinchDist.current.lastDist = 1;
            
            const midX = (t1.clientX + t2.clientX) / 2; const midY = (t1.clientY + t2.clientY) / 2;
            const zRatio = dist / initialPinchDist.current.lastDist;

            setCamera(prev => {
                let newZ = prev.z * zRatio;
                if (newZ > 500000) newZ = 500000;
                if (newZ < 1e-6) newZ = 1e-6;
                const actualRatio = newZ / prev.z;

                const canvas = canvasRef.current; 
                const rect = canvas.getBoundingClientRect();
                const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
                
                const dxScreen = (midX - initialPinchDist.current.lastMidX) / scale;
                const dyScreen = (midY - initialPinchDist.current.lastMidY) / scale;
                const cx = canvas.width / 2; const cy = canvas.height / 2;
                const pointerCanvasX = (midX - rect.left) / scale; const pointerCanvasY = (midY - rect.top) / scale;
                
                const logicX = pointerCanvasX - cx - prev.x; const logicY = pointerCanvasY - cy - prev.y;

                const newCamX = prev.x + dxScreen - logicX * (actualRatio - 1);
                const newCamY = prev.y + dyScreen - logicY * (actualRatio - 1);

                return { x: newCamX, y: newCamY, z: newZ };
            });

            initialPinchDist.current = { lastDist: dist, lastMidX: midX, lastMidY: midY };
        }
      };

      const handleTouchEnd = (e) => {
          if (e.touches.length < 2) initialPinchDist.current = null;
          if (e.touches.length === 0) {
              isDraggingRef.current = false; setIsDragUI(false);
              if (dragDistRef.current < 5 && e.changedTouches.length > 0) {
                  const handled = processCanvasClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                  if (!handled && useMathLab && usePointMode) {
                      addMathPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                  }
              }
          } else if (e.touches.length === 1) {
              lastMouseRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
              isDraggingRef.current = true;
          }
      };

      const handleZoom = (direction) => {
          setCamera(prev => {
              const currentStep = getOptimalGridStep(prev.z);
              const getNextStep = (step, dir) => {
                  const exp = Math.floor(Math.log10(step));
                  const frac = Math.round(step / Math.pow(10, exp));
                  if (dir === 'in') { 
                      if (frac === 5) return 2 * Math.pow(10, exp);
                      if (frac === 2) return 1 * Math.pow(10, exp);
                      if (frac === 1) return 5 * Math.pow(10, exp - 1);
                  } else { 
                      if (frac === 1) return 2 * Math.pow(10, exp);
                      if (frac === 2) return 5 * Math.pow(10, exp);
                      if (frac === 5) return 10 * Math.pow(10, exp);
                  }
                  return step;
              };
              const nextStep = getNextStep(currentStep, direction);
              let newZ = 100 / nextStep;
              
              if (newZ > 500000) newZ = 500000;
              if (newZ < 1e-6) newZ = 1e-6;
              const actualRatio = newZ / prev.z;
              return { x: prev.x * actualRatio, y: prev.y * actualRatio, z: newZ }; 
          });
      };
      
      const goHome = () => {
          if (useMathLab && !keepViewOnMathLab) {
              setCamera({ x: 0, y: 0, z: 100.0 });
          } else {
              setCamera(getOptimalCamera(imageObj));
          }
      };

      const zoomIn = () => handleZoom('in'); const zoomOut = () => handleZoom('out');

      useLayoutEffect(() => {
        if (!imageObj) return;
        const cCanvas = colorCacheRef.current;
        
        let iw = imageObj.width;
        let ih = imageObj.height;
        const MAX_SIZE = 1000;
        if (iw > MAX_SIZE || ih > MAX_SIZE) {
            const scale = Math.min(MAX_SIZE / iw, MAX_SIZE / ih);
            iw = Math.round(iw * scale);
            ih = Math.round(ih * scale);
        }
        
        cCanvas.width = iw; 
        cCanvas.height = ih;
        const cCtx = cCanvas.getContext('2d', { willReadFrequently: true });
        cCtx.drawImage(imageObj, 0, 0, iw, ih);

        const doColorMath = rAdd !== 0 || rMul !== 1 || gAdd !== 0 || gMul !== 1 || bAdd !== 0 || bMul !== 1 || chkGray || binThresh >= 0 || chkInvert || globalAdd !== 0 || globalMul !== 1.0 || useDuotone;

        if (doColorMath) {
          const imgData = cCtx.getImageData(0, 0, iw, ih);
          const data = imgData.data;
          const cDark = hexToRgb(colorDark); const cLight = hexToRgb(colorLight);
          for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] === 0) continue; 
            let r = data[i] * rMul + rAdd, g = data[i+1] * gMul + gAdd, b = data[i+2] * bMul + bAdd;
            r = r * globalMul + globalAdd; g = g * globalMul + globalAdd; b = b * globalMul + globalAdd;
            r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));

            if (chkGray || binThresh >= 0 || useDuotone) {
              let gray = r * 0.299 + g * 0.587 + b * 0.114;
              if (useDuotone) {
                const ratio = gray / 255.0;
                r = cDark.r + (cLight.r - cDark.r) * ratio; g = cDark.g + (cLight.g - cDark.g) * ratio; b = cDark.b + (cLight.b - cDark.b) * ratio;
              } else { if (binThresh >= 0) gray = gray > binThresh ? 255 : 0; r = g = b = gray; }
            }
            if (chkInvert) { r = 255 - r; g = 255 - g; b = 255 - b; }
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          cCtx.putImageData(imgData, 0, 0);
        }
      }, [imageObj, chkGray, chkInvert, globalAdd, globalMul, binThresh, rAdd, rMul, gAdd, gMul, bAdd, bMul, useDuotone, colorDark, colorLight]);

      useLayoutEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        ctx.imageSmoothingEnabled = imageSmoothing;

        const w = canvas.width, h = canvas.height;
        const cx = w / 2, cy = h / 2;
        
        const gridStep = getOptimalGridStep(camera.z);
        const z = camera.z;

        ctx.clearRect(0, 0, w, h);

        const isImageActive = !useMathLab || showImageInMathLab;

        let minXIter = Math.floor(((-cx - camera.x) / z) / gridStep) - 2;
        let maxXIter = Math.ceil(((w - cx - camera.x) / z) / gridStep) + 2;
        if (maxXIter - minXIter > 200) { minXIter = -100; maxXIter = 100; }
        
        let minYIter = Math.floor(((-cy - camera.y) / z) / gridStep) - 2;
        let maxYIter = Math.ceil(((h - cy - camera.y) / z) / gridStep) + 2;
        if (maxYIter - minYIter > 200) { minYIter = -100; maxYIter = 100; }

        let regularMarksX = [];
        for (let i = minXIter; i <= maxXIter; i++) { if (i !== 0) regularMarksX.push(i * gridStep); }
        let regularMarksY = [];
        for (let i = minYIter; i <= maxYIter; i++) { if (i !== 0) regularMarksY.push(-i * gridStep); }

        const drawGridLines = () => {
          if (hideGrid) return;
          
          ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.beginPath();
          regularMarksX.forEach(valX => { 
              let screenX = cx + camera.x + valX * z; 
              if (isFinite(screenX)) { ctx.moveTo(screenX, -h); ctx.lineTo(screenX, h * 2); }
          });
          regularMarksY.forEach(valY => { 
              let screenY = cy + camera.y - valY * z; 
              if (isFinite(screenY)) { ctx.moveTo(-w, screenY); ctx.lineTo(w * 2, screenY); }
          });
          ctx.stroke();

          ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath();
          let sOriginX = cx + camera.x, sOriginY = cy + camera.y;
          if (isFinite(sOriginX)) { ctx.moveTo(sOriginX, -h); ctx.lineTo(sOriginX, h * 2); }
          if (isFinite(sOriginY)) { ctx.moveTo(-w, sOriginY); ctx.lineTo(w * 2, sOriginY); }
          ctx.stroke();
        };

        const drawNumbers = () => {
            if (hideGrid) return;
            let sOriginX = cx + camera.x, sOriginY = cy + camera.y;
            ctx.font = `bold 14px monospace`;
            
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            regularMarksX.forEach(valX => {
                let screenX = cx + camera.x + valX * z;
                if (!isFinite(screenX)) return;
                let textY = Math.max(15, Math.min(h - 25, sOriginY + 15));
                let str = formatNumber(valX);
                ctx.lineWidth = 6; ctx.strokeStyle = '#09090b'; ctx.strokeText(str, screenX, textY);
                ctx.fillStyle = 'white'; ctx.fillText(str, screenX, textY);
            });

            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            regularMarksY.forEach(valY => {
                let screenY = cy + camera.y - valY * z;
                if (!isFinite(screenY)) return;
                let textX = Math.max(15, Math.min(w - 70, sOriginX - 10));
                let str = formatNumber(valY);
                ctx.lineWidth = 6; ctx.strokeStyle = '#09090b'; ctx.strokeText(str, textX, screenY);
                ctx.fillStyle = 'white'; ctx.fillText(str, textX, screenY);
            });
        };

        const drawImageLayer = () => {
            if (!imageObj || !colorCacheRef.current) return;
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y); 
            ctx.scale(z, z); 
            ctx.transform(matrix.a, matrix.b, matrix.c, matrix.d, matrix.e, matrix.f);
            ctx.drawImage(colorCacheRef.current, -imageObj.width / 2, -imageObj.height / 2, imageObj.width, imageObj.height);
            ctx.restore();
        };

        const drawUnitSquare = () => {
            if (!useMathLab || !useUnitSquare) return;
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            
            let pts = [ new DOMPoint(0,0), new DOMPoint(1,0), new DOMPoint(1,-1), new DOMPoint(0,-1) ];
            ctx.beginPath();
            pts.forEach((p, i) => {
                let tPt = p.matrixTransform(matrix);
                if (!isFinite(tPt.x) || !isFinite(tPt.y)) return;
                if (i===0) ctx.moveTo(tPt.x*z, tPt.y*z);
                else ctx.lineTo(tPt.x*z, tPt.y*z);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(234, 179, 8, 0.3)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            let o = new DOMPoint(0,0).matrixTransform(matrix);
            let det = matrix.a * matrix.d - matrix.b * matrix.c;
            if(isFinite(o.x) && isFinite(o.y)) {
                ctx.font = '900 24px sans-serif';
                ctx.fillStyle = '#fde68a';
                ctx.shadowColor = 'black'; ctx.shadowBlur = 6;
                ctx.fillText(`넓이: ${Math.abs(det).toFixed(2)}`, o.x*z + 15, o.y*z + 25);
            }
            ctx.restore();
        };

        const drawPolygon = () => {
            if (!useMathLab || !usePolygonMode || polygonPoints.length === 0) return;
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            
            ctx.beginPath();
            polygonPoints.forEach((p, i) => {
                let pt = new DOMPoint(p.x, -p.y).matrixTransform(matrix);
                if (!isFinite(pt.x) || !isFinite(pt.y)) return;
                if (i===0) ctx.moveTo(pt.x*z, pt.y*z);
                else ctx.lineTo(pt.x*z, pt.y*z);
            });
            if (isPolygonClosed) {
                ctx.closePath();
                ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
                ctx.fill();
            }
            ctx.strokeStyle = '#a855f7';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            polygonPoints.forEach((p, idx) => {
                let pt = new DOMPoint(p.x, -p.y).matrixTransform(matrix);
                if (!isFinite(pt.x) || !isFinite(pt.y)) return;
                ctx.beginPath();
                ctx.arc(pt.x*z, pt.y*z, 6, 0, Math.PI*2);
                ctx.fillStyle = (idx === 0 && !isPolygonClosed) ? '#ef4444' : '#a855f7'; 
                ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            });
            ctx.restore();
        };

        const drawMathFunctions = () => {
            if (!useMathLab || !useGraph || graphs.length === 0) return;
            const constNames = constants.map(c => c.name);
            const currentConstValues = constants.map(c => c.value);

            let viewMinX = -cx - camera.x - w * 2;
            let viewMaxX = w - cx - camera.x + w * 2;
            let viewMinY = -cy - camera.y - h * 2;
            let viewMaxY = h - cy - camera.y + h * 2;

            graphs.forEach((g, idx) => {
                if (!g || !g.eq) return;
                const func = compileMath(g.eq, constNames);
                
                let gMatrix = matrix;
                if (g.matrixMode === 'none') {
                    gMatrix = new DOMMatrix(); 
                } else if (g.matrixMode === 'custom' && g.customMatrix) {
                    gMatrix = new DOMMatrix([g.customMatrix.a, g.customMatrix.b, g.customMatrix.c, g.customMatrix.d, g.customMatrix.e, g.customMatrix.f]);
                }

                ctx.save();
                ctx.translate(cx + camera.x, cy + camera.y);
                ctx.beginPath();
                ctx.strokeStyle = GRAPH_COLORS[idx % GRAPH_COLORS.length]; 
                ctx.lineWidth = 4; 

                let invMat;
                try { invMat = gMatrix.inverse(); } catch(e) { invMat = new DOMMatrix(); }

                let corners = [
                    new DOMPoint(-w, -h), new DOMPoint(w*2, -h),
                    new DOMPoint(-w, h*2), new DOMPoint(w*2, h*2)
                ];
                let minMathX = Infinity, maxMathX = -Infinity;
                corners.forEach(c => {
                    let canvasX = (c.x - cx - camera.x) / z;
                    let canvasY = (c.y - cy - camera.y) / z;
                    let mathPt = new DOMPoint(canvasX, canvasY).matrixTransform(invMat);
                    minMathX = Math.min(minMathX, mathPt.x);
                    maxMathX = Math.max(maxMathX, mathPt.x);
                });

                let steps = Math.min(3000, w * 1.5);
                let mathStep = (maxMathX - minMathX) / steps;
                if (mathStep <= 0 || !isFinite(mathStep)) mathStep = 0.01;

                let startMathX = minMathX;
                let first = true;
                let prevMathY = null;
                let prevMathX = null;

                for (let mathX = startMathX; mathX <= maxMathX; mathX += mathStep) {
                    let mathY = executeMath(func, mathX, currentConstValues); 
                    
                    if (isNaN(mathY) || !isFinite(mathY)) {
                        if (!first && prevMathX !== null && prevMathY !== null) {
                            let bx = prevMathX, step = mathStep, lastValidY = prevMathY;
                            for(let k=0; k<25; k++){ 
                                step /= 2; 
                                let ty = executeMath(func, bx + step, currentConstValues); 
                                if(!isNaN(ty) && isFinite(ty)){ bx += step; lastValidY = ty; } 
                            }
                            
                            let delta = Math.max(1e-12, Math.abs(bx) * 1e-6);
                            let tY1 = executeMath(func, bx - delta, currentConstValues);
                            let tY2 = executeMath(func, bx - delta * 100, currentConstValues);
                            let isPlunging = !isNaN(tY1) && !isNaN(tY2) && tY1 < tY2 && tY1 < -3;
                            let isShooting = !isNaN(tY1) && !isNaN(tY2) && tY1 > tY2 && tY1 > 3;

                            if (isPlunging) {
                                let aPt = new DOMPoint(bx, 1e7).matrixTransform(gMatrix);
                                if (isFinite(aPt.x)) ctx.lineTo(aPt.x * z, viewMaxY);
                            } else if (isShooting) {
                                let aPt = new DOMPoint(bx, -1e7).matrixTransform(gMatrix);
                                if (isFinite(aPt.x)) ctx.lineTo(aPt.x * z, viewMinY);
                            } else {
                                let bPt = new DOMPoint(bx, -lastValidY).matrixTransform(gMatrix);
                                if (isFinite(bPt.x) && isFinite(bPt.y)) ctx.lineTo(Math.max(viewMinX, Math.min(viewMaxX, bPt.x*z)), Math.max(viewMinY, Math.min(viewMaxY, bPt.y*z)));
                            }
                        }
                        first = true; prevMathY = null; prevMathX = null; continue;
                    }

                    if (prevMathY !== null) {
                        let dyScreen = Math.abs(mathY - prevMathY) * z;
                        if (dyScreen > h && mathY * prevMathY < 0) {
                            let midY = executeMath(func, mathX - mathStep/2, currentConstValues);
                            let minY = Math.min(prevMathY, mathY);
                            let maxY = Math.max(prevMathY, mathY);
                            let margin = Math.max(1, Math.abs(maxY - minY) * 0.1);
                            if (isNaN(midY) || midY < minY - margin || midY > maxY + margin) {
                                first = true; 
                            }
                        }
                    }
                    
                    let pt = new DOMPoint(mathX, -mathY);
                    let transformedPt = pt.matrixTransform(gMatrix);
                    let drawX = Math.max(viewMinX, Math.min(viewMaxX, transformedPt.x * z));
                    let drawY = Math.max(viewMinY, Math.min(viewMaxY, transformedPt.y * z));

                    if (first) {
                        let probeY = executeMath(func, mathX - mathStep, currentConstValues);
                        if (isNaN(probeY) || !isFinite(probeY)) {
                            let bx = mathX, step = mathStep, lastValidY = mathY;
                            for(let k=0; k<25; k++){ 
                                step /= 2; 
                                let ty = executeMath(func, bx - step, currentConstValues); 
                                if(!isNaN(ty) && isFinite(ty)){ bx -= step; lastValidY = ty; } 
                            }
                            
                            let delta = Math.max(1e-12, Math.abs(bx) * 1e-6);
                            let tY1 = executeMath(func, bx + delta, currentConstValues);
                            let tY2 = executeMath(func, bx + delta * 100, currentConstValues);
                            let isPlunging = !isNaN(tY1) && !isNaN(tY2) && tY1 < tY2 && tY1 < -3;
                            let isShooting = !isNaN(tY1) && !isNaN(tY2) && tY1 > tY2 && tY1 > 3;

                            if (isPlunging) {
                                let aPt = new DOMPoint(bx, 1e7).matrixTransform(gMatrix);
                                if (isFinite(aPt.x)) ctx.moveTo(aPt.x * z, viewMaxY);
                                let bPt = new DOMPoint(bx, -lastValidY).matrixTransform(gMatrix);
                                if (isFinite(bPt.x) && isFinite(bPt.y)) ctx.lineTo(bPt.x * z, Math.max(viewMinY, Math.min(viewMaxY, bPt.y * z)));
                            } else if (isShooting) {
                                let aPt = new DOMPoint(bx, -1e7).matrixTransform(gMatrix);
                                if (isFinite(aPt.x)) ctx.moveTo(aPt.x * z, viewMinY);
                                let bPt = new DOMPoint(bx, -lastValidY).matrixTransform(gMatrix);
                                if (isFinite(bPt.x) && isFinite(bPt.y)) ctx.lineTo(bPt.x * z, Math.max(viewMinY, Math.min(viewMaxY, bPt.y * z)));
                            } else {
                                let bPt = new DOMPoint(bx, -lastValidY).matrixTransform(gMatrix);
                                if (isFinite(bPt.x) && isFinite(bPt.y)) ctx.moveTo(Math.max(viewMinX, Math.min(viewMaxX, bPt.x*z)), Math.max(viewMinY, Math.min(viewMaxY, bPt.y*z)));
                            }
                            if (isFinite(drawX) && isFinite(drawY)) ctx.lineTo(drawX, drawY);
                        } else {
                            if (isFinite(drawX) && isFinite(drawY)) ctx.moveTo(drawX, drawY);
                        }
                        first = false;
                    } else {
                        if (isFinite(drawX) && isFinite(drawY)) ctx.lineTo(drawX, drawY);
                    }
                    prevMathY = mathY;
                    prevMathX = mathX;
                }
                ctx.stroke();
                ctx.restore();
            });
        };

        const drawMathPoints = () => {
            if (!useMathLab || !usePointMode || points.length === 0) return;
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            points.forEach(p => {
                let pt = new DOMPoint(p.x, -p.y);
                let tPt = pt.matrixTransform(matrix);
                let drawX = tPt.x * z;
                let drawY = tPt.y * z;
                if (!isFinite(drawX) || !isFinite(drawY)) return;
                
                ctx.beginPath();
                ctx.arc(drawX, drawY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#10b981'; 
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(`${p.label}(${p.x}, ${p.y})`, drawX + 12, drawY - 12);
                ctx.shadowBlur = 0;
            });
            ctx.restore();
        };

        const drawCalcPoints = () => {
            if (calcPoints.length === 0) return;
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            calcPoints.forEach(p => {
                let pt = new DOMPoint(p.x, -p.y);
                let tPt = pt.matrixTransform(matrix);
                let drawX = tPt.x * z;
                let drawY = tPt.y * z;
                if (!isFinite(drawX) || !isFinite(drawY)) return;
                
                ctx.beginPath();
                ctx.arc(drawX, drawY, 12, 0, 2 * Math.PI);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', drawX, drawY);
                
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'left';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(`(${p.x}, ${p.y})`, drawX + 18, drawY - 18);
                ctx.shadowBlur = 0;
            });
            ctx.restore();
        };

        if (!imageUnderGrid) {
            drawGridLines();
            drawNumbers();
        }
        
        if (useMathLab && mathUnderImage) { drawUnitSquare(); drawPolygon(); drawMathFunctions(); drawMathPoints(); }

        if (isImageActive) drawImageLayer();

        if (useMathLab && !mathUnderImage) { drawUnitSquare(); drawPolygon(); drawMathFunctions(); drawMathPoints(); }

        if (imageUnderGrid) {
            drawGridLines();
            drawNumbers();
        }

        drawCalcPoints();

        if (useRefl) {
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y); ctx.translate(translateX * z, translateY * z); ctx.rotate(-(reflAngle * Math.PI) / 180); 
            ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 3; ctx.beginPath(); 
            if (isFinite(-w*5)) ctx.moveTo(-w * 5, 0); 
            if (isFinite(w*5)) ctx.lineTo(w * 5, 0); 
            ctx.stroke(); ctx.restore();
        }

      }, [camera, matrix, imageObj, imageUnderGrid, hideGrid, useRefl, reflAngle, translateX, translateY, useMathLab, useGraph, usePointMode, points, graphs, imageSmoothing, constants, mathUnderImage, showImageInMathLab, calcPoints, useUnitSquare, usePolygonMode, polygonPoints, isPolygonClosed]); 

      return (
        <div className="flex w-full h-screen overflow-hidden animate-fade-in bg-zinc-950 relative">
          
          {mathPadOpen && (
            <div className="fixed inset-0 z-[110] flex items-end md:items-center justify-center bg-black/70 backdrop-blur-sm p-4 pb-10">
              <div className="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 w-full max-w-[28rem] shadow-2xl animate-fade-in flex flex-col">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4">
                  <h3 className="text-white font-bold text-lg">수식 입력 (y = f(x))</h3>
                  <button onClick={() => setMathPadOpen(false)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                
                <div className="bg-zinc-950 border border-zinc-700 rounded-xl p-3 flex flex-col mb-4 shadow-inner">
                    <div className="flex items-center text-purple-400 font-mono text-xl w-full border-b border-zinc-800 pb-2 mb-2 relative">
                        <span className="mr-2">y =</span>
                        <input 
                            ref={inputRef} type="text" value={tempGraphEq} 
                            onChange={(e) => setTempGraphEq(e.target.value)} 
                            onKeyDown={(e) => { if (e.key === 'Enter') applyMathPad(); }}
                            className="flex-1 bg-transparent outline-none text-white tracking-wider font-mono min-w-0"
                            autoFocus autoComplete="off" spellCheck="false"
                            inputMode="none"
                        />
                    </div>
                    <div className="flex justify-start text-purple-300 font-serif text-2xl tracking-wide min-h-[36px] items-center pl-8 opacity-80"
                         dangerouslySetInnerHTML={{ __html: tempGraphEq ? tempGraphEq.replace(/log_([0-9a-zA-Z]+)/g, 'log<sub>$1</sub>').replace(/\^([0-9a-zA-Z]+|\([^)]+\))/g, '<sup>$1</sup>').replace(/\(([^)]+)\)\/\(([^)]+)\)/g, '<span class="inline-flex flex-col items-center align-middle mx-1 text-[0.65em]"><span class="border-b border-purple-400/50 px-1 pb-0.5">$1</span><span class="pt-0.5">$2</span></span>').replace(/\*/g, '·') : "<span class='text-zinc-600 text-sm'>수식 미리보기</span>" }}>
                    </div>
                </div>
                
                <div className="flex gap-2 mb-4 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
                    <button onClick={() => setPadTab('math')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${padTab === 'math' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}>기본 수식</button>
                    <button onClick={() => setPadTab('const')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${padTab === 'const' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}>상수 추가 (a~z)</button>
                </div>

                {padTab === 'math' && (
                    <div className="flex gap-4">
                        <div className="grid grid-cols-3 gap-2 flex-1">
                            <button onClick={()=>handleMathPadKey('sin(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-xs">sin</button>
                            <button onClick={()=>handleMathPadKey('cos(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-xs">cos</button>
                            <button onClick={()=>handleMathPadKey('tan(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-xs">tan</button>
                            <button onClick={()=>handleMathPadKey('log_')} className="bg-zinc-800 text-amber-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-[11px]">log_n</button>
                            <button onClick={()=>handleMathPadKey('log(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-[11px]">log₁₀</button>
                            <button onClick={()=>handleMathPadKey('ln(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-[11px]">ln</button>
                            
                            <button onClick={()=>handleMathPadKey('sqrt(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-base">√</button>
                            <button onClick={()=>handleMathPadKey('^2')} className="bg-zinc-800 text-sky-300 py-3 rounded-lg font-black hover:bg-zinc-700 text-sm">x²</button>
                            <button onClick={()=>handleMathPadKey('^')} className="bg-zinc-800 text-sky-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-sm">xⁿ</button>
                            
                            <button onClick={()=>handleMathPadKey('abs(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-base">|x|</button>
                            <button onClick={()=>handleMathPadKey('(')} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-base">(</button>
                            <button onClick={()=>handleMathPadKey(')')} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-base">)</button>
                            
                            <button onClick={()=>handleMathPadKey('x')} className="col-span-2 bg-purple-600/30 text-purple-400 border border-purple-500/30 py-3 rounded-lg font-bold text-xl hover:bg-purple-600/50">x</button>
                            <button onClick={()=>handleMathPadKey(')/(')} className="bg-zinc-700 text-emerald-400 py-3 rounded-lg font-bold hover:bg-zinc-600 text-[10px]">a/b</button>
                        </div>
                        <div className="grid grid-cols-4 gap-2 flex-[1.3]">
                            <button onClick={()=>handleMathPadKey('7')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">7</button>
                            <button onClick={()=>handleMathPadKey('8')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">8</button>
                            <button onClick={()=>handleMathPadKey('9')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">9</button>
                            <button onClick={handleMathPadDelete} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-sm">⌫</button>
                            <button onClick={()=>handleMathPadKey('4')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">4</button>
                            <button onClick={()=>handleMathPadKey('5')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">5</button>
                            <button onClick={()=>handleMathPadKey('6')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">6</button>
                            <button onClick={()=>handleMathPadKey('/')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">÷</button>
                            <button onClick={()=>handleMathPadKey('1')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">1</button>
                            <button onClick={()=>handleMathPadKey('2')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">2</button>
                            <button onClick={()=>handleMathPadKey('3')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">3</button>
                            <button onClick={()=>handleMathPadKey('*')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">×</button>
                            <button onClick={handleMathPadClear} className="bg-rose-600/30 text-rose-400 border border-rose-500/30 py-3 rounded-lg font-bold hover:bg-rose-600/50 text-xs">AC</button>
                            <button onClick={()=>handleMathPadKey('0')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">0</button>
                            <button onClick={()=>handleMathPadKey('.')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">.</button>
                            <button onClick={()=>handleMathPadKey('-')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-2xl hover:bg-sky-600/50">-</button>
                            <button onClick={()=>handleMathPadKey('pi')} className="bg-zinc-700 text-emerald-400 py-3 rounded-lg font-black hover:bg-zinc-600 text-sm">π</button>
                            <button onClick={()=>handleMathPadKey('+')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">+</button>
                            <button onClick={applyMathPad} className="col-span-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-lg transition shadow-[0_0_10px_rgba(168,85,247,0.4)]">=</button>
                        </div>
                    </div>
                )}
                
                {padTab === 'const' && (
                    <div className="grid grid-cols-5 gap-3">
                        {['a','b','c','d','f','g','h','k','m','n','p','q','r','s','t','u','w','y','z'].map(letter => (
                            <button key={letter} onClick={() => handleConstClick(letter)} className="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 py-4 rounded-lg font-bold text-xl hover:bg-indigo-600/40 transition">
                                {letter}
                            </button>
                        ))}
                    </div>
                )}
              </div>
            </div>
          )}

          {logicInfoData && (
            <div className="fixed inset-0 z-[120] flex items-start md:items-center justify-center pt-24 md:pt-0 bg-black/70 backdrop-blur-sm px-4" onClick={() => setLogicInfoData(null)}>
              <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-5 md:p-6 w-full max-w-md shadow-2xl animate-fade-in flex flex-col gap-4" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-white font-bold text-lg md:text-xl flex items-center gap-2">
                    <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg>
                    {logicInfoData.title}
                  </h3>
                  <button onClick={() => setLogicInfoData(null)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                <p className="text-zinc-300 text-sm leading-relaxed">{logicInfoData.desc}</p>
                
                {logicInfoData.matrix && (
                  <div className="bg-black border border-zinc-800 rounded-lg p-5 flex justify-center items-center relative my-2 shadow-inner h-[130px]">
                    <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[14px] h-full text-zinc-500 fill-current shrink-0">

                              <div className="flex items-center gap-2 pl-9 font-sans">

                                  <span className="text-slate-400">(</span><span className="text-sky-300">{fmt(matrix.d)}</span> <span className="font-sans">×</span> <span className="text-amber-300">{selectedCalcPoint.y}</span><span className="text-slate-400">)</span> <span className="font-sans">+</span> 
                                  <span className="text-sky-300">{fmt(matrix.f)}</span>
                              </div>
                              <div className="flex items-center gap-2 pl-9 font-sans flex-wrap">

                              </div>
                              <div className="flex items-center gap-2 pl-9 font-sans">

                                        <CustomNumberInput value={g.customMatrix.f} onChange={v => updateGraphCustomMatrix(g.id, 'f', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />

                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">

                  변수 <code className="text-sky-400 bg-zinc-800 px-1 rounded mx-0.5">v</code>는 슬라이더의 라디안 값입니다.<br/>

                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m11</span><input type="text" value={tempLogic.m11} onChange={e => setTempLogic({...tempLogic, m11: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>

                    <label className="flex items-center gap-3 cursor-pointer group bg-zinc-900/50 p-3 rounded-lg border border-zinc-700/50 hover:bg-zinc-800 transition">
                        <div className="relative">

                    <ConfigRow title="Y축 확대 (Scale Y)" prefix="scaleY" config={config} setConfig={setConfig} colorClass="sky" />

                    <ConfigRow title="X축 전단 (Shear X)" prefix="shearX" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="Y축 전단 (Shear Y)" prefix="shearY" config={config} setConfig={setConfig} colorClass="sky" />

                      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>

                            <MatrixInput value={m12Str} onChange={v => handleMatrixUpdate('f', v)} matrixFormatExact={matrixFormatExact} isTranslate={true} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m12Str, "0", "0")}`} />

                            <span className="text-zinc-400 font-serif text-[80px] leading-[0]" style={{ transform: 'scale(0.6, 2.5)' }}>)</span>
