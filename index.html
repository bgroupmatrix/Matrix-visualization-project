<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vision Matrix Pro - Web Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-40px) rotate(180deg); } }
    @keyframes float-med { 0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); } 50% { transform: translateY(30px) rotate(-120deg) scale(1.1); } }
    @keyframes float-fast { 0%, 100% { transform: translateX(0px) rotate(0deg); } 50% { transform: translateX(-30px) rotate(90deg); } }
    .geom-shape { position: absolute; opacity: 0.15; border: 3px solid white; }
    .shape-1 { animation: float-slow 12s infinite ease-in-out; }
    .shape-2 { animation: float-med 15s infinite ease-in-out; }
    .shape-3 { animation: float-fast 10s infinite ease-in-out; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type="number"], input[type="text"] { -moz-appearance: textfield; appearance: textfield; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans overflow-hidden touch-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function getOptimalGridStep(z) {
        const targetStep = 100 / z;
        const exponent = Math.floor(Math.log10(targetStep));
        const fraction = targetStep / Math.pow(10, exponent);
        let niceFraction;
        if (fraction < 1.5) niceFraction = 1;
        else if (fraction < 3.5) niceFraction = 2;
        else if (fraction < 7.5) niceFraction = 5;
        else niceFraction = 10;
        return parseFloat((niceFraction * Math.pow(10, exponent)).toPrecision(14));
    }

    function formatNumber(num) {
        if (num === 0) return "0";
        const abs = Math.abs(num);
        if (abs >= 1e7 || abs <= 1e-4) return num.toExponential(2).replace('+', '');
        return parseFloat(num.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 4 });
    }

    function hexToRgb(hex) {
        const bigint = parseInt(hex.slice(1), 16);
        return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function compileMath(expr) {
        try {
            let safeExpr = expr.replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos')
                               .replace(/tan/g, 'Math.tan').replace(/abs/g, 'Math.abs')
                               .replace(/sqrt/g, 'Math.sqrt').replace(/pi/gi, 'Math.PI');
            return new Function('v', `return ${safeExpr};`);
        } catch(e) { return () => 0; }
    }

    const executeMath = (func, v) => {
        try { const res = func(v); return isNaN(res) ? 0 : res; } 
        catch { return 0; }
    }

    function CustomNumberInput({ value, onChange, className }) {
        const [localVal, setLocalVal] = useState(String(value));
        useEffect(() => { setLocalVal(String(value)); }, [value]);
        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            setLocalVal(String(parsed));
            onChange(parsed);
        };
        const handleChange = (e) => {
            let val = e.target.value;
            if (val === '-' || val === '') { setLocalVal(val); return; }
            if (val.length > 1 && val.startsWith('0') && !val.startsWith('0.')) val = val.replace(/^0+/, '') || '0';
            if (val.length > 2 && val.startsWith('-0') && !val.startsWith('-0.')) { val = '-' + val.replace(/^-0+/, ''); if(val === '-') val = '-0'; }
            if (/^-?\d*\.?\d*$/.test(val)) {
                setLocalVal(val);
                const parsed = parseFloat(val);
                if (!isNaN(parsed)) onChange(parsed);
            }
        };
        return <input type="text" value={localVal} onChange={handleChange} onBlur={handleBlur} className={className} />;
    }

    const ControlRow = ({ label, min, max, step, value, onChange, colorClass = "sky", syncKey = null, isSynced = false, onToggleSync = null, onOpenLogic = null }) => (
      <div className="flex flex-col gap-1">
        <div className="flex justify-between items-center">
          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
            {label}
            {syncKey && ( <button onClick={onToggleSync} title="동시 조작 링크 (체인 묶기)" className={`text-xs px-1.5 py-0.5 rounded font-black transition-colors ${isSynced ? 'bg-sky-500 text-white' : 'bg-zinc-800 text-zinc-500 hover:text-zinc-300 border border-zinc-700'}`}>🔗</button> )}
            {onOpenLogic && ( <button onClick={onOpenLogic} title="수학 로직 변경 (코랩 모드)" className={`text-xs px-1.5 py-0.5 rounded font-black transition-colors bg-zinc-800 text-zinc-500 hover:text-white border border-zinc-700`}>⚙️</button> )}
          </span>
          <CustomNumberInput value={value} onChange={onChange} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1 rounded w-20 text-right outline-none focus:border-${colorClass}-500 transition-colors`} />
        </div>
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} className={`accent-${colorClass}-400 cursor-pointer h-1.5 bg-zinc-700 rounded-lg appearance-none`} />
      </div>
    );

    const ConfigRow = ({ title, prefix, config, setConfig, colorClass }) => {
        const handleConfigChange = (type, val) => {
            setConfig(prev => {
                let next = { ...prev, [`${prefix}${type}`]: val };
                if (type === 'Min' && next[`${prefix}Min`] > next[`${prefix}Max`]) next[`${prefix}Max`] = next[`${prefix}Min`];
                if (type === 'Max' && next[`${prefix}Max`] < next[`${prefix}Min`]) next[`${prefix}Min`] = next[`${prefix}Max`];
                return next;
            });
        };
        return (
            <div className="flex flex-col gap-2 border-b border-zinc-700 pb-3">
                <span className="text-zinc-300 text-xs font-bold">{title}</span>
                <div className="flex gap-2">
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최소 (Min)<CustomNumberInput value={config[`${prefix}Min`]} onChange={v => handleConfigChange('Min', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최대 (Max)<CustomNumberInput value={config[`${prefix}Max`]} onChange={v => handleConfigChange('Max', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">간격 (Step)<CustomNumberInput value={config[`${prefix}Step`]} onChange={v => handleConfigChange('Step', Math.max(0.0001, Math.abs(v)))} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                </div>
            </div>
        );
    };

    function StartScreen({ onStart }) {
      return (
        <div className="relative w-full h-screen bg-gradient-to-br from-zinc-800 via-zinc-900 to-black overflow-hidden flex flex-col items-center justify-center">
          <div className="geom-shape shape-1 rounded-full w-48 h-48 -top-10 left-10"></div><div className="geom-shape shape-2 w-32 h-32 top-1/4 right-20"></div>
          <div className="geom-shape shape-3 rounded-full w-24 h-24 bottom-20 left-1/4"></div><div className="geom-shape shape-1 w-64 h-64 border-t-0 border-r-0 rounded-bl-full -bottom-10 -right-10"></div>
          <div className="relative z-10 flex flex-col items-center justify-center transform transition-all duration-700 hover:scale-105" style={{ transform: 'perspective(1000px) rotateX(10deg) rotateY(-10deg) rotateZ(2deg)' }}>
            <div className="flex items-center text-white">
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">(</span>
              <div className="grid grid-cols-3 gap-x-6 md:gap-x-12 gap-y-2 text-5xl md:text-8xl font-black mx-2 md:mx-4 bg-clip-text text-transparent bg-gradient-to-b from-white via-zinc-300 to-zinc-600">
                <span style={{ transform: 'translateY(15px)' }}>m</span><span style={{ transform: 'translateY(0px)' }}>a</span><span style={{ transform: 'translateY(15px)' }}>t</span>
                <span style={{ transform: 'translateY(-15px)' }}>r</span><span style={{ transform: 'translateY(0px)' }}>i</span><span style={{ transform: 'translateY(-15px)' }}>x</span>
              </div>
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">)</span>
            </div>
          </div>
          <p className="relative z-10 mt-6 text-zinc-400 font-medium tracking-widest text-sm md:text-lg text-center px-4">Interactive Vision Transformation Engine</p>
          <button onClick={onStart} className="relative z-10 mt-12 md:mt-16 px-10 py-3 md:px-14 md:py-4 bg-gradient-to-r from-white to-zinc-300 text-black text-xl md:text-2xl font-black rounded-full hover:from-zinc-300 hover:to-zinc-500 shadow-lg transition-all duration-300 transform hover:-translate-y-1">시작하기</button>
        </div>
      );
    }

    function SimulatorScreen() {
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      const [panelWidth, setPanelWidth] = useState(450);
      const isResizingPanel = useRef(false);

      const [isPanelExpanded, setIsPanelExpanded] = useState(false); 
      const [isPhotoMenuOpen, setIsPhotoMenuOpen] = useState(false); 

      const [isManualMode, setIsManualMode] = useState(false);
      const [manualMatrix, setManualMatrix] = useState({ a: '1.00', b: '0.00', c: '0.00', d: '1.00', e: '0', f: '0' });

      const [useGraph, setUseGraph] = useState(false);
      const [graphEq, setGraphEq] = useState('sin(x/50)*100');

      const [logicModalOpen, setLogicModalOpen] = useState(false);
      const [customLogic, setCustomLogic] = useState({ m00: 'cos(v)', m01: '-sin(v)', m10: 'sin(v)', m11: 'cos(v)' });
      const [tempLogic, setTempLogic] = useState(customLogic);
      
      const compiledLogic = useRef({ m00: compileMath('cos(v)'), m01: compileMath('-sin(v)'), m10: compileMath('sin(v)'), m11: compileMath('cos(v)') });

      const openLogicModal = () => { setTempLogic(customLogic); setLogicModalOpen(true); };
      const saveLogicModal = () => {
          setCustomLogic(tempLogic);
          compiledLogic.current = { m00: compileMath(tempLogic.m00), m01: compileMath(tempLogic.m01), m10: compileMath(tempLogic.m10), m11: compileMath(tempLogic.m11) };
          setLogicModalOpen(false);
      };

      const [camera, setCamera] = useState({ x: 0, y: 0, z: 1.0 });
      const isDraggingRef = useRef(false);
      const lastMouseRef = useRef({ x: 0, y: 0 });
      const [isDragUI, setIsDragUI] = useState(false);

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [settingsTab, setSettingsTab] = useState('display'); 
      const [imageUnderGrid, setImageUnderGrid] = useState(false);
      const [hideGrid, setHideGrid] = useState(false);
      const [autoResetOnLoad, setAutoResetOnLoad] = useState(false);
      
      const [config, setConfig] = useState({
        scaleXMin: 0.1, scaleXMax: 5.0, scaleXStep: 0.1, scaleYMin: 0.1, scaleYMax: 5.0, scaleYStep: 0.1,
        squeezeMin: 0.1, squeezeMax: 3.0, squeezeStep: 0.1, transXMin: -500, transXMax: 500, transXStep: 1, transYMin: -500, transYMax: 500, transYStep: 1,
        rotMin: -180, rotMax: 180, rotStep: 1, shearXMin: -3.0, shearXMax: 3.0, shearXStep: 0.1, shearYMin: -3.0, shearYMax: 3.0, shearYStep: 0.1, contMin: 0, contMax: 5.0, contStep: 0.1
      });

      const [activeTab, setActiveTab] = useState('geo');

      const [scaleX, setScaleX] = useState(1.0); const [scaleY, setScaleY] = useState(1.0);
      const [translateX, setTranslateX] = useState(0); const [translateY, setTranslateY] = useState(0);
      const [rotation, setRotation] = useState(0); const [shearX, setShearX] = useState(0); const [shearY, setShearY] = useState(0);
      const [squeeze, setSqueeze] = useState(1.0); const [useRefl, setUseRefl] = useState(false); const [reflAngle, setReflAngle] = useState(90);

      const [chkGray, setChkGray] = useState(false); const [chkInvert, setChkInvert] = useState(false);
      const [globalAdd, setGlobalAdd] = useState(0); const [globalMul, setGlobalMul] = useState(1.0); const [binThresh, setBinThresh] = useState(-1);
      
      const [rAdd, setRAdd] = useState(0); const [rMul, setRMul] = useState(1.0);
      const [gAdd, setGAdd] = useState(0); const [gMul, setGMul] = useState(1.0);
      const [bAdd, setBAdd] = useState(0); const [bMul, setBMul] = useState(1.0);

      const [useDuotone, setUseDuotone] = useState(false);
      const [colorDarkUI, setColorDarkUI] = useState('#0a0a2a'); const [colorDark, setColorDark] = useState('#0a0a2a');
      const [colorLightUI, setColorLightUI] = useState('#ffea00'); const [colorLight, setColorLight] = useState('#ffea00');

      useEffect(() => { const t = setTimeout(() => setColorDark(colorDarkUI), 150); return () => clearTimeout(t); }, [colorDarkUI]);
      useEffect(() => { const t = setTimeout(() => setColorLight(colorLightUI), 150); return () => clearTimeout(t); }, [colorLightUI]);

      const [imageObj, setImageObj] = useState(null);
      const canvasRef = useRef(null);
      const colorCacheRef = useRef(null);
      if (!colorCacheRef.current && typeof document !== 'undefined') { colorCacheRef.current = document.createElement('canvas'); }

      // 🚀 함수 모드 켜졌을 때 자동 원점 줌인
      useEffect(() => {
          if (useGraph) {
              setCamera({ x: 0, y: 0, z: 2.0 });
          }
      }, [useGraph]);

      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      useEffect(() => {
        const handleMouseMoveGlobal = (e) => {
          if (!isResizingPanel.current) return;
          let newWidth = e.clientX;
          if (newWidth < 300) newWidth = 300;
          if (newWidth > window.innerWidth * 0.7) newWidth = Math.floor(window.innerWidth * 0.7);
          setPanelWidth(newWidth);
        };
        const handleMouseUpGlobal = () => { if (isResizingPanel.current) { isResizingPanel.current = false; document.body.style.cursor = 'default'; } };
        window.addEventListener('mousemove', handleMouseMoveGlobal); window.addEventListener('mouseup', handleMouseUpGlobal);
        return () => { window.removeEventListener('mousemove', handleMouseMoveGlobal); window.removeEventListener('mouseup', handleMouseUpGlobal); };
      }, []);

      const startResizingPanel = (e) => { isResizingPanel.current = true; document.body.style.cursor = 'col-resize'; e.preventDefault(); };

      const [syncKeys, setSyncKeys] = useState(new Set());
      const toggleSync = (key) => { setSyncKeys(prev => { const next = new Set(prev); if (next.has(key)) next.delete(key); else next.add(key); return next; }); };

      const prevVals = useRef({});
      useEffect(() => { prevVals.current = { scaleX, scaleY, translateX, translateY, rotation, shearX, shearY, squeeze, globalAdd, globalMul, rAdd, rMul, gAdd, gMul, bAdd, bMul }; });

      const stateSetters = { scaleX: setScaleX, scaleY: setScaleY, translateX: setTranslateX, translateY: setTranslateY, rotation: setRotation, shearX: setShearX, shearY: setShearY, squeeze: setSqueeze, globalAdd: setGlobalAdd, globalMul: setGlobalMul, rAdd: setRAdd, rMul: setRMul, gAdd: setGAdd, gMul: setGMul, bAdd: setBAdd, bMul: setBMul };
      
      const handleSyncChange = (key, newVal) => {
          const oldVal = prevVals.current[key];
          const delta = newVal - oldVal;
          stateSetters[key](newVal);
          if (syncKeys.has(key)) {
              syncKeys.forEach(k => {
                  if (k === key) return;
                  let targetNewVal = prevVals.current[k] + delta;
                  const bounds = {
                      scaleX: {min: config.scaleXMin, max: config.scaleXMax}, scaleY: {min: config.scaleYMin, max: config.scaleYMax},
                      translateX: {min: config.transXMin, max: config.transXMax}, translateY: {min: config.transYMin, max: config.transYMax},
                      rotation: {min: config.rotMin, max: config.rotMax}, shearX: {min: config.shearXMin, max: config.shearXMax}, shearY: {min: config.shearYMin, max: config.shearYMax},
                      squeeze: {min: config.squeezeMin, max: config.squeezeMax}, globalAdd: {min: -255, max: 255}, globalMul: {min: config.contMin, max: config.contMax},
                      rAdd: {min: -255, max: 255}, rMul: {min: config.contMin, max: config.contMax}, gAdd: {min: -255, max: 255}, gMul: {min: config.contMin, max: config.contMax}, bAdd: {min: -255, max: 255}, bMul: {min: config.contMin, max: config.contMax}
                  }[k];
                  if (targetNewVal < bounds.min) targetNewVal = bounds.min;
                  if (targetNewVal > bounds.max) targetNewVal = bounds.max;
                  stateSetters[k](targetNewVal);
              });
          }
      };

      const getOptimalCamera = (img) => {
        if (!img) return { x: 0, y: 0, z: 1.0 };
        let targetZ = Math.min((2000 * 0.8) / img.width, (1200 * 0.8) / img.height); 
        if (targetZ > 1.0) targetZ = 1.0; 
        return { x: 0, y: 0, z: targetZ };
      };

      const resetAll = (img = imageObj) => {
        setCamera(getOptimalCamera(img));
        setScaleX(1.0); setScaleY(1.0); setTranslateX(0); setTranslateY(0); 
        setRotation(0); setShearX(0); setShearY(0); setSqueeze(1.0); setUseRefl(false); setReflAngle(90);
        setChkGray(false); setChkInvert(false); setGlobalAdd(0); setGlobalMul(1.0); setBinThresh(-1);
        setRAdd(0); setRMul(1.0); setGAdd(0); setGMul(1.0); setBAdd(0); setBMul(1.0);
        setUseDuotone(false); setIsManualMode(false); setUseGraph(false);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          setImageObj(img);
          if (autoResetOnLoad) resetAll(img); else setCamera(getOptimalCamera(img));
        };
        img.src = url;
      };

      const calculateDelta = (clientX, clientY) => {
          const canvas = canvasRef.current;
          if (!canvas) return { dx: 0, dy: 0 };
          const rect = canvas.getBoundingClientRect();
          const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
          const dx = (clientX - lastMouseRef.current.x) / scale;
          const dy = (clientY - lastMouseRef.current.y) / scale;
          return { dx, dy };
      };

      const handleMouseDown = (e) => { isDraggingRef.current = true; setIsDragUI(true); lastMouseRef.current = { x: e.clientX, y: e.clientY }; };
      const handleMouseMove = (e) => {
        if (!isDraggingRef.current) return;
        const { dx, dy } = calculateDelta(e.clientX, e.clientY);
        setCamera(prev => ({ ...prev, x: prev.x + dx, y: prev.y + dy }));
        lastMouseRef.current = { x: e.clientX, y: e.clientY };
      };
      const handleMouseUpOrLeave = () => { isDraggingRef.current = false; setIsDragUI(false); };

      const handleTouchStart = (e) => {
        isDraggingRef.current = true; setIsDragUI(true); 
        const touch = e.touches[0]; lastMouseRef.current = { x: touch.clientX, y: touch.clientY }; 
      };
      const handleTouchMove = (e) => {
        if (!isDraggingRef.current) return;
        const touch = e.touches[0];
        const { dx, dy } = calculateDelta(touch.clientX, touch.clientY);
        setCamera(prev => ({ ...prev, x: prev.x + dx, y: prev.y + dy }));
        lastMouseRef.current = { x: touch.clientX, y: touch.clientY };
      };
      const handleTouchEnd = () => { isDraggingRef.current = false; setIsDragUI(false); };

      const handleZoom = (direction) => {
          setCamera(prev => {
              const ratio = direction === 'in' ? 1.25 : 0.8;
              const newZ = prev.z * ratio;
              if (newZ > 1e12 || newZ < 1e-12) return prev; 
              return { x: prev.x * ratio, y: prev.y * ratio, z: newZ };
          });
      };
      const zoomIn = () => handleZoom('in'); const zoomOut = () => handleZoom('out'); const goHome = () => setCamera(getOptimalCamera(imageObj));

      let matrix = new DOMMatrix();
      let m00 = "1.00", m01 = "0.00", m02 = "0", m10 = "0.00", m11 = "1.00", m12 = "0";

      if (isManualMode) {
          matrix = new DOMMatrix([
              parseFloat(manualMatrix.a) || 0, parseFloat(manualMatrix.b) || 0,
              parseFloat(manualMatrix.c) || 0, parseFloat(manualMatrix.d) || 0,
              parseFloat(manualMatrix.e) || 0, parseFloat(manualMatrix.f) || 0
          ]);
      } else {
          matrix = matrix.translate(translateX, translateY);
          if (useRefl) {
              const theta = (reflAngle * Math.PI) / 180;
              matrix = matrix.multiply(new DOMMatrix([Math.cos(2*theta), Math.sin(2*theta), Math.sin(2*theta), -Math.cos(2*theta), 0, 0]));
          } else { 
              let v = rotation * Math.PI / 180;
              let rM = new DOMMatrix([
                  executeMath(compiledLogic.current.m00, v), executeMath(compiledLogic.current.m10, v),
                  executeMath(compiledLogic.current.m01, v), executeMath(compiledLogic.current.m11, v),
                  0, 0
              ]);
              matrix = matrix.multiply(rM);
          }
          matrix = matrix.scale(scaleX * squeeze, scaleY * (1 / squeeze));
          matrix = matrix.multiply(new DOMMatrix([1, shearY, shearX, 1, 0, 0]));
      }

      if (!isManualMode) {
          m00 = matrix.a.toFixed(2); m10 = matrix.b.toFixed(2);
          m01 = matrix.c.toFixed(2); m11 = matrix.d.toFixed(2);
          m02 = matrix.e.toFixed(0); m12 = matrix.f.toFixed(0);
      }

      const handleManualInput = (key, val) => {
          if (!isManualMode) {
              setIsManualMode(true);
              setManualMatrix({ a: m00, b: m10, c: m01, d: m11, e: m02, f: m12, [key]: val });
          } else { setManualMatrix(prev => ({...prev, [key]: val})); }
      };

      // 🚀 클릭 즉시 수동 모드로 부드럽게 진입시키는 포커스 감지기
      const handleManualFocus = () => {
          if (!isManualMode) {
              setIsManualMode(true);
              setManualMatrix({ a: m00, b: m10, c: m01, d: m11, e: m02, f: m12 });
          }
      };

      const getMatrixColor = (val, defaultVal) => val === defaultVal ? "text-zinc-600" : "text-sky-400 text-shadow-glow";

      useEffect(() => {
        if (!imageObj) return;
        const cCanvas = colorCacheRef.current;
        cCanvas.width = imageObj.width; cCanvas.height = imageObj.height;
        const cCtx = cCanvas.getContext('2d', { willReadFrequently: true });
        cCtx.drawImage(imageObj, 0, 0);

        const doColorMath = rAdd !== 0 || rMul !== 1 || gAdd !== 0 || gMul !== 1 || bAdd !== 0 || bMul !== 1 || chkGray || binThresh >= 0 || chkInvert || globalAdd !== 0 || globalMul !== 1.0 || useDuotone;

        if (doColorMath) {
          const imgData = cCtx.getImageData(0, 0, cCanvas.width, cCanvas.height);
          const data = imgData.data;
          const cDark = hexToRgb(colorDark); const cLight = hexToRgb(colorLight);
          for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] === 0) continue; 
            let r = data[i] * rMul + rAdd, g = data[i+1] * gMul + gAdd, b = data[i+2] * bMul + bAdd;
            r = r * globalMul + globalAdd; g = g * globalMul + globalAdd; b = b * globalMul + globalAdd;
            r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));

            if (chkGray || binThresh >= 0 || useDuotone) {
              let gray = r * 0.299 + g * 0.587 + b * 0.114;
              if (useDuotone) {
                const ratio = gray / 255.0;
                r = cDark.r + (cLight.r - cDark.r) * ratio; g = cDark.g + (cLight.g - cDark.g) * ratio; b = cDark.b + (cLight.b - cDark.b) * ratio;
              } else { if (binThresh >= 0) gray = gray > binThresh ? 255 : 0; r = g = b = gray; }
            }
            if (chkInvert) { r = 255 - r; g = 255 - g; b = 255 - b; }
            data[i] = r; data[i+1] = g; data[i+2] = b;
          }
          cCtx.putImageData(imgData, 0, 0);
        }
      }, [imageObj, chkGray, chkInvert, globalAdd, globalMul, binThresh, rAdd, rMul, gAdd, gMul, bAdd, bMul, useDuotone, colorDark, colorLight]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const w = canvas.width, h = canvas.height;
        const cx = w / 2, cy = h / 2;
        
        const gridStep = getOptimalGridStep(camera.z);
        const z = camera.z;

        ctx.clearRect(0, 0, w, h);

        const drawGridAndAxes = () => {
          if (hideGrid) return;
          const logicalLeft = (-cx - camera.x) / z, logicalRight = (w - cx - camera.x) / z;
          const logicalTop = (-cy - camera.y) / z, logicalBottom = (h - cy - camera.y) / z;
          const minXIter = Math.floor(logicalLeft / gridStep), maxXIter = Math.ceil(logicalRight / gridStep);
          const minYIter = Math.floor(logicalTop / gridStep), maxYIter = Math.ceil(logicalBottom / gridStep);

          ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.beginPath();
          for (let i = minXIter; i <= maxXIter; i++) { let screenX = cx + camera.x + i * gridStep * z; ctx.moveTo(screenX, 0); ctx.lineTo(screenX, h); }
          for (let i = minYIter; i <= maxYIter; i++) { let screenY = cy + camera.y + i * gridStep * z; ctx.moveTo(0, screenY); ctx.lineTo(w, screenY); }
          ctx.stroke();

          ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath();
          let sOriginX = cx + camera.x, sOriginY = cy + camera.y;
          if (sOriginX >= 0 && sOriginX <= w) { ctx.moveTo(sOriginX, 0); ctx.lineTo(sOriginX, h); }
          if (sOriginY >= 0 && sOriginY <= h) { ctx.moveTo(0, sOriginY); ctx.lineTo(w, sOriginY); }
          ctx.stroke();

          ctx.font = `bold 15px monospace`; ctx.fillStyle = 'white'; ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)'; ctx.lineWidth = 3;
          for (let i = minXIter; i <= maxXIter; i++) {
            if (i === 0) continue;
            let textY = Math.max(15, Math.min(h - 10, sOriginY + 15)); let str = formatNumber(i * gridStep);
            ctx.strokeText(str, cx + camera.x + i * gridStep * z + 5, textY); ctx.fillText(str, cx + camera.x + i * gridStep * z + 5, textY); 
          }
          for (let i = minYIter; i <= maxYIter; i++) {
            if (i === 0) continue;
            let textX = Math.max(5, Math.min(w - 70, sOriginX + 5)); let str = formatNumber(-i * gridStep);
            ctx.strokeText(str, textX, cy + camera.y + i * gridStep * z - 5); ctx.fillText(str, textX, cy + camera.y + i * gridStep * z - 5); 
          }
        };

        if (!imageUnderGrid) drawGridAndAxes();

        ctx.save();
        ctx.translate(cx + camera.x, cy + camera.y); 
        ctx.scale(z, z); 
        ctx.transform(matrix.a, matrix.b, matrix.c, matrix.d, matrix.e, matrix.f);
        
        if (imageObj && colorCacheRef.current) {
          ctx.drawImage(colorCacheRef.current, -imageObj.width / 2, -imageObj.height / 2, imageObj.width, imageObj.height);
        } 
        // 🚀 함수 모드가 켜졌을 땐 기본 도형(네모, 원)을 아예 그리지 않음!
        else if (!imageObj && !useGraph) {
          ctx.fillStyle = 'rgb(59, 130, 246)'; ctx.fillRect(-100, -100, 200, 200);
          ctx.fillStyle = 'rgb(239, 68, 68)'; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        if (useGraph) {
            const func = compileMath(graphEq.replace(/x/g, 'v'));
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            ctx.scale(z, z);
            ctx.beginPath();
            ctx.strokeStyle = '#a855f7'; 
            ctx.lineWidth = 4 / z; 
            
            let first = true;
            for (let logicalX = -3000; logicalX <= 3000; logicalX += 5) {
                let logicalY = -executeMath(func, logicalX); 
                let pt = new DOMPoint(logicalX, logicalY);
                let transformedPt = pt.matrixTransform(matrix);
                
                if(first) { ctx.moveTo(transformedPt.x, transformedPt.y); first = false; }
                else { ctx.lineTo(transformedPt.x, transformedPt.y); }
            }
            ctx.stroke();
            ctx.restore();
        }

        if (imageUnderGrid) drawGridAndAxes();

        if (useRefl) {
          ctx.save();
          ctx.translate(cx + camera.x, cy + camera.y); ctx.translate(translateX * z, translateY * z); ctx.rotate(-(reflAngle * Math.PI) / 180); 
          ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-30000, 0); ctx.lineTo(30000, 0); ctx.stroke(); ctx.restore();
        }
      }, [camera, matrix, imageObj, imageUnderGrid, hideGrid, useRefl, reflAngle, translateX, translateY, useGraph, graphEq]); 

      return (
        <div className="flex w-full h-screen overflow-hidden animate-fade-in bg-zinc-950 relative">
          
          {/* ==============================================
              모달 영역 (코랩 로직 변경 & 설정창) 
          ============================================== */}
          {logicModalOpen && (
            <div className="fixed inset-0 z-[100] flex items-start md:items-center justify-center pt-24 md:pt-0 bg-black/70 backdrop-blur-sm px-4">
              <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-5 md:p-6 w-full max-w-sm shadow-2xl animate-fade-in flex flex-col gap-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-white font-bold text-lg md:text-xl">⚙️ 수학 로직 변경</h3>
                  <button onClick={() => setLogicModalOpen(false)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                <p className="text-zinc-400 text-[11px] md:text-xs">
                  회전 변환(Rotation)의 수학 함수식을 직접 수정합니다.<br/>
                  변수 <code className="text-sky-400 bg-zinc-800 px-1 rounded mx-0.5">v</code>는 슬라이더의 라디안 값입니다.<br/>
                  <span className="text-zinc-500">(예: <code className="text-amber-400 bg-zinc-800 px-1 rounded mx-0.5">tan(v)</code>, <code className="text-amber-400 bg-zinc-800 px-1 rounded mx-0.5">-sin(v)*2</code>)</span>
                </p>
                <div className="grid grid-cols-2 gap-3 font-mono text-sm md:text-base">
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m00</span><input type="text" value={tempLogic.m00} onChange={e => setTempLogic({...tempLogic, m00: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m01</span><input type="text" value={tempLogic.m01} onChange={e => setTempLogic({...tempLogic, m01: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m10</span><input type="text" value={tempLogic.m10} onChange={e => setTempLogic({...tempLogic, m10: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m11</span><input type="text" value={tempLogic.m11} onChange={e => setTempLogic({...tempLogic, m11: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                </div>
                <div className="flex gap-3 mt-2">
                  <button onClick={() => setTempLogic({m00:'cos(v)', m01:'-sin(v)', m10:'sin(v)', m11:'cos(v)'})} className="flex-1 py-2 rounded bg-zinc-800 text-zinc-300 font-bold hover:bg-zinc-700 transition text-sm">초기화</button>
                  <button onClick={saveLogicModal} className="flex-1 py-2 rounded bg-sky-600 text-white font-bold hover:bg-sky-500 transition text-sm">적용하기</button>
                </div>
              </div>
            </div>
          )}

          <div className="absolute top-4 right-4 md:top-6 md:right-6 z-[60] flex flex-col items-end">
            <button onClick={() => setIsSettingsOpen(!isSettingsOpen)} className={`p-2 md:p-3 rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 transition shadow-lg text-white font-bold text-lg md:text-xl ${isSettingsOpen ? 'ring-2 ring-sky-500' : ''}`} title="설정">☰</button>
            {isSettingsOpen && (
              <div className="mt-2 md:mt-3 bg-zinc-800 border border-zinc-700 shadow-2xl rounded-xl p-4 flex flex-col w-[85vw] md:w-[28rem] animate-fade-in origin-top-right">
                <div className="flex border-b border-zinc-700 mb-4">
                  <button onClick={() => setSettingsTab('display')} className={`flex-1 pb-2 text-sm font-bold transition ${settingsTab==='display' ? 'text-sky-400 border-b-2 border-sky-400' : 'text-zinc-500 hover:text-zinc-300'}`}>디스플레이</button>
                  <button onClick={() => setSettingsTab('inputs')} className={`flex-1 pb-2 text-sm font-bold transition ${settingsTab==='inputs' ? 'text-sky-400 border-b-2 border-sky-400' : 'text-zinc-500 hover:text-zinc-300'}`}>입력값 조절</button>
                </div>
                {settingsTab === 'display' && (
                  <div className="flex flex-col gap-4">
                    <label className="flex items-center gap-3 cursor-pointer group"><div className="relative"><input type="checkbox" checked={autoResetOnLoad} onChange={(e) => setAutoResetOnLoad(e.target.checked)} className="peer sr-only" /><div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div><div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div></div><span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">새 사진을 불러올 때 리셋 (Auto Reset)</span></label>
                    <label className="flex items-center gap-3 cursor-pointer group"><div className="relative"><input type="checkbox" checked={imageUnderGrid} onChange={(e) => setImageUnderGrid(e.target.checked)} className="peer sr-only" /><div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div><div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div></div><span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">이미지를 좌표계 아래로</span></label>
                    <label className="flex items-center gap-3 cursor-pointer group"><div className="relative"><input type="checkbox" checked={hideGrid} onChange={(e) => setHideGrid(e.target.checked)} className="peer sr-only" /><div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div><div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div></div><span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">좌표계(그리드) 숨기기</span></label>
                  </div>
                )}
                {settingsTab === 'inputs' && (
                  <div className="flex flex-col gap-4 max-h-[50vh] overflow-y-auto pr-2">
                    <ConfigRow title="X축 확대 (Scale X)" prefix="scaleX" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="Y축 확대 (Scale Y)" prefix="scaleY" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="X축 이동 (Translate X)" prefix="transX" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="Y축 이동 (Translate Y)" prefix="transY" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="X축 전단 (Shear X)" prefix="shearX" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="Y축 전단 (Shear Y)" prefix="shearY" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="스퀴즈 (Squeeze)" prefix="squeeze" config={config} setConfig={setConfig} colorClass="purple" />
                    <ConfigRow title="회전 (Rotation °)" prefix="rot" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="명암비 (Contrast 배율)" prefix="cont" config={config} setConfig={setConfig} colorClass="zinc" />
                  </div>
                )}
              </div>
            )}
          </div>

          {/* ==============================================
              좌측(PC) / 하단 서랍(모바일) 패널 
          ============================================== */}
          <div style={isMobile ? { position: 'fixed', bottom: 'env(safe-area-inset-bottom, 16px)', left: 0, width: '100%', height: '55vh', transform: isPanelExpanded ? 'translateY(0)' : 'translateY(100%)', zIndex: 45 } : { width: `${panelWidth}px`, height: '100%', position: 'relative', zIndex: 40 }} 
               className={`bg-zinc-900 flex flex-col shadow-2xl shrink-0 transition-transform duration-300 ease-in-out border-zinc-800 ${isMobile ? 'border-t rounded-t-2xl' : 'border-r'}`}>
            
            {isMobile && (
              <div onClick={() => setIsPanelExpanded(!isPanelExpanded)} className="absolute left-1/2 -top-7 w-28 h-7 flex justify-center items-end pb-1.5 cursor-pointer bg-zinc-800 border-t border-zinc-700/50" style={{ transform: 'translateX(-50%)', clipPath: 'polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%)' }}>
                <div className="w-8 h-1 rounded-full bg-zinc-500"></div>
              </div>
            )}

            <div className="hidden md:block p-5 border-b border-zinc-800 shrink-0">
              <h1 className="text-xl font-black text-white flex items-baseline gap-2 truncate">Vision Matrix</h1>
              <div className="flex gap-2 mt-4">
                <label className="flex-1 bg-zinc-100 hover:bg-white text-black py-2.5 rounded-lg text-base font-bold transition text-center cursor-pointer shadow truncate">📁 사진 열기<input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} /></label>
                <button onClick={() => resetAll(imageObj)} className="px-5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-base font-bold transition shadow shrink-0">🔄 리셋</button>
              </div>
            </div>

            {/* 🚀 PC용 수동 행렬 입력판 (onFocus 기능 추가) */}
            <div className="hidden md:flex p-6 bg-black justify-center items-center border-b border-zinc-800 shrink-0 relative">
              <span className="absolute -left-6 -top-2 text-7xl font-light text-zinc-600 pointer-events-none">(</span>
              <div className="grid grid-cols-3 gap-x-6 gap-y-4 text-center font-mono text-3xl font-bold tracking-tighter w-full max-w-[280px]">
                <input type="text" value={isManualMode ? manualMatrix.a : m00} onFocus={handleManualFocus} onChange={e => handleManualInput('a', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m00, "1.00")}`} />
                <input type="text" value={isManualMode ? manualMatrix.c : m01} onFocus={handleManualFocus} onChange={e => handleManualInput('c', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m01, "0.00")}`} />
                <input type="text" value={isManualMode ? manualMatrix.e : m02} onFocus={handleManualFocus} onChange={e => handleManualInput('e', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m02, "0")}`} />
                <input type="text" value={isManualMode ? manualMatrix.b : m10} onFocus={handleManualFocus} onChange={e => handleManualInput('b', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m10, "0.00")}`} />
                <input type="text" value={isManualMode ? manualMatrix.d : m11} onFocus={handleManualFocus} onChange={e => handleManualInput('d', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m11, "1.00")}`} />
                <input type="text" value={isManualMode ? manualMatrix.f : m12} onFocus={handleManualFocus} onChange={e => handleManualInput('f', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m12, "0")}`} />
                <div className="text-zinc-600 pointer-events-none">0.0</div><div className="text-zinc-600 pointer-events-none">0.0</div><div className="text-zinc-600 pointer-events-none">1.0</div>
              </div>
              <span className="absolute -right-6 -top-2 text-7xl font-light text-zinc-600 pointer-events-none">)</span>
            </div>

            <div className="flex border-b border-zinc-800 shrink-0">
              <button onClick={() => setActiveTab('geo')} className={`flex-1 py-2 md:py-3 text-sm md:text-base font-bold transition truncate ${activeTab === 'geo' ? 'bg-zinc-800 text-white border-b-2 border-sky-400' : 'text-zinc-500 hover:text-zinc-300'}`}>📐 기하학 변환</button>
              <button onClick={() => setActiveTab('color')} className={`flex-1 py-2 md:py-3 text-sm md:text-base font-bold transition truncate ${activeTab === 'color' ? 'bg-zinc-800 text-white border-b-2 border-amber-400' : 'text-zinc-500 hover:text-zinc-300'}`}>🎨 색상 변환</button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 md:p-5">
              {activeTab === 'geo' && (
                <div className="flex flex-col gap-5 md:gap-6">
                  {isManualMode && (
                    <div className="bg-purple-900/20 border border-purple-500/40 rounded-xl p-4 flex flex-col gap-2 shadow-lg animate-fade-in">
                      <span className="text-purple-400 font-bold text-sm">⚠️ 수동 행렬 입력 모드</span>
                      <p className="text-zinc-400 text-xs leading-relaxed">직접 타이핑한 행렬이 우선 적용되며, 기하학 슬라이더 조작은 일시적으로 무시됩니다.</p>
                      <button onClick={() => setIsManualMode(false)} className="mt-1 py-2 bg-purple-600/80 hover:bg-purple-500 text-white text-sm rounded font-bold transition">수동 모드 해제</button>
                    </div>
                  )}

                  <div className={`flex flex-col gap-5 md:gap-6 transition-opacity duration-300 ${isManualMode ? 'opacity-30 pointer-events-none grayscale' : ''}`}>
                    <div className="space-y-4">
                      <ControlRow label="X축 확대 (Scale X)" min={config.scaleXMin} max={config.scaleXMax} step={config.scaleXStep} value={scaleX} onChange={v => handleSyncChange('scaleX', v)} syncKey="scaleX" isSynced={syncKeys.has('scaleX')} onToggleSync={() => toggleSync('scaleX')} />
                      <ControlRow label="Y축 확대 (Scale Y)" min={config.scaleYMin} max={config.scaleYMax} step={config.scaleYStep} value={scaleY} onChange={v => handleSyncChange('scaleY', v)} syncKey="scaleY" isSynced={syncKeys.has('scaleY')} onToggleSync={() => toggleSync('scaleY')} />
                      <ControlRow label="스퀴즈 (Squeeze)" min={config.squeezeMin} max={config.squeezeMax} step={config.squeezeStep} value={squeeze} onChange={v => handleSyncChange('squeeze', v)} colorClass="purple" syncKey="squeeze" isSynced={syncKeys.has('squeeze')} onToggleSync={() => toggleSync('squeeze')} />
                    </div>
                    
                    <hr className="border-zinc-800" />
                    
                    <div className="p-4 bg-purple-900/10 rounded-xl border border-purple-500/20 flex flex-col gap-3">
                      <label className="flex items-center gap-2 cursor-pointer text-purple-400 font-bold text-sm md:text-base">
                        <input type="checkbox" checked={useGraph} onChange={(e) => setUseGraph(e.target.checked)} className="w-4 h-4 accent-purple-500" /> 함수(f(x))를 행렬로 구부리기
                      </label>
                      <div className="flex items-center gap-2">
                        <span className="text-white font-bold italic text-lg">y = </span>
                        <input type="text" value={graphEq} onChange={e => setGraphEq(e.target.value)} className="flex-1 bg-zinc-950 border border-zinc-700 text-purple-400 px-3 py-2 rounded focus:outline-none focus:border-purple-500 font-mono text-sm" placeholder="예: sin(x/50)*100" />
                      </div>
                    </div>

                    <hr className="border-zinc-800" />
                    
                    <div className="space-y-4">
                      <ControlRow label="X축 이동 (Translate X)" min={config.transXMin} max={config.transXMax} step={config.transXStep} value={translateX} onChange={v => handleSyncChange('translateX', v)} syncKey="translateX" isSynced={syncKeys.has('translateX')} onToggleSync={() => toggleSync('translateX')} />
                      <ControlRow label="Y축 이동 (Translate Y)" min={config.transYMin} max={config.transYMax} step={config.transYStep} value={translateY} onChange={v => handleSyncChange('translateY', v)} syncKey="translateY" isSynced={syncKeys.has('translateY')} onToggleSync={() => toggleSync('translateY')} />
                      <ControlRow label="평면 회전 (Rotation °)" min={config.rotMin} max={config.rotMax} step={config.rotStep} value={rotation} onChange={v => handleSyncChange('rotation', v)} syncKey="rotation" isSynced={syncKeys.has('rotation')} onToggleSync={() => toggleSync('rotation')} onOpenLogic={openLogicModal} />
                    </div>
                    <hr className="border-zinc-800" />
                    <div className="space-y-4">
                      <ControlRow label="X축 전단 (Shear X)" min={config.shearXMin} max={config.shearXMax} step={config.shearXStep} value={shearX} onChange={v => handleSyncChange('shearX', v)} syncKey="shearX" isSynced={syncKeys.has('shearX')} onToggleSync={() => toggleSync('shearX')} />
                      <ControlRow label="Y축 전단 (Shear Y)" min={config.shearYMin} max={config.shearYMax} step={config.shearYStep} value={shearY} onChange={v => handleSyncChange('shearY', v)} syncKey="shearY" isSynced={syncKeys.has('shearY')} onToggleSync={() => toggleSync('shearY')} />
                    </div>
                    <div className="p-4 bg-rose-900/10 rounded-xl border border-rose-500/20 flex flex-col gap-3">
                      <label className="flex items-center gap-2 cursor-pointer text-rose-400 font-bold text-sm md:text-base">
                        <input type="checkbox" checked={useRefl} onChange={(e) => setUseRefl(e.target.checked)} className="w-4 h-4 accent-rose-500" /> 반사 변환 직선 (y = ax) 켜기
                      </label>
                      <ControlRow label="반사축 각도" min="0" max="180" step="1" value={reflAngle} onChange={setReflAngle} colorClass="rose" />
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'color' && (
                <div className="flex flex-col gap-5 md:gap-6">
                  <div className="flex gap-2 md:gap-4 p-3 bg-amber-900/10 rounded-xl border border-amber-500/20 flex-wrap">
                    <label className="flex-1 flex items-center gap-2 cursor-pointer text-amber-400 font-bold whitespace-nowrap text-sm md:text-base"><input type="checkbox" checked={chkGray} onChange={(e) => setChkGray(e.target.checked)} className="w-4 h-4 accent-amber-500" /> 흑백화</label>
                    <label className="flex-1 flex items-center gap-2 cursor-pointer text-amber-400 font-bold whitespace-nowrap text-sm md:text-base"><input type="checkbox" checked={chkInvert} onChange={(e) => setChkInvert(e.target.checked)} className="w-4 h-4 accent-amber-500" /> 반전</label>
                  </div>
                  <div className="space-y-4">
                    <ControlRow label="전체 밝기 (+)" min="-255" max="255" step="1" value={globalAdd} onChange={v=>handleSyncChange('globalAdd', v)} syncKey="globalAdd" isSynced={syncKeys.has('globalAdd')} onToggleSync={()=>toggleSync('globalAdd')} colorClass="zinc" />
                    <ControlRow label="전체 명암비 (x)" min={config.contMin} max={config.contMax} step={config.contStep} value={globalMul} onChange={v=>handleSyncChange('globalMul', v)} syncKey="globalMul" isSynced={syncKeys.has('globalMul')} onToggleSync={()=>toggleSync('globalMul')} colorClass="zinc" />
                    <ControlRow label="이진화 (Threshold, -1 끄기)" min="-1" max="255" step="1" value={binThresh} onChange={setBinThresh} colorClass="zinc" />
                  </div>

                  <div className="p-3 bg-purple-900/20 rounded-xl border border-purple-500/30 flex flex-col gap-3">
                    <label className="flex items-center gap-2 cursor-pointer text-purple-400 font-bold text-sm md:text-base"><input type="checkbox" checked={useDuotone} onChange={(e) => setUseDuotone(e.target.checked)} className="w-4 h-4 accent-purple-500" /> 가짜 컬러 복원 (듀오톤)</label>
                    <div className="flex gap-2">
                      <label className="flex-1 flex flex-col gap-1 text-zinc-400 text-xs">어두운 영역<input type="color" value={colorDarkUI} onChange={(e) => setColorDarkUI(e.target.value)} className="w-full h-8 cursor-pointer bg-zinc-900 border-none rounded"/></label>
                      <label className="flex-1 flex flex-col gap-1 text-zinc-400 text-xs">밝은 영역<input type="color" value={colorLightUI} onChange={(e) => setColorLightUI(e.target.value)} className="w-full h-8 cursor-pointer bg-zinc-900 border-none rounded"/></label>
                    </div>
                  </div>

                  <hr className="border-zinc-800" />
                  <div className="space-y-4 p-3 border-l-2 border-red-500">
                    <ControlRow label="Red 밝기" min="-255" max="255" step="1" value={rAdd} onChange={v=>handleSyncChange('rAdd', v)} syncKey="rAdd" isSynced={syncKeys.has('rAdd')} onToggleSync={()=>toggleSync('rAdd')} colorClass="red" />
                    <ControlRow label="Red 명암비" min={config.contMin} max={config.contMax} step={config.contStep} value={rMul} onChange={v=>handleSyncChange('rMul', v)} syncKey="rMul" isSynced={syncKeys.has('rMul')} onToggleSync={()=>toggleSync('rMul')} colorClass="red" />
                  </div>
                  <div className="space-y-4 p-3 border-l-2 border-green-500">
                    <ControlRow label="Green 밝기" min="-255" max="255" step="1" value={gAdd} onChange={v=>handleSyncChange('gAdd', v)} syncKey="gAdd" isSynced={syncKeys.has('gAdd')} onToggleSync={()=>toggleSync('gAdd')} colorClass="green" />
                    <ControlRow label="Green 명암비" min={config.contMin} max={config.contMax} step={config.contStep} value={gMul} onChange={v=>handleSyncChange('gMul', v)} syncKey="gMul" isSynced={syncKeys.has('gMul')} onToggleSync={()=>toggleSync('gMul')} colorClass="green" />
                  </div>
                  <div className="space-y-4 p-3 border-l-2 border-blue-500">
                    <ControlRow label="Blue 밝기" min="-255" max="255" step="1" value={bAdd} onChange={v=>handleSyncChange('bAdd', v)} syncKey="bAdd" isSynced={syncKeys.has('bAdd')} onToggleSync={()=>toggleSync('bAdd')} colorClass="blue" />
                    <ControlRow label="Blue 명암비" min={config.contMin} max={config.contMax} step={config.contStep} value={bMul} onChange={v=>handleSyncChange('bMul', v)} syncKey="bMul" isSynced={syncKeys.has('bMul')} onToggleSync={()=>toggleSync('bMul')} colorClass="blue" />
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* ==============================================
              PC용 패널 크기 리사이저 
          ============================================== */}
          {!isMobile && (
            <div className="w-1.5 bg-zinc-800 hover:bg-sky-500 cursor-col-resize flex-shrink-0 z-20 flex items-center justify-center transition-colors group relative" onMouseDown={startResizingPanel} title="패널 크기 조절">
              <div className="h-10 w-0.5 bg-zinc-600 group-hover:bg-white rounded"></div>
            </div>
          )}

          {/* ==============================================
              우측(PC) / 바탕화면(모바일) 메인 캔버스
          ============================================== */}
          <div className={`flex items-center justify-center relative overflow-hidden bg-zinc-950 h-full ${isMobile ? 'w-full absolute inset-0 z-10' : 'flex-1 z-10'}`}>
            
            {/* 🚀 모바일 전용 수동 매트릭스 입력 & 사진 열기 */}
            {isMobile && (
              <div className="absolute top-4 left-4 z-[50] flex items-start">
                <div className="bg-black/90 backdrop-blur border border-zinc-700 rounded-lg p-2 shadow-xl relative z-10 w-[120px]">
                  <div className="grid grid-cols-3 gap-x-2 gap-y-1 text-center font-mono text-[11px] font-bold tracking-tighter">
                    <input type="text" value={isManualMode ? manualMatrix.a : m00} onFocus={handleManualFocus} onChange={e => handleManualInput('a', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m00, "1.00")}`} />
                    <input type="text" value={isManualMode ? manualMatrix.c : m01} onFocus={handleManualFocus} onChange={e => handleManualInput('c', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m01, "0.00")}`} />
                    <input type="text" value={isManualMode ? manualMatrix.e : m02} onFocus={handleManualFocus} onChange={e => handleManualInput('e', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m02, "0")}`} />
                    <input type="text" value={isManualMode ? manualMatrix.b : m10} onFocus={handleManualFocus} onChange={e => handleManualInput('b', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m10, "0.00")}`} />
                    <input type="text" value={isManualMode ? manualMatrix.d : m11} onFocus={handleManualFocus} onChange={e => handleManualInput('d', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m11, "1.00")}`} />
                    <input type="text" value={isManualMode ? manualMatrix.f : m12} onFocus={handleManualFocus} onChange={e => handleManualInput('f', e.target.value)} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${isManualMode ? 'text-purple-400' : getMatrixColor(m12, "0")}`} />
                    <div className="text-zinc-600 pointer-events-none">0.0</div><div className="text-zinc-600 pointer-events-none">0.0</div><div className="text-zinc-600 pointer-events-none">1.0</div>
                  </div>
                </div>

                <button onClick={() => setIsPhotoMenuOpen(!isPhotoMenuOpen)} className="w-7 h-[88px] flex items-center justify-center bg-sky-600 hover:bg-sky-500 transition-colors shadow-xl relative z-0 -ml-2 pl-2" style={{ clipPath: 'polygon(0% 0%, 100% 15%, 100% 85%, 0% 100%)' }}>
                  <span className="text-white text-[10px] font-black">{isPhotoMenuOpen ? '◀' : '▶'}</span>
                </button>

                {isPhotoMenuOpen && (
                  <div className="ml-1 bg-zinc-800/90 backdrop-blur border border-zinc-700 rounded-lg p-1 shadow-xl animate-fade-in origin-left h-[88px] flex items-center">
                    <label className="flex bg-zinc-100 text-black px-3 py-2 rounded text-[11px] font-bold transition cursor-pointer shadow whitespace-nowrap">
                      📁 사진 열기
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => { handleImageUpload(e); setIsPhotoMenuOpen(false); }} />
                    </label>
                  </div>
                )}
              </div>
            )}

            {useRefl && (
              <div className={`absolute ${isMobile ? 'top-[110px] left-4' : 'top-8 left-8'} z-20 text-rose-500 font-bold text-sm md:text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,1)] bg-zinc-900/60 px-3 py-2 md:px-5 md:py-3 rounded-lg border border-rose-500/30 shadow-2xl backdrop-blur-sm`}>
                Reflection Axis: {Math.abs(reflAngle - 90) < 0.01 ? "x = 0" : `y = ${Math.tan(reflAngle * Math.PI / 180).toFixed(2)}x`}
              </div>
            )}

            <canvas 
              ref={canvasRef} width={2000} height={1200} 
              className={`w-full h-full object-cover transition-colors touch-none ${isDragUI ? 'cursor-grabbing' : 'cursor-grab'}`}
              onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUpOrLeave} onMouseLeave={handleMouseUpOrLeave}
              onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchEnd}
            />
            
            <div className="absolute flex bg-zinc-800/90 backdrop-blur rounded-xl border border-zinc-700 shadow-2xl overflow-hidden text-xs md:text-lg font-bold z-40 transition-all duration-300"
                 style={isMobile ? { bottom: isPanelExpanded ? 'calc(55vh + env(safe-area-inset-bottom, 16px) + 16px)' : 'calc(env(safe-area-inset-bottom, 16px) + 16px)', right: '16px' } : { bottom: '32px', right: '32px' }}>
              <button onClick={zoomOut} className="px-3 py-2 md:px-6 md:py-3 hover:bg-zinc-700 text-white transition">➖</button>
              <button onClick={zoomIn} className="px-3 py-2 md:px-6 md:py-3 hover:bg-zinc-700 text-white border-l border-zinc-700 transition">➕</button>
              <button onClick={goHome} className="px-3 py-2 md:px-6 md:py-3 hover:bg-sky-600 bg-sky-500 text-white transition border-l border-zinc-700">🏠</button>
            </div>
          </div>

        </div>
      );
    }

    function App() {
      const [isStarted, setIsStarted] = useState(window.location.hash === '#simulator');
      useEffect(() => {
        const handlePopState = () => setIsStarted(window.location.hash === '#simulator');
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);
      const handleStart = () => { window.history.pushState(null, '', '#simulator'); setIsStarted(true); };
      return !isStarted ? <StartScreen onStart={handleStart} /> : <SimulatorScreen />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
