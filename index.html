                  </div>
                  <div className="space-y-4 p-3 border-l-2 border-blue-500 mb-8">
                    <ControlRow label="Blue 밝기" min="-255" max="255" step="1" value={bAdd} onChange={v=>handleSyncChange('bAdd', v)} onReset={() => handleSyncChange('bAdd', 0)} syncKey="bAdd" isSynced={syncKeys.has('bAdd')} onToggleSync={()=>toggleSync('bAdd')} colorClass="blue" onOpenInfo={() => setLogicInfoData(INFO_DATA.cAdd)} />
                    <ControlRow label="Blue 명암비" min={Math.max(0, config.contMin)} max={config.contMax} step={config.contStep} value={bMul} onChange={v=>handleSyncChange('bMul', v)} onReset={() => handleSyncChange('bMul', 1.0)} syncKey="bMul" isSynced={syncKeys.has('bMul')} onToggleSync={()=>toggleSync('bMul')} colorClass="blue" onOpenInfo={() => setLogicInfoData(INFO_DATA.cMul)} />
                  </div>
                </div>
              )}
            </div>
          </div>

          {!isMobile && (
            <div className="w-1.5 bg-zinc-800 hover:bg-sky-500 cursor-col-resize flex-shrink-0 z-20 flex items-center justify-center transition-colors group relative" 
                 onMouseDown={startResizingPanel} 
                 onTouchStart={startResizingPanel} 
                 title="패널 크기 조절">
              <div className="h-10 w-0.5 bg-zinc-600 group-hover:bg-white rounded"></div>
            </div>
          )}

          <div className={`flex items-center justify-center relative overflow-hidden bg-zinc-950 h-full ${isMobile ? 'w-full absolute inset-0 z-10' : 'flex-1 z-10'}`}>
            
            <div 
              className={`absolute inset-0 z-[55] touch-none ${isCalcMode || usePolygonMode ? 'cursor-default' : ((useMathLab && usePointMode) ? 'cursor-default' : (isDragUI ? 'cursor-grabbing' : 'cursor-grab'))}`}
              onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUpOrLeave} onMouseLeave={handleMouseUpOrLeave}
              onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchEnd}
            />
            
            <canvas ref={canvasRef} width={2000} height={1200} className="w-full h-full object-cover z-20 pointer-events-none absolute inset-0" />

            {isCalcMode && (
                <div className="absolute top-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 z-[70] pointer-events-none">
                    <div className="bg-amber-500/90 text-white px-5 py-2.5 rounded-full font-bold text-sm md:text-base shadow-[0_0_15px_rgba(245,158,11,0.5)] animate-pulse flex items-center gap-3 pointer-events-auto">
                        <span>화면을 터치하여 계산 과정을 볼 점을 찍어주세요</span>
                        <button onClick={() => setShowManualCalcPointUI(!showManualCalcPointUI)} className="bg-white text-amber-600 px-3 py-1 rounded-full text-xs hover:bg-amber-100 transition whitespace-nowrap shadow-sm">
                            직접 입력
                        </button>
                    </div>
                    {showManualCalcPointUI && (
                        <div className="flex gap-2 items-center bg-black/80 p-2.5 rounded-lg border border-amber-500/50 shadow-xl pointer-events-auto">
                            <span className="text-zinc-400 font-mono text-xs">X:</span>
                            <CustomNumberInput value={calcManualX} onChange={setCalcManualX} className="w-16 bg-zinc-900 text-amber-300 font-mono px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-amber-500" />
                            <span className="text-zinc-400 font-mono text-xs">Y:</span>
                            <CustomNumberInput value={calcManualY} onChange={setCalcManualY} className="w-16 bg-zinc-900 text-amber-300 font-mono px-2 py-1 text-xs border border-zinc-700 rounded outline-none focus:border-amber-500" />
                            <button onClick={handleAddManualCalcPoint} className="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold transition">입력</button>
                        </div>
                    )}
                </div>
            )}

            <div className={`absolute flex flex-col bg-zinc-800/90 backdrop-blur rounded-xl border border-zinc-700 shadow-2xl overflow-hidden text-lg font-bold z-[100] pointer-events-auto ${!isDraggingHandle.current ? 'transition-all duration-300' : ''}`}
                 style={isMobile ? { bottom: `calc(${mobilePanelHeight}vh + env(safe-area-inset-bottom, 0px) + 24px)`, right: '16px' } : { bottom: '32px', right: '32px' }}>
              {isMobile && (
                  <button onClick={() => resetAll(imageObj)} className="px-3 py-3 md:px-4 md:py-4 hover:bg-rose-600 hover:text-white text-rose-400 transition-colors" title="리셋">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
                  </button>
              )}
              <button onClick={goHome} className={`px-3 py-3 md:px-4 md:py-4 hover:bg-sky-600 bg-sky-500 text-white transition-colors ${isMobile ? 'border-t' : ''} border-zinc-700`} title="화면 맞춤">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              </button>
              <button onClick={zoomIn} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition-colors" title="확대">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
              </button>
              <button onClick={zoomOut} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-zinc-300 hover:text-white border-t border-zinc-700 transition-colors" title="축소">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM7 10h6"/></svg>
              </button>
            </div>

            {isMobile && (
              <div className="absolute top-4 left-4 z-[60] flex items-center drop-shadow-2xl pointer-events-auto">
                <div className="bg-black/90 backdrop-blur border border-zinc-700 rounded-lg p-3 relative w-[200px] h-[140px] flex justify-between items-center">
                  
                  <button onClick={() => setShowMatrixChain(!showMatrixChain)} className={`absolute -top-3 left-4 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border ${showMatrixChain ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-zinc-800 border-zinc-600 text-zinc-400 hover:bg-zinc-700 hover:text-white'}`} title="행렬 곱셈 분해하여 보기">
                      {showMatrixChain ? (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                      ) : (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                      )}
                  </button>

                  <button onClick={() => setIsCalcMode(!isCalcMode)} className={`absolute -top-3 -right-3 w-8 h-8 flex items-center justify-center rounded-full transition shadow-lg z-10 border ${isCalcMode ? 'bg-amber-500 border-amber-400 text-white animate-pulse' : 'bg-zinc-800 border-zinc-600 text-amber-400 hover:bg-zinc-700 hover:text-white'}`} title="연산 과정 보기">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                  </button>

                  <div className="flex items-center justify-center w-4 h-full">
                    <span className="text-zinc-400 font-serif text-[60px] leading-[0]" style={{ transform: 'scale(0.7, 2.0)' }}>(</span>
                  </div>
                  {showMatrixChain ? (
                      <div className="flex items-center w-[120px] overflow-x-auto space-x-1 px-2 scrollbar-hide self-center">
                          {chainOrder.map((id, idx) => {
                              const chainItem = getChainMatrix(id);
                              return (
                                  <React.Fragment key={id}>
                                      <div 
                                          draggable 
                                          onDragStart={(e) => handleDragStart(e, idx)}
                                          onDragOver={handleDragOver}
                                          onDrop={(e) => handleDrop(e, idx)}
                                          className="cursor-grab active:cursor-grabbing hover:scale-105 transition-transform drop-shadow-lg"
                                      >
                                          <MiniMatrix m={chainItem.m} label={chainItem.label} />
                                      </div>
                                      {idx < chainOrder.length - 1 && <span className="text-zinc-500 font-bold text-xs shrink-0">×</span>}
                                  </React.Fragment>
                              );
                          })}
                      </div>
                  ) : (
                      <div className="grid grid-cols-3 gap-x-2 gap-y-3 text-center font-mono text-[13px] font-bold tracking-tighter w-full self-center max-w-[140px] mx-1">
                        <MatrixInput value={m00Str} onChange={v => handleMatrixUpdate('a', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m00Str, "1.00", "1")}`} />
                        <MatrixInput value={m01Str} onChange={v => handleMatrixUpdate('c', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m01Str, "0.00", "0")}`} />
                        <MatrixInput value={m02Str} onChange={v => handleMatrixUpdate('e', v)} matrixFormatExact={matrixFormatExact} isTranslate={true} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m02Str, "0", "0")}`} />
                        <MatrixInput value={m10Str} onChange={v => handleMatrixUpdate('b', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m10Str, "0.00", "0")}`} />
                        <MatrixInput value={m11Str} onChange={v => handleMatrixUpdate('d', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m11Str, "1.00", "1")}`} />
                        <MatrixInput value={m12Str} onChange={v => handleMatrixUpdate('f', v)} matrixFormatExact={matrixFormatExact} isTranslate={true} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-0.5 transition-colors ${getMatrixColor(m12Str, "0", "0")}`} />
                        <div className="text-zinc-600 pointer-events-none w-full text-center text-[12px]">0</div>
                        <div className="text-zinc-600 pointer-events-none w-full text-center text-[12px]">0</div>
                        <div className="text-zinc-600 pointer-events-none w-full text-center text-[12px]">1</div>
                      </div>
                  )}
                  <div className="flex items-center justify-center w-4 h-full">
                    <span className="text-zinc-400 font-serif text-[60px] leading-[0]" style={{ transform: 'scale(0.7, 2.0)' }}>)</span>
                  </div>
                </div>

                <label className="ml-3 w-14 h-[140px] flex flex-col gap-1.5 items-center justify-center bg-zinc-800/90 hover:bg-zinc-700 backdrop-blur border border-zinc-700 text-zinc-300 rounded-lg font-bold transition cursor-pointer shadow-xl pointer-events-auto">
                    <svg className="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span className="text-[10px] text-zinc-400">사진 열기</span>
                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                </label>
              </div>
            )}

          </div>
        </div>
      );
    }

    function App() {
      const [isStarted, setIsStarted] = useState(window.location.hash === '#simulator');
      useEffect(() => {
        const handlePopState = () => setIsStarted(window.location.hash === '#simulator');
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);
      const handleStart = () => { window.history.pushState(null, '', '#simulator'); setIsStarted(true); };
      return !isStarted ? <StartScreen onStart={handleStart} /> : <SimulatorScreen />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
