<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vision Matrix Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-40px) rotate(180deg); } }
    @keyframes float-med { 0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); } 50% { transform: translateY(30px) rotate(-120deg) scale(1.1); } }
    @keyframes float-fast { 0%, 100% { transform: translateX(0px) rotate(0deg); } 50% { transform: translateX(-30px) rotate(90deg); } }
    .geom-shape { position: absolute; opacity: 0.15; border: 3px solid white; }
    .shape-1 { animation: float-slow 12s infinite ease-in-out; }
    .shape-2 { animation: float-med 15s infinite ease-in-out; }
    .shape-3 { animation: float-fast 10s infinite ease-in-out; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type="number"], input[type="text"] { -moz-appearance: textfield; appearance: textfield; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const DEFAULT_CONFIG = {
        scaleXMin: -5.0, scaleXMax: 5.0, scaleXStep: 0.1, scaleYMin: -5.0, scaleYMax: 5.0, scaleYStep: 0.1,
        squeezeMin: 0.1, squeezeMax: 3.0, squeezeStep: 0.1, transXMin: -500, transXMax: 500, transXStep: 1, transYMin: -500, transYMax: 500, transYStep: 1,
        rotMin: -180, rotMax: 180, rotStep: 1, shearXMin: -3.0, shearXMax: 3.0, shearXStep: 0.1, shearYMin: -3.0, shearYMax: 3.0, shearYStep: 0.1, contMin: 0, contMax: 5.0, contStep: 0.1
    };

    const GRAPH_COLORS = ['#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4'];

    const INFO_DATA = {
        scaleX: { title: "X축 확대 (Scale X)", desc: "X좌표에만 지정한 배율(sx)을 곱하여 가로로 늘리거나 줄입니다.", matrix: [['sx', '0', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        scaleY: { title: "Y축 확대 (Scale Y)", desc: "Y좌표에만 지정한 배율(sy)을 곱하여 세로로 늘리거나 줄입니다.", matrix: [['1', '0', '0'], ['0', 'sy', '0'], ['0', '0', '1']] },
        squeeze: { title: "스퀴즈 (Squeeze)", desc: "전체 면적은 그대로 1로 유지하면서, 한쪽 축은 늘리고 반대 축은 압축하는 특수 변환입니다.", matrix: [['k', '0', '0'], ['0', '1/k', '0'], ['0', '0', '1']] },
        transX: { title: "X축 이동 (Translate X)", desc: "모든 픽셀의 X좌표에 일정 값(dx)을 더하여 좌우로 평행 이동시킵니다.", matrix: [['1', '0', 'dx'], ['0', '1', '0'], ['0', '0', '1']] },
        transY: { title: "Y축 이동 (Translate Y)", desc: "모든 픽셀의 Y좌표에 일정 값(dy)을 더하여 상하로 평행 이동시킵니다.", matrix: [['1', '0', '0'], ['0', '1', 'dy'], ['0', '0', '1']] },
        rot: { title: "평면 회전 (Rotation)", desc: "원점을 기준으로 이미지를 지정된 각도(θ)만큼 평면 회전시키는 변환입니다.", matrix: [['cosθ', '-sinθ', '0'], ['sinθ', 'cosθ', '0'], ['0', '0', '1']] },
        shearX: { title: "X축 전단 (Shear X)", desc: "Y값이 커질수록 X축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 눕힙니다.", matrix: [['1', 'shx', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        shearY: { title: "Y축 전단 (Shear Y)", desc: "X값이 커질수록 Y축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 세웁니다.", matrix: [['1', '0', '0'], ['shy', '1', '0'], ['0', '0', '1']] },
        refl: { title: "반사 변환 (Reflection)", desc: "원점을 지나는 특정 직선(y = ax)을 거울 삼아 이미지를 반대편으로 대칭 이동시킵니다.", matrix: [['cos(2θ)', 'sin(2θ)', '0'], ['sin(2θ)', '-cos(2θ)', '0'], ['0', '0', '1']] },
        mathLab: { title: "수학 실험실 (Math Lab)", desc: "이미지 렌더링을 끄고 순수한 2D 좌표평면을 띄워 실험하는 전문가용 모드입니다." },
        graph: { title: "함수 맵핑 (Function Map)", desc: "입력된 수학 함수 f(x)의 각 점에 3x3 변환 행렬을 곱하여 곡선을 구부립니다.", formulas: ["y = f(x)", "Point = Matrix * [x, y, 1]"] },
        point: { title: "좌표 점 맵핑 (Point Map)", desc: "화면을 클릭하여 생성된 수학적 원본 좌표(x,y)에 실시간으로 행렬을 곱합니다.", formulas: ["Point = Matrix * [x, y, 1]"] },
        polygon: { title: "다각형 그리기 맵핑", desc: "화면을 터치해 꼭짓점을 찍고, 처음 찍은 점을 다시 클릭하면 다각형 도형이 생성됩니다. 행렬 변환 시 뼈대 점들이 어떻게 움직여 도형이 찌그러지는지 확인해보세요." },
        symmetry: { title: "도형의 대칭이동", desc: "고등학교 1학년 수학 과정의 핵심인 x축, y축, 원점, y=x 직선에 대한 대칭이동을 원클릭으로 수행합니다. 각 버튼을 누르면 그에 맞는 변환 행렬로 자동 셋팅됩니다." },
        unitSquare: { title: "단위 정사각형 (행렬식/넓이)", desc: "한 변의 길이가 1인 기준 정사각형을 띄웁니다. 행렬 변환 후 이 정사각형의 넓이가 바로 행렬식(Determinant, |ad-bc|)의 값을 의미합니다. 넓이가 어떻게 뻥튀기되는지 관찰하세요.", formulas: ["넓이 변화율 = |ad - bc|"] },
        origin: { title: "변환 중심점 (Origin)", desc: "기본적으로 모든 도형과 사진의 회전 및 확대는 원점(0,0)을 기준으로 일어납니다. 이 좌표를 조절하면 행렬 변환의 '축'이 바뀌어 전혀 다른 궤적의 이동이 발생합니다." },
        chkGray: { title: "흑백화 (Grayscale)", desc: "빛의 3원색(RGB)에 눈의 민감도를 곱해 무채색으로 변환합니다.", formulas: ["Gray = R*0.299 + G*0.587 + B*0.114", "R = Gray, G = Gray, B = Gray"] },
        chkInv: { title: "색상 반전 (Invert)", desc: "빛의 삼원색 한계치(255)에서 현재 색상을 빼 보색을 만듭니다.", formulas: ["R = 255 - R", "G = 255 - G", "B = 255 - B"] },
        gAdd: { title: "전체 밝기 (Global Add)", desc: "모든 픽셀에 동일한 상수를 더해 화면 전체를 밝게 하거나 어둡게 합니다.", formulas: ["R' = R + Add"] },
        gMul: { title: "전체 명암비 (Global Contrast)", desc: "밝은 곳은 더 밝게, 어두운 곳은 더 어둡게 배율을 곱해 색상의 대비를 키웁니다.", formulas: ["R' = R * Contrast"] },
        binThresh: { title: "이진화 (Binary Threshold)", desc: "특정 임계값을 기준으로 픽셀을 오직 흰색(255)과 검은색(0)으로만 나눕니다.", formulas: ["if (Gray > Threshold) 255", "else 0"] },
        duo: { title: "듀오톤 (Duotone)", desc: "이미지를 흑백으로 바꾼 뒤, 어두운 부분과 밝은 부분에 두 가지 색상만 매핑합니다.", formulas: ["Color = Dark + (Light - Dark) * Ratio"] },
        cAdd: { title: "채널별 밝기 (Channel Add)", desc: "특정 색상(R/G/B) 채널의 값만 더하거나 뺍니다.", formulas: ["Channel = Channel + Add"] },
        cMul: { title: "채널별 명암비 (Channel Contrast)", desc: "특정 색상 채널의 값에만 배율을 곱합니다.", formulas: ["Channel = Channel * Contrast"] }
    };

    function getOptimalGridStep(z) {
        const targetStep = 100 / z;
        const exponent = Math.floor(Math.log10(targetStep));
        const fraction = targetStep / Math.pow(10, exponent);
        let niceFraction;
        if (fraction < 1.5) niceFraction = 1;
        else if (fraction < 3.5) niceFraction = 2;
        else if (fraction < 7.5) niceFraction = 5;
        else niceFraction = 10;
        return parseFloat((niceFraction * Math.pow(10, exponent)).toPrecision(14));
    }

    function formatNumber(num) {
        if (num === 0) return "0";
        const abs = Math.abs(num);
        if (abs >= 1e7 || abs <= 1e-7) return num.toExponential(2).replace('+', '');
        return parseFloat(num.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 7 });
    }

    const fmt = (v) => parseFloat(v.toFixed(4)).toString();

    const hexToRgb = (hex) => {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    };

    function compileMath(expr, constNames = []) {
        try {
            let s = expr.toLowerCase();
            s = s.replace(/log_([0-9a-z.]+)\(([^)]+)\)/g, '(log($2)/log($1))');
            const keywords = ['sin', 'cos', 'tan', 'log', 'ln', 'abs', 'sqrt', 'exp', 'pi'];
            const map = {};
            keywords.forEach((kw, i) => {
                const char = String.fromCharCode(0xE000 + i);
                s = s.split(kw).join(char);
                map[char] = kw;
            });
            s = s.replace(/([a-z])(?=[a-z])/g, '$1*'); 
            s = s.replace(/([a-z])(?=[\uE000-\uE009])/g, '$1*'); 
            s = s.replace(/([\uE000-\uE009])(?=[a-z])/g, '$1*'); 
            s = s.replace(/([0-9.]+)(?=[a-z\uE000-\uE009])/g, '$1*'); 
            s = s.replace(/([a-z\uE000-\uE009])(?=[0-9.])/g, '$1*'); 
            s = s.replace(/([0-9a-z])\(/g, '$1*('); 
            s = s.replace(/\)(?=[0-9a-z\uE000-\uE009])/g, ')*'); 
            s = s.replace(/\)\(/g, ')*('); 
            for (const char in map) { s = s.split(char).join(map[char]); }
            s = s.replace(/sin/g, 'Math.sin')
                 .replace(/cos/g, 'Math.cos')
                 .replace(/tan/g, 'Math.tan')
                 .replace(/log/g, 'Math.log10')
                 .replace(/ln/g, 'Math.log')
                 .replace(/abs/g, 'Math.abs')
                 .replace(/sqrt/g, 'Math.sqrt')
                 .replace(/exp/g, 'Math.exp')
                 .replace(/pi/g, 'Math.PI')
                 .replace(/\be\b/g, 'Math.E')
                 .replace(/\^/g, '**')
                 .replace(/\bx\b/g, 'v'); 
            return new Function('v', ...constNames, `return ${s};`);
        } catch(e) { return () => NaN; }
    }

    const executeMath = (func, v, constValues = []) => {
        try { 
            const res = func(v, ...constValues); 
            if (typeof res === 'boolean') return res ? 1 : 0;
            return isNaN(res) ? NaN : res; 
        } 
        catch { return NaN; }
    }

    function CustomNumberInput({ value, onChange, validate, className }) {
        const [localVal, setLocalVal] = useState(String(value));
        useEffect(() => { setLocalVal(String(value)); }, [value]);

        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            if (validate && !validate(parsed)) {
                setLocalVal(String(value)); 
                return;
            }
            setLocalVal(String(parsed));
            if (parsed !== parseFloat(value)) onChange(parsed);
        };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                let parsed = parseFloat(localVal);
                if (isNaN(parsed)) parsed = 0;
                if (validate && !validate(parsed)) return; 
                e.target.blur(); 
            }
        };

        return <input type="text" value={localVal} onChange={(e) => setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} />;
    }

    function MatrixInput({ value, onChange, isTranslate, matrixFormatExact, className }) {
        const [localVal, setLocalVal] = useState("");
        useEffect(() => { 
            let parsed = parseFloat(value);
            if (isNaN(parsed)) parsed = 0;
            let finalStr = matrixFormatExact ? parseFloat(parsed.toFixed(4)).toString() : (isTranslate ? parsed.toFixed(0) : parsed.toFixed(2));
            setLocalVal(finalStr); 
        }, [value, isTranslate, matrixFormatExact]);
        
        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            let finalStr = matrixFormatExact ? parseFloat(parsed.toFixed(4)).toString() : (isTranslate ? parsed.toFixed(0) : parsed.toFixed(2));
            setLocalVal(finalStr);
            if (Math.abs(parsed - parseFloat(value)) > 0.0001) onChange(parsed);
        };
        const handleKeyDown = (e) => { 
            if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
        };

        const getFontSize = () => {
            const len = localVal.length;
            if (len > 8) return '0.55em';
            if (len > 6) return '0.7em';
            if (len > 4) return '0.85em';
            return '1em';
        };

        return <input type="text" value={localVal} onChange={e=>setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} style={{ fontSize: getFontSize(), transition: 'font-size 0.2s ease' }} />;
    }

    const ControlRow = ({ label, min, max, step, value, onChange, onReset = null, colorClass = "sky", syncKey = null, isSynced = false, onToggleSync = null, onOpenLogic = null, onOpenInfo = null }) => (
      <div className="flex flex-col gap-1">
        <div className="flex justify-between items-center">
          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
            {label}
            {onOpenInfo && ( <button onClick={onOpenInfo} title="설명 보기" className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button> )}
            {syncKey && ( <button onClick={onToggleSync} title="동기화 링크" className={`p-1 rounded transition-colors ${isSynced ? 'bg-sky-500 text-white' : 'text-zinc-500 hover:text-white'}`}><svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg></button> )}
            {onOpenLogic && ( 
              <button onClick={onOpenLogic} title="설정 변경" className="text-zinc-500 hover:text-white transition">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
              </button> 
            )}
            {onReset && ( 
              <button onClick={onReset} title="초기화" className="text-zinc-500 hover:text-white transition">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
              </button> 
            )}
          </span>
          <CustomNumberInput value={value} validate={(v) => v >= min && v <= max} onChange={onChange} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1 rounded w-16 text-right outline-none focus:border-${colorClass}-500 transition-colors`} />
        </div>
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} style={{ touchAction: 'pan-y' }} className={`accent-${colorClass}-400 cursor-pointer h-1.5 bg-zinc-700 rounded-lg appearance-none`} />
      </div>
    );

    const ConfigRow = ({ title, prefix, config, setConfig, colorClass, restrictMin = -Infinity }) => {
        const handleConfigChange = (type, val) => { 
            if (type === 'Min' && val < restrictMin) val = restrictMin;
            setConfig(prev => ({ ...prev, [`${prefix}${type}`]: val })); 
        };
        const resetToDefault = () => { setConfig(prev => ({ ...prev, [`${prefix}Min`]: Math.max(restrictMin, DEFAULT_CONFIG[`${prefix}Min`]), [`${prefix}Max`]: DEFAULT_CONFIG[`${prefix}Max`], [`${prefix}Step`]: DEFAULT_CONFIG[`${prefix}Step`] })); };

        return (
            <div className="flex flex-col gap-2 border-b border-zinc-700 pb-3">
                <div className="flex justify-between items-center">
                    <span className="text-zinc-300 text-xs font-bold">{title}</span>
                    <button onClick={resetToDefault} className="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-400 hover:text-white rounded border border-zinc-700 transition">초기화</button>
                </div>
                <div className="flex gap-2">
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최소<CustomNumberInput value={config[`${prefix}Min`]} validate={(v) => v <= config[`${prefix}Max`] && v >= restrictMin} onChange={v => handleConfigChange('Min', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최대<CustomNumberInput value={config[`${prefix}Max`]} validate={(v) => v >= config[`${prefix}Min`]} onChange={v => handleConfigChange('Max', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">간격<CustomNumberInput value={config[`${prefix}Step`]} validate={(v) => Math.abs(v) > 0} onChange={v => handleConfigChange('Step', Math.abs(v))} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                </div>
            </div>
        );
    };

    const MiniMatrix = ({ m, label }) => (
        <div className="flex flex-col items-center gap-1 shrink-0">
            <span className="text-zinc-400 text-[10px] font-bold px-2 py-0.5 bg-zinc-800 rounded-full border border-zinc-700 whitespace-nowrap">{label}</span>
            <div className="flex items-center justify-center relative w-[70px] h-[60px]">
              <span className="text-zinc-500 font-serif text-[24px] leading-[0]" style={{ transform: 'scale(0.5, 1.8)' }}>(</span>
              <div className="grid grid-cols-3 gap-x-1 gap-y-1 text-center font-mono text-[8px] font-bold text-sky-300 flex-1">

          <button onClick={onStart} className="relative z-10 mt-12 md:mt-16 px-10 py-3 md:px-14 md:py-4 bg-gradient-to-r from-white to-zinc-300 text-black text-xl md:text-2xl font-black rounded-full hover:from-zinc-300 hover:to-zinc-500 shadow-lg transition-all duration-300 transform hover:-translate-y-1">시작하기</button>
        </div>
      );
    }

    function SimulatorScreen() {
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      const [panelWidth, setPanelWidth] = useState(450);
      const isResizingPanel = useRef(false);

      const [mobilePanelHeight, setMobilePanelHeightState] = useState(15);

      const isDraggingHandle = useRef(false);
      const handleStartY = useRef(0);
      const handleStartHeight = useRef(0);

      const [logicInfoData, setLogicInfoData] = useState(null); 
      const [useMathLab, setUseMathLab] = useState(false);
      const [showImageInMathLab, setShowImageInMathLab] = useState(false); 
      const [keepViewOnMathLab, setKeepViewOnMathLab] = useState(false); 
      const [mathUnderImage, setMathUnderImage] = useState(false); 
      
      const [constants, setConstants] = useState([]);
      const [activeConstConfig, setActiveConstConfig] = useState(null);

      const toggleConstConfig = (name) => { setActiveConstConfig(prev => prev === name ? null : name); };
      const updateConstant = (name, key, val) => { setConstants(prev => prev.map(c => c.name === name ? { ...c, [key]: val } : c)); };
      const deleteConstant = (name) => { setConstants(prev => prev.filter(c => c.name !== name)); };
      
      const [useGraph, setUseGraph] = useState(false);
      const [graphs, setGraphs] = useState([{ id: Date.now(), eq: 'x', matrixMode: 'global', customMatrix: {a:1, b:0, c:0, d:1, e:0, f:0} }]);
      const [isGraphListExpanded, setIsGraphListExpanded] = useState(true);

      const [usePointMode, setUsePointMode] = useState(false);
      const [points, setPoints] = useState([]); 
      const [isPointListExpanded, setIsPointListExpanded] = useState(true);
      
      const [showManualPointUI, setShowManualPointUI] = useState(false);
      const [manualX, setManualX] = useState("0");
      const [manualY, setManualY] = useState("0");

      const [mathPadOpen, setMathPadOpen] = useState(false);
      const [padTab, setPadTab] = useState('math'); 
      const [tempGraphEq, setTempGraphEq] = useState("");
      const [editingGraphId, setEditingGraphId] = useState(null);
      const inputRef = useRef(null);

      const [graphSettingsId, setGraphSettingsId] = useState(null);

      // 🚀 드래그 앤 드롭 행렬 조립기 State
      const [showMatrixChain, setShowMatrixChain] = useState(false);
      const [chainOrder, setChainOrder] = useState(['translate', 'origin', 'rotate', 'scale', 'shear', 'origin_back']);

      const [useUnitSquare, setUseUnitSquare] = useState(false);
      const [transformOriginX, setTransformOriginX] = useState(0);
      const [transformOriginY, setTransformOriginY] = useState(0);
      
      const [usePolygonMode, setUsePolygonMode] = useState(false);
      const [polygonPoints, setPolygonPoints] = useState([]);
      const [isPolygonClosed, setIsPolygonClosed] = useState(false);
      const [showManualPolyUI, setShowManualPolyUI] = useState(false);
      const [polyManualX, setPolyManualX] = useState("0");

      const [isCalcMode, setIsCalcMode] = useState(false);
      const [calcPoints, setCalcPoints] = useState([]);
      const [selectedCalcPoint, setSelectedCalcPoint] = useState(null);
      const [showManualCalcPointUI, setShowManualCalcPointUI] = useState(false);
      const [calcManualX, setCalcManualX] = useState("0");
      const [calcManualY, setCalcManualY] = useState("0");

      useEffect(() => {
          const neededConsts = new Set();

              const keywords = ['sin', 'cos', 'tan', 'log', 'ln', 'abs', 'sqrt', 'exp', 'pi', 'e', 'x'];
              keywords.forEach(kw => { s = s.split(kw).join(''); });

          });
          
          setConstants(prev => {

              });

              neededConsts.forEach(letter => {
                  if (!newConstants.some(c => c.name === letter)) {
                      newConstants.push({ name: letter, value: 1.0, min: -10, max: 10, step: 0.1 });

      const openMathPad = (id, currentEq) => {

      const handleMathPadKey = (char) => {
          const el = inputRef.current;

              setTempGraphEq(newEq);

                  el.setSelectionRange(pos + char.length, pos + char.length);
