<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 🚀 안드로이드 기기 자체의 강제 화면 확대/축소(Pinch Zoom) 기능을 원천 차단합니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vision Matrix Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-40px) rotate(180deg); } }
    @keyframes float-med { 0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); } 50% { transform: translateY(30px) rotate(-120deg) scale(1.1); } }
    @keyframes float-fast { 0%, 100% { transform: translateX(0px) rotate(0deg); } 50% { transform: translateX(-30px) rotate(90deg); } }
    .geom-shape { position: absolute; opacity: 0.15; border: 3px solid white; }
    .shape-1 { animation: float-slow 12s infinite ease-in-out; }
    .shape-2 { animation: float-med 15s infinite ease-in-out; }
    .shape-3 { animation: float-fast 10s infinite ease-in-out; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type="number"], input[type="text"] { -moz-appearance: textfield; appearance: textfield; }
    /* 🚀 모바일 환경(화면 너비 768px 이하)에서만 막대 터치 무시 & 손잡이 터치만 허용 */
    @media (max-width: 768px) {
      .strict-slider {
        /* Tailwind를 뚫고 강제로 적용하기 위해 !important 추가 */
        pointer-events: none !important;
      }
      .strict-slider::-webkit-slider-thumb {
        pointer-events: auto !important;
        /* 모바일에서 동그란 손잡이를 콕 집기 편하도록 터치 영역(크기)을 살짝 키워줍니다 */
        width: 22px !important;
        height: 22px !important;
      }
      .strict-slider::-moz-range-thumb {
        pointer-events: auto !important;
        width: 22px !important;
        height: 22px !important;
      }
    }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .math-cursor {
      display: inline-block;
      width: 2px;
      height: 1.15em;
      background-color: #e4e4e7;
      vertical-align: middle;
      margin: 0 1px;
      animation: cursor-blink 1s infinite;
      border-radius: 1px;
    }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const DEFAULT_CONFIG = {
        scaleXMin: -5.0, scaleXMax: 5.0, scaleXStep: 0.1,
        scaleYMin: -5.0, scaleYMax: 5.0, scaleYStep: 0.1,
        scaleZMin: -5.0, scaleZMax: 5.0, scaleZStep: 0.1,
        squeezeMin: 0.1, squeezeMax: 3.0, squeezeStep: 0.1,
        transXMin: -500, transXMax: 500, transXStep: 1,
        transYMin: -500, transYMax: 500, transYStep: 1,
        transZMin: -500, transZMax: 500, transZStep: 1,
        rotMin: -180, rotMax: 180, rotStep: 1,
        rotXMin: -180, rotXMax: 180, rotXStep: 1,
        rotYMin: -180, rotYMax: 180, rotYStep: 1,
        rotZMin: -180, rotZMax: 180, rotZStep: 1,
        shearXMin: -3.0, shearXMax: 3.0, shearXStep: 0.1,
        shearYMin: -3.0, shearYMax: 3.0, shearYStep: 0.1,
        shearXYMin: -3.0, shearXYMax: 3.0, shearXYStep: 0.1,
        shearXZMin: -3.0, shearXZMax: 3.0, shearXZStep: 0.1,
        shearYZMin: -3.0, shearYZMax: 3.0, shearYZStep: 0.1,
        contMin: 0, contMax: 5.0, contStep: 0.1,
        perspXMin: -0.005, perspXMax: 0.005, perspXStep: 0.00005,
        perspYMin: -0.005, perspYMax: 0.005, perspYStep: 0.00005
    };

    const GRAPH_COLORS = ['#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4'];

    const INFO_DATA = {
        perspX: { title: "수평 투시 변환", desc: "화면을 가로 방향으로 원근감을 주어 비스듬히 눕힙니다. 투시란 멀리 있는 것은 작게, 가까이 있는 것은 크게 보여 입체감과 거리감을 주는 기법입니다.", matrix: [['1', '0', '0'], ['0', '1', '0'], ['px', '0', '1']] },
        perspY: { title: "수직 투시 변환", desc: "화면을 세로 방향으로 원근감을 주어 벽처럼 세웁니다. 투시란 멀리 있는 것은 작게, 가까이 있는 것은 크게 보여 입체감과 거리감을 주는 기법입니다.", matrix: [['1', '0', '0'], ['0', '1', '0'], ['0', 'py', '1']] },
        scaleX: { title: "X축 확대 변환", desc: "가로 방향으로 지정한 배율만큼 늘리거나 줄입니다.", matrix: [['sx', '0', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        scaleY: { title: "Y축 확대 변환", desc: "세로 방향으로 지정한 배율만큼 늘리거나 줄입니다.", matrix: [['1', '0', '0'], ['0', 'sy', '0'], ['0', '0', '1']] },
        squeeze: { title: "스퀴즈 변환", desc: "전체 넓이는 그대로 유지하면서 한쪽 방향을 늘리는 만큼 반대쪽 방향을 납작하게 압축합니다. 찰흙을 누르면 옆으로 퍼지지만 전체 양은 그대로인 원리입니다.", matrix: [['k', '0', '0'], ['0', '1/k', '0'], ['0', '0', '1']] },
        transX: { title: "X축 이동 변환", desc: "화면을 왼쪽이나 오른쪽으로 나란히 밀어서 이동합니다.", matrix: [['1', '0', 'dx'], ['0', '1', '0'], ['0', '0', '1']] },
        transY: { title: "Y축 이동 변환", desc: "화면을 위나 아래로 나란히 밀어서 이동합니다.", matrix: [['1', '0', '0'], ['0', '1', 'dy'], ['0', '0', '1']] },
        transZ: { title: "Z축 이동 변환", desc: "3차원 공간에서 높이·깊이 방향인 Z축을 따라 도형과 사진을 나란히 이동합니다.", formulas: ["변환된 Z좌표 = 기존 Z좌표 + dz"] },
        rot: { title: "회전 변환", desc: "중심점을 기준으로 지정한 각도만큼 화면을 돌립니다.", matrix: [['cosθ', '-sinθ', '0'], ['sinθ', 'cosθ', '0'], ['0', '0', '1']] },
        shearX: { title: "X축 전단 변환", desc: "위아래는 고정한 채 가로 방향으로 비스듬하게 밀어 기울입니다. 전단이란 쌓아 둔 카드 뭉치를 옆으로 밀듯 층층이 어긋나게 미는 변환을 뜻합니다.", matrix: [['1', 'shx', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        shearY: { title: "Y축 전단 변환", desc: "좌우는 고정한 채 세로 방향으로 비스듬하게 밀어 기울입니다. 전단이란 쌓아 둔 카드 뭉치를 위아래로 밀듯 층층이 어긋나게 미는 변환을 뜻합니다.", matrix: [['1', '0', '0'], ['shy', '1', '0'], ['0', '0', '1']] },
        refl: { title: "직선에 대한 대칭 변환", desc: "원점을 지나는 직선을 거울 삼아 도형을 반대쪽으로 뒤집습니다.", matrix: [['(1-m²)/(1+m²)', '2m/(1+m²)', '0'], ['2m/(1+m²)', '(m²-1)/(1+m²)', '0'], ['0', '0', '1']] },
        reflLine: { title: "직선 방정식에 대한 대칭 변환", desc: "원점을 지나지 않는 원하는 직선을 거울 삼아 도형을 반대쪽으로 뒤집습니다.", matrix: [['(B²-A²)/D', '-2AB/D', '-2AC/D'], ['-2AB/D', '(A²-B²)/D', '-2BC/D'], ['0', '0', '1']], formulas: ["D = A² + B²"] },
        proj: { title: "직선에 대한 정사영", desc: "위에서 수직으로 빛을 비췄을 때 생기는 그림자처럼, 모든 점을 기준 직선이나 평면 위로 수직으로 내려 납작하게 모읍니다.", matrix: [['1/(1+m²)', 'm/(1+m²)', '0'], ['m/(1+m²)', 'm²/(1+m²)', '0'], ['0', '0', '1']] },
        mathLab: { title: "수학 모드", desc: "사진을 숨기고 좌표 평면과 공간 위에서 순수한 도형과 함수가 행렬에 의해 어떻게 변하는지 실험하는 모드입니다." },
        graph: { title: "함수 그리기", desc: "수식으로 그려진 그래프 선이 변환 행렬에 의해 어떻게 휘어지고 이동하는지 확인합니다.", formulas: ["y = f(x)", "변환된 점 = 변환 행렬 × [x, y, 1]"] },
        point: { title: "점 그리기", desc: "화면을 눌러서 찍은 점이 행렬 계산에 의해 어디로 이동하는지 확인합니다.", formulas: ["변환된 점 = 변환 행렬 × [x, y, 1]"] },
        polygon: { title: "도형 그리기", desc: "화면에 여러 개의 꼭짓점을 찍어 다각형 도형을 만듭니다. 처음 찍은 빨간 점을 다시 누르면 도형이 완성됩니다." },
        symmetry: { title: "도형의 대칭이동", desc: "기본적인 X축, Y축, 원점, 대각선 대칭이동을 버튼 하나로 간편하게 수행합니다." },
        unitSquare: { title: "단위 정사각형", desc: "가로·세로 길이가 1이고 넓이가 1인 기준 정사각형을 띄워, 변환 후 넓이가 몇 배로 변하는지 한눈에 비교합니다.", formulas: ["넓이 변화율 = |ad - bc|"] },
        origin: { title: "변환 중심점", desc: "확대·축소나 회전을 할 때 중심이 되는 기준 위치를 바꿉니다." },
        chkGray: { title: "흑백 전환", desc: "빛의 삼원색 비율을 계산하여 사진을 색깔 없는 흑백 사진으로 만듭니다.", formulas: ["밝기 = 빨강 × 0.299 + 초록 × 0.587 + 파랑 × 0.114", "빨강 = 밝기, 초록 = 밝기, 파랑 = 밝기"] },
        chkInv: { title: "색상 반전", desc: "현재 색상을 정반대되는 색상인 보색으로 뒤집어 필름처럼 보여줍니다.", formulas: ["빨강 = 255 - 빨강", "초록 = 255 - 초록", "파랑 = 255 - 파랑"] },
        gAdd: { title: "전체 밝기", desc: "화면 전체의 빛을 더하거나 빼서 사진을 전체적으로 밝게 하거나 어둡게 합니다.", formulas: ["새 색상값 = 기존 색상값 + 밝기 조절값"] },
        gMul: { title: "전체 명암비", desc: "밝은 곳은 더 밝게, 어두운 곳은 더 어둡게 만들어 색의 선명한 차이를 키웁니다.", formulas: ["새 색상값 = 기존 색상값 × 명암비 배율"] },
        binThresh: { title: "이진화", desc: "회색빛 없이 오직 흰색과 검은색 두 가지로만 사진을 표현합니다. 기준치보다 밝으면 흰색, 어두우면 검은색으로 칠하며 -1로 두면 기능이 꺼집니다.", formulas: ["밝기가 기준치보다 크면 흰색 255, 아니면 검은색 0"] },
        duo: { title: "이중 색상 변환", desc: "사진의 어두운 부분과 밝은 부분을 선택한 두 가지 색깔로만 물들여 색다른 분위기를 줍니다.", formulas: ["새 색상 = 어두운 색 + 밝기 비율 × 두 색의 차이"] },
        cAdd: { title: "색상별 밝기", desc: "빨강, 초록, 파랑 중 특정한 한 가지 색상의 빛만 더하거나 뺍니다.", formulas: ["새 색상값 = 기존 색상값 + 밝기 조절값"] },
        cMul: { title: "색상별 명암비", desc: "특정한 한 가지 색상에만 밝고 어두운 대비 배율을 곱해 해당 색감을 강조합니다.", formulas: ["새 색상값 = 기존 색상값 × 명암비 배율"] },
        matrixChain: { title: "행렬 곱셈 순서 변경", desc: "행렬 곱셈은 일반적으로 교환 법칙이 성립하지 않아 곱하는 순서에 따라 최종 결과가 완전히 달라집니다. 순서를 직접 바꾸어 결과가 어떻게 달라지는지 관찰해 보세요." },
        scaleZ: { title: "Z축 확대 변환", desc: "3차원 공간의 높이·깊이 방향인 Z축으로 지정한 배율만큼 늘리거나 줄입니다.", matrix: [['1', '0', '0'], ['0', '1', '0'], ['0', '0', 'sz']] },
        squeeze3D: { title: "3차원 스퀴즈 변환", desc: "입체 도형의 전체 부피는 그대로 유지하면서 가로·세로는 k배 늘리고 높이는 1/k²배로 압축합니다. 찰흙을 위에서 누르면 옆으로 퍼지지만 전체 부피는 일정한 원리입니다.", matrix: [['k', '0', '0'], ['0', 'k', '0'], ['0', '0', '1/k²']], formulas: ["부피 변화율 = k × k × 1/k² = 1"] },
        rotX: { title: "X축 3차원 회전 변환", desc: "가로축인 X축을 철봉 삼아 매달려 돌듯, 3차원 공간의 사진과 도형을 앞뒤로 회전시킵니다.", matrix: [['1', '0', '0'], ['0', 'cosθ', '-sinθ'], ['0', 'sinθ', 'cosθ']] },
        rotY: { title: "Y축 3차원 회전 변환", desc: "세로축인 Y축을 회전축으로 삼아, 회전문이 돌듯 3차원 공간의 사진과 도형을 좌우 입체적으로 회전시킵니다.", matrix: [['cosθ', '0', 'sinθ'], ['0', '1', '0'], ['-sinθ', '0', 'cosθ']] },
        rotZ: { title: "Z축 3차원 회전 변환", desc: "높이축인 Z축을 중심축으로 삼아, 시계 바늘이 돌듯 바닥 평면 위에서 회전시킵니다.", matrix: [['cosθ', '-sinθ', '0'], ['sinθ', 'cosθ', '0'], ['0', '0', '1']] },
        shearXY: { title: "XY 3차원 전단 변환", desc: "세로 위치에 비례하여 가로 방향으로 입체 도형을 비스듬히 밀어 기울입니다. 전단이란 쌓인 책을 옆으로 밀어 비스듬하게 만드는 변환입니다.", matrix: [['1', 'shxy', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        shearXZ: { title: "XZ 3차원 전단 변환", desc: "높이에 비례하여 가로 방향으로 사진과 입체 도형을 비스듬히 밀어 기울입니다. 전단이란 쌓인 책을 옆으로 밀어 비스듬하게 만드는 변환입니다.", matrix: [['1', '0', 'shxz'], ['0', '1', '0'], ['0', '0', '1']] },
        shearYZ: { title: "YZ 3차원 전단 변환", desc: "높이에 비례하여 세로 방향으로 사진과 입체 도형을 비스듬히 밀어 기울입니다. 전단이란 쌓인 책을 옆으로 밀어 비스듬하게 만드는 변환입니다.", matrix: [['1', '0', '0'], ['0', '1', 'shyz'], ['0', '0', '1']] },
        symmetry3D: { title: "3차원 평면 대칭 변환", desc: "3차원 공간의 바닥면·옆면·정면 또는 원점을 거울 삼아 입체 도형을 반대쪽으로 뒤집습니다." },
        unitCube: { title: "단위 정육면체", desc: "가로·세로·높이가 모두 1이고 부피가 1인 기준 정육면체를 띄워, 3차원 행렬 변환 후 입체 도형의 부피가 몇 배로 변하는지 직관적으로 비교합니다.", formulas: ["부피 변화율 = |a(ei-fh) - b(di-fg) + c(dh-eg)|"] },
        polyhedron3D: { title: "3차원 다면체", desc: "여러 개의 평면으로 둘러싸인 입체도형인 다면체(정육면체, 정사면체, 정팔면체, 사각뿔)를 3차원 공간에 띄워 행렬 변환을 입체적으로 관찰합니다." },
        surface3D: { title: "3차원 곡면 그리기", desc: "가로와 세로 위치에 따라 높이가 정해지는 3차원 함수 수식을 입체 곡면 형태로 그리고 행렬 변환을 적용합니다.", formulas: ["z = f(x, y)", "변환된 점 = 3×3 변환 행렬 × [x, y, z]"] }
    };

    function getOptimalGridStep(z) {
        const targetStep = 100 / z;
        const exponent = Math.floor(Math.log10(targetStep));
        const fraction = targetStep / Math.pow(10, exponent);
        let niceFraction;
        if (fraction < 1.5) niceFraction = 1;
        else if (fraction < 3.5) niceFraction = 2;
        else if (fraction < 7.5) niceFraction = 5;
        else niceFraction = 10;
        return parseFloat((niceFraction * Math.pow(10, exponent)).toPrecision(14));
    }

    function formatNumber(num) {
        if (num === 0) return "0";
        const abs = Math.abs(num);
        if (abs >= 1e7 || abs <= 1e-7) return num.toExponential(2).replace('+', '');
        return parseFloat(num.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 7 });
    }

    const fmt = (v) => parseFloat(v.toFixed(4)).toString();
    
    // 🚀 미니 조립기 전용 포맷터: 좁은 공간에 글자가 겹치지 않도록 소수점 5자리 정확도 유지 및 축약
    const fmtMini = (v) => {
        if (v === 0) return "0";
        let s = parseFloat(v.toFixed(5)).toString();
        if (s.startsWith('0.')) return s.substring(1); 
        if (s.startsWith('-0.')) return '-' + s.substring(2); 
        return s;
    };

    const hexToRgb = (hex) => {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    };

    // 🚀 확장 수학 함수 정의 (역수 삼각비, 부호함수, 팩토리얼 등)
    Math.csc = (x) => 1 / Math.sin(x);
    Math.sec = (x) => 1 / Math.cos(x);
    Math.cot = (x) => 1 / Math.tan(x);
    Math.sgn = (x) => Math.sign(x);
    Math.fact = (x) => {
        if (x < 0 || !isFinite(x)) return NaN;
        if (Math.abs(x - Math.round(x)) > 1e-7) return NaN;
        let n = Math.round(x);
        if (n > 170) return Infinity;
        let r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        return r;
    };

    const MATH_KEYWORDS_SORTED = [
        'floor', 'round', 'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh',
        'sqrt', 'cbrt', 'ceil', 'fact', 'sin', 'cos', 'tan', 'csc', 'sec', 'cot',
        'log', 'abs', 'exp', 'sgn', 'ln', 'pi'
    ];

    // 🚀 기존 텍스트 수식을 시각적 구조 수식으로 변환 (호환성 유지)
    function toVisualMath(expr) {
        if (!expr) return "";
        let s = expr;
        s = s.replace(/(^|[^\\])log_([0-9a-zA-Z.]+)\(([^()]+)\)/g, '$1\\log_{$2}{$3}');
        s = s.replace(/(^|[^\\])sqrt\(([^()]+)\)/g, '$1\\sqrt{$2}');
        s = s.replace(/(^|[^\\])cbrt\(([^()]+)\)/g, '$1\\cbrt{$2}');
        s = s.replace(/(^|[^\\])abs\(([^()]+)\)/g, '$1\\abs{$2}');
        s = s.replace(/(^|[^\\])\bpi\b/g, '$1\\pi');
        s = s.replace(/\^\(([^()]+)\)/g, '^{$1}');
        s = s.replace(/\^([0-9a-zA-Z]+)/g, '^{$1}');
        return s;
    }

    // 🚀 시각적 구조 수식(\frac, \sqrt 등)을 연산 엔진용 표준 수식으로 정규화
    function normalizeMathExpr(expr) {
        if (!expr) return "";
        let s = expr.replace(/\\pi/g, '(pi)').replace(/°/g, '*(pi/180)');
        let guard = 0;
        while ((s.includes('\\') || s.includes('{') || s.includes('}')) && guard++ < 60) {
            let prev = s;
            s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '(($1)/($2))');
            s = s.replace(/\\root\{([^{}]*)\}\{([^{}]*)\}/g, (_, n, a) => {
                const trimN = n.trim();
                if (trimN === '2' || trimN === '') return `(sqrt(${a}))`;
                if (trimN === '3') return `(cbrt(${a}))`;
                const numN = Number(trimN);
                if (Number.isInteger(numN) && Math.abs(numN % 2) === 1) {
                    return `(sgn(${a})*(abs(${a})^(1/(${trimN}))))`;
                }
                return `((${a})^(1/(${trimN})))`;
            });
            s = s.replace(/\\log_\{([^{}]*)\}\{([^{}]*)\}/g, '(ln($2)/ln($1))');
            s = s.replace(/\\sqrt\{([^{}]*)\}/g, '(sqrt($1))');
            s = s.replace(/\\cbrt\{([^{}]*)\}/g, '(cbrt($1))');
            s = s.replace(/\\abs\{([^{}]*)\}/g, '(abs($1))');
            s = s.replace(/\\floor\{([^{}]*)\}/g, '(floor($1))');
            s = s.replace(/\\ceil\{([^{}]*)\}/g, '(ceil($1))');
            s = s.replace(/\\(asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|csc|sec|cot|ln|log|exp|sgn|round)\{([^{}]*)\}/g, ' ($1($2))');
            s = s.replace(/\^\{([^{}]*)\}/g, '^($1)');
            if (s === prev) {
                s = s.replace(/\{([^{}]*)\}/g, '($1)');
                if (s === prev) break;
            }
        }
        let factGuard = 0;
        while (s.includes('!') && factGuard++ < 20) {
            let next = s.replace(/(\([^()]+\)|[0-9a-zA-Z.]+)!/g, '(fact($1))');
            if (next === s) break;
            s = next;
        }
        return s;
    }

    // 🚀 중괄호 블록 추출기 및 커서 위치 계산기
    function extractBraced(str, openBraceIdx) {
        if (openBraceIdx >= str.length || str[openBraceIdx] !== '{') {
            return { contentStart: openBraceIdx, contentEnd: openBraceIdx, nextIdx: openBraceIdx };
        }
        let depth = 1;
        let i = openBraceIdx + 1;
        while (i < str.length && depth > 0) {
            if (str[i] === '{') depth++;
            else if (str[i] === '}') depth--;
            i++;
        }
        const contentEnd = depth === 0 ? i - 1 : str.length;
        return { contentStart: openBraceIdx + 1, contentEnd, nextIdx: i };
    }

    const CMD_2ARG_REGEX = /^\\(frac|root|log_)\{/;
    const CMD_1ARG_REGEX = /^(\\(?:sqrt|cbrt|abs|floor|ceil|round|asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|csc|sec|cot|ln|log|exp|sgn)|\^)\{/;

    function getValidCursorPositions(str) {
        const stops = [];
        function collect(sIdx, eIdx) {
            stops.push(sIdx);
            let i = sIdx;
            while (i < eIdx) {
                const sub = str.slice(i, eIdx);
                const m2 = sub.match(CMD_2ARG_REGEX);
                if (m2) {
                    const b1Open = i + m2[0].length - 1;
                    const b1 = extractBraced(str, b1Open);
                    collect(b1.contentStart, b1.contentEnd);
                    if (b1.nextIdx < eIdx && str[b1.nextIdx] === '{') {
                        const b2 = extractBraced(str, b1.nextIdx);
                        collect(b2.contentStart, b2.contentEnd);
                        i = b2.nextIdx;
                    } else {
                        i = b1.nextIdx;
                    }
                    stops.push(i);
                    continue;
                }
                const m1 = sub.match(CMD_1ARG_REGEX);
                if (m1) {
                    const b1Open = i + m1[0].length - 1;
                    const b1 = extractBraced(str, b1Open);
                    collect(b1.contentStart, b1.contentEnd);
                    i = b1.nextIdx;
                    stops.push(i);
                    continue;
                }
                if (sub.startsWith('\\pi')) {
                    i += 3;
                    stops.push(i);
                    continue;
                }
                i += 1;
                stops.push(i);
            }
        }
        collect(0, str.length);
        return Array.from(new Set(stops)).sort((a, b) => a - b);
    }

    // 🚀 교과서 수식(WYSIWYG) 렌더러 (커서 및 터치 이동 지원)
    function renderMathVisual(rawStr, cursorPos = -1, onSetCursor = null) {
        const str = cursorPos === -1 ? toVisualMath(rawStr) : rawStr;
        const clickAt = (idx) => (e) => {
            if (!onSetCursor) return;
            e.stopPropagation();
            onSetCursor(idx);
        };
        const renderCursor = (key) => <span key={key} className="math-cursor" />;

        function renderSlot(sIdx, eIdx, placeholder = '□') {
            if (sIdx === eIdx) {
                const isFocused = cursorPos === sIdx;
                return (
                    <span
                        onClick={clickAt(sIdx)}
                        className={`inline-flex items-center justify-center min-w-[18px] min-h-[22px] px-1 rounded border border-dashed mx-0.5 transition-colors ${
                            isFocused
                                ? 'border-zinc-300 bg-zinc-800 text-zinc-100'
                                : 'border-zinc-600 bg-zinc-900 text-zinc-500 hover:border-zinc-400'
                        }`}
                    >
                        {isFocused ? renderCursor(`cur-${sIdx}`) : <span className="text-[0.7em] opacity-60">{placeholder}</span>}
                    </span>
                );
            }
            return renderRange(sIdx, eIdx);
        }

        function renderRange(sIdx, eIdx) {
            const nodes = [];
            let i = sIdx;
            while (i < eIdx) {
                if (cursorPos === i) nodes.push(renderCursor(`cur-${i}`));
                const sub = str.slice(i, eIdx);

                // 1) 2인자 구조 (\frac, \root, \log_)
                const m2 = sub.match(CMD_2ARG_REGEX);
                if (m2) {
                    const cmd = m2[1];
                    const cmdStart = i;
                    const b1Open = i + m2[0].length - 1;
                    const b1 = extractBraced(str, b1Open);
                    const b2 = (b1.nextIdx < eIdx && str[b1.nextIdx] === '{')
                        ? extractBraced(str, b1.nextIdx)
                        : { contentStart: b1.nextIdx, contentEnd: b1.nextIdx, nextIdx: b1.nextIdx };

                    if (cmd === 'frac') {
                        nodes.push(
                            <span key={`frac-${cmdStart}`} onClick={clickAt(b2.nextIdx)} className="inline-flex flex-col items-center align-middle mx-1 my-0.5 select-none">
                                <span onClick={clickAt(b1.contentEnd)} className="px-1.5 pb-0.5 text-[0.82em] leading-tight inline-flex items-center justify-center min-w-[20px]">
                                    {renderSlot(b1.contentStart, b1.contentEnd)}
                                </span>
                                <span className="w-full border-b-2 border-zinc-200 opacity-90"></span>
                                <span onClick={clickAt(b2.contentEnd)} className="px-1.5 pt-0.5 text-[0.82em] leading-tight inline-flex items-center justify-center min-w-[20px]">
                                    {renderSlot(b2.contentStart, b2.contentEnd)}
                                </span>
                            </span>
                        );
                    } else if (cmd === 'root') {
                        nodes.push(
                            <span key={`root-${cmdStart}`} onClick={clickAt(b2.nextIdx)} className="inline-flex items-stretch align-middle mx-0.5 my-0.5 select-none">
                                <sup onClick={clickAt(b1.contentEnd)} className="text-[0.6em] self-start -mr-1 mt-0.5 text-zinc-300 font-sans font-bold">
                                    {renderSlot(b1.contentStart, b1.contentEnd, 'n')}
                                </sup>
                                <svg viewBox="0 0 12 24" preserveAspectRatio="none" className="w-3 self-stretch text-zinc-200 stroke-current fill-none shrink-0" strokeWidth="2">
                                    <path d="M0 15 L2.5 14 L6 22 L11.5 1 L12 1" strokeLinecap="round" strokeLinejoin="round" />
                                </svg>
                                <span onClick={clickAt(b2.contentEnd)} className="border-t-2 border-zinc-200 pt-0.5 px-1 inline-flex items-center leading-tight">
                                    {renderSlot(b2.contentStart, b2.contentEnd)}
                                </span>
                            </span>
                        );
                    } else if (cmd === 'log_') {
                        nodes.push(
                            <span key={`logn-${cmdStart}`} onClick={clickAt(b2.nextIdx)} className="inline-flex items-baseline align-middle mx-0.5 select-none">
                                <span onClick={clickAt(cmdStart)} className="font-serif italic text-zinc-200">log</span>
                                <sub onClick={clickAt(b1.contentEnd)} className="inline-flex items-center text-[0.65em] mr-0.5 translate-y-1 text-zinc-300">
                                    {renderSlot(b1.contentStart, b1.contentEnd, 'a')}
                                </sub>
                                <span className="text-zinc-400 font-sans">(</span>
                                <span onClick={clickAt(b2.contentEnd)} className="px-0.5 inline-flex items-center">
                                    {renderSlot(b2.contentStart, b2.contentEnd)}
                                </span>
                                <span className="text-zinc-400 font-sans">)</span>
                            </span>
                        );
                    }
                    i = b2.nextIdx;
                    continue;
                }

                // 2) 1인자 구조 (\sqrt, \cbrt, \abs, ^, 삼각비, 로그 등)
                const m1 = sub.match(CMD_1ARG_REGEX);
                if (m1) {
                    const rawCmd = m1[1];
                    const cmdStart = i;
                    const b1Open = i + m1[0].length - 1;
                    const b1 = extractBraced(str, b1Open);

                    if (rawCmd === '^') {
                        const prevChar = cmdStart > sIdx ? str[cmdStart - 1] : '';
                        const needsBaseBox = !prevChar || /[=+\-*/({]/.test(prevChar);
                        nodes.push(
                            <span key={`pow-${cmdStart}`} className="inline-flex items-baseline">
                                {needsBaseBox && (
                                    <span onClick={clickAt(cmdStart)} className="inline-flex items-center justify-center min-w-[16px] min-h-[20px] px-1 rounded border border-dashed border-zinc-500/60 bg-zinc-800/40 text-zinc-500 text-xs mx-0.5">□</span>
                                )}
                                <sup onClick={clickAt(b1.contentEnd)} className="inline-flex items-center text-[0.68em] align-super ml-0.5 -top-1.5 relative text-zinc-200">
                                    {renderSlot(b1.contentStart, b1.contentEnd)}
                                </sup>
                            </span>
                        );
                    } else if (rawCmd === '\\sqrt' || rawCmd === '\\cbrt') {
                        nodes.push(
                            <span key={`sqrt-${cmdStart}`} onClick={clickAt(b1.nextIdx)} className="inline-flex items-stretch align-middle mx-0.5 my-0.5 select-none">
                                {rawCmd === '\\cbrt' && <sup className="text-[0.6em] self-start -mr-1 mt-0.5 text-zinc-300 font-sans font-bold">3</sup>}
                                <svg viewBox="0 0 12 24" preserveAspectRatio="none" className="w-3 self-stretch text-zinc-200 stroke-current fill-none shrink-0" strokeWidth="2">
                                    <path d="M0 15 L2.5 14 L6 22 L11.5 1 L12 1" strokeLinecap="round" strokeLinejoin="round" />
                                </svg>
                                <span onClick={clickAt(b1.contentEnd)} className="border-t-2 border-zinc-200 pt-0.5 px-1 inline-flex items-center leading-tight">
                                    {renderSlot(b1.contentStart, b1.contentEnd)}
                                </span>
                            </span>
                        );
                    } else if (rawCmd === '\\abs') {
                        nodes.push(
                            <span key={`abs-${cmdStart}`} onClick={clickAt(b1.nextIdx)} className="inline-flex items-stretch align-middle mx-0.5 my-0.5 select-none">
                                <span onClick={clickAt(cmdStart)} className="border-l-2 border-zinc-300 mx-0.5 my-0.5"></span>
                                <span onClick={clickAt(b1.contentEnd)} className="px-1 inline-flex items-center">
                                    {renderSlot(b1.contentStart, b1.contentEnd)}
                                </span>
                                <span className="border-r-2 border-zinc-300 mx-0.5 my-0.5"></span>
                            </span>
                        );
                    } else if (rawCmd === '\\floor' || rawCmd === '\\ceil') {
                        const isFloor = rawCmd === '\\floor';
                        nodes.push(
                            <span key={`fl-${cmdStart}`} onClick={clickAt(b1.nextIdx)} className="inline-flex items-stretch align-middle mx-0.5 my-0.5 select-none">
                                <span onClick={clickAt(cmdStart)} className={`border-l-2 ${isFloor ? 'border-b-2' : 'border-t-2'} border-zinc-300 w-1.5 my-0.5`}></span>
                                <span onClick={clickAt(b1.contentEnd)} className="px-1 inline-flex items-center">
                                    {renderSlot(b1.contentStart, b1.contentEnd)}
                                </span>
                                <span className={`border-r-2 ${isFloor ? 'border-b-2' : 'border-t-2'} border-zinc-300 w-1.5 my-0.5`}></span>
                            </span>
                        );
                    } else {
                        const fnName = rawCmd.slice(1);
                        const labelMap = {
                            asin: <>sin<sup className="text-[0.65em] -top-1.5 relative">-1</sup></>,
                            acos: <>cos<sup className="text-[0.65em] -top-1.5 relative">-1</sup></>,
                            atan: <>tan<sup className="text-[0.65em] -top-1.5 relative">-1</sup></>,
                            log: <>log<sub className="text-[0.65em] translate-y-0.5">10</sub></>,
                            exp: <>exp</>
                        };
                        nodes.push(
                            <span key={`fn-${cmdStart}`} onClick={clickAt(b1.nextIdx)} className="inline-flex items-center align-middle mx-0.5 select-none">
                                <span onClick={clickAt(cmdStart)} className="font-serif italic text-zinc-200 pr-0.5">
                                    {labelMap[fnName] || fnName}
                                </span>
                                <span className="text-zinc-400 font-sans">(</span>
                                <span onClick={clickAt(b1.contentEnd)} className="px-0.5 inline-flex items-center">
                                    {renderSlot(b1.contentStart, b1.contentEnd)}
                                </span>
                                <span className="text-zinc-400 font-sans">)</span>
                            </span>
                        );
                    }
                    i = b1.nextIdx;
                    continue;
                }

                // 3) 파이 기호 (\pi)
                if (sub.startsWith('\\pi')) {
                    const tokenStart = i;
                    nodes.push(
                        <span key={`pi-${tokenStart}`} onClick={clickAt(tokenStart + 3)} className="font-serif italic text-zinc-200 mx-0.5 cursor-pointer">π</span>
                    );
                    i += 3;
                    continue;
                }

                // 4) 일반 문자 및 연산자
                const ch = str[i];
                const charIdx = i;
                const displayChar = ch === '*' ? '×' : ch === '/' ? '÷' : ch === '-' ? '−' : ch;
                const isOp = ['+', '-', '*', '/', '='].includes(ch);
                nodes.push(
                    <span
                        key={`ch-${charIdx}`}
                        onClick={clickAt(charIdx + 1)}
                        className={`cursor-pointer ${
                            isOp ? 'mx-1 text-zinc-300 font-sans font-bold' :
                            /[a-zA-Z]/.test(ch) ? 'font-serif italic text-white font-bold' : 'text-zinc-100'
                        }`}
                    >
                        {displayChar}
                    </span>
                );
                i += 1;
            }
            if (cursorPos === eIdx) nodes.push(renderCursor(`cur-${eIdx}`));
            return nodes;
        }

        if (!str && cursorPos === -1) return <span className="text-zinc-500 text-sm">수식을 입력하세요</span>;
        return (
            <span onClick={clickAt(str.length)} className="inline-flex items-center flex-nowrap whitespace-nowrap w-max min-h-[36px]">
                {renderRange(0, str.length)}
            </span>
        );
    }

    function compileMath(expr, constNames = []) {
        try {
            let s = normalizeMathExpr(expr).toLowerCase();
            if (s.includes('=')) {
                s = s.split('=')[1];
            }
            s = s.replace(/log_([0-9a-z.]+)\(([^)]+)\)/g, '(ln($2)/ln($1))');
            const map = {};
            MATH_KEYWORDS_SORTED.forEach((kw, i) => {
                const char = String.fromCharCode(0xE000 + i);
                s = s.split(kw).join(char);
                map[char] = kw;
            });
            s = s.replace(/([a-z])(?=[a-z])/g, '$1*'); 
            s = s.replace(/([a-z])(?=[\uE000-\uE030])/g, '$1*'); 
            s = s.replace(/([\uE000-\uE030])(?=[a-z])/g, '$1*'); 
            s = s.replace(/([0-9.]+)(?=[a-z\uE000-\uE030])/g, '$1*'); 
            s = s.replace(/([a-z\uE000-\uE030])(?=[0-9.])/g, '$1*'); 
            s = s.replace(/([0-9a-z])\(/g, '$1*('); s = s.replace(/\)(?=[0-9a-z\uE000-\uE030])/g, ')*'); 
            s = s.replace(/\)\(/g, ')*('); 
            for (const char in map) { s = s.split(char).join(map[char]); }
            const fnMap = {
                asin: 'Math.asin', acos: 'Math.acos', atan: 'Math.atan',
                sinh: 'Math.sinh', cosh: 'Math.cosh', tanh: 'Math.tanh',
                sin: 'Math.sin', cos: 'Math.cos', tan: 'Math.tan',
                csc: 'Math.csc', sec: 'Math.sec', cot: 'Math.cot',
                log: 'Math.log10', ln: 'Math.log', abs: 'Math.abs',
                sqrt: 'Math.sqrt', cbrt: 'Math.cbrt', exp: 'Math.exp',
                floor: 'Math.floor', ceil: 'Math.ceil', round: 'Math.round',
                sgn: 'Math.sgn', fact: 'Math.fact', pi: 'Math.PI'
            };
            s = s.replace(/\b(asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|csc|sec|cot|log|ln|abs|sqrt|cbrt|exp|floor|ceil|round|sgn|fact|pi)\b/g, m => fnMap[m]);
            s = s.replace(/\be\b/g, 'Math.E')
                 .replace(/\^/g, '**')
                 .replace(/\bx\b/g, 'v'); 
            return new Function('v', ...constNames, `return ${s};`);
        } catch(e) { return () => NaN; }
    }

    const executeMath = (func, v, constValues = []) => {
        try { 
            const res = func(v, ...constValues); 
            if (typeof res === 'boolean') return res ? 1 : 0;
            return isNaN(res) ? NaN : res; 
        } 
        catch { return NaN; }
    }

    function CustomNumberInput({ value, onChange, validate, className }) {
        const [localVal, setLocalVal] = useState(String(value));
        useEffect(() => { setLocalVal(String(value)); }, [value]);

        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            if (validate && !validate(parsed)) {
                setLocalVal(String(value)); 
                return;
            }
            setLocalVal(String(parsed));
            if (parsed !== parseFloat(value)) onChange(parsed);
        };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                let parsed = parseFloat(localVal);
                if (isNaN(parsed)) parsed = 0;
                if (validate && !validate(parsed)) return; 
                e.target.blur(); 
            }
        };

        return <input type="text" value={localVal} onChange={(e) => setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} />;
    }

    // 🚀 isPerspective 속성을 추가하여 투시 변환일 경우 소수점 5자리까지 렌더링되도록 확장
    function MatrixInput({ value, onChange, isTranslate, isPerspective, matrixFormatExact, className }) {
        const [localVal, setLocalVal] = useState("");
        
        const formatValue = (val) => {
            let parsed = parseFloat(val);
            if (isNaN(parsed)) parsed = 0;
            if (matrixFormatExact) return parseFloat(parsed.toFixed(6)).toString();
            if (isTranslate) return parsed.toFixed(0);
            // 🚀 투시 변환 원소 표기 시 불필요한 뒷자리 0을 깎아내는 수학적 안전 처리 추가
            if (isPerspective) return parsed === 0 ? "0.00" : parseFloat(parsed.toFixed(5)).toString();
            return parsed.toFixed(2);
        };

        useEffect(() => { setLocalVal(formatValue(value)); }, [value, isTranslate, isPerspective, matrixFormatExact]);
        
        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            setLocalVal(formatValue(parsed));
            // 🚀 0.00001 단위의 미세한 변화도 감지할 수 있도록 오차 허용범위 축소
            if (Math.abs(parsed - parseFloat(value)) > 0.0000001) onChange(parsed);
        };
        const handleKeyDown = (e) => { 
            if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
        };

        const getFontSize = () => {
            const len = localVal.length;
            if (len > 8) return '0.55em';
            if (len > 6) return '0.7em';
            if (len > 4) return '0.85em';
            return '1em';
        };

        return <input type="text" value={localVal} onChange={e=>setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} style={{ fontSize: getFontSize(), transition: 'font-size 0.2s ease' }} />;
    }

    const ControlRow = ({ label, min, max, step, value, onChange, onReset = null, colorClass = "sky", syncKey = null, isSynced = false, onToggleSync = null, onOpenLogic = null, onOpenInfo = null, onOpenConfig = null, isConfigOpen = false }) => (
      <div className="flex flex-col gap-1">
        <div className="flex justify-between items-center">
          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
            {label}
            {onOpenInfo && ( <button onClick={onOpenInfo} title="설명" className="text-zinc-500 hover:text-white transition"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg></button> )}
            {onReset && ( 
              <button onClick={onReset} title="초기화" className="text-zinc-500 hover:text-white transition">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2V15"/></svg>
              </button> 
            )}
            {syncKey && ( <button onClick={onToggleSync} title="동기화" className={`p-1 rounded transition-colors ${isSynced ? 'bg-sky-500 text-white' : 'text-zinc-500 hover:text-white'}`}><svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg></button> )}
            {onOpenConfig && ( 
              <button onClick={onOpenConfig} title="상수 입력값 조절" className={`p-1 rounded transition-colors ${isConfigOpen ? 'text-indigo-400 bg-zinc-800' : 'text-zinc-500 hover:text-white'}`}>
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
              </button> 
            )}
            {onOpenLogic && ( 
              <button onClick={onOpenLogic} title="삼각비 변경" className="text-zinc-500 hover:text-white transition">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
              </button> 
            )}
          </span>
          <CustomNumberInput value={value} validate={(v) => v >= min && v <= max} onChange={onChange} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1 rounded w-16 text-right outline-none focus:border-${colorClass}-500 transition-colors`} />
        </div>
        
        {/* 🚀 strict-slider 클래스 추가됨 */}
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} style={{ touchAction: 'pan-y' }} className={`strict-slider accent-${colorClass}-400 cursor-pointer h-1.5 bg-zinc-700 rounded-lg appearance-none`} />
      </div>
    );

    const ConfigRow = ({ title, prefix, config, setConfig, colorClass, restrictMin = -Infinity }) => {
        const handleConfigChange = (type, val) => { 
            if (type === 'Min' && val < restrictMin) val = restrictMin;
            setConfig(prev => ({ ...prev, [`${prefix}${type}`]: val })); 
        };
        const resetToDefault = () => { setConfig(prev => ({ ...prev, [`${prefix}Min`]: Math.max(restrictMin, DEFAULT_CONFIG[`${prefix}Min`]), [`${prefix}Max`]: DEFAULT_CONFIG[`${prefix}Max`], [`${prefix}Step`]: DEFAULT_CONFIG[`${prefix}Step`] })); };

        return (
            <div className="flex flex-col gap-2 border-b border-zinc-700 pb-3">
                <div className="flex justify-between items-center">
                    <span className="text-zinc-300 text-xs font-bold">{title}</span>
                    <button onClick={resetToDefault} className="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-400 hover:text-white rounded border border-zinc-700 transition">초기화</button>
                </div>
                <div className="flex gap-2">
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최솟값<CustomNumberInput value={config[`${prefix}Min`]} validate={(v) => v <= config[`${prefix}Max`] && v >= restrictMin} onChange={v => handleConfigChange('Min', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최댓값<CustomNumberInput value={config[`${prefix}Max`]} validate={(v) => v >= config[`${prefix}Min`]} onChange={v => handleConfigChange('Max', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">간격<CustomNumberInput value={config[`${prefix}Step`]} validate={(v) => Math.abs(v) > 0} onChange={v => handleConfigChange('Step', Math.abs(v))} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                </div>
            </div>
        );
    };

    // 🚀 행렬 조립기 블록별 담당 원소 하이라이팅을 위한 색상 추출기 (2D / 3D 겸용)
    const getMiniColor = (type, key, is3D = false) => {
        const activeMap = is3D ? {
            'translate': ['e', 'f', 'p2'],
            'origin': ['e', 'f'],
            'origin_back': ['e', 'f'],
            'perspective': ['px', 'py'],
            'rotate': ['a', 'b', 'c', 'd', 'e', 'f', 'px', 'py', 'p2'],
            'scale': ['a', 'd', 'p2'],
            'shear': ['c', 'e', 'f']
        } : {
            'translate': ['e', 'f'],
            'origin': ['e', 'f'],
            'origin_back': ['e', 'f'],
            'perspective': ['px', 'py'],
            'rotate': ['a', 'b', 'c', 'd'],
            'scale': ['a', 'd'],
            'shear': ['b', 'c']
        };
        return (activeMap[type] && activeMap[type].includes(key)) ? "text-sky-400 text-shadow-glow" : "text-zinc-600";
    };

    const MiniMatrix = ({ m, m3 = null, label, type }) => {
        const is3D = Array.isArray(m3);
        const v00 = is3D ? m3[0] : m.a;
        const v01 = is3D ? m3[1] : m.c;
        const v02 = is3D ? m3[2] : m.e;
        const v10 = is3D ? m3[3] : m.b;
        const v11 = is3D ? m3[4] : m.d;
        const v12 = is3D ? m3[5] : m.f;
        const v20 = is3D ? m3[6] : (m.m14 || 0);
        const v21 = is3D ? m3[7] : (m.m24 || 0);
        const v22 = is3D ? m3[8] : (m.m44 ?? 1);
        return (
            <div className="flex flex-col items-center gap-0.5 shrink-0 px-1">
                <span className="text-zinc-400 text-[10px] font-bold px-2 py-0.5 bg-zinc-800 rounded-full border border-zinc-700 whitespace-nowrap">{label}</span>
                {/* 🚀 w-[75px] 로 확장하여 원소끼리 겹치는 버그 완전 해결 */}
                <div className="flex items-center justify-center relative w-[75px] h-[50px]">
                  <span className="text-zinc-500 font-serif text-[24px] leading-[0]" style={{ transform: 'scale(0.4, 1.6)' }}>(</span>
                  <div className="grid grid-cols-3 gap-x-1 gap-y-1 text-center font-mono text-[8px] font-bold flex-1 tracking-tighter">
                      <span className={getMiniColor(type, 'a', is3D)}>{fmtMini(v00)}</span>
                      <span className={getMiniColor(type, 'c', is3D)}>{fmtMini(v01)}</span>
                      <span className={getMiniColor(type, 'e', is3D)}>{fmtMini(v02)}</span>
                      <span className={getMiniColor(type, 'b', is3D)}>{fmtMini(v10)}</span>
                      <span className={getMiniColor(type, 'd', is3D)}>{fmtMini(v11)}</span>
                      <span className={getMiniColor(type, 'f', is3D)}>{fmtMini(v12)}</span>
                      <span className={getMiniColor(type, 'px', is3D)}>{fmtMini(v20)}</span>
                      <span className={getMiniColor(type, 'py', is3D)}>{fmtMini(v21)}</span>
                      <span className={is3D ? getMiniColor(type, 'p2', true) : "text-zinc-600"}>{fmtMini(v22)}</span>
                  </div>
                  <span className="text-zinc-500 font-serif text-[24px] leading-[0]" style={{ transform: 'scale(0.4, 1.6)' }}>)</span>
                </div>
            </div>
        );
    };

    function StartScreen({ onStart }) {
      return (
        <div className="relative w-full h-screen bg-gradient-to-br from-zinc-800 via-zinc-900 to-black overflow-hidden flex flex-col items-center justify-center">
          <div className="geom-shape shape-1 rounded-full w-48 h-48 -top-10 left-10"></div><div className="geom-shape shape-2 w-32 h-32 top-1/4 right-20"></div>
          <div className="geom-shape shape-3 rounded-full w-24 h-24 bottom-20 left-1/4"></div><div className="geom-shape shape-1 w-64 h-64 border-t-0 border-r-0 rounded-bl-full -bottom-10 -right-10"></div>
          
          <div className="relative z-10 flex flex-col items-center justify-center transform transition-all duration-700 hover:scale-105">
            <div className="flex items-center text-white">
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">(</span>
              <div className="grid grid-cols-3 gap-x-6 md:gap-x-12 gap-y-2 text-5xl md:text-8xl font-black mx-2 md:mx-4 text-center bg-clip-text text-transparent bg-gradient-to-b from-white via-zinc-300 to-zinc-600">
                <span>m</span><span>a</span><span>t</span>
                <span>r</span><span>i</span><span>x</span>
              </div>
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">)</span>
            </div>
          </div>
          
          <p className="relative z-10 mt-6 text-zinc-400 font-medium tracking-widest text-sm md:text-lg text-center px-4">Matrix Transform Simulator</p>
          <button onClick={onStart} className="relative z-10 mt-12 md:mt-16 px-10 py-3 md:px-14 md:py-4 bg-gradient-to-r from-white to-zinc-300 text-black text-xl md:text-2xl font-black rounded-full hover:from-zinc-300 hover:to-zinc-500 shadow-lg transition-all duration-300 transform hover:-translate-y-1">시작하기</button>
        </div>
      );
    }

    function SimulatorScreen() {
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      const [panelWidth, setPanelWidth] = useState(450);
      const isResizingPanel = useRef(false);

      const [mobilePanelHeight, setMobilePanelHeightState] = useState(15); 
      const mobilePanelHeightRef = useRef(15);
      const setMobilePanelHeight = (h) => {
          setMobilePanelHeightState(h);
          mobilePanelHeightRef.current = h;
      };
      
      const isDraggingHandle = useRef(false);
      const handleStartY = useRef(0);
      const handleStartHeight = useRef(0);
      const autoScrollTimerRef = useRef(null); // 🚀 누락된 스크롤 타이머 변수 추가

      const [logicInfoData, setLogicInfoData] = useState(null); 
      const [useMathLab, setUseMathLab] = useState(false);
      const [showImageInMathLab, setShowImageInMathLab] = useState(false); 
      const [keepViewOnMathLab, setKeepViewOnMathLab] = useState(false); 
      const [mathUnderImage, setMathUnderImage] = useState(false); 

      // 🚀 1. 픽셀-좌표 매핑 비율 상태 추가
      const [pixelsPerUnit, setPixelsPerUnit] = useState(1);
      
      const [constants, setConstants] = useState([]);
      const [activeConstConfig, setActiveConstConfig] = useState(null);

      const toggleConstConfig = (name) => { setActiveConstConfig(prev => prev === name ? null : name); };
      const updateConstant = (name, key, val) => { 
        setConstants(prev => prev.map(c => {
          if (c.name !== name) return c;
          let updated = { ...c, [key]: val };
          if (key === 'min' && updated.value < val) updated.value = val;
          if (key === 'max' && updated.value > val) updated.value = val;
          return updated;
        })); 
      };
      const deleteConstant = (name) => { setConstants(prev => prev.filter(c => c.name !== name)); };
      
      const [useGraph, setUseGraph] = useState(false);
      // 🚀 기본 수식을 y=x 로 설정
      const [graphs, setGraphs] = useState([{ id: Date.now(), eq: 'y=x', matrixMode: 'global', customMatrix: {a:1, b:0, c:0, d:1, e:0, f:0} }]);
      const [isGraphListExpanded, setIsGraphListExpanded] = useState(true);

      const [usePointMode, setUsePointMode] = useState(false);
      const [points, setPoints] = useState([]); 
      const [isPointListExpanded, setIsPointListExpanded] = useState(true);
      
      const [showManualPointUI, setShowManualPointUI] = useState(false);
      const [manualX, setManualX] = useState("0");
      const [manualY, setManualY] = useState("0");

      const [mathPadOpen, setMathPadOpen] = useState(false);
      const [padTab, setPadTab] = useState('math'); 
      const [tempGraphEq, setTempGraphEq] = useState("");
      const [editingGraphId, setEditingGraphId] = useState(null);
      const inputRef = useRef(null);
      const [mathError, setMathError] = useState(""); // 🚀 수식 에러 메시지 상태

      const [graphSettingsId, setGraphSettingsId] = useState(null);

      // 🚀 드래그 앤 드롭 행렬 조립기 State
      const [showMatrixChain, setShowMatrixChain] = useState(false);
      const [chainOrder, setChainOrder] = useState(['translate', 'origin', 'perspective', 'rotate', 'scale', 'shear', 'origin_back']);

      // 🚀 PC용 드래그 상태 관리
      const dragChainRef = useRef(null);
      const [ghostDragInfo, setGhostDragInfo] = useState(null); 

      // 🚀 그림자 팝업 메뉴 드래그 상태 관리
      const dragMenuRef = useRef({ isDragging: false, startX: 0, startY: 0, initLeft: 0, initTop: 0 });
      const [shadowMenuPos, setShadowMenuPos] = useState(null);

      // 🚀 실시간 그림자 변수들을 에러 해결을 위해 먼저 생성(위로 끌어올림)
      const [shadowStates, setShadowStates] = useState([]);
      const [showShadowMenu, setShowShadowMenu] = useState(false);
      const [selectedShadowId, setSelectedShadowId] = useState(null);
      const [showShadowList, setShowShadowList] = useState(false);

      // 🚀 그림자가 모두 삭제되면 개별 팝업 메뉴 및 목록 창도 자동으로 닫히도록 동기화
      useEffect(() => {
          if (shadowStates.length === 0) {
              setShowShadowMenu(false);
              setSelectedShadowId(null);
              setShowShadowList(false);
          }
      }, [shadowStates.length]);

      // 그림자 메뉴가 닫히면 위치를 초기화하여 다음번 열릴 때 기본 위치에 뜨게 함
      useEffect(() => {
          if (!showShadowMenu) setShadowMenuPos(null);
      }, [showShadowMenu]); 

      // 🚀 모바일 전용 세로 모달 드래그 앤 드롭 상태 관리
      const mobileChainContainerRef = useRef(null);
      const mobileDragRef = useRef(null);
      const [mobileGhost, setMobileGhost] = useState(null);

      const handleMobileChainTouchStart = (e, index, id) => {
          const touch = e.touches[0];
          const target = e.currentTarget;
          const rect = target.getBoundingClientRect();
          
          mobileDragRef.current = {
              index, id,
              offsetY: touch.clientY - rect.top,
              width: rect.width, height: rect.height,
              isDragging: true
          };
          setMobileGhost({ id, x: rect.left, y: rect.top, width: rect.width, height: rect.height });
          if(navigator.vibrate) navigator.vibrate(20);
      };

      const handleMobileChainTouchMove = (e) => {
          if (!mobileDragRef.current) return;
          if (!e.touches || e.touches.length === 0) return; // 🚀 화면 밖 튀어나감(Touch End/Cancel) 시 e.touches[0] 증발 에러 완벽 방어
          const touch = e.touches[0];
          
          if (!mobileDragRef.current.isDragging) return;

          if (e.cancelable) e.preventDefault(); 

          let targetIdx = -1;
          const container = mobileChainContainerRef.current;
          
          if (container) {
              const crect = container.getBoundingClientRect();
              const edge = 50;
              // 위아래 모서리에 닿으면 자동 스크롤
              if (touch.clientY > crect.bottom - edge) container.scrollTop += 15;
              else if (touch.clientY < crect.top + edge) container.scrollTop -= 15;

              // 🚀 1. 유저 요청: 블록이 화면 밖(조립기 칸 밖)으로 나가지 못하게 Y좌표를 칸 내부에 가둠!
              let newY = touch.clientY - mobileDragRef.current.offsetY;
              const ghostHeight = mobileDragRef.current.height || 60; 
              newY = Math.max(crect.top, Math.min(crect.bottom - ghostHeight, newY));
              
              setMobileGhost(prev => prev ? { ...prev, y: newY } : null);

              // 🚀 2. 과격한 터치로 손가락이 좌우(X축)로 흔들려도 위치 교환이 안 끊기도록 Y축으로만 강력하게 판단!
              const children = Array.from(container.children);
              for (let i = 0; i < children.length; i++) {
                  const child = children[i];
                  const attr = child.getAttribute('data-mobile-idx');
                  if (attr !== null) {
                      const rect = child.getBoundingClientRect();
                      
                      // 손가락이 삐뚤어져도 Y좌표만 안에 있으면 무조건 통과!
                      if (touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                          const tIdx = parseInt(attr, 10);
                          const cIdx = mobileDragRef.current.index;
                          
                          if (tIdx !== cIdx && !isNaN(tIdx) && !isNaN(cIdx)) {
                              const midY = rect.top + rect.height / 2;
                              if ((cIdx < tIdx && touch.clientY > midY) || (cIdx > tIdx && touch.clientY < midY)) {
                                  targetIdx = tIdx;
                              }
                          }
                          break;
                      }
                  }
              }
          }

          // 🚀 3. 안전한 배열 인덱스 검사 (상태 꼬임 블랙스크린 렌더링 에러 영구 차단)
          if (targetIdx !== -1) {
              const currentIndex = mobileDragRef.current.index;
              if (!isNaN(targetIdx) && targetIdx !== currentIndex && targetIdx >= 0 && targetIdx < chainOrder.length && currentIndex >= 0 && currentIndex < chainOrder.length) {
                  setChainOrder(prev => {
                      const newOrder = [...prev];
                      const temp = newOrder[currentIndex];
                      if (!temp) return prev; 
                      newOrder.splice(currentIndex, 1);

             if (newHeight < 0) newHeight = 0;
             if (newHeight > 85) newHeight = 85; 
             setMobilePanelHeight(newHeight);
          }
        };

        const handleMouseUpGlobal = (e) => {
          // 🚀 드래그 종료 처리
          if (dragMenuRef.current) {
              dragMenuRef.current.isDragging = false;
          }

          if (isResizingPanel.current) {
             isResizingPanel.current = false; 
             document.body.style.cursor = 'default'; 
          }
          
          if (isDraggingHandle.current) {
             isDraggingHandle.current = false;
             let clientY = e.type.includes('touch') ? e.changedTouches[0].clientY : e.clientY;
             const deltaY = Math.abs(handleStartY.current - clientY);
             
             if (deltaY < 20) { // 가볍게 탭했을 때
                 const h = handleStartHeight.current; 
                 if (h > 40) setMobilePanelHeight(0);
                 else setMobilePanelHeight(50); // 기본 열림 높이 50vh로 수정
             }
          }
        };

        window.addEventListener('mousemove', handleMouseMoveGlobal, { passive: false }); 
        window.addEventListener('mouseup', handleMouseUpGlobal);
        window.addEventListener('touchmove', handleMouseMoveGlobal, { passive: false });
        window.addEventListener('touchend', handleMouseUpGlobal);
        
        return () => { 
            window.removeEventListener('mousemove', handleMouseMoveGlobal); 
            window.removeEventListener('mouseup', handleMouseUpGlobal); 
            window.removeEventListener('touchmove', handleMouseMoveGlobal);
            window.removeEventListener('touchend', handleMouseUpGlobal);

      }, []);

      const startResizingPanel = (e) => {

      const startDraggingHandle = (e) => {

      // 🚀 드래그 앤 드롭 핸들러 로직

          e.dataTransfer.effectAllowed = "move";
      };
      
      const handleDrop = (e, targetIndex) => {
          e.preventDefault();
          const dragIndexStr = e.dataTransfer.getData('dragIndex');
          if (!dragIndexStr) return;
          const dragIndex = parseInt(dragIndexStr);
          if (dragIndex === targetIndex) return;
          
          const newOrder = [...chainOrder];
          const [draggedItem] = newOrder.splice(dragIndex, 1);
          newOrder.splice(targetIndex, 0, draggedItem);
          setChainOrder(newOrder);
      };
      
      const handleDragOver = (e) => {

      };

      const [syncKeys, setSyncKeys] = useState(new Set());
      const toggleSync = (key) => { setSyncKeys(prev => { const next = new Set(prev); if (next.has(key)) next.delete(key); else next.add(key); return next; }); };

      const prevVals = useRef({});
      useEffect(() => { prevVals.current = { scaleX, scaleY, scaleZ, translateX, translateY, translateZ, rotation, rotX, rotY, rotZ, shearX, shearY, shearXY, shearXZ, shearYZ, squeeze, perspX, perspY, reflAngle, projAngle, globalAdd, globalMul, rAdd, rMul, gAdd, gMul, bAdd, bMul }; });

      const stateSetters = { scaleX: setScaleX, scaleY: setScaleY, scaleZ: setScaleZ, translateX: setTranslateX, translateY: setTranslateY, translateZ: setTranslateZ, rotation: setRotation, rotX: setRotX, rotY: setRotY, rotZ: setRotZ, shearX: setShearX, shearY: setShearY, shearXY: setShearXY, shearXZ: setShearXZ, shearYZ: setShearYZ, squeeze: setSqueeze, perspX: setPerspX, perspY: setPerspY, reflAngle: setReflAngle, projAngle: setProjAngle, globalAdd: setGlobalAdd, globalMul: setGlobalMul, rAdd: setRAdd, rMul: setRMul, gAdd: setGAdd, gMul: setGMul, bAdd: setBAdd, bMul: setBMul };
      
      const getSliderBounds = () => ({
          scaleX: {min: config.scaleXMin, max: config.scaleXMax},
          scaleY: {min: config.scaleYMin, max: config.scaleYMax},
          scaleZ: {min: config.scaleZMin, max: config.scaleZMax},
          translateX: {min: config.transXMin, max: config.transXMax},
          translateY: {min: config.transYMin, max: config.transYMax},
          translateZ: {min: config.transZMin, max: config.transZMax},
          rotation: {min: config.rotMin, max: config.rotMax},
          rotX: {min: config.rotXMin, max: config.rotXMax},
          rotY: {min: config.rotYMin, max: config.rotYMax},
          rotZ: {min: config.rotZMin, max: config.rotZMax},
          reflAngle: {min: 0, max: 180},
          projAngle: {min: 0, max: 180},
          shearX: {min: config.shearXMin, max: config.shearXMax},
          shearY: {min: config.shearYMin, max: config.shearYMax},
          shearXY: {min: config.shearXYMin, max: config.shearXYMax},
          shearXZ: {min: config.shearXZMin, max: config.shearXZMax},
          shearYZ: {min: config.shearYZMin, max: config.shearYZMax},

          perspX: {min: config.perspXMin, max: config.perspXMax},
          perspY: {min: config.perspYMin, max: config.perspYMax},
          globalAdd: {min: -255, max: 255}, globalMul: {min: config.contMin, max: config.contMax},
          rAdd: {min: -255, max: 255}, rMul: {min: config.contMin, max: config.contMax},
          gAdd: {min: -255, max: 255}, gMul: {min: config.contMin, max: config.contMax},

      const handleSyncChange = (key, newVal) => {
          setManualMat3D(null);
          setUseSymmetryGhost(false);

          stateSetters[key](newVal);
          if (syncKeys.has(key)) {

              setConstants(prev => prev.map(c => {
                  if (syncKeys.has(`const_${c.name}`)) {
                      let v = c.value + delta;

                  }
                  return c;
              }));
              syncKeys.forEach(k => {
                  if (k === key || k.startsWith('const_')) return;
                  let targetNewVal = prevVals.current[k] + delta;
                  const bounds = allBounds[k];
                  if (bounds) {
                      if (targetNewVal < bounds.min) targetNewVal = bounds.min;
                      if (targetNewVal > bounds.max) targetNewVal = bounds.max;
                  }
                  if (stateSetters[k]) stateSetters[k](targetNewVal);

          }
      };

      const handleConstSyncChange = (name, newVal) => {
          const target = constants.find(c => c.name === name);
          if (!target) return;
          const delta = newVal - target.value;
          const syncKeyName = `const_${name}`;
          const isSynced = syncKeys.has(syncKeyName);

          setConstants(prev => prev.map(c => {
              if (c.name === name) return { ...c, value: newVal };
              if (isSynced && syncKeys.has(`const_${c.name}`)) {
                  let v = c.value + delta;
                  return { ...c, value: Math.max(c.min, Math.min(c.max, v)) };
              }
              return c;
          }));

          if (isSynced) {
              const allBounds = getSliderBounds();
              syncKeys.forEach(k => {
                  if (k.startsWith('const_')) return;
                  if (stateSetters[k]) {
                      let targetNewVal = prevVals.current[k] + delta;
                      const bounds = allBounds[k];
                      if (bounds) {
                          if (targetNewVal < bounds.min) targetNewVal = bounds.min;
                          if (targetNewVal > bounds.max) targetNewVal = bounds.max;
                      }

      };

      const resetAll = (img = imageObj) => {
        if (useMathLab && !keepViewOnMathLab) {

            setCamera(getOptimalCamera(img));
        }
        
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

        setScaleY(clamp(1.0, config.scaleYMin, config.scaleYMax));
        setTranslateX(clamp(0, config.transXMin, config.transXMax));
        setTranslateY(clamp(0, config.transYMin, config.transYMax));
        setTransformOriginX(0); setTransformOriginY(0);
        setRotation(clamp(0, config.rotMin, config.rotMax));
        setShearX(clamp(0, config.shearXMin, config.shearXMax));
        setShearY(clamp(0, config.shearYMin, config.shearYMax));
        setSqueeze(clamp(1.0, config.squeezeMin, config.squeezeMax));
        
        setUseRefl(false); setReflAngle(90); setUseSymmetryGhost(false);
        setUseProj(false); setProjAngle(0); setProjMode3D('rotPlane');
        setUsePerspective(false); setPerspX(0); setPerspY(0);
        setChkGray(false); setChkInvert(false); 
        setGlobalAdd(0); setGlobalMul(clamp(1.0, config.contMin, config.contMax));

        setRAdd(0); setRMul(clamp(1.0, config.contMin, config.contMax));

        setBAdd(0); setBMul(clamp(1.0, config.contMin, config.contMax));
    
        setUseDuotone(false); 
        setChainOrder(['translate', 'origin', 'perspective', 'rotate', 'scale', 'shear', 'origin_back']);
        setScaleZ(clamp(1.0, config.scaleZMin ?? -5.0, config.scaleZMax ?? 5.0));
        setTranslateZ(clamp(0, config.transZMin ?? -500, config.transZMax ?? 500));
        setRotX(0); setRotY(0); setRotZ(0);
        setShearXY(0); setShearXZ(0); setShearYZ(0);
        setImageZVal(1.0);
        setManualMat3D(null);
        setCam3D({ yaw: -32, pitch: 24 });
      };

      // 🚀 현재 화면 이미지 병합 및 다운로드 함수
      const handleSaveImage = (format) => {
          const c2d = canvasRef.current;
          const cgl = canvasGLRef.current;
          if (!c2d) return;

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = c2d.width;
          tempCanvas.height = c2d.height;
          const tCtx = tempCanvas.getContext('2d');

          // 현재 테마에 맞춰 배경색 칠하기

          tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

          // 2D 캔버스와 WebGL 캔버스를 옵션(!is3DMode && mathUnderImage) 순서에 맞게 병합
          if (!is3DMode && mathUnderImage && cgl) {

              setCaptureModal({ isOpen: true, url: dataUrl, format });
              return;
          } else {
              const link = document.createElement('a');
              link.download = `vision_matrix_export.${format === 'jpeg' ? 'jpg' : format}`;
              link.href = dataUrl;
              link.click();
          }
      };

      const handleImageUpload = (e) => { // <-- (기존 코드 위치)

        };
