<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vision Matrix Pro - Web Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-40px) rotate(180deg); } }
    @keyframes float-med { 0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); } 50% { transform: translateY(30px) rotate(-120deg) scale(1.1); } }
    @keyframes float-fast { 0%, 100% { transform: translateX(0px) rotate(0deg); } 50% { transform: translateX(-30px) rotate(90deg); } }
    .geom-shape { position: absolute; opacity: 0.15; border: 3px solid white; }
    .shape-1 { animation: float-slow 12s infinite ease-in-out; }
    .shape-2 { animation: float-med 15s infinite ease-in-out; }
    .shape-3 { animation: float-fast 10s infinite ease-in-out; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type="number"], input[type="text"] { -moz-appearance: textfield; appearance: textfield; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans overflow-hidden touch-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_CONFIG = {
        scaleXMin: 0.1, scaleXMax: 5.0, scaleXStep: 0.1, scaleYMin: 0.1, scaleYMax: 5.0, scaleYStep: 0.1,
        squeezeMin: 0.1, squeezeMax: 3.0, squeezeStep: 0.1, transXMin: -500, transXMax: 500, transXStep: 1, transYMin: -500, transYMax: 500, transYStep: 1,
        rotMin: -180, rotMax: 180, rotStep: 1, shearXMin: -3.0, shearXMax: 3.0, shearXStep: 0.1, shearYMin: -3.0, shearYMax: 3.0, shearYStep: 0.1, contMin: 0, contMax: 5.0, contStep: 0.1
    };

    const GRAPH_COLORS = ['#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4'];

    const INFO_DATA = {
        scaleX: { title: "X축 확대 (Scale X)", desc: "X좌표에만 지정한 배율(sx)을 곱하여 가로로 늘리거나 줄입니다.", matrix: [['sx', '0', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        scaleY: { title: "Y축 확대 (Scale Y)", desc: "Y좌표에만 지정한 배율(sy)을 곱하여 세로로 늘리거나 줄입니다.", matrix: [['1', '0', '0'], ['0', 'sy', '0'], ['0', '0', '1']] },
        squeeze: { title: "스퀴즈 (Squeeze)", desc: "전체 면적은 그대로 1로 유지하면서, 한쪽 축은 늘리고 반대 축은 압축하는 특수 변환입니다.", matrix: [['k', '0', '0'], ['0', '1/k', '0'], ['0', '0', '1']] },
        transX: { title: "X축 이동 (Translate X)", desc: "모든 픽셀의 X좌표에 일정 값(dx)을 더하여 좌우로 평행 이동시킵니다.", matrix: [['1', '0', 'dx'], ['0', '1', '0'], ['0', '0', '1']] },
        transY: { title: "Y축 이동 (Translate Y)", desc: "모든 픽셀의 Y좌표에 일정 값(dy)을 더하여 상하로 평행 이동시킵니다.", matrix: [['1', '0', '0'], ['0', '1', 'dy'], ['0', '0', '1']] },
        rot: { title: "평면 회전 (Rotation)", desc: "원점을 기준으로 이미지를 지정된 각도(θ)만큼 평면 회전시키는 변환입니다.", matrix: [['cos(θ)', '-sin(θ)', '0'], ['sin(θ)', 'cos(θ)', '0'], ['0', '0', '1']] },
        shearX: { title: "X축 전단 (Shear X)", desc: "Y값이 커질수록 X축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 눕힙니다.", matrix: [['1', 'shx', '0'], ['0', '1', '0'], ['0', '0', '1']] },
        shearY: { title: "Y축 전단 (Shear Y)", desc: "X값이 커질수록 Y축 방향으로 더 많이 밀려나게 하여 이미지를 비스듬히 세웁니다.", matrix: [['1', '0', '0'], ['shy', '1', '0'], ['0', '0', '1']] },
        refl: { title: "반사 변환 (Reflection)", desc: "원점을 지나는 특정 직선(y = ax)을 거울 삼아 이미지를 반대편으로 대칭 이동시킵니다.", matrix: [['cos(2θ)', 'sin(2θ)', '0'], ['sin(2θ)', '-cos(2θ)', '0'], ['0', '0', '1']] },
        mathLab: { title: "🧮 수학 실험실 (Math Lab)", desc: "이미지나 기본 도형 렌더링을 끄고 순수한 2D 좌표평면을 띄워, 점을 직접 찍거나 수학 함수식을 입력하여 행렬이 어떻게 공간을 휘게 만드는지 직관적으로 실험할 수 있는 전문가용 모드입니다." },
        graph: { title: "함수 맵핑 (Function Map)", desc: "입력된 수학 함수 f(x)의 각 점(x, y)에 현재 설정된 3x3 변환 행렬을 곱하여 곡선의 형태를 구부립니다.", formulas: ["y = f(x)", "Point = Matrix * [x, y, 1]"] },
        point: { title: "📍 좌표 점 맵핑 (Point Map)", desc: "화면을 클릭하여 생성된 수학적 원본 좌표(x, y)에 현재 설정된 3x3 변환 행렬을 실시간으로 곱하여 점들을 이동시킵니다.", formulas: ["Point = Matrix * [x, y, 1]"] },
        
        chkGray: { title: "흑백화 (Grayscale)", desc: "빛의 3원색(RGB)에 사람의 눈이 민감하게 느끼는 가중치를 곱해 완전한 무채색으로 변환합니다.", formulas: ["Gray = R*0.299 + G*0.587 + B*0.114", "R = Gray, G = Gray, B = Gray"] },
        chkInv: { title: "색상 반전 (Invert)", desc: "빛의 삼원색 한계치(255)에서 현재 색상을 빼 보색(반대색)을 만듭니다.", formulas: ["R = 255 - R", "G = 255 - G", "B = 255 - B"] },
        gAdd: { title: "전체 밝기 (Global Add)", desc: "모든 픽셀의 RGB 값에 동일한 상수를 더해 화면 전체를 밝게 하거나 어둡게 합니다.", formulas: ["R' = R + Add", "G' = G + Add", "B' = B + Add"] },
        gMul: { title: "전체 명암비 (Global Contrast)", desc: "밝은 곳은 더 밝게, 어두운 곳은 더 어둡게 배율을 곱해 색상의 대비를 키웁니다.", formulas: ["R' = R * Contrast", "G' = G * Contrast", "B' = B * Contrast"] },
        binThresh: { title: "이진화 (Binary Threshold)", desc: "특정 임계값(Threshold)을 기준으로 픽셀을 오직 흰색(255)과 검은색(0) 두 가지로만 나눕니다.", formulas: ["if (Gray > Threshold) 255", "else 0"] },
        duo: { title: "듀오톤 (Duotone)", desc: "이미지를 흑백으로 바꾼 뒤, 어두운 부분과 밝은 부분에 지정된 두 가지 색상만 매핑합니다.", formulas: ["Ratio = Gray / 255", "Color = Dark + (Light - Dark) * Ratio"] },
        cAdd: { title: "채널별 밝기 (Channel Add)", desc: "특정 색상(Red/Green/Blue) 채널의 값만 더하거나 빼서 특정 색조를 강하게 만듭니다.", formulas: ["Channel = Channel + Add"] },
        cMul: { title: "채널별 명암비 (Channel Contrast)", desc: "특정 색상(R,G,B) 채널의 값에만 배율을 곱해 해당 색상의 대비를 극대화합니다.", formulas: ["Channel = Channel * Contrast"] }
    };

    function getOptimalGridStep(z) {
        const targetStep = 100 / z;
        const exponent = Math.floor(Math.log10(targetStep));
        const fraction = targetStep / Math.pow(10, exponent);
        let niceFraction;
        if (fraction < 1.5) niceFraction = 1;
        else if (fraction < 3.5) niceFraction = 2;
        else if (fraction < 7.5) niceFraction = 5;
        else niceFraction = 10;
        return parseFloat((niceFraction * Math.pow(10, exponent)).toPrecision(14));
    }

    function formatNumber(num) {
        if (num === 0) return "0";
        const abs = Math.abs(num);
        if (abs >= 1e7 || abs <= 1e-4) return num.toExponential(2).replace('+', '');
        return parseFloat(num.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 4 });
    }

    function hexToRgb(hex) {
        const bigint = parseInt(hex.slice(1), 16);
        return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function compileMath(expr) {
        try {
            let safeExpr = expr.replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos')
                               .replace(/tan/g, 'Math.tan').replace(/abs/g, 'Math.abs')
                               .replace(/sqrt/g, 'Math.sqrt').replace(/pi/gi, 'Math.PI')
                               .replace(/\^/g, '**'); 
            return new Function('v', `return ${safeExpr};`);
        } catch(e) { return () => NaN; }
    }

    const executeMath = (func, v) => {
        try { const res = func(v); return isNaN(res) ? NaN : res; } 
        catch { return NaN; }
    }

    function CustomNumberInput({ value, onChange, validate, className }) {
        const [localVal, setLocalVal] = useState(String(value));
        useEffect(() => { setLocalVal(String(value)); }, [value]);

        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            if (validate && !validate(parsed)) {
                setLocalVal(String(value)); 
                return;
            }
            setLocalVal(String(parsed));
            if (parsed !== parseFloat(value)) onChange(parsed);
        };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
                let parsed = parseFloat(localVal);
                if (isNaN(parsed)) parsed = 0;
                if (validate && !validate(parsed)) {
                    e.preventDefault(); 
                    return;
                }
                e.target.blur(); 
            }
        };

        const handleChange = (e) => { setLocalVal(e.target.value); };
        return <input type="text" value={localVal} onChange={handleChange} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} />;
    }

    // 🚀 스마트 매트릭스 인풋 (토글 옵션 반영)
    function MatrixInput({ value, onChange, isTranslate, matrixFormatExact, className }) {
        const [localVal, setLocalVal] = useState(String(value));
        useEffect(() => { setLocalVal(String(value)); }, [value]);
        
        const handleBlur = () => {
            let parsed = parseFloat(localVal);
            if (isNaN(parsed)) parsed = 0;
            
            const fmtVal = matrixFormatExact 
                ? parseFloat(parsed.toFixed(4)).toString() 
                : (isTranslate ? parsed.toFixed(0) : parsed.toFixed(2));
                
            setLocalVal(fmtVal);
            if (Math.abs(parsed - parseFloat(value)) > 0.0001) onChange(parsed);
        };
        
        const handleKeyDown = (e) => { if (e.key === 'Enter') e.target.blur(); };
        
        return <input type="text" value={localVal} onChange={e=>setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className={className} />;
    }

    const ControlRow = ({ label, min, max, step, value, onChange, colorClass = "sky", syncKey = null, isSynced = false, onToggleSync = null, onOpenLogic = null, onOpenInfo = null }) => (
      <div className="flex flex-col gap-1">
        <div className="flex justify-between items-center">
          <span className="text-zinc-400 font-medium text-sm flex items-center gap-1.5">
            {label}
            {onOpenInfo && ( <button onClick={onOpenInfo} title="로직 설명" className={`w-[18px] h-[18px] pb-px rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center font-serif italic text-[11px] font-black border border-zinc-700 shadow-sm transition`}>i</button> )}
            {syncKey && ( <button onClick={onToggleSync} title="동시 조작 링크 (체인 묶기)" className={`text-xs px-1.5 py-0.5 rounded font-black transition-colors ${isSynced ? 'bg-sky-500 text-white' : 'bg-zinc-800 text-zinc-500 hover:text-zinc-300 border border-zinc-700'}`}>🔗</button> )}
            {onOpenLogic && ( <button onClick={onOpenLogic} title="수학 로직 변경 (코랩 모드)" className={`text-xs px-1.5 py-0.5 rounded font-black transition-colors bg-zinc-800 text-zinc-500 hover:text-white border border-zinc-700`}>⚙️</button> )}
          </span>
          <CustomNumberInput value={value} validate={(v) => v >= min && v <= max} onChange={onChange} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1 rounded w-20 text-right outline-none focus:border-${colorClass}-500 transition-colors`} />
        </div>
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} className={`accent-${colorClass}-400 cursor-pointer h-1.5 bg-zinc-700 rounded-lg appearance-none`} />
      </div>
    );

    const ConfigRow = ({ title, prefix, config, setConfig, colorClass }) => {
        const handleConfigChange = (type, val) => {
            setConfig(prev => ({ ...prev, [`${prefix}${type}`]: val }));
        };
        const resetToDefault = () => {
            setConfig(prev => ({
                ...prev,
                [`${prefix}Min`]: DEFAULT_CONFIG[`${prefix}Min`],
                [`${prefix}Max`]: DEFAULT_CONFIG[`${prefix}Max`],
                [`${prefix}Step`]: DEFAULT_CONFIG[`${prefix}Step`]
            }));
        };

        return (
            <div className="flex flex-col gap-2 border-b border-zinc-700 pb-3">
                <div className="flex justify-between items-center">
                    <span className="text-zinc-300 text-xs font-bold">{title}</span>
                    <button onClick={resetToDefault} className="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-400 hover:text-white rounded border border-zinc-700 transition">↺ 기본값</button>
                </div>
                <div className="flex gap-2">
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최소 (Min)<CustomNumberInput value={config[`${prefix}Min`]} validate={(v) => v <= config[`${prefix}Max`]} onChange={v => handleConfigChange('Min', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">최대 (Max)<CustomNumberInput value={config[`${prefix}Max`]} validate={(v) => v >= config[`${prefix}Min`]} onChange={v => handleConfigChange('Max', v)} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                    <label className="flex-1 text-[11px] text-zinc-500 flex flex-col gap-1">간격 (Step)<CustomNumberInput value={config[`${prefix}Step`]} validate={(v) => Math.abs(v) > 0} onChange={v => handleConfigChange('Step', Math.abs(v))} className={`bg-zinc-950 border border-zinc-700 text-${colorClass}-400 font-bold px-2 py-1.5 rounded outline-none w-full text-center`} /></label>
                </div>
            </div>
        );
    };

    function StartScreen({ onStart }) {
      return (
        <div className="relative w-full h-screen bg-gradient-to-br from-zinc-800 via-zinc-900 to-black overflow-hidden flex flex-col items-center justify-center">
          <div className="geom-shape shape-1 rounded-full w-48 h-48 -top-10 left-10"></div><div className="geom-shape shape-2 w-32 h-32 top-1/4 right-20"></div>
          <div className="geom-shape shape-3 rounded-full w-24 h-24 bottom-20 left-1/4"></div><div className="geom-shape shape-1 w-64 h-64 border-t-0 border-r-0 rounded-bl-full -bottom-10 -right-10"></div>
          <div className="relative z-10 flex flex-col items-center justify-center transform transition-all duration-700 hover:scale-105" style={{ transform: 'perspective(1000px) rotateX(10deg) rotateY(-10deg) rotateZ(2deg)' }}>
            <div className="flex items-center text-white">
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">(</span>
              <div className="grid grid-cols-3 gap-x-6 md:gap-x-12 gap-y-2 text-5xl md:text-8xl font-black mx-2 md:mx-4 bg-clip-text text-transparent bg-gradient-to-b from-white via-zinc-300 to-zinc-600">
                <span style={{ transform: 'translateY(15px)' }}>m</span><span style={{ transform: 'translateY(0px)' }}>a</span><span style={{ transform: 'translateY(15px)' }}>t</span>
                <span style={{ transform: 'translateY(-15px)' }}>r</span><span style={{ transform: 'translateY(0px)' }}>i</span><span style={{ transform: 'translateY(-15px)' }}>x</span>
              </div>
              <span className="text-[6rem] md:text-[12rem] font-light leading-none opacity-80">)</span>
            </div>
          </div>
          <p className="relative z-10 mt-6 text-zinc-400 font-medium tracking-widest text-sm md:text-lg text-center px-4">Interactive Vision Transformation Engine</p>
          <button onClick={onStart} className="relative z-10 mt-12 md:mt-16 px-10 py-3 md:px-14 md:py-4 bg-gradient-to-r from-white to-zinc-300 text-black text-xl md:text-2xl font-black rounded-full hover:from-zinc-300 hover:to-zinc-500 shadow-lg transition-all duration-300 transform hover:-translate-y-1">시작하기</button>
        </div>
      );
    }

    function SimulatorScreen() {
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      const [panelWidth, setPanelWidth] = useState(450);
      const isResizingPanel = useRef(false);

      const [isPanelExpanded, setIsPanelExpanded] = useState(false); 
      const prevPanelState = useRef(false); 
      const [isPhotoMenuOpen, setIsPhotoMenuOpen] = useState(false); 

      const [logicInfoData, setLogicInfoData] = useState(null); 

      const [useMathLab, setUseMathLab] = useState(false);
      
      const [useGraph, setUseGraph] = useState(false);
      const [graphs, setGraphs] = useState([{ id: Date.now(), eq: 'x' }]);
      const [isGraphListExpanded, setIsGraphListExpanded] = useState(true);

      const [usePointMode, setUsePointMode] = useState(false);
      const [points, setPoints] = useState([]); 
      const [isPointListExpanded, setIsPointListExpanded] = useState(true);

      const [mathPadOpen, setMathPadOpen] = useState(false);
      const [tempGraphEq, setTempGraphEq] = useState("");
      const [editingGraphId, setEditingGraphId] = useState(null);

      const openMathPad = (id, currentEq) => { 
          setEditingGraphId(id); 
          setTempGraphEq(currentEq); 
          setMathPadOpen(true); 
      };
      const handleMathPadKey = (char) => { setTempGraphEq(prev => prev + char); };
      const handleMathPadDelete = () => { setTempGraphEq(prev => prev.slice(0, -1)); };
      const handleMathPadClear = () => { setTempGraphEq(""); };
      const applyMathPad = () => { 
          setGraphs(prev => prev.map(g => g.id === editingGraphId ? { ...g, eq: tempGraphEq || 'x' } : g));
          setMathPadOpen(false); 
      };
      
      const addGraph = () => { setGraphs(prev => [...prev, { id: Date.now(), eq: 'x' }]); setIsGraphListExpanded(true); };
      const removeGraph = (id) => { 
          setGraphs(prev => {
              const next = prev.filter(g => g.id !== id);
              return next.length > 0 ? next : [{ id: Date.now(), eq: 'x' }];
          });
      };

      const [logicModalOpen, setLogicModalOpen] = useState(false);
      const [customLogic, setCustomLogic] = useState({ m00: 'cos(v)', m01: '-sin(v)', m10: 'sin(v)', m11: 'cos(v)' });
      const [tempLogic, setTempLogic] = useState(customLogic);
      
      const compiledLogic = useRef({ m00: compileMath('cos(v)'), m01: compileMath('-sin(v)'), m10: compileMath('sin(v)'), m11: compileMath('cos(v)') });

      const openLogicModal = () => { setTempLogic(customLogic); setLogicModalOpen(true); };
      const saveLogicModal = () => {
          setCustomLogic(tempLogic);
          compiledLogic.current = { m00: compileMath(tempLogic.m00), m01: compileMath(tempLogic.m01), m10: compileMath(tempLogic.m10), m11: compileMath(tempLogic.m11) };
          setLogicModalOpen(false);
      };

      const [camera, setCamera] = useState({ x: 0, y: 0, z: 1.0 });
      const isDraggingRef = useRef(false);
      const lastMouseRef = useRef({ x: 0, y: 0 });
      const initialPinchDist = useRef(null);
      const dragDistRef = useRef(0);
      
      const [isDragUI, setIsDragUI] = useState(false);

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [settingsTab, setSettingsTab] = useState('display'); 
      const [imageSmoothing, setImageSmoothing] = useState(true); 
      const [imageUnderGrid, setImageUnderGrid] = useState(false);
      const [hideGrid, setHideGrid] = useState(false);
      const [autoResetOnLoad, setAutoResetOnLoad] = useState(false);
      
      // 🚀 매트릭스 소수점 포맷 설정 토글

            ctx.strokeText(str, textX, cy + camera.y + i * gridStep * z - 5); ctx.fillText(str, textX, cy + camera.y + i * gridStep * z - 5); 
          }
        };

        if (!imageUnderGrid) drawGridAndAxes();

        ctx.save();
        ctx.translate(cx + camera.x, cy + camera.y); 
        ctx.scale(z, z); 
        ctx.transform(matrix.a, matrix.b, matrix.c, matrix.d, matrix.e, matrix.f);
        
        if (!useMathLab) {
            if (imageObj && colorCacheRef.current) {
              ctx.drawImage(colorCacheRef.current, -imageObj.width / 2, -imageObj.height / 2, imageObj.width, imageObj.height);
            } else if (!imageObj) {
              ctx.fillStyle = 'rgb(59, 130, 246)'; ctx.fillRect(-100, -100, 200, 200);
              ctx.fillStyle = 'rgb(239, 68, 68)'; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill();
            }
        }
        ctx.restore();

        // 🚀 순수 수학 실험실 (2D 가속 엔진)
        if (useMathLab && useGraph && graphs.length > 0) {
            graphs.forEach((g, idx) => {
                if (!g) return;
                const func = compileMath(g.eq.replace(/x/g, 'v'));
                ctx.save();
                ctx.translate(cx + camera.x, cy + camera.y);
                ctx.beginPath();
                ctx.strokeStyle = GRAPH_COLORS[idx % GRAPH_COLORS.length]; 
                ctx.lineWidth = 4; 
                
                let first = true;
                for (let screenX = -3000; screenX <= 3000; screenX += 2) {
                    let mathX = screenX / z;
                    let mathY = executeMath(func, mathX); 
                    
                    if (isNaN(mathY) || !isFinite(mathY)) {
                        first = true;
                        continue;
                    }
                    
                    let pt = new DOMPoint(mathX, -mathY);
                    let transformedPt = pt.matrixTransform(matrix);
                    
                    let drawX = transformedPt.x * z;
                    let drawY = transformedPt.y * z;
                    
                    if(first) { ctx.moveTo(drawX, drawY); first = false; }
                    else { ctx.lineTo(drawX, drawY); }
                }
                ctx.stroke();
                ctx.restore();
            });
        }

        if (imageUnderGrid) drawGridAndAxes();

        if (useMathLab && usePointMode && points.length > 0) {
            ctx.save();
            ctx.translate(cx + camera.x, cy + camera.y);
            points.forEach(p => {
                let pt = new DOMPoint(p.x, -p.y);
                let tPt = pt.matrixTransform(matrix);
                
                let drawX = tPt.x * z;
                let drawY = tPt.y * z;
                
                ctx.beginPath();
                ctx.arc(drawX, drawY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#10b981'; 
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(`${p.label}(${p.x}, ${p.y})`, drawX + 12, drawY - 12);
                ctx.shadowBlur = 0;
            });
            ctx.restore();
        }

        if (useRefl) {
          ctx.save();
          ctx.translate(cx + camera.x, cy + camera.y); ctx.translate(translateX * z, translateY * z); ctx.rotate(-(reflAngle * Math.PI) / 180); 
          ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-30000, 0); ctx.lineTo(30000, 0); ctx.stroke(); ctx.restore();
        }
      }, [camera, matrix, imageObj, imageUnderGrid, hideGrid, useRefl, reflAngle, translateX, translateY, useMathLab, useGraph, usePointMode, points, graphs, imageSmoothing]); 

      return (
        <div className="flex w-full h-screen overflow-hidden animate-fade-in bg-zinc-950 relative">
          
          {mathPadOpen && (
            <div className="fixed inset-0 z-[110] flex items-end md:items-center justify-center bg-black/70 backdrop-blur-sm p-4 pb-10">
              <div className="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl animate-fade-in flex flex-col gap-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-white font-bold text-lg">🧮 수식 입력 (y = f(x))</h3>
                  <button onClick={() => setMathPadOpen(false)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                
                <div className="bg-zinc-950 border border-zinc-700 rounded-xl p-4 text-right overflow-x-auto whitespace-nowrap scrollbar-hide flex justify-end">
                    <span className="text-purple-400 font-mono text-2xl tracking-wider">y = {tempGraphEq}</span>
                    <span className="animate-pulse text-white font-mono text-2xl">_</span>
                </div>
                
                <div className="grid grid-cols-5 gap-2">
                    <button onClick={()=>handleMathPadKey('sin(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-sm">sin</button>
                    <button onClick={()=>handleMathPadKey('cos(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-sm">cos</button>
                    <button onClick={()=>handleMathPadKey('tan(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-sm">tan</button>
                    <button onClick={()=>handleMathPadKey('(')} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-lg">(</button>
                    <button onClick={()=>handleMathPadKey(')')} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-lg">)</button>

                    <button onClick={()=>handleMathPadKey('x')} className="bg-purple-600/30 text-purple-400 border border-purple-500/30 py-3 rounded-lg font-bold text-xl hover:bg-purple-600/50">x</button>
                    <button onClick={()=>handleMathPadKey('7')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">7</button>
                    <button onClick={()=>handleMathPadKey('8')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">8</button>
                    <button onClick={()=>handleMathPadKey('9')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">9</button>
                    <button onClick={()=>handleMathPadKey('/')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">÷</button>

                    <button onClick={()=>handleMathPadKey('^')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-lg">^</button>
                    <button onClick={()=>handleMathPadKey('4')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">4</button>
                    <button onClick={()=>handleMathPadKey('5')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">5</button>
                    <button onClick={()=>handleMathPadKey('6')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">6</button>
                    <button onClick={()=>handleMathPadKey('*')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">×</button>

                    <button onClick={()=>handleMathPadKey('sqrt(')} className="bg-zinc-800 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-700 text-lg">√</button>
                    <button onClick={()=>handleMathPadKey('1')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">1</button>
                    <button onClick={()=>handleMathPadKey('2')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">2</button>
                    <button onClick={()=>handleMathPadKey('3')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">3</button>
                    <button onClick={()=>handleMathPadKey('-')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">-</button>

                    <button onClick={handleMathPadClear} className="bg-rose-600/30 text-rose-400 border border-rose-500/30 py-3 rounded-lg font-bold hover:bg-rose-600/50 text-sm">AC</button>
                    <button onClick={()=>handleMathPadKey('0')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">0</button>
                    <button onClick={()=>handleMathPadKey('.')} className="bg-zinc-800 text-white py-3 rounded-lg font-bold text-xl hover:bg-zinc-700">.</button>
                    <button onClick={handleMathPadDelete} className="bg-zinc-700 text-zinc-300 py-3 rounded-lg font-bold hover:bg-zinc-600 text-lg">⌫</button>
                    <button onClick={()=>handleMathPadKey('+')} className="bg-sky-600/30 text-sky-400 border border-sky-500/30 py-3 rounded-lg font-bold text-xl hover:bg-sky-600/50">+</button>
                </div>
                <button onClick={applyMathPad} className="w-full mt-2 py-4 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-lg transition shadow-[0_0_15px_rgba(168,85,247,0.4)]">
                    적용하기
                </button>
              </div>
            </div>
          )}

          {logicInfoData && (
            <div className="fixed inset-0 z-[120] flex items-start md:items-center justify-center pt-24 md:pt-0 bg-black/70 backdrop-blur-sm px-4">
              <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-5 md:p-6 w-full max-w-sm shadow-2xl animate-fade-in flex flex-col gap-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-white font-bold text-lg md:text-xl">💡 {logicInfoData.title}</h3>
                  <button onClick={() => setLogicInfoData(null)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                
                <p className="text-zinc-300 text-sm leading-relaxed">{logicInfoData.desc}</p>
                
                {logicInfoData.matrix && (
                  <div className="bg-black border border-zinc-700 rounded-lg p-4 flex justify-center items-center relative my-2 shadow-inner">
                    <span className="absolute left-3 text-[50px] font-light text-zinc-600">(</span>
                    <div className="grid grid-cols-3 gap-x-8 gap-y-3 text-center font-mono text-lg font-bold text-sky-400">
                      {logicInfoData.matrix.flat().map((val, idx) => (
                        <div key={idx} className={val === '0' || val === '1' ? 'text-zinc-500' : 'text-sky-400 text-shadow-glow'}>{val}</div>
                      ))}
                    </div>
                    <span className="absolute right-3 text-[50px] font-light text-zinc-600">)</span>
                  </div>
                )}

                {logicInfoData.formulas && (
                  <div className="bg-zinc-950 border border-zinc-800 rounded-lg p-3 flex flex-col gap-2 font-mono text-[13px] shadow-inner">
                    {logicInfoData.formulas.map((f, i) => (
                      <div key={i} className="text-amber-400">{f}</div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {logicModalOpen && (
            <div className="fixed inset-0 z-[100] flex items-start md:items-center justify-center pt-24 md:pt-0 bg-black/70 backdrop-blur-sm px-4">
              <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-5 md:p-6 w-full max-w-sm shadow-2xl animate-fade-in flex flex-col gap-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-white font-bold text-lg md:text-xl">⚙️ 수학 로직 변경</h3>
                  <button onClick={() => setLogicModalOpen(false)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                <p className="text-zinc-400 text-[11px] md:text-xs">
                  회전 변환(Rotation)의 수학 함수식을 직접 수정합니다.<br/>
                  변수 <code className="text-sky-400 bg-zinc-800 px-1 rounded mx-0.5">v</code>는 슬라이더의 라디안 값입니다.<br/>
                  <span className="text-zinc-500">(예: <code className="text-amber-400 bg-zinc-800 px-1 rounded mx-0.5">tan(v)</code>, <code className="text-amber-400 bg-zinc-800 px-1 rounded mx-0.5">-sin(v)*2</code>)</span>
                </p>
                <div className="grid grid-cols-2 gap-3 font-mono text-sm md:text-base">
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m00</span><input type="text" value={tempLogic.m00} onChange={e => setTempLogic({...tempLogic, m00: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m01</span><input type="text" value={tempLogic.m01} onChange={e => setTempLogic({...tempLogic, m01: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m10</span><input type="text" value={tempLogic.m10} onChange={e => setTempLogic({...tempLogic, m10: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                  <div className="flex flex-col gap-1"><span className="text-zinc-500 text-[10px]">m11</span><input type="text" value={tempLogic.m11} onChange={e => setTempLogic({...tempLogic, m11: e.target.value})} className="bg-black border border-zinc-700 text-sky-400 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-center" /></div>
                </div>
                <div className="flex gap-3 mt-2">
                  <button onClick={() => setTempLogic({m00:'cos(v)', m01:'-sin(v)', m10:'sin(v)', m11:'cos(v)'})} className="flex-1 py-2 rounded bg-zinc-800 text-zinc-300 font-bold hover:bg-zinc-700 transition text-sm">초기화</button>
                  <button onClick={saveLogicModal} className="flex-1 py-2 rounded bg-sky-600 text-white font-bold hover:bg-sky-500 transition text-sm">적용하기</button>
                </div>
              </div>
            </div>
          )}

          <div className="absolute top-4 right-4 md:top-6 md:right-6 z-[60] flex flex-col items-end">
            <button onClick={() => setIsSettingsOpen(!isSettingsOpen)} className={`p-2 md:p-3 rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 transition shadow-lg text-white font-bold text-lg md:text-xl ${isSettingsOpen ? 'ring-2 ring-sky-500' : ''}`} title="설정">☰</button>
            {isSettingsOpen && (
              <div className="mt-2 md:mt-3 bg-zinc-800 border border-zinc-700 shadow-2xl rounded-xl p-4 flex flex-col w-[85vw] md:w-[28rem] animate-fade-in origin-top-right">
                <div className="flex border-b border-zinc-700 mb-4">
                  <button onClick={() => setSettingsTab('display')} className={`flex-1 pb-2 text-sm font-bold transition ${settingsTab==='display' ? 'text-sky-400 border-b-2 border-sky-400' : 'text-zinc-500 hover:text-zinc-300'}`}>디스플레이</button>
                  <button onClick={() => setSettingsTab('inputs')} className={`flex-1 pb-2 text-sm font-bold transition ${settingsTab==='inputs' ? 'text-sky-400 border-b-2 border-sky-400' : 'text-zinc-500 hover:text-zinc-300'}`}>입력값 조절</button>
                </div>
                {settingsTab === 'display' && (
                  <div className="flex flex-col gap-4">
                    <label className="flex items-center gap-3 cursor-pointer group"><div className="relative"><input type="checkbox" checked={autoResetOnLoad} onChange={(e) => setAutoResetOnLoad(e.target.checked)} className="peer sr-only" /><div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div><div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div></div><span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">새 사진을 불러올 때 리셋 (Auto Reset)</span></label>
                    <label className="flex items-center gap-3 cursor-pointer group"><div className="relative"><input type="checkbox" checked={imageSmoothing} onChange={(e) => setImageSmoothing(e.target.checked)} className="peer sr-only" /><div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div><div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div></div><span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">이미지 스무딩 (계단현상 방지)</span></label>
                    <label className="flex items-center gap-3 cursor-pointer group"><div className="relative"><input type="checkbox" checked={imageUnderGrid} onChange={(e) => setImageUnderGrid(e.target.checked)} className="peer sr-only" /><div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div><div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div></div><span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">이미지를 좌표계 아래로</span></label>
                    <label className="flex items-center gap-3 cursor-pointer group"><div className="relative"><input type="checkbox" checked={hideGrid} onChange={(e) => setHideGrid(e.target.checked)} className="peer sr-only" /><div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div><div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div></div><span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">좌표계(그리드) 숨기기</span></label>
                    
                    {/* 🚀 행렬 표시 형식 토글 스위치 */}
                    <label className="flex items-center gap-3 cursor-pointer group mt-2 pt-4 border-t border-zinc-800">
                        <div className="relative">
                            <input type="checkbox" checked={matrixFormatExact} onChange={(e) => setMatrixFormatExact(e.target.checked)} className="peer sr-only" />
                            <div className="block bg-zinc-950 w-10 h-6 rounded-full border border-zinc-700 peer-checked:bg-sky-500 transition"></div>
                            <div className="dot absolute left-1 top-1 bg-zinc-400 w-4 h-4 rounded-full transition peer-checked:translate-x-4 peer-checked:bg-white"></div>
                        </div>
                        <span className="text-xs md:text-sm font-medium text-zinc-300 group-hover:text-white transition">행렬 값 딱 떨어지게 표시 (1.00 → 1)</span>
                    </label>

                  </div>
                )}
                {settingsTab === 'inputs' && (
                  <div className="flex flex-col gap-4 max-h-[50vh] overflow-y-auto pr-2">
                    <ConfigRow title="X축 확대 (Scale X)" prefix="scaleX" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="Y축 확대 (Scale Y)" prefix="scaleY" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="X축 이동 (Translate X)" prefix="transX" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="Y축 이동 (Translate Y)" prefix="transY" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="평면 회전 (Rotation °)" prefix="rot" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="X축 전단 (Shear X)" prefix="shearX" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="Y축 전단 (Shear Y)" prefix="shearY" config={config} setConfig={setConfig} colorClass="sky" />
                    <ConfigRow title="스퀴즈 (Squeeze)" prefix="squeeze" config={config} setConfig={setConfig} colorClass="purple" />
                    <ConfigRow title="명암비 (Contrast 배율)" prefix="cont" config={config} setConfig={setConfig} colorClass="zinc" />
                  </div>
                )}
              </div>
            )}
          </div>

          <div style={isMobile ? { position: 'fixed', bottom: 'env(safe-area-inset-bottom, 16px)', left: 0, width: '100%', height: '55vh', transform: isPanelExpanded ? 'translateY(0)' : 'translateY(100%)', zIndex: 45 } : { width: `${panelWidth}px`, height: '100%', position: 'relative', zIndex: 40 }} 
               className={`bg-zinc-900 flex flex-col shadow-2xl shrink-0 transition-transform duration-300 ease-in-out border-zinc-800 ${isMobile ? 'border-t rounded-t-2xl' : 'border-r'}`}>
            
            {isMobile && (
              <div onClick={() => setIsPanelExpanded(!isPanelExpanded)} className="absolute left-1/2 -top-7 w-28 h-7 flex justify-center items-end pb-1.5 cursor-pointer bg-zinc-800 border-t border-zinc-700/50" style={{ transform: 'translateX(-50%)', clipPath: 'polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%)' }}>
                <div className="w-8 h-1 rounded-full bg-zinc-500"></div>
              </div>
            )}

            <div className="hidden md:block p-5 border-b border-zinc-800 shrink-0">
              <h1 className="text-xl font-black text-white flex items-baseline gap-2 truncate">Vision Matrix</h1>
              <div className="flex gap-2 mt-4">
                <label className="flex-1 bg-zinc-100 hover:bg-white text-black py-2.5 rounded-lg text-base font-bold transition text-center cursor-pointer shadow truncate">📁 사진 열기<input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} /></label>
                <button onClick={() => resetAll(imageObj)} className="px-5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-base font-bold transition shadow shrink-0">🔄 리셋</button>
              </div>
            </div>

            <div className="hidden md:flex p-8 bg-black justify-center items-center border-b border-zinc-800 shrink-0 relative">
              <div className="flex items-center justify-center relative w-full">
                {/* 🚀 PC 매트릭스 괄호 및 폰트 사이즈 대폭 증가 */}
                <span className="text-[140px] font-light text-zinc-600 leading-none mr-2 relative -top-2">(</span>
                <div className="grid grid-cols-3 gap-x-4 gap-y-5 text-center font-mono text-2xl md:text-3xl font-bold tracking-tighter w-full max-w-[360px]">
                  <MatrixInput value={m00} onChange={v => handleMatrixUpdate('a', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m00, "1.00", "1")}`} />
                  <MatrixInput value={m01} onChange={v => handleMatrixUpdate('c', v)} matrixFormatExact={matrixFormatExact} isTranslate={false} className={`w-full bg-transparent text-center focus:outline-none focus:bg-zinc-800/80 rounded py-1 transition-colors ${getMatrixColor(m01, "0.00", "0")}`} />

                    <label className="flex bg-zinc-100 text-black px-3 py-2 rounded text-[11px] font-bold transition cursor-pointer shadow whitespace-nowrap">
                      📁 사진 열기
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => { handleImageUpload(e); setIsPhotoMenuOpen(false); }} />
                    </label>
                  </div>
                )}
              </div>
            )}

            {useRefl && (
              <div className={`absolute ${isMobile ? 'top-[135px] left-4' : 'top-8 left-8'} z-[60] text-rose-500 font-bold text-sm md:text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,1)] bg-zinc-900/60 px-3 py-2 md:px-5 md:py-3 rounded-lg border border-rose-500/30 shadow-2xl backdrop-blur-sm`}>
                Reflection Axis: {Math.abs(reflAngle - 90) < 0.01 ? "x = 0" : `y = ${Math.tan(reflAngle * Math.PI / 180).toFixed(2)}x`}
              </div>
            )}

            <canvas ref={canvasRef} width={2000} height={1200} className="w-full h-full object-cover z-20 pointer-events-none absolute inset-0" />
            
            <div className="absolute flex flex-col bg-zinc-800/90 backdrop-blur rounded-xl border border-zinc-700 shadow-2xl overflow-hidden text-lg md:text-xl font-bold z-[60] transition-all duration-300"
                 style={isMobile ? { bottom: isPanelExpanded ? 'calc(55vh + env(safe-area-inset-bottom, 16px) + 16px)' : 'calc(env(safe-area-inset-bottom, 16px) + 16px)', right: '16px' } : { bottom: '32px', right: '32px' }}>
              {isMobile && (
                  <button onClick={() => resetAll(imageObj)} className="px-3 py-3 md:px-4 md:py-4 hover:bg-rose-600 hover:text-white text-rose-400 transition" title="리셋 (Reset)">🔄</button>
              )}
              <button onClick={goHome} className={`px-3 py-3 md:px-4 md:py-4 hover:bg-sky-600 bg-sky-500 text-white transition ${isMobile ? 'border-t' : ''} border-zinc-700`} title="오토핏 화면으로">🏠</button>
              <button onClick={zoomIn} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-white border-t border-zinc-700 transition" title="확대 (Zoom In)">➕</button>
              <button onClick={zoomOut} className="px-3 py-3 md:px-4 md:py-4 hover:bg-zinc-700 text-white border-t border-zinc-700 transition" title="축소 (Zoom Out)">➖</button>
            </div>
          </div>

        </div>
      );
    }

    function App() {
      const [isStarted, setIsStarted] = useState(window.location.hash === '#simulator');
      useEffect(() => {
        const handlePopState = () => setIsStarted(window.location.hash === '#simulator');
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);
      const handleStart = () => { window.history.pushState(null, '', '#simulator'); setIsStarted(true); };
      return !isStarted ? <StartScreen onStart={handleStart} /> : <SimulatorScreen />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
