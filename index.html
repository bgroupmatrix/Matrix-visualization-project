                            <button onClick={() => handleMathPadKey('root', 'cmd2')} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[44px] rounded-xl font-bold text-xs flex items-center justify-center shadow-sm transition" title="거듭제곱근">
                                <span><sup className="text-[9px] mr-[1px]">n</sup>√<span className="border-t border-current text-[10px] px-0.5">□</span></span>
                            </button>
                            <button onClick={() => handleMathPadKey('2', 'presetPow')} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="제곱">□²</button>
                            <button onClick={() => handleMathPadKey('^', 'cmd1')} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="거듭제곱">□ⁿ</button>
                            <button onClick={() => handleMathPadKey('abs', 'cmd1')} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="절댓값">|□|</button>
                        </div>

                        {/* 하단: 모바일 친화적 대형 4열 숫자 패드(Zinc) 및 사칙연산(Amber/Sky) */}
                        <div className="grid grid-cols-4 gap-2">
                            <button onClick={() => handleMathPadKey('7')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">7</button>
                            <button onClick={() => handleMathPadKey('8')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">8</button>
                            <button onClick={() => handleMathPadKey('9')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">9</button>
                            <button onClick={() => handleMathPadKey('/')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-400 border border-amber-500/30 min-h-[48px] rounded-xl font-bold text-xl shadow-sm transition">÷</button>

                            <button onClick={() => handleMathPadKey('4')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">4</button>
                            <button onClick={() => handleMathPadKey('5')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">5</button>
                            <button onClick={() => handleMathPadKey('6')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">6</button>
                            <button onClick={() => handleMathPadKey('*')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-400 border border-amber-500/30 min-h-[48px] rounded-xl font-bold text-xl shadow-sm transition">×</button>

                            <button onClick={() => handleMathPadKey('1')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">1</button>
                            <button onClick={() => handleMathPadKey('2')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">2</button>
                            <button onClick={() => handleMathPadKey('3')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">3</button>
                            <button onClick={() => handleMathPadKey('-')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-400 border border-amber-500/30 min-h-[48px] rounded-xl font-bold text-xl shadow-sm transition">−</button>

                            <button onClick={() => handleMathPadKey('0')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-lg shadow-sm transition">0</button>
                            <button onClick={() => handleMathPadKey('.')} className="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white border border-zinc-700 min-h-[48px] rounded-xl font-bold text-xl shadow-sm transition">.</button>
                            <button onClick={() => handleMathPadKey('=')} className="bg-sky-900/20 hover:bg-sky-900/40 active:scale-95 text-sky-400 border border-sky-500/30 min-h-[48px] rounded-xl font-bold text-xl shadow-sm transition">=</button>
                            <button onClick={() => handleMathPadKey('+')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-400 border border-amber-500/30 min-h-[48px] rounded-xl font-bold text-xl shadow-sm transition">+</button>
                        </div>
                    </div>
                )}

                {/* 2. 삼각비 · 함수 탭 (중복 제거 완료, 3열 삼각비 + 4열 대수 함수 대형 버튼) */}
                {padTab === 'func' && (
                    <div className="flex flex-col gap-2.5 max-h-[300px] overflow-y-auto pr-1">
                        <span className="text-[11px] font-bold text-emerald-400 pl-1">삼각함수 · 역삼각함수 · 쌍곡선함수</span>
                        <div className="grid grid-cols-3 gap-2">
                            <button onClick={() => handleMathPadKey('sin', 'cmd1')} className="bg-emerald-900/10 hover:bg-emerald-900/30 active:scale-95 text-emerald-300 border border-emerald-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-base shadow-sm transition">sin</button>
                            <button onClick={() => handleMathPadKey('cos', 'cmd1')} className="bg-emerald-900/10 hover:bg-emerald-900/30 active:scale-95 text-emerald-300 border border-emerald-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-base shadow-sm transition">cos</button>
                            <button onClick={() => handleMathPadKey('tan', 'cmd1')} className="bg-emerald-900/10 hover:bg-emerald-900/30 active:scale-95 text-emerald-300 border border-emerald-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-base shadow-sm transition">tan</button>

                            <button onClick={() => handleMathPadKey('csc', 'cmd1')} className="bg-emerald-900/10 hover:bg-emerald-900/30 active:scale-95 text-emerald-300 border border-emerald-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-base shadow-sm transition">csc</button>
                            <button onClick={() => handleMathPadKey('sec', 'cmd1')} className="bg-emerald-900/10 hover:bg-emerald-900/30 active:scale-95 text-emerald-300 border border-emerald-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-base shadow-sm transition">sec</button>
                            <button onClick={() => handleMathPadKey('cot', 'cmd1')} className="bg-emerald-900/10 hover:bg-emerald-900/30 active:scale-95 text-emerald-300 border border-emerald-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-base shadow-sm transition">cot</button>

                            <button onClick={() => handleMathPadKey('asin', 'cmd1')} className="bg-sky-900/20 hover:bg-sky-900/40 active:scale-95 text-sky-300 border border-sky-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">sin⁻¹</button>
                            <button onClick={() => handleMathPadKey('acos', 'cmd1')} className="bg-sky-900/20 hover:bg-sky-900/40 active:scale-95 text-sky-300 border border-sky-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">cos⁻¹</button>
                            <button onClick={() => handleMathPadKey('atan', 'cmd1')} className="bg-sky-900/20 hover:bg-sky-900/40 active:scale-95 text-sky-300 border border-sky-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">tan⁻¹</button>

                            <button onClick={() => handleMathPadKey('sinh', 'cmd1')} className="bg-teal-900/10 hover:bg-teal-900/30 active:scale-95 text-teal-300 border border-teal-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">sinh</button>
                            <button onClick={() => handleMathPadKey('cosh', 'cmd1')} className="bg-teal-900/10 hover:bg-teal-900/30 active:scale-95 text-teal-300 border border-teal-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">cosh</button>
                            <button onClick={() => handleMathPadKey('tanh', 'cmd1')} className="bg-teal-900/10 hover:bg-teal-900/30 active:scale-95 text-teal-300 border border-teal-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">tanh</button>
                        </div>

                        <span className="text-[11px] font-bold text-indigo-400 pl-1 mt-1">로그 · 지수 · 특수 대수 기호</span>
                        <div className="grid grid-cols-4 gap-2">
                            <button onClick={() => handleMathPadKey('ln', 'cmd1')} className="bg-indigo-900/20 hover:bg-indigo-900/40 active:scale-95 text-indigo-300 border border-indigo-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">ln</button>
                            <button onClick={() => handleMathPadKey('log', 'cmd1')} className="bg-indigo-900/20 hover:bg-indigo-900/40 active:scale-95 text-indigo-300 border border-indigo-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">log₁₀</button>
                            <button onClick={() => handleMathPadKey('log_', 'cmd2')} className="bg-indigo-900/20 hover:bg-indigo-900/40 active:scale-95 text-indigo-300 border border-indigo-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">log<sub className="not-italic text-[10px]">a</sub>b</button>
                            <button onClick={() => handleMathPadKey('e', 'prefixPow')} className="bg-indigo-900/20 hover:bg-indigo-900/40 active:scale-95 text-indigo-300 border border-indigo-500/30 min-h-[44px] rounded-xl font-serif italic font-bold text-sm shadow-sm transition">e<sup className="not-italic text-[10px]">□</sup></button>

                            <button onClick={() => handleMathPadKey('10', 'prefixPow')} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition">10<sup className="text-[10px]">□</sup></button>
                            <button onClick={() => handleMathPadKey('-1', 'presetPow')} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="역수 지수">□⁻¹</button>
                            <button onClick={() => handleMathPadKey('cbrt', 'cmd1')} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="세제곱근">∛□</button>
                            <button onClick={() => handleMathPadKey('°')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-300 border border-amber-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="각도">° 각도</button>

                            <button onClick={() => handleMathPadKey('floor', 'cmd1')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-300 border border-amber-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="내림">⌊x⌋</button>
                            <button onClick={() => handleMathPadKey('ceil', 'cmd1')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-300 border border-amber-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="올림">⌈x⌉</button>
                            <button onClick={() => handleMathPadKey('round', 'cmd1')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-300 border border-amber-500/30 min-h-[44px] rounded-xl font-bold text-xs shadow-sm transition" title="반올림">반올림</button>
                            <button onClick={() => handleMathPadKey('!')} className="bg-amber-900/10 hover:bg-amber-900/30 active:scale-95 text-amber-300 border border-amber-500/30 min-h-[44px] rounded-xl font-bold text-sm shadow-sm transition" title="팩토리얼">n!</button>
                        </div>
                    </div>
                )}
                
                {/* 3. 동적 상수 탭 */}
                {padTab === 'const' && (
                    <div className="grid grid-cols-5 gap-2">
                        {['a','b','c','d','f','g','h','k','m','n','p','q','r','s','t','u','w','z'].map(letter => (
                            <button key={letter} onClick={() => handleConstClick(letter)} className="bg-purple-900/10 hover:bg-purple-900/30 active:scale-95 text-purple-300 border border-purple-500/30 min-h-[48px] rounded-xl font-serif italic font-bold text-lg shadow-sm transition">
                                {letter}
                            </button>
                        ))}
                    </div>
                )}

                <button onClick={applyMathPad} className="mt-3 w-full bg-sky-500 hover:bg-sky-600 active:scale-[0.99] text-white font-bold rounded-xl text-base py-3.5 transition shadow-lg">
                    수식 적용하기
                </button>
              </div>
            </div>
          )}

          {logicInfoData && (
            <div className="fixed inset-0 z-[400] flex items-start md:items-center justify-center pt-24 md:pt-0 bg-black/70 backdrop-blur-sm px-4" onClick={() => setLogicInfoData(null)}>
              <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-5 md:p-6 w-full max-w-md shadow-2xl animate-fade-in flex flex-col gap-4" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-white font-bold text-lg md:text-xl flex items-center gap-2">
                    <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4m0-4h.01"/></svg>
                    {logicInfoData.title}
                  </h3>
                  <button onClick={() => setLogicInfoData(null)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                <p className="text-zinc-300 text-sm leading-relaxed">{logicInfoData.desc}</p>
                
                {logicInfoData.matrix && (
                  <div className="bg-black border border-zinc-800 rounded-lg p-5 flex justify-center items-center relative my-2 shadow-inner h-[130px]">
                    <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[14px] h-full text-zinc-500 fill-current shrink-0">
                      <path d="M 22,0 C -4,25 -4,75 22,100 C 4,75 4,25 22,0 Z" />
                    </svg>
                    <div className="grid grid-cols-3 gap-x-3 gap-y-4 text-center font-mono text-base font-bold text-sky-400 mx-1 flex-1 w-full max-w-[240px]">
                    {logicInfoData.matrix.flat().map((val, idx) => (
                      <div key={idx} className={val === '0' || val === '1' ? 'text-zinc-500 flex items-center justify-center whitespace-nowrap' : 'text-sky-400 text-shadow-glow flex items-center justify-center whitespace-nowrap text-[10px] md:text-[11px] tracking-tighter'}>{val}</div>
                    ))}
                  </div>
                    <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[14px] h-full text-zinc-500 fill-current shrink-0">
                      <path d="M 2,0 C 28,25 28,75 2,100 C 20,75 20,25 2,0 Z" />
                    </svg>
                  </div>
                )}
                
                {logicInfoData.formulas && (
                  <div className="bg-zinc-950 border border-zinc-800 rounded-lg p-3 flex flex-col gap-2 font-mono text-[13px] shadow-inner">
                    {logicInfoData.formulas.map((f, i) => (
                      <div key={i} className="text-amber-400">{f}</div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 🚀 3번 기능 개선: 한눈에 들어오는 컴팩트 연산 레이아웃 및 요소별 색상·박스 구분 */}
          {selectedCalcPoint && (() => {
              const z0Val = selectedCalcPoint.z ?? 0;
              const [m00, m01, m02, m10, m11, m12, m20, m21, m22] = mat3D;
              const rawX3 = m00 * selectedCalcPoint.x + m01 * selectedCalcPoint.y + m02 * z0Val + effTrans3D.x;
              const rawY3 = m10 * selectedCalcPoint.x + m11 * selectedCalcPoint.y + m12 * z0Val + effTrans3D.y;
              const rawZ3 = m20 * selectedCalcPoint.x + m21 * selectedCalcPoint.y + m22 * z0Val + effTrans3D.z;
              const w3 = usePerspective ? (1 + perspX * rawX3 + perspY * rawY3) : 1;
              const finX3 = rawX3 / (Math.abs(w3) < 1e-6 ? 1 : w3);
              const finY3 = rawY3 / (Math.abs(w3) < 1e-6 ? 1 : w3);
              const finZ3 = rawZ3 / (Math.abs(w3) < 1e-6 ? 1 : w3);

              const pX2 = matrix.m14 || 0;
              const pY2 = matrix.m24 || 0;
              const m44Val = matrix.m44 ?? 1;
              const rawX2 = matrix.a * selectedCalcPoint.x + matrix.c * selectedCalcPoint.y + matrix.e;
              const rawY2 = matrix.b * selectedCalcPoint.x + matrix.d * selectedCalcPoint.y + matrix.f;
              const w2 = pX2 * selectedCalcPoint.x + pY2 * selectedCalcPoint.y + m44Val;
              const isPerspActive = is3DMode
                  ? Boolean(usePerspective)
                  : Boolean(usePerspective || pX2 || pY2 || Math.abs(m44Val - 1) > 1e-6);
              const perspWVal = is3DMode ? w3 : w2;
              const isPerspWZero = Math.abs(perspWVal) < 1e-6;
              const safePerspW = isPerspWZero ? 1 : perspWVal;
              const finX2 = rawX2 / (Math.abs(w2) < 1e-6 ? 1 : w2);
              const finY2 = rawY2 / (Math.abs(w2) < 1e-6 ? 1 : w2);

              const handleCopyCalcText = () => {
                  if (is3DMode) {
                      const text = `[3차원 행렬 연산 과정]\n3×3 행렬:\n[ ${fmt(m00)}  ${fmt(m01)}  ${fmt(m02)} ]\n[ ${fmt(m10)}  ${fmt(m11)}  ${fmt(m12)} ]\n[ ${fmt(m20)}  ${fmt(m21)}  ${fmt(m22)} ]\n\n원본 3D 좌표: (${selectedCalcPoint.x}, ${selectedCalcPoint.y}, ${z0Val})\n평행이동(dx, dy, dz): (${fmt(effTrans3D.x)}, ${fmt(effTrans3D.y)}, ${fmt(effTrans3D.z)})\n\nX' = ${fmt(rawX3)}\nY' = ${fmt(rawY3)}\nZ' = ${fmt(rawZ3)}\n\n최종 3D 좌표: (${fmt(finX3)}, ${fmt(finY3)}, ${fmt(finZ3)})`;
                      navigator.clipboard.writeText(text).then(() => alert("3D 연산 과정이 텍스트로 복사되었습니다."));
                  } else {
                      const a = fmt(matrix.a), c = fmt(matrix.c), e = fmt(matrix.e);
                      const b = fmt(matrix.b), d = fmt(matrix.d), f = fmt(matrix.f);
                      const x = selectedCalcPoint.x, y = selectedCalcPoint.y;
                      const pXStr = pX2 ? fmt(pX2) : '0';
                      const pYStr = pY2 ? fmt(pY2) : '0';
                      const m44Str = fmt(m44Val);
                      const text = `[행렬 연산 과정]\n행렬:\n[ ${a}  ${c}  ${e} ]\n[ ${b}  ${d}  ${f} ]\n[ ${pXStr}  ${pYStr}  ${m44Str} ]\n\n원본 좌표: (${x}, ${y})\n\nX' = (${a} * ${x}) + (${c} * ${y}) + ${e}*1 = ${fmt(rawX2)}\nY' = (${b} * ${x}) + (${d} * ${y}) + ${f}*1 = ${fmt(rawY2)}\nW' = (${pXStr} * ${x}) + (${pYStr} * ${y}) + ${m44Str}*1 = ${fmt(w2)}\n\n결과 좌표: (X'/W', Y'/W') = (${fmt(finX2)}, ${fmt(finY2)})`;
                      navigator.clipboard.writeText(text).then(() => alert("연산 과정이 텍스트로 복사되었습니다."));
                  }
              };

              return (
              <div className="fixed inset-0 z-[150] flex items-center justify-center bg-black/80 backdrop-blur-sm p-2.5 md:p-4 animate-fade-in" onClick={() => setSelectedCalcPoint(null)}>
                  <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-3.5 md:p-4 shadow-2xl max-w-md w-full flex flex-col gap-2.5 transform transition-all max-h-[94vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                      <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                          <h3 className="text-white font-bold text-sm md:text-base flex items-center gap-1.5">
                              <svg className="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                              {is3DMode ? "3차원 행렬 연산 과정" : "행렬 연산 과정"}
                          </h3>
                          <div className="flex items-center gap-2">
                              <button onClick={handleCopyCalcText} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 px-2 py-1 rounded-md text-[10px] md:text-xs font-bold flex items-center gap-1 transition">
                                  <svg className="w-3 h-3 text-sky-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                  복사
                              </button>
                              <button onClick={() => setSelectedCalcPoint(null)} className="text-zinc-400 hover:text-white font-bold text-base md:text-lg px-1">✕</button>
                          </div>
                      </div>
                      
                      {is3DMode ? (
                          <div className="bg-zinc-950 p-2.5 md:p-3 rounded-lg border border-zinc-800 font-mono text-zinc-200 flex flex-col gap-2 text-[11px] md:text-xs">
                              {/* 상단: 요소별 구별된 행렬식 영역 */}
                              <div className="flex items-center justify-center gap-1 md:gap-1.5 overflow-x-auto scrollbar-hide py-0.5">
                                  <div className="bg-zinc-900 border border-zinc-800 rounded-lg px-2 py-1 flex flex-col items-center shrink-0">
                                      <span className="text-[9px] font-sans font-bold text-sky-400 mb-0.5">변환 행렬</span>

                                      </div>
                                      <span className="text-emerald-400 font-bold shrink-0">= {fmt(rawY2)}</span>
                                  </div>
                                  <div className="bg-zinc-900 border border-zinc-800 rounded-md px-2.5 py-1.5 flex items-center justify-between gap-2 min-w-max">
                                      <div className="flex items-center gap-1">
                                          <span className="text-emerald-300 font-bold w-4">W'</span>
                                          <span className="text-zinc-400">=</span>
                                          <span>(<span className="text-sky-300 font-bold">{fmt(pX2)}</span>×<span className="text-amber-300 font-bold">{selectedCalcPoint.x}</span>) + (<span className="text-sky-300 font-bold">{fmt(pY2)}</span>×<span className="text-amber-300 font-bold">{selectedCalcPoint.y}</span>) + (<span className="text-sky-300 font-bold">{fmt(m44Val)}</span>×<span className="text-amber-300 font-bold">1</span>)</span>
                                      </div>
                                      <span className="text-emerald-400 font-bold shrink-0">= {fmt(w2)}</span>
                                  </div>
                              </div>

                              {/* 하단: 최종 결과 요약 바 */}
                              <div className="bg-emerald-950/20 border border-emerald-500/30 rounded-md px-3 py-2 flex items-center justify-between gap-2 flex-wrap">

                                      <span className="text-white font-bold text-xs">변환된 최종 좌표</span>
                                      <span className="text-[10px] bg-zinc-800 text-sky-300 border border-zinc-700 px-1.5 py-0.5 rounded font-mono">(X'/W', Y'/W')</span>
                                  </div>
                                  <span className="text-emerald-400 font-bold text-xs md:text-sm font-mono">({fmt(finX2)}, {fmt(finY2)})</span>
                              </div>
                          </div>
                      )}

                      <div className="p-3 bg-zinc-800 border border-zinc-700 rounded-lg text-[11px] md:text-xs text-zinc-300 leading-relaxed flex flex-col gap-2">

                              <svg className="w-4 h-4 text-sky-400 shrink-0" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

                              </p>

                                      <span className="font-mono text-emerald-300 font-bold">W'({fmt(perspWVal)})</span>는 관찰자로부터 떨어진 <b>거리 비율</b>입니다. 좌표를 <span className="font-mono text-emerald-300 font-bold">W'</span>로 나누어 실제 화면 평면(<span className="font-mono">W=1</span>)에 맞추면, 먼 곳(<span className="font-mono">W'&gt;1</span>)은 작아지고 가까운 곳(<span className="font-mono">W'&lt;1</span>)은 커져서 <b>원근감</b>이 생깁니다.

                      <div className="flex justify-end gap-2 md:gap-3 mt-1 md:mt-2">

          {/* 🚀 단위 정사각형 넓이(2D) / 단위 정육면체 부피(3D) 연산 과정 및 스퀴즈 원리 설명 모달 */}
          {showUnitSquareModal && (() => {
              if (is3DMode) {
                  const [m00, m01, m02, m10, m11, m12, m20, m21, m22] = mat3D;
                  const lenU = Math.hypot(m00, m10, m20);
                  const lenV = Math.hypot(m01, m11, m21);
                  const lenW = Math.hypot(m02, m12, m22);
                  // 외적 u x v (밑면 법선 벡터, 크기 = 밑면 평행사변형 넓이)
                  const cxU = m10 * m21 - m20 * m11;
                  const cyU = m20 * m01 - m00 * m21;
                  const czU = m00 * m11 - m10 * m01;
                  const baseArea = Math.hypot(cxU, cyU, czU);
                  // 3x3 행렬식 det(A) = (u x v) · w
                  const term1 = m00 * (m11 * m22 - m12 * m21);
                  const term2 = m01 * (m10 * m22 - m12 * m20);
                  const term3 = m02 * (m10 * m21 - m11 * m20);
                  const det3D = term1 - term2 + term3;
                  const absDet3D = Math.abs(det3D);
                  const height3D = baseArea > 1e-6 ? absDet3D / baseArea : 0;

                  return (
                      <div className="fixed inset-0 z-[150] flex items-center justify-center bg-black/80 backdrop-blur-sm p-3 md:p-4 animate-fade-in" onClick={() => setShowUnitSquareModal(false)}>

                                      3차원 단위 정육면체 부피 연산 과정
                                  </h3>
                                  <button onClick={() => setShowUnitSquareModal(false)} className="text-zinc-500 hover:text-white font-bold text-lg md:text-xl">✕</button>
                              </div>

                              <div className="bg-zinc-950 p-3 md:p-4 rounded-lg border border-zinc-800 font-mono text-zinc-300 overflow-x-auto shadow-inner scrollbar-hide relative pb-10 md:pb-12 text-[10px] md:text-sm">
                                  {/* 상단 3x3 기저 벡터 변환식 */}
                                  <div className="flex items-center gap-1 md:gap-2 mb-4 justify-center min-w-max">
                                      <div className="flex items-stretch">
                                          <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 22,0 C -4,25 -4,75 22,100 C 4,75 4,25 22,0 Z" /></svg>
                                          <div className="grid grid-cols-3 gap-x-2.5 gap-y-1 text-center text-sky-400 mx-1 w-max items-center py-2 font-bold">
                                              <span>{fmt(m00)}</span><span>{fmt(m01)}</span><span>{fmt(m02)}</span>
                                              <span>{fmt(m10)}</span><span>{fmt(m11)}</span><span>{fmt(m12)}</span>
                                              <span>{fmt(m20)}</span><span>{fmt(m21)}</span><span>{fmt(m22)}</span>
                                          </div>
                                          <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 22,0 C -4,25 -4,75 22,100 C 4,75 4,25 22,0 Z" transform="scale(-1, 1) translate(-24, 0)" /></svg>
                                      </div>
                                      <span className="text-slate-400 font-sans font-bold px-1">×</span>
                                      <div className="flex items-stretch">
                                          <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 22,0 C -4,25 -4,75 22,100 C 4,75 4,25 22,0 Z" /></svg>
                                          <div className="grid grid-cols-3 gap-x-2.5 gap-y-1 text-center text-amber-300 mx-1 w-max items-center py-2">
                                              <span>1</span><span>0</span><span>0</span>
                                              <span>0</span><span>1</span><span>0</span>
                                              <span>0</span><span>0</span><span>1</span>
                                          </div>
                                          <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 2,0 C 28,25 28,75 2,100 C 20,75 20,25 2,0 Z" /></svg>
                                      </div>
                                  </div>

                                  {/* 1. 기하학적 밑넓이 × 수직 높이로 부피 구하기 */}
                                  <div className="flex flex-col gap-2 text-[10px] md:text-sm border-t border-slate-700/50 pt-3 min-w-max">
                                      <div className="text-zinc-400 font-sans font-bold text-xs">[1] 모서리 길이 및 밑넓이 × 높이 계산</div>
                                      <div className="flex items-center gap-2 flex-wrap">
                                          <span className="text-rose-300 font-bold">가로: {fmt(lenU)}</span>
                                          <span className="text-emerald-300 font-bold">세로: {fmt(lenV)}</span>
                                          <span className="text-sky-300 font-bold">옆모서리: {fmt(lenW)}</span>
                                      </div>
                                      <div className="flex items-center gap-1.5 flex-wrap">
                                          <span className="text-amber-300 font-bold">밑넓이</span>
                                          <span>=</span>
                                          <span className="text-emerald-400 font-bold">{fmt(baseArea)}</span>
                                          <span className="ml-2 text-purple-300 font-bold">수직 높이</span>
                                          <span>=</span>
                                          <span className="text-emerald-400 font-bold">{fmt(height3D)}</span>
                                      </div>
                                      <div className="flex items-center gap-1.5 pl-2 font-sans">
                                          <span>∴ 밑넓이 × 수직 높이 = </span>
                                          <span className="font-mono text-amber-300">{fmt(baseArea)}</span>
                                          <span>×</span>
                                          <span className="font-mono text-purple-300">{fmt(height3D)}</span>
                                          <span>=</span>
                                          <span className="text-emerald-400 font-bold text-sm md:text-base font-mono">{fmt(absDet3D)}</span>
                                      </div>
                                  </div>

                                  {/* 2. 3x3 행렬식으로 부피 구하기 */}
                                  <div className="flex flex-col gap-2 text-[10px] md:text-sm border-t border-slate-700/50 pt-3 mt-3 min-w-max">
                                      <div className="text-zinc-400 font-sans font-bold text-xs">[2] 3×3 행렬식으로 부피 변화율 계산</div>
                                      <div className="text-zinc-400 text-[10px] md:text-xs">
                                          행렬식 = a(ei − fh) − b(di − fg) + c(dh − eg)
                                      </div>
                                      <div className="flex items-center gap-1.5 flex-wrap">
                                          <span>= ({fmt(term1)}) − ({fmt(term2)}) + ({fmt(term3)}) = </span>
                                          <span className="text-sky-300 font-bold">{fmt(det3D)}</span>
                                      </div>
                                      <div className="flex items-center gap-2 pl-2 font-sans">
                                          <span className="text-amber-300 font-bold">∴ 최종 부피 =</span>
                                          <span className="text-emerald-400 font-bold text-sm md:text-xl font-mono border-b-2 border-emerald-400/50">{fmt(absDet3D)}</span>
                                      </div>
                                  </div>

                                  <button onClick={() => {
                                      const text = `[단위 정육면체 3D 부피 연산 과정]\n3×3 변환 행렬 A:\n[ ${fmt(m00)}  ${fmt(m01)}  ${fmt(m02)} ]\n[ ${fmt(m10)}  ${fmt(m11)}  ${fmt(m12)} ]\n[ ${fmt(m20)}  ${fmt(m21)}  ${fmt(m22)} ]\n\n[1] 기하학적 계산\n- 밑넓이 |u × v|: ${fmt(baseArea)}\n- 수직 높이 h: ${fmt(height3D)}\n- 부피 = ${fmt(baseArea)} × ${fmt(height3D)} = ${fmt(absDet3D)}\n\n[2] 3×3 행렬식 계산\n- det(A) = ${fmt(det3D)}\n- 최종 부피 |det(A)| = ${fmt(absDet3D)}`;
                                      navigator.clipboard.writeText(text).then(() => alert("3D 부피 연산 과정이 텍스트로 복사되었습니다."));
                                  }} className="absolute bottom-2 right-2 md:bottom-3 md:right-3 bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs font-sans font-bold flex items-center gap-1.5 transition shadow">
                                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                      텍스트로 복사
                                  </button>
                              </div>

                              {/* 하단 3차원 스퀴즈 변환 부피 보존 원리 설명 */}
                              <div className="flex flex-col gap-2 mt-1">
                                  <div className="p-3 bg-zinc-800/50 border border-zinc-700 rounded-lg text-[11px] md:text-xs text-zinc-300 leading-relaxed">
                                      <b className="text-white block mb-1.5 flex items-center gap-1.5">
                                          <svg className="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                          3차원 스퀴즈 변환 부피 보존 원리
                                      </b>
                                      <div className="flex flex-col gap-2">
                                          <p>
                                              <strong className="text-white bg-zinc-700 px-1 rounded">왜 3차원 스퀴즈 변환 시 부피가 1로 일정할까요?</strong><br/>
                                              3차원 스퀴즈 변환은 가로와 세로를 각각 <span className="text-purple-300 font-mono font-bold">k</span>배 늘릴 때, 높이를 제곱의 역수인 <span className="text-purple-300 font-mono font-bold">1/k²</span>배로 압축합니다. 따라서 <span className="text-amber-300 font-mono font-bold">k × k × 1/k² = 1</span>이 되어 정육면체가 납작하거나 길쭉해져도 부피는 항상 일정하게 유지됩니다.
                                          </p>
                                          <p className="border-t border-zinc-700 pt-2">
                                              <strong className="text-white bg-zinc-700 px-1 rounded">현재 스퀴즈 배율 확인</strong><br/>
                                              현재 <span className="text-purple-300 font-mono">k = {fmt(squeeze)}</span>, <span className="text-purple-300 font-mono">1/k² = {fmt(1 / (squeeze * squeeze))}</span>이며, 스퀴즈 부피 변화율은 <span className="text-emerald-300 font-mono font-bold">|{fmt(squeeze)} × {fmt(squeeze)} × {fmt(1 / (squeeze * squeeze))}| = 1</span>입니다.
                                          </p>
                                      </div>
                                  </div>
                              </div>

                              <div className="flex justify-end gap-2 md:gap-3 mt-1">
                                  <button onClick={() => setShowUnitSquareModal(false)} className="px-5 md:px-6 py-1.5 md:py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition shadow-lg font-bold text-xs md:text-sm">
                                      확인
                                  </button>
                              </div>
                          </div>
                      </div>
                  );
              }

              const a = matrix.a, b = matrix.b, c = matrix.c, d = matrix.d;
              const baseLen = Math.hypot(a, b);
              const sideLen = Math.hypot(c, d);
              const det = a * d - b * c;
              const absDet = Math.abs(det);
              const heightLen = baseLen > 1e-6 ? absDet / baseLen : 0;
              const isSkewed = baseLen > 1e-6 && sideLen > 1e-6 && Math.abs(a * c + b * d) / (baseLen * sideLen) > 0.01;

              return (
                  <div className="fixed inset-0 z-[150] flex items-center justify-center bg-black/80 backdrop-blur-sm p-3 md:p-4 animate-fade-in" onClick={() => setShowUnitSquareModal(false)}>
                      <div className="bg-zinc-900 border border-zinc-600 rounded-xl p-4 md:p-5 shadow-2xl max-w-md w-full flex flex-col gap-3 transform transition-all max-h-[92vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                          <div className="flex justify-between items-center border-b border-zinc-700 pb-2">
                              <h3 className="text-white font-bold text-sm md:text-xl flex items-center gap-2">
                                  <svg className="w-4 h-4 md:w-5 md:h-5 text-amber-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                                  단위 정사각형 넓이 연산 과정
                              </h3>
                              <button onClick={() => setShowUnitSquareModal(false)} className="text-zinc-500 hover:text-white font-bold text-lg md:text-xl">✕</button>
                          </div>

                          <div className="bg-zinc-950 p-3 md:p-4 rounded-lg border border-zinc-800 font-mono text-zinc-300 overflow-x-auto shadow-inner scrollbar-hide relative pb-10 md:pb-12 text-[10px] md:text-sm">
                              {/* 상단 행렬 기저 벡터 변환식 */}
                              <div className="flex items-center gap-1 md:gap-2 mb-4 justify-center min-w-max">
                                  <div className="flex items-stretch">
                                      <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 22,0 C -4,25 -4,75 22,100 C 4,75 4,25 22,0 Z" /></svg>
                                      <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-center text-sky-400 mx-1 w-max items-center py-2 font-bold">
                                          <span>{fmt(a)}</span><span>{fmt(c)}</span>
                                          <span>{fmt(b)}</span><span>{fmt(d)}</span>
                                      </div>
                                      <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 2,0 C 28,25 28,75 2,100 C 20,75 20,25 2,0 Z" /></svg>
                                  </div>
                                  <span className="text-slate-400 font-sans font-bold px-1">×</span>
                                  <div className="flex items-stretch">
                                      <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 22,0 C -4,25 -4,75 22,100 C 4,75 4,25 22,0 Z" /></svg>
                                      <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-center text-amber-300 mx-1 w-max items-center py-2">
                                          <span>1</span><span>0</span>
                                          <span>0</span><span>1</span>
                                      </div>
                                      <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 2,0 C 28,25 28,75 2,100 C 20,75 20,25 2,0 Z" /></svg>
                                  </div>
                                  <span className="text-slate-400 font-sans font-bold px-1">=</span>
                                  <div className="flex items-stretch">
                                      <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 22,0 C -4,25 -4,75 22,100 C 4,75 4,25 22,0 Z" /></svg>
                                      <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-center text-emerald-300 mx-1 w-max font-bold items-center py-2">
                                          <span>{fmt(a)}</span><span>{fmt(c)}</span>
                                          <span>{fmt(b)}</span><span>{fmt(d)}</span>
                                      </div>
                                      <svg viewBox="0 0 24 100" preserveAspectRatio="none" className="w-[10px] md:w-[14px] text-zinc-500 fill-current shrink-0 py-1"><path d="M 2,0 C 28,25 28,75 2,100 C 20,75 20,25 2,0 Z" /></svg>
                                  </div>
                              </div>

                              {/* 1. 기하학적 길이로 넓이 구하기 */}
                              <div className="flex flex-col gap-2 text-[10px] md:text-sm border-t border-slate-700/50 pt-3 min-w-max">
                                  <div className="text-zinc-400 font-sans font-bold text-xs">[1] 밑변 × 높이로 넓이 계산</div>
                                  <div className="flex items-center gap-1.5 flex-wrap">
                                      <span className="text-sky-300 font-bold">밑변</span>
                                      <span>= √(</span><span className="text-sky-300">{fmt(a)}</span><span>² + </span><span className="text-sky-300">{fmt(b)}</span><span>²) =</span>
                                      <span className="text-emerald-400 font-bold">{fmt(baseLen)}</span>
                                  </div>
                                  {isSkewed && (
                                      <div className="flex items-center gap-1.5 flex-wrap">
                                          <span className="text-purple-300 font-bold">옆변</span>
                                          <span>= √(</span><span className="text-sky-300">{fmt(c)}</span><span>² + </span><span className="text-sky-300">{fmt(d)}</span><span>²) =</span>
                                          <span className="text-purple-300 font-bold">{fmt(sideLen)}</span>
                                      </div>
                                  )}
                                  <div className="flex items-center gap-1.5 flex-wrap">
                                      <span className="text-emerald-300 font-bold">높이</span>
                                      <span>=</span>
                                      {isSkewed ? (
                                          <><span>|ad - bc| ÷ 밑변 = </span><span className="text-emerald-400 font-bold">{fmt(heightLen)}</span></>
                                      ) : (
                                          <><span>√(</span><span className="text-sky-300">{fmt(c)}</span><span>² + </span><span className="text-sky-300">{fmt(d)}</span><span>²) = </span><span className="text-emerald-400 font-bold">{fmt(heightLen)}</span></>
                                      )}
                                  </div>
                                  <div className="flex items-center gap-1.5 pl-2 font-sans">
                                      <span>∴ 밑변 × 높이 = </span>
                                      <span className="font-mono text-sky-300">{fmt(baseLen)}</span>
                                      <span>×</span>
                                      <span className="font-mono text-emerald-300">{fmt(heightLen)}</span>
                                      <span>=</span>
                                      <span className="text-amber-300 font-bold text-sm md:text-base font-mono">{fmt(absDet)}</span>
                                  </div>
                              </div>

                              {/* 2. 행렬식으로 넓이 구하기 */}
                              <div className="flex flex-col gap-2 text-[10px] md:text-sm border-t border-slate-700/50 pt-3 mt-3 min-w-max">
                                  <div className="text-zinc-400 font-sans font-bold text-xs">[2] 행렬식으로 넓이 계산</div>
                                  <div className="flex items-center gap-1.5 flex-wrap">
                                      <span className="text-amber-300 font-bold">넓이</span>
                                      <span>= |(</span><span className="text-sky-300">{fmt(a)}</span><span> × </span><span className="text-sky-300">{fmt(d)}</span><span>) − (</span><span className="text-sky-300">{fmt(b)}</span><span> × </span><span className="text-sky-300">{fmt(c)}</span><span>)|</span>
                                  </div>
                                  <div className="flex items-center gap-2 pl-4 md:pl-8 font-sans">
                                      <span>= |{fmt(a * d)} − ({fmt(b * c)})| =</span>
                                      <span className="text-emerald-400 font-bold text-sm md:text-xl font-mono border-b-2 border-emerald-400/50">{fmt(absDet)}</span>
                                  </div>
                              </div>

                              {/* 텍스트로 복사 버튼 */}
                              <button onClick={() => {
                                  const text = `[단위 정사각형 넓이 연산 과정]\n선형 변환 행렬:\n[ ${fmt(a)}  ${fmt(c)} ]\n[ ${fmt(b)}  ${fmt(d)} ]\n\n[1] 길이로 계산\n- 밑변: ${fmt(baseLen)}\n- 높이: ${fmt(heightLen)}\n- 밑변 × 높이 = ${fmt(baseLen)} × ${fmt(heightLen)} = ${fmt(absDet)}\n\n[2] 행렬식으로 계산\n- |ad - bc| = |(${fmt(a)} × ${fmt(d)}) - (${fmt(b)} × ${fmt(c)})| = ${fmt(absDet)}`;
                                  navigator.clipboard.writeText(text).then(() => alert("넓이 연산 과정이 텍스트로 복사되었습니다."));
                              }} className="absolute bottom-2 right-2 md:bottom-3 md:right-3 bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs font-sans font-bold flex items-center gap-1.5 transition shadow">
                                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                  텍스트로 복사
                              </button>
                          </div>

                          {/* 하단 스퀴즈 변환 넓이 보존 원리 설명 */}
                          <div className="flex flex-col gap-2 mt-1">
                              <div className="p-3 bg-zinc-800/50 border border-zinc-700 rounded-lg text-[11px] md:text-xs text-zinc-300 leading-relaxed">
                                  <b className="text-white block mb-1.5 flex items-center gap-1.5">
                                      <svg className="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                      스퀴즈 변환 원리 알아보기
                                  </b>
                                  <div className="flex flex-col gap-2">
                                      <p>
                                          <strong className="text-white bg-zinc-700 px-1 rounded">왜 스퀴즈 변환을 했을 때 넓이가 일정할까요?</strong><br/>
                                          스퀴즈 변환은 밑변을 <span className="text-purple-300 font-mono font-bold">k</span>배 늘릴 때 높이를 정확히 그 역수인 <span className="text-purple-300 font-mono font-bold">1/k</span>배로 압축하는 변환입니다. 따라서 변환 후의 가로와 세로를 곱하면 <span className="text-amber-300 font-mono font-bold">k × 1/k = 1</span>로 서로 약분되어 넓이가 항상 일정하게 유지됩니다.
                                      </p>
                                      <p className="border-t border-zinc-700 pt-2">
                                          <strong className="text-white bg-zinc-700 px-1 rounded">행렬식으로 증명하기</strong><br/>
                                          스퀴즈 행렬은 대각선 숫자가 <span className="text-sky-300 font-mono">a = k, d = 1/k</span>이고 <span className="text-sky-300 font-mono">b = 0, c = 0</span>이므로, 넓이 변화율인 행렬식 <span className="text-emerald-300 font-mono font-bold">|ad - bc| = |k × 1/k - 0| = 1</span>이 되어 현재 배율 <span className="text-purple-300 font-mono">k = {fmt(squeeze)}, 1/k = {fmt(1 / squeeze)}</span> 값을 어떻게 조절해도 넓이는 변하지 않습니다.
                                      </p>
                                  </div>
                              </div>
                          </div>

                          <div className="flex justify-end gap-2 md:gap-3 mt-1">
                              <button onClick={() => setShowUnitSquareModal(false)} className="px-5 md:px-6 py-1.5 md:py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition shadow-lg font-bold text-xs md:text-sm">
                                  확인
                              </button>
                          </div>
                      </div>
                  </div>
              );
          })()}

          {graphSettingsId !== null && (
            <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
              <div className="bg-zinc-900 border border-zinc-700 rounded-xl p-5 md:p-6 w-full max-w-[22rem] shadow-2xl animate-fade-in flex flex-col gap-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-white font-bold text-lg">함수 행렬 설정</h3>
                  <button onClick={() => setGraphSettingsId(null)} className="text-zinc-500 hover:text-white font-bold text-xl">✕</button>
                </div>
                
                {graphs.find(g => g.id === graphSettingsId) && (() => {
                    const g = graphs.find(g => g.id === graphSettingsId);
                    return (
                        <div className="flex flex-col gap-5">
                            <div className="flex flex-col gap-2">
                                <label className="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-zinc-800 transition">
                                    <input type="radio" name="matrixMode" checked={g.matrixMode === 'global'} onChange={() => {
                                        setGraphs(prev => prev.map(item => item.id === g.id ? { ...item, matrixMode: 'global' } : item));
                                    }} className="accent-purple-500" />
                                    <span className="text-zinc-300 font-bold text-sm">행렬 변환 적용</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-zinc-800 transition">
                                    <input type="radio" name="matrixMode" checked={g.matrixMode === 'none'} onChange={() => {
                                        setGraphs(prev => prev.map(item => item.id === g.id ? { ...item, matrixMode: 'none' } : item));
                                    }} className="accent-purple-500" />
                                    <span className="text-zinc-300 font-bold text-sm">행렬 변환 미적용</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer p-2 rounded hover:bg-zinc-800 transition">
                                    <input type="radio" name="matrixMode" checked={g.matrixMode === 'custom'} onChange={() => {
                                        setGraphs(prev => prev.map(item => item.id === g.id ? { ...item, matrixMode: 'custom' } : item));
                                    }} className="accent-purple-500" />
                                    <span className="text-zinc-300 font-bold text-sm text-purple-400">변환 행렬 입력</span>
                                </label>
                            </div>

                            {g.matrixMode === 'custom' && (
                                <div className="bg-black border border-zinc-800 rounded-lg p-4 flex justify-center items-center relative shadow-inner h-[140px]">
                                    <div className="flex items-center justify-center w-3 h-full">
                                        <span className="text-zinc-500 font-serif text-[60px] leading-[0]" style={{ transform: 'scale(0.6, 2.0)' }}>(</span>
                                    </div>
                                    <div className="grid grid-cols-3 gap-x-3 gap-y-4 text-center font-mono text-base font-bold text-purple-400 mx-2 flex-1 max-w-[200px]">
                                        <CustomNumberInput value={g.customMatrix.a} onChange={v => updateGraphCustomMatrix(g.id, 'a', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />
                                        <CustomNumberInput value={g.customMatrix.c} onChange={v => updateGraphCustomMatrix(g.id, 'c', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />
                                        <CustomNumberInput value={g.customMatrix.e} onChange={v => updateGraphCustomMatrix(g.id, 'e', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />
                                        <CustomNumberInput value={g.customMatrix.b} onChange={v => updateGraphCustomMatrix(g.id, 'b', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />
                                        <CustomNumberInput value={g.customMatrix.d} onChange={v => updateGraphCustomMatrix(g.id, 'd', v)} className="w-full bg-zinc-900 border border-zinc-700 text-center focus:outline-none focus:border-purple-500 rounded py-1" />

                            </div>
